 {day:"Day 1",section:"Your turn",title:"Your offer in one sentence: I help [who] go from [before] to [after] using [mechanism], in [time], or [guarantee].",html:"<div class=\"slide\" data-i=\"37\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">25 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 4 of 12</span><span class=\"qk\">Long answer \u00b7 30+ words</span><span class=\"qtime\">\u23f1 4 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your offer in one sentence: I help [who] go from [before] to [after] using [mechanism], in [time], or [guarantee].</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One sentence</u><span>Who, from-state, to-state, mechanism. All four, no more.</span></div><div class=\"qc\"><u>A named after</u><span>The after-state, described as their life \u2014 never as your deliverable.</span></div><div class=\"qc\"><u>No tool words</u><span>The mechanism is how you get there, not what software you use.</span></div></div><div class=\"foot\"><b>Why this one:</b> One sentence that has to survive being read by a stranger with no context. If they cannot repeat it back after one pass, no amount of page design downstream will rescue it.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your offer in one sentence: I help [who] go from [before] to [after] using [mechanism], in [time], or [guarantee].</span><span class=\"fbar\"><i style=\"width:34.7%\"></i></span><span class=\"pg num\">038<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q4 \u00b7 B2B SaaS",title:"SendFlow answers Q4",html:"<div class=\"slide\" data-i=\"38\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q4 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">26 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 4</u><p>Your offer in one sentence: I help [who] go from [before] to [after] using [mechanism], in [time], or [guarantee].</p></div><div class=\"answer\"><u>How they answer it</u><p>We help VPs of Sales go from reps sending 15 manual touches a day to 200 personalised ones using our profile-to-message engine, live in a week, or your first month is free.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The before and after are the same unit \u2014 touches per rep per day \u2014 so the improvement is arithmetic.</span></div><div class=\"w\"><i>2</i><span>15 \u2192 200 is a number the buyer can check against their own CRM in under a minute.</span></div><div class=\"w\"><i>3</i><span>The mechanism is named in the same breath, which is what stops it reading as a boast.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Notice the after-state is a behaviour change in <em>their</em> team, not a feature of the product. The product is the mechanism clause, and it arrives last.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q4</span><span class=\"fbar\"><i style=\"width:36.1%\"></i></span><span class=\"pg num\">039<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q4 \u00b7 B2B consulting brand",title:"Apex Growth answers Q4",html:"<div class=\"slide\" data-i=\"39\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q4 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">27 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 4</u><p>Your offer in one sentence: I help [who] go from [before] to [after] using [mechanism], in [time], or [guarantee].</p></div><div class=\"answer\"><u>How they answer it</u><p>I help professional-services partners go from referral-dependent to a predictable pipeline using the Partner Pipeline System, inside 90 days, or we keep working free until it runs.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The after-state is structural \u2014 a pipeline that survives a specific person's absence.</span></div><div class=\"w\"><i>2</i><span>It implicitly names the before-state everyone in that market recognises: <b>lunch-based pipeline</b>.</span></div><div class=\"w\"><i>3</i><span>No metric is claimed, which is honest for an offer sold on predictability rather than volume.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Dependency is the enemy being named. A consultancy that sells away its own indispensability is making a harder, more credible promise than one selling growth.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q4</span><span class=\"fbar\"><i style=\"width:37.5%\"></i></span><span class=\"pg num\">040<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q4 \u00b7 Solopreneur",title:"Sarah Chen answers Q4",html:"<div class=\"slide\" data-i=\"40\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q4 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">28 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 4</u><p>Your offer in one sentence: I help [who] go from [before] to [after] using [mechanism], in [time], or [guarantee].</p></div><div class=\"answer\"><u>How they answer it</u><p>I help founders go from selling only when they aren't delivering to a funnel that runs either way, in six weeks, with every asset built alongside you.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The before-state is a time conflict, which is the real constraint for a business of one.</span></div><div class=\"w\"><i>2</i><span>\u201cSell while you're delivering\u201d is the after-state in the founder's own vocabulary.</span></div><div class=\"w\"><i>3</i><span>The mechanism is the funnel itself, so the offer and the proof are the same object.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cEither way\u201d is the pivot word. It promises the funnel works during the exact weeks the founder has no time \u2014 which is when every previous attempt collapsed.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q4</span><span class=\"fbar\"><i style=\"width:38.9%\"></i></span><span class=\"pg num\">041<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Which rung of your ladder is this offer?",html:"<div class=\"slide\" data-i=\"41\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">29 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 5 of 12</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which rung of your ladder is this offer?</div><div class=\"qopts\" style=\"--oc:2;max-height:22cqh\"><span class=\"qopt\"><i>A</i><span>Entry \u00b7 small and self-liquidating</span></span><span class=\"qopt\"><i>B</i><span>Core \u00b7 the main transformation</span></span><span class=\"qopt\"><i>C</i><span>Flagship \u00b7 highest-touch, highest-price</span></span><span class=\"qopt\"><i>D</i><span>I only have one offer today</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One rung</u><span>Pick the rung this funnel sells \u2014 not the whole ladder.</span></div><div class=\"qc\"><u>Matches the ask</u><span>A $9k rung cannot be sold from a single cold email.</span></div><div class=\"qc\"><u>Has a next</u><span>You know what sits directly above it, for Day 3.</span></div></div><div class=\"foot\"><b>Why this one:</b> The rung decides the price, the length of the sales cycle and how much trust has to be built before the ask. Getting it wrong makes every downstream choice subtly wrong too.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which rung of your ladder is this offer?</span><span class=\"fbar\"><i style=\"width:40.3%\"></i></span><span class=\"pg num\">042<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q5 \u00b7 B2B SaaS",title:"SendFlow answers Q5",html:"<div class=\"slide\" data-i=\"42\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q5 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">30 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which rung of your ladder is this offer?</p></div><div class=\"answer\"><u>How they answer it</u><p>Core \u00b7 the main transformation \u2014 the $490/month seat, with a $290 audit below and a managed programme above.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A per-seat subscription is a low-commitment rung, so a self-serve funnel can carry it alone.</span></div><div class=\"w\"><i>2</i><span>The rung above \u2014 the managed programme \u2014 already exists, which makes Day 3's ascension work easy.</span></div><div class=\"w\"><i>3</i><span>Monthly billing means <b>retention is the business</b>, not an afterthought.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A subscription rung is unusual in that the first sale is small and the real revenue is in month six. That pushes all the weight onto onboarding rather than the close.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q5</span><span class=\"fbar\"><i style=\"width:41.7%\"></i></span><span class=\"pg num\">043<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q5 \u00b7 B2B consulting brand",title:"Apex Growth answers Q5",html:"<div class=\"slide\" data-i=\"43\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q5 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">31 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which rung of your ladder is this offer?</p></div><div class=\"answer\"><u>How they answer it</u><p>Core \u00b7 the main transformation \u2014 \u00a312,000 for the 90-day build; the annual retainer sits above it.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A five-figure, time-boxed engagement sits mid-ladder \u2014 too big for checkout, too small for procurement.</span></div><div class=\"w\"><i>2</i><span>It needs a call in the chain, which sets the whole Day 2 build: booking page, reminders, scripts.</span></div><div class=\"w\"><i>3</i><span>The retainer above it is the real prize, making this rung a <b>qualified entry point</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A \u00a312k rung cannot be closed on a page. The funnel's job is to earn a conversation, which is why their close chain on Day 2 matters more than their checkout.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q5</span><span class=\"fbar\"><i style=\"width:43.1%\"></i></span><span class=\"pg num\">044<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q5 \u00b7 Solopreneur",title:"Sarah Chen answers Q5",html:"<div class=\"slide\" data-i=\"44\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q5 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">32 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which rung of your ladder is this offer?</p></div><div class=\"answer\"><u>How they answer it</u><p>Core \u00b7 the main transformation \u2014 the $4,000 six-week build. I still need to name my flagship.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Four figures is the highest price that can still close from a page plus a sequence.</span></div><div class=\"w\"><i>2</i><span>The fixed six-week scope caps delivery load, which matters when there is only one deliverer.</span></div><div class=\"w\"><i>3</i><span>There is currently <b>no rung above it</b> \u2014 Day 3 turns that gap into the biggest single lever.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">At $4,000 with a six-week clock, this rung is right at the boundary where a funnel can close without a call \u2014 which is exactly the experiment worth running.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q5</span><span class=\"fbar\"><i style=\"width:44.4%\"></i></span><span class=\"pg num\">045<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Which funnel shape are you building?",html:"<div class=\"slide\" data-i=\"45\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">33 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 6 of 12</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which funnel shape are you building?</div><div class=\"qopts\" style=\"--oc:2;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Webinar funnel</span></span><span class=\"qopt\"><i>B</i><span>Workshop (challenge) funnel</span></span><span class=\"qopt\"><i>C</i><span>Reverse squeeze funnel</span></span><span class=\"qopt\"><i>D</i><span>Book-a-call funnel</span></span><span class=\"qopt\"><i>E</i><span>Still deciding</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One shape</u><span>Commit. You can run a second funnel later, never first.</span></div><div class=\"qc\"><u>Matches the ticket</u><span>Higher ticket needs more contact time before the ask.</span></div><div class=\"qc\"><u>You can staff it</u><span>A live workshop needs a host every week. Be honest.</span></div></div><div class=\"foot\"><b>Why this one:</b> The shape determines what you build for the next three days. Choosing it now \u2014 rather than drifting into one \u2014 is what stops Day 2 becoming a scramble.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which funnel shape are you building?</span><span class=\"fbar\"><i style=\"width:45.8%\"></i></span><span class=\"pg num\">046<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q6 \u00b7 B2B SaaS",title:"SendFlow answers Q6",html:"<div class=\"slide\" data-i=\"46\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q6 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">34 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 6</u><p>Which funnel shape are you building?</p></div><div class=\"answer\"><u>How they answer it</u><p>Reverse squeeze funnel \u2014 nobody has heard of us, and we can demonstrate the mechanism in one piece of content.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The shape matches a low-friction ticket \u2014 no human has to be in the room to close it.</span></div><div class=\"w\"><i>2</i><span>It runs continuously, which suits a team large enough to maintain it but too busy to present weekly.</span></div><div class=\"w\"><i>3</i><span>Automation is also the product, so the funnel <b>demonstrates the thing it sells</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A self-serve product can afford an automated shape because the price is low enough that trust can be built after the purchase rather than before it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q6</span><span class=\"fbar\"><i style=\"width:47.2%\"></i></span><span class=\"pg num\">047<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q6 \u00b7 B2B consulting brand",title:"Apex Growth answers Q6",html:"<div class=\"slide\" data-i=\"47\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q6 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">35 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 6</u><p>Which funnel shape are you building?</p></div><div class=\"answer\"><u>How they answer it</u><p>Webinar funnel \u2014 partners don't believe pipeline can be systematised, so the idea has to be taught before any offer lands.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The ticket demands real contact time before anyone is asked for money.</span></div><div class=\"w\"><i>2</i><span>An eleven-person firm can staff a live session; a solo operator often cannot.</span></div><div class=\"w\"><i>3</i><span>Live delivery doubles as proof of seniority, which is <b>the thing being bought</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">At \u00a312k the shape has to manufacture contact time. Whatever they pick must put a human in front of the buyer before the ask, not after it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q6</span><span class=\"fbar\"><i style=\"width:48.6%\"></i></span><span class=\"pg num\">048<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q6 \u00b7 Solopreneur",title:"Sarah Chen answers Q6",html:"<div class=\"slide\" data-i=\"48\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q6 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">36 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 6</u><p>Which funnel shape are you building?</p></div><div class=\"answer\"><u>How they answer it</u><p>Reverse squeeze funnel \u2014 my ticket is too small to justify a call on every lead.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Any shape requiring a weekly live slot competes with billable delivery hours.</span></div><div class=\"w\"><i>2</i><span>A recorded or evergreen shape lets the funnel run during her busiest delivery weeks.</span></div><div class=\"w\"><i>3</i><span>Lower maintenance beats higher conversion when there is <b>nobody to cover a missed week</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The honest constraint is staffing, not strategy. A shape that needs her live every week competes directly with the delivery work that pays the bills.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q6</span><span class=\"fbar\"><i style=\"width:50.0%\"></i></span><span class=\"pg num\">049<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 the turn",title:"Half two \u2014 the conversion engine",html:"<div class=\"slide\" data-i=\"49\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 the turn</span><span class=\"sp\"></span><span class=\"step num\">37 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Part B</div><div class=\"h2\">Now turn those decisions into a machine</div><div class=\"lede\">Part A gave you answers: who, what, which shape. On their own they are a document. The rest of this session turns them into <em>one structured source of truth</em> that every page, email, ad and outreach message gets generated from.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Everything downstream derives from one file</div><div class=\"cb\">Change a block tomorrow and every headline, email and ad drawn from it updates. That is what a source of truth buys you.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">It is what you hand the agent</div><div class=\"cb\">On Day 3 this file <em>is</em> the context an AI builds from. A vague brief produces a template.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">The diagnostic is the engine inside the engine</div><div class=\"cb\">Ask, score, band, prescribe \u2014 so the funnel recommends a rung instead of arguing for one.</div></div></div><div class=\"bar\"><span class=\"bl\">Why the same session</span><span class=\"bt\">The engine is unanswerable until the strategy above it is settled. Splitting them across two days is how people arrive with a blank file.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Half two \u2014 the conversion engine</span><span class=\"fbar\"><i style=\"width:51.4%\"></i></span><span class=\"pg num\">050<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 framing",title:"Funnel vs campaign",html:"<div class=\"slide\" data-i=\"50\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 framing</span><span class=\"sp\"></span><span class=\"step num\">38 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Know the difference</div><div class=\"h2\" style=\"font-size:2.6cqw\">A campaign is a moment. A funnel is a machine.</div><div class=\"matrix fill\" style=\"grid-template-columns:minmax(0,.85fr) repeat(2,minmax(0,1fr))\"><div class=\"mc head\"></div><div class=\"mc head\"><b>Campaign</b></div><div class=\"mc head\"><b>Funnel</b></div><div class=\"mc rowh\"><b>What it is</b></div><div class=\"mc\"><span>A burst \u2014 a launch, a push, a good week.</span></div><div class=\"mc\"><span>An always-on machine that runs without you launching anything.</span></div><div class=\"mc rowh\"><b>How it fails</b></div><div class=\"mc\"><span>Quietly, and you cannot say which part.</span></div><div class=\"mc\"><span>At one named step, which you can see in the report.</span></div><div class=\"mc rowh\"><b>What it needs</b></div><div class=\"mc\"><span>Energy, timing and someone to drive it.</span></div><div class=\"mc\"><span>Instrumentation and a weekly thirty-minute review.</span></div><div class=\"mc rowh\"><b>What it produces</b></div><div class=\"mc\"><span>Revenue you cannot forecast.</span></div><div class=\"mc\"><span>Revenue you can forecast, and improve one step at a time.</span></div><div class=\"mc rowh\"><b>When to use it</b></div><div class=\"mc\"><span>A genuine event \u2014 a launch, a deadline, a season.</span></div><div class=\"mc\"><span>Everything else. This is the default.</span></div></div><div class=\"foot\">Campaigns are not wrong \u2014 they are a layer you run <em>on top of</em> a funnel. The mistake is running campaigns <em>instead of</em> one.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Funnel vs campaign</span><span class=\"fbar\"><i style=\"width:52.8%\"></i></span><span class=\"pg num\">051<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 step 1",title:"Five inputs, every asset",html:"<div class=\"slide\" data-i=\"51\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 step 1</span><span class=\"sp\"></span><span class=\"step num\">39 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 1 \u00b7 the five blocks</div><div class=\"h2\" style=\"font-size:2.35cqw\">Define five inputs once \u2192 generate every asset</div><div class=\"lede\">Offer, ICP, brand, mechanism, proof. Write them once and every headline, email, ad and landing page draws from the same well. Change one block and everything downstream updates \u2014 which is the entire reason this is a file rather than a document.</div><div class=\"viz\"><svg viewBox=\"0 8 800 327\" role=\"img\" aria-label=\"Hub and spoke diagram: five context blocks feed a central conversion engine, which generates six funnel assets.\">\n          <defs>\n            <marker id=\"HUB_ain\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"HUB_aout\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" opacity=\".6\" marker-end=\"url(#HUB_ain)\">\n            <path d=\"M180 52 C270 52 250 170 322 186\"/>\n            <path d=\"M180 112 C260 112 260 176 322 192\"/>\n            <path d=\"M180 172 C250 172 270 186 322 198\"/>\n            <path d=\"M180 232 C260 232 270 208 322 204\"/>\n            <path d=\"M180 292 C270 292 250 224 322 210\"/>\n          </g>\n          <g fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.6\" opacity=\".7\" marker-end=\"url(#HUB_aout)\">\n            <path d=\"M478 176 C560 150 540 44 620 40\" class=\"flowline\"/>\n            <path d=\"M478 184 C560 168 545 92 620 92\" class=\"flowline\"/>\n            <path d=\"M478 194 C560 190 555 142 620 144\" class=\"flowline\"/>\n            <path d=\"M478 200 C560 200 555 198 620 198\" class=\"flowline\"/>\n            <path d=\"M478 208 C560 214 550 250 620 250\" class=\"flowline\"/>\n            <path d=\"M478 214 C560 232 545 300 620 302\" class=\"flowline\"/>\n          </g>\n          <g font-size=\"13\">\n            <rect x=\"8\" y=\"32\" width=\"172\" height=\"40\" rx=\"11\" fill=\"var(--accent-2)\"/><text x=\"26\" y=\"49\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13.5\">1 \u00b7 Offer</text><text x=\"26\" y=\"63\" class=\"svmute\" font-size=\"11\">price \u00b7 guarantee \u00b7 bonuses</text>\n            <rect x=\"8\" y=\"92\" width=\"172\" height=\"40\" rx=\"11\" fill=\"var(--accent-2)\"/><text x=\"26\" y=\"109\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13.5\">2 \u00b7 ICP</text><text x=\"26\" y=\"123\" class=\"svmute\" font-size=\"11\">role \u00b7 pains \u00b7 desires</text>\n            <rect x=\"8\" y=\"152\" width=\"172\" height=\"40\" rx=\"11\" fill=\"var(--accent-2)\"/><text x=\"26\" y=\"169\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13.5\">3 \u00b7 Brand</text><text x=\"26\" y=\"183\" class=\"svmute\" font-size=\"11\">voice \u00b7 visual rules</text>\n            <rect x=\"8\" y=\"212\" width=\"172\" height=\"40\" rx=\"11\" fill=\"var(--accent-2)\"/><text x=\"26\" y=\"229\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13.5\">4 \u00b7 Mechanism</text><text x=\"26\" y=\"243\" class=\"svmute\" font-size=\"11\">your unique \"how\"</text>\n            <rect x=\"8\" y=\"272\" width=\"172\" height=\"40\" rx=\"11\" fill=\"var(--accent-2)\"/><text x=\"26\" y=\"289\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13.5\">5 \u00b7 Proof</text><text x=\"26\" y=\"303\" class=\"svmute\" font-size=\"11\">results \u00b7 testimonials</text>\n          </g>\n          <circle cx=\"400\" cy=\"200\" r=\"78\" fill=\"var(--accent)\"/>\n          <circle cx=\"400\" cy=\"200\" r=\"78\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"10\" opacity=\".22\" class=\"pulse\"/>\n          <text x=\"400\" y=\"188\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"16\">Conversion</text>\n          <text x=\"400\" y=\"208\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"16\">engine</text>\n          <text x=\"400\" y=\"228\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"10.5\">single source of truth</text>\n          <g font-size=\"12.5\">\n            <rect x=\"620\" y=\"22\" width=\"172\" height=\"36\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"638\" y=\"41\" class=\"svlabel\">Landing page</text>\n            <rect x=\"620\" y=\"74\" width=\"172\" height=\"36\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"638\" y=\"93\" class=\"svlabel\">Nurture emails</text>\n            <rect x=\"620\" y=\"126\" width=\"172\" height=\"36\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"638\" y=\"145\" class=\"svlabel\">Ad copy</text>\n            <rect x=\"620\" y=\"180\" width=\"172\" height=\"36\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"638\" y=\"199\" class=\"svlabel\">Outreach templates</text>\n            <rect x=\"620\" y=\"232\" width=\"172\" height=\"36\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"638\" y=\"251\" class=\"svlabel\">Sales page</text>\n            <rect x=\"620\" y=\"284\" width=\"172\" height=\"36\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"638\" y=\"303\" class=\"svlabel\">Checkout</text>\n          </g>\n        </svg></div><div class=\"chips\"><span class=\"chip\">Offer</span><span class=\"chip\">ICP</span><span class=\"chip\">Brand</span><span class=\"chip\">Mechanism</span><span class=\"chip\">Proof</span></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Filled once, read everywhere</div><div class=\"cb\">The spec is the input to the build, the copy and the analytics config alike.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">No per-asset overrides</div><div class=\"cb\">The moment one page hardcodes a colour or a price, the file stops being the source of truth.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">It is what you hand the agent</div><div class=\"cb\">On Day 3 this file <em>is</em> the context. A vague brief produces a template.</div></div></div><div class=\"bar\"><span class=\"bl\">The test</span><span class=\"bt\">If you changed your price today, how many places would you have to edit? The answer should be one.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Five inputs, every asset</span><span class=\"fbar\"><i style=\"width:54.2%\"></i></span><span class=\"pg num\">052<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 step 1",title:"The capture interview",html:"<div class=\"slide\" data-i=\"52\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 step 1</span><span class=\"sp\"></span><span class=\"step num\">40 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">How the blocks get filled</div><div class=\"h2\">Twenty-one questions, in five groups</div><div class=\"lede\">The source material specifies an interview that has to be completed and approved before a single line of the build is written. The groups are the five blocks, made answerable.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">A\u00b7B</div><div class=\"ct\">Brand &amp;amp; story, then the assessment</div><div class=\"cb\">Who you are and how you sound, followed by what you will ask a visitor and why each question earns its place.</div></div><div class=\"card\"><div class=\"cn\">C\u00b7D</div><div class=\"ct\">Offer, pricing and payments, then traffic</div><div class=\"cb\">What is sold, at what price, with which guarantee \u2014 and which channels will actually carry people to it.</div></div><div class=\"card\"><div class=\"cn\">E</div><div class=\"ct\">Tech, analytics and deploy</div><div class=\"cb\">Where it runs, what it records and how it ships. Decided now, not discovered on launch day.</div></div></div><div class=\"bar\"><span class=\"bl\">The rule that makes it work</span><span class=\"bt\">No code until the interview is answered <em>and</em> approved. An agent that starts building immediately gives you one expensive chance to catch a misunderstanding, later.</span></div><div class=\"foot\">Source: the 21-question capture interview, <b>00-START-HERE</b> in the assessment context pack.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The capture interview</span><span class=\"fbar\"><i style=\"width:55.6%\"></i></span><span class=\"pg num\">053<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 positioning",title:"Name your mechanism",html:"<div class=\"slide\" data-i=\"53\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 positioning</span><span class=\"sp\"></span><span class=\"step num\">41 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Pro tip</div><div class=\"h2\">An unnamed method is a commodity</div><div class=\"lede\">\u201cWe do outreach\u201d is something anyone can sell, and the only remaining question is price. A named method with a reason for each step is a reason to choose you \u2014 and it is the name you put on every page you build tomorrow.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Name the transformation, not the tool</div><div class=\"cb\">\u201cProfile-to-Message\u201d describes what changes. \u201cOur AI platform\u201d describes what you bought.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Three to five steps</div><div class=\"cb\">Fewer than three is a slogan. More than five and nobody can repeat it back to a colleague.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">A reason per step</div><div class=\"cb\">Each step must be necessary, and you must be able to say why in one sentence. A step you cannot justify is decoration.</div></div></div><div class=\"bar\"><span class=\"bl\">Where it goes</span><span class=\"bt\">The mechanism name appears on the landing page, in the nurture sequence, on the run-of-show and in the proposal. Name it once, today.</span></div><div class=\"foot\">The strongest mechanisms contain one mildly contrarian claim \u2014 it is what makes them memorable.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Name your mechanism</span><span class=\"fbar\"><i style=\"width:56.9%\"></i></span><span class=\"pg num\">054<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 step 2",title:"Ask \u2192 score \u2192 band \u2192 prescribe",html:"<div class=\"slide\" data-i=\"54\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 step 2</span><span class=\"sp\"></span><span class=\"step num\">42 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 2 \u00b7 the engine inside the engine</div><div class=\"h2\" style=\"font-size:2.35cqw\">Ask \u2192 score \u2192 band \u2192 prescribe</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 552\" role=\"img\" aria-label=\"Diagnose-then-prescribe engine. Left column: five things you ask, from role and firmographics through agreement statements to goals. Middle column: four score axes that those answers feed, each showing a partial fill. Right column: a nought-to-one-hundred gauge showing sixty-eight, a band label, and a recommended tier card. A footer states that the band-to-tier mapping is a rule stored in the spec, not a judgement call.\">\n          <defs>\n            <marker id=\"DIAG_dp\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"DIAG_dp2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"24\" class=\"svsub\" font-size=\"11\">1 \u00b7 WHAT YOU ASK</text>\n          <text x=\"272\" y=\"24\" class=\"svsub\" font-size=\"11\">2 \u00b7 WHAT IT SCORES</text>\n          <text x=\"562\" y=\"24\" class=\"svsub\" font-size=\"11\">3 \u00b7 WHAT THEY GET BACK</text>\n          <!-- connectors -->\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.4\" opacity=\".5\" marker-end=\"url(#DIAG_dp)\">\n            <path d=\"M232 70 C254 70 250 88 266 90\" class=\"flowline\"/>\n            <path d=\"M232 124 C254 124 252 148 266 150\" class=\"flowline\"/>\n            <path d=\"M232 178 C254 178 252 206 266 210\" class=\"flowline\"/>\n            <path d=\"M232 232 C254 232 250 150 266 150\" class=\"flowline\"/>\n            <path d=\"M232 232 C254 232 250 210 266 212\" class=\"flowline\"/>\n            <path d=\"M232 286 C254 286 250 268 266 270\" class=\"flowline\"/>\n          </g>\n          <!-- questions -->\n          <g font-size=\"11\">\n            <rect x=\"16\" y=\"48\" width=\"216\" height=\"44\" rx=\"10\" class=\"node\"/><text x=\"32\" y=\"68\" class=\"svlabel\" font-size=\"11.5\">Who are you?</text><text x=\"32\" y=\"83\" class=\"svmute\" font-size=\"10\">role \u00b7 seniority \u00b7 single-select</text>\n            <rect x=\"16\" y=\"102\" width=\"216\" height=\"44\" rx=\"10\" class=\"node\"/><text x=\"32\" y=\"122\" class=\"svlabel\" font-size=\"11.5\">How big are you?</text><text x=\"32\" y=\"137\" class=\"svmute\" font-size=\"10\">headcount \u00b7 revenue band</text>\n            <rect x=\"16\" y=\"156\" width=\"216\" height=\"44\" rx=\"10\" class=\"node\"/><text x=\"32\" y=\"176\" class=\"svlabel\" font-size=\"11.5\">What's already in place?</text><text x=\"32\" y=\"191\" class=\"svmute\" font-size=\"10\">current stack \u00b7 current spend</text>\n            <rect x=\"16\" y=\"210\" width=\"216\" height=\"44\" rx=\"10\" fill=\"var(--accent-2)\"/><text x=\"32\" y=\"230\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">What hurts?</text><text x=\"32\" y=\"245\" class=\"svmute\" font-size=\"10\">6\u201312 agreement statements \u2190 the meat</text>\n            <rect x=\"16\" y=\"264\" width=\"216\" height=\"44\" rx=\"10\" class=\"node\"/><text x=\"32\" y=\"284\" class=\"svlabel\" font-size=\"11.5\">What's the goal?</text><text x=\"32\" y=\"299\" class=\"svmute\" font-size=\"10\">multi-select + timeline</text>\n          </g>\n          <!-- score axes -->\n          <g font-size=\"10.5\">\n            <rect x=\"266\" y=\"72\" width=\"252\" height=\"40\" rx=\"9\" class=\"node\"/>\n            <text x=\"280\" y=\"90\" class=\"svlabel\" font-size=\"11\">Acquisition</text>\n            <rect x=\"280\" y=\"96\" width=\"224\" height=\"7\" rx=\"3.5\" fill=\"var(--line)\"/><rect x=\"280\" y=\"96\" width=\"70\" height=\"7\" rx=\"3.5\" fill=\"var(--pink)\"/>\n            <text x=\"508\" y=\"90\" text-anchor=\"end\" class=\"svmute\">31</text>\n            <rect x=\"266\" y=\"132\" width=\"252\" height=\"40\" rx=\"9\" class=\"node\"/>\n            <text x=\"280\" y=\"150\" class=\"svlabel\" font-size=\"11\">Conversion</text>\n            <rect x=\"280\" y=\"156\" width=\"224\" height=\"7\" rx=\"3.5\" fill=\"var(--line)\"/><rect x=\"280\" y=\"156\" width=\"43\" height=\"7\" rx=\"3.5\" fill=\"var(--pink)\"/>\n            <text x=\"508\" y=\"150\" text-anchor=\"end\" class=\"svmute\">19</text>\n            <rect x=\"266\" y=\"192\" width=\"252\" height=\"40\" rx=\"9\" class=\"node\"/>\n            <text x=\"280\" y=\"210\" class=\"svlabel\" font-size=\"11\">Retention</text>\n            <rect x=\"280\" y=\"216\" width=\"224\" height=\"7\" rx=\"3.5\" fill=\"var(--line)\"/><rect x=\"280\" y=\"216\" width=\"172\" height=\"7\" rx=\"3.5\" fill=\"var(--teal)\"/>\n            <text x=\"508\" y=\"210\" text-anchor=\"end\" class=\"svmute\">77</text>\n            <rect x=\"266\" y=\"252\" width=\"252\" height=\"40\" rx=\"9\" class=\"node\"/>\n            <text x=\"280\" y=\"270\" class=\"svlabel\" font-size=\"11\">Ops &amp; data</text>\n            <rect x=\"280\" y=\"276\" width=\"224\" height=\"7\" rx=\"3.5\" fill=\"var(--line)\"/><rect x=\"280\" y=\"276\" width=\"130\" height=\"7\" rx=\"3.5\" fill=\"var(--amber)\"/>\n            <text x=\"508\" y=\"270\" text-anchor=\"end\" class=\"svmute\">58</text>\n          </g>\n          <text x=\"266\" y=\"312\" class=\"svmute\" font-size=\"10\">Each answer adds weight \u00d7 raw score to one or more axes. Skipped branches add nothing.</text>\n          <path d=\"M522 182 C544 182 542 176 556 176\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" marker-end=\"url(#DIAG_dp2)\" class=\"flowline\"/>\n          <!-- gauge -->\n          <path d=\"M638 190 A 64 64 0 0 1 766 190\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"14\" stroke-linecap=\"round\"/>\n          <path d=\"M638 190 A 64 64 0 0 1 736 136\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"14\" stroke-linecap=\"round\"/>\n          <text x=\"702\" y=\"168\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"30\">68</text>\n          <text x=\"702\" y=\"188\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">out of 100</text>\n          <text x=\"632\" y=\"208\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">0</text>\n          <text x=\"772\" y=\"208\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">100</text>\n          <rect x=\"562\" y=\"226\" width=\"282\" height=\"38\" rx=\"9\" fill=\"var(--amber-bg)\"/>\n          <text x=\"703\" y=\"240\" text-anchor=\"middle\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"11.5\">BAND \u00b7 conversion-limited</text>\n          <text x=\"703\" y=\"256\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">your weakest axis names the band</text>\n          <rect x=\"562\" y=\"276\" width=\"282\" height=\"150\" rx=\"12\" fill=\"var(--accent)\"/>\n          <text x=\"582\" y=\"300\" class=\"svwhite\" font-size=\"12\">RECOMMENDED FOR YOU</text>\n          <text x=\"582\" y=\"326\" class=\"svwhite\" font-size=\"14\">The 90-day conversion sprint</text>\n          <text x=\"582\" y=\"348\" class=\"svwhite2\" font-size=\"11\">Because your retention is already strong,</text>\n          <text x=\"582\" y=\"366\" class=\"svwhite2\" font-size=\"11\">the fastest money is in the step before it.</text>\n          <line x1=\"582\" y1=\"384\" x2=\"824\" y2=\"384\" stroke=\"rgba(255,255,255,.28)\"/>\n          <text x=\"582\" y=\"406\" class=\"svwhite2\" font-size=\"11\">Their own words, echoed back \u2192  one CTA</text>\n          <!-- rule footer -->\n          <rect x=\"16\" y=\"450\" width=\"828\" height=\"86\" rx=\"12\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <text x=\"36\" y=\"476\" class=\"svlabel\" font-size=\"11.5\">THE RULE IS STORED, NOT DECIDED</text>\n          <text x=\"36\" y=\"496\" class=\"svmute\" font-size=\"10.5\">score 0\u201340 \u2192 entry rung \u00b7 41\u201375 \u2192 core rung \u00b7 76\u2013100 \u2192 flagship rung. Written down once, applied identically to everyone.</text>\n          <text x=\"36\" y=\"514\" class=\"svmute\" font-size=\"10.5\">That is what makes it a machine: same inputs, same prescription, every time \u2014 and a rule you can A/B test instead of a hunch you can't.</text>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Answers map to axes, not to a total</div><div class=\"ab\">Each answer carries a weight against one named dimension. The axes are the three to five things your offer genuinely improves.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Normalise, then band</div><div class=\"ab\">Sum the weighted scores per axis, normalise to 0\u2013100, then apply a written rule that maps a range to a named band.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">The band prescribes the rung</div><div class=\"ab\">Band \u2192 recommended tier is a rule you commit to in advance, which means it can be tested rather than argued about.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Diagnose first, prescribe second. People do not argue with a conclusion they helped produce.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Ask \u2192 score \u2192 band \u2192 prescribe</span><span class=\"fbar\"><i style=\"width:58.3%\"></i></span><span class=\"pg num\">055<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 step 2",title:"Making the score honest",html:"<div class=\"slide\" data-i=\"55\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 step 2</span><span class=\"sp\"></span><span class=\"step num\">43 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Before you ship a diagnostic</div><div class=\"h2\">Three things that keep a score honest</div><div class=\"lede\">A diagnostic that flatters everyone is a quiz. One that produces a recommendation you cannot deliver is worse \u2014 it converts, and then it disappoints.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Only axes you can move</div><div class=\"cb\">An axis your offer does not improve makes the whole score dishonest. If you cannot help with retention, do not measure it.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Skipped questions score zero</div><div class=\"cb\">Conditional branches mean not everyone sees every question. A skipped screen must contribute nothing rather than a default.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Unit-test it with three answer sets</div><div class=\"cb\">A deliberately low set, a middling one and a high one. If all three land in the same band, the weights are wrong.</div></div></div><div class=\"bar\"><span class=\"bl\">The rule to write down</span><span class=\"bt\">Which score range maps to which recommended tier. A written rule can be A/B tested next month; a hunch can only be argued about.</span></div><div class=\"foot\">Source: the scoring engine and its branching predicates, <b>02-build-and-launch-tasks</b>.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Making the score honest</span><span class=\"fbar\"><i style=\"width:59.7%\"></i></span><span class=\"pg num\">056<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 step 3",title:"One spec, one renderer, every asset",html:"<div class=\"slide\" data-i=\"56\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 step 3</span><span class=\"sp\"></span><span class=\"step num\">44 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 3 \u00b7 one file</div><div class=\"h2\" style=\"font-size:2.35cqw\">One spec \u2192 one renderer \u2192 every asset</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 512\" role=\"img\" aria-label=\"Spec-driven architecture. Five context blocks feed a single funnel spec file listing its keys. The file feeds one renderer, which produces six assets: landing page, nurture emails, ad copy, outreach templates, checkout, and upsell pages. Below, an experiments lane shows variant A and variant B stored in the same file, split fifty-fifty across sessions, with the winner written back into the file.\">\n          <defs>\n            <marker id=\"SPEC_sp\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"SPEC_sp2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"26\" class=\"svsub\" font-size=\"11\">DEFINE ONCE</text>\n          <text x=\"286\" y=\"26\" class=\"svsub\" font-size=\"11\">STORED AS ONE FILE</text>\n          <text x=\"656\" y=\"26\" class=\"svsub\" font-size=\"11\">RENDERS EVERYTHING</text>\n          <g font-size=\"11\">\n            <rect x=\"16\" y=\"48\" width=\"230\" height=\"40\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"32\" y=\"72\" fill=\"var(--accent-ink)\" font-weight=\"650\">Offer \u00b7 pricing \u00b7 guarantee</text>\n            <rect x=\"16\" y=\"96\" width=\"230\" height=\"40\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"32\" y=\"120\" fill=\"var(--accent-ink)\" font-weight=\"650\">ICP \u00b7 persona \u00b7 objection</text>\n            <rect x=\"16\" y=\"144\" width=\"230\" height=\"40\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"32\" y=\"168\" fill=\"var(--accent-ink)\" font-weight=\"650\">Brand voice \u00b7 visual rules</text>\n            <rect x=\"16\" y=\"192\" width=\"230\" height=\"40\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"32\" y=\"216\" fill=\"var(--accent-ink)\" font-weight=\"650\">Mechanism \u00b7 the named method</text>\n            <rect x=\"16\" y=\"240\" width=\"230\" height=\"40\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"32\" y=\"264\" fill=\"var(--accent-ink)\" font-weight=\"650\">Proof \u00b7 tagged to objections</text>\n          </g>\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" opacity=\".55\" marker-end=\"url(#SPEC_sp)\">\n            <path d=\"M246 68 C266 68 262 150 280 158\" class=\"flowline\"/>\n            <path d=\"M246 116 C266 116 264 158 280 162\" class=\"flowline\"/>\n            <path d=\"M246 164 C266 164 266 164 280 166\" class=\"flowline\"/>\n            <path d=\"M246 212 C266 212 264 176 280 172\" class=\"flowline\"/>\n            <path d=\"M246 260 C266 260 262 190 280 176\" class=\"flowline\"/>\n          </g>\n          <rect x=\"290\" y=\"48\" width=\"242\" height=\"248\" rx=\"12\" class=\"node\"/>\n          <rect x=\"290\" y=\"48\" width=\"242\" height=\"30\" rx=\"12\" fill=\"var(--accent-2)\"/>\n          <rect x=\"290\" y=\"64\" width=\"242\" height=\"14\" fill=\"var(--accent-2)\"/>\n          <text x=\"306\" y=\"64\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">funnel-spec file</text>\n          <g style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace\" font-size=\"11\" class=\"svsub\">\n            <text x=\"306\" y=\"98\">brand { }</text>\n            <text x=\"306\" y=\"122\">icp { }</text>\n            <text x=\"306\" y=\"146\">offer { }</text>\n            <text x=\"306\" y=\"170\">pricing { tiers[] }</text>\n            <text x=\"306\" y=\"194\">stages [ screens[] ]</text>\n            <text x=\"306\" y=\"218\">scoreModel { axes, rule }</text>\n            <text x=\"306\" y=\"242\">copy { headlines, ctas }</text>\n            <text x=\"306\" y=\"266\">analytics { events[] }</text>\n            <text x=\"306\" y=\"290\" fill=\"var(--accent-ink)\" font-weight=\"700\">experiments [ ]</text>\n          </g>\n          <path d=\"M532 172 L556 172\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" marker-end=\"url(#SPEC_sp)\" class=\"flowline\"/>\n          <rect x=\"566\" y=\"48\" width=\"70\" height=\"248\" rx=\"12\" fill=\"var(--accent)\"/>\n          <text transform=\"translate(601,172) rotate(-90)\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"13\">ONE RENDERER</text>\n          <path d=\"M636 172 L650 172\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2\" marker-end=\"url(#SPEC_sp2)\" class=\"flowline\"/>\n          <g font-size=\"11\">\n            <rect x=\"656\" y=\"48\" width=\"188\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"672\" y=\"70\" class=\"svlabel\" font-size=\"11.5\">Landing page</text>\n            <rect x=\"656\" y=\"90\" width=\"188\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"672\" y=\"112\" class=\"svlabel\" font-size=\"11.5\">Nurture emails</text>\n            <rect x=\"656\" y=\"132\" width=\"188\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"672\" y=\"154\" class=\"svlabel\" font-size=\"11.5\">Ad copy</text>\n            <rect x=\"656\" y=\"174\" width=\"188\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"672\" y=\"196\" class=\"svlabel\" font-size=\"11.5\">Outreach templates</text>\n            <rect x=\"656\" y=\"216\" width=\"188\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"672\" y=\"238\" class=\"svlabel\" font-size=\"11.5\">Checkout</text>\n            <rect x=\"656\" y=\"258\" width=\"188\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"672\" y=\"280\" class=\"svlabel\" font-size=\"11.5\">Upsell pages</text>\n          </g>\n          <!-- experiments lane -->\n          <rect x=\"16\" y=\"330\" width=\"828\" height=\"164\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <text x=\"36\" y=\"356\" class=\"svlabel\" font-size=\"11.5\">AND EVERY EXPERIMENT LIVES IN THE SAME FILE</text>\n          <g font-size=\"11\">\n            <rect x=\"36\" y=\"374\" width=\"170\" height=\"44\" rx=\"9\" class=\"node\"/><text x=\"50\" y=\"394\" class=\"svlabel\" font-size=\"11\">headline: variant A</text><text x=\"50\" y=\"409\" class=\"svmute\" font-size=\"10\">the current winner</text>\n            <rect x=\"218\" y=\"374\" width=\"170\" height=\"44\" rx=\"9\" class=\"node\" stroke=\"var(--accent)\"/><text x=\"232\" y=\"394\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">headline: variant B</text><text x=\"232\" y=\"409\" class=\"svmute\" font-size=\"10\">the challenger</text>\n            <rect x=\"430\" y=\"374\" width=\"170\" height=\"44\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"444\" y=\"394\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">50 / 50 of sessions</text><text x=\"444\" y=\"409\" class=\"svmute\" font-size=\"10\">same UTM either side</text>\n            <rect x=\"642\" y=\"374\" width=\"186\" height=\"44\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"656\" y=\"394\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11\">winner written back</text><text x=\"656\" y=\"409\" class=\"svmute\" font-size=\"10\">loser reverted, learning logged</text>\n          </g>\n          <g fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.5\" opacity=\".6\" marker-end=\"url(#SPEC_sp)\">\n            <path d=\"M392 396 L424 396\"/><path d=\"M604 396 L636 396\"/>\n          </g>\n          <path d=\"M735 370 C735 344 640 336 500 336 L360 336\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.6\" stroke-dasharray=\"5 6\" marker-end=\"url(#SPEC_sp2)\" opacity=\".85\"/>\n          <text x=\"548\" y=\"352\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">back into the file \u2014 so the funnel improves itself</text>\n          <text x=\"36\" y=\"444\" class=\"svmute\" font-size=\"10.5\">One change per leak. Never two at once, or you can't attribute the result. Let each arm reach a meaningful sample before you decide \u2014</text>\n          <text x=\"36\" y=\"462\" class=\"svmute\" font-size=\"10.5\">a one-day blip is noise. And log every result, including the losers, so you never re-run an experiment you've already lost.</text>\n          <text x=\"36\" y=\"480\" class=\"svmute\" font-size=\"10.5\">This lane is why Day 3 exists. Build it now and the optimisation loop has somewhere to write.</text>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Data in the file, never in the code</div><div class=\"ab\">Every brand value, price, question and analytics key lives in the spec. The renderer knows how to draw, not what to say.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">One theme layer</div><div class=\"ab\">Colours, fonts, radius and button shape bind to CSS variables from the spec. No page ever overrides a colour locally.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Compliance is a field, not a page</div><div class=\"ab\">Disclaimers, refund window, consent and data-minimisation are spec fields \u2014 which is how they stay consistent across every asset.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">If changing your price means editing more than one file, the spec is not yet the source of truth.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">One spec, one renderer, every asset</span><span class=\"fbar\"><i style=\"width:61.1%\"></i></span><span class=\"pg num\">057<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 step 3",title:"The screen primitives",html:"<div class=\"slide\" data-i=\"57\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 step 3</span><span class=\"sp\"></span><span class=\"step num\">45 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">How the pages get built</div><div class=\"h2\">A small library of screens, reused everywhere</div><div class=\"lede\">The source architecture defines a fixed set of screen primitives \u2014 one component per screen type, sharing a header and footer, with only the body differing. That constraint is what makes a funnel buildable in a day rather than a month.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">One component per primitive</div><div class=\"cb\">A single-choice screen, a multi-choice screen, a slider, a result screen. Built once, configured many times.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Shared chrome</div><div class=\"cb\">Header, progress and footer are identical across every screen, so a change lands everywhere at once.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Only the body changes</div><div class=\"cb\">Which means a new question is a spec entry, not a new page \u2014 and the visual language cannot drift.</div></div></div><div class=\"bar\"><span class=\"bl\">Why this matters on Day 3</span><span class=\"bt\">An agent building against a primitive library produces something consistent. An agent building page-by-page produces sixteen slightly different pages.</span></div><div class=\"foot\">Source: the screen-primitive library, <b>01-assessment-funnel-blueprint</b>.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The screen primitives</span><span class=\"fbar\"><i style=\"width:62.5%\"></i></span><span class=\"pg num\">058<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1B \u00b7 proof",title:"Proof, organised by objection",html:"<div class=\"slide\" data-i=\"58\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1B \u00b7 proof</span><span class=\"sp\"></span><span class=\"step num\">46 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The fifth block</div><div class=\"h2\">Organise proof by the objection it answers</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">A number that changed</div><div class=\"rs\">Countable, and in the same unit before and after.</div></div><div class=\"rmeta\"><b>Best</b><span>hard proof</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">A name, with permission</div><div class=\"rs\">Or explicitly anonymised. Never implied consent you do not have.</div></div><div class=\"rmeta\"><b>Required</b><span>attribution</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">A date</div><div class=\"rs\">Recent enough to be credible, specific enough to be checked.</div></div><div class=\"rmeta\"><b>Required</b><span>recency</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Borrowed proof, labelled</div><div class=\"rs\">Someone else's result, clearly marked as theirs. Honest and still useful.</div></div><div class=\"rmeta\"><b>If new</b><span>acceptable</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Filed by objection</div><div class=\"rs\">Name each file after the objection it answers, not after the client.</div></div><div class=\"rmeta\"><b>Tonight</b><span>the homework</span></div></div></div><div class=\"bar\"><span class=\"bl\">Why name files by objection</span><span class=\"bt\">When you are writing a page on Day 3 you are not looking for \u201cthe Acme case study\u201d \u2014 you are looking for something that answers \u201cthis won't work at our size\u201d.</span></div><div class=\"foot\">If you have no proof at all, say so on the page and use borrowed proof. A confident sentence with nothing behind it is the one thing that cannot be recovered from.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Proof, organised by objection</span><span class=\"fbar\"><i style=\"width:63.9%\"></i></span><span class=\"pg num\">059<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Your offer block: price, guarantee, what's included, and what is explicitly NOT included.",html:"<div class=\"slide\" data-i=\"59\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">47 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 7 of 12</span><span class=\"qk\">Long answer \u00b7 30+ words</span><span class=\"qtime\">\u23f1 4 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your offer block: price, guarantee, what's included, and what is explicitly NOT included.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Four parts</u><span>Price, guarantee, what's in, what's explicitly out.</span></div><div class=\"qc\"><u>A real guarantee</u><span>Something that costs you money if it fails.</span></div><div class=\"qc\"><u>Named exclusions</u><span>The two things people always assume are included.</span></div></div><div class=\"foot\"><b>Why this one:</b> The exclusions do more work than the inclusions. They are what stops the wrong buyer arriving, and what stops scope creep eating the margin on the right one.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your offer block: price, guarantee, what's included, and what is explicitly NOT included.</span><span class=\"fbar\"><i style=\"width:65.3%\"></i></span><span class=\"pg num\">060<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q7 \u00b7 B2B SaaS",title:"SendFlow answers Q7",html:"<div class=\"slide\" data-i=\"60\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q7 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">48 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 7</u><p>Your offer block: price, guarantee, what's included, and what is explicitly NOT included.</p></div><div class=\"answer\"><u>How they answer it</u><p>$490/month per seat, cancel anytime, first month free if not live in 7 days. Includes setup and sequences. Does not include list purchase or domain costs.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>\u201cCancel anytime\u201d removes the commitment objection that kills self-serve subscriptions.</span></div><div class=\"w\"><i>2</i><span>The guarantee is operational \u2014 live in 7 days \u2014 and therefore entirely within their control.</span></div><div class=\"w\"><i>3</i><span>Excluding list purchase and domain costs heads off the <b>\u201cwhy am I being billed twice\u201d</b> conversation.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The guarantee is tied to <em>time to live</em>, not to results. For a subscription that is the honest promise \u2014 they control activation, the customer controls outcomes.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q7</span><span class=\"fbar\"><i style=\"width:66.7%\"></i></span><span class=\"pg num\">061<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q7 \u00b7 B2B consulting brand",title:"Apex Growth answers Q7",html:"<div class=\"slide\" data-i=\"61\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q7 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">49 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 7</u><p>Your offer block: price, guarantee, what's included, and what is explicitly NOT included.</p></div><div class=\"answer\"><u>How they answer it</u><p>\u00a312,000, 90 days, keep-working-free guarantee. Includes strategy, build and training. Does not include running campaigns for them after handover.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Price and duration are both fixed, which is what a partnership needs to approve spend.</span></div><div class=\"w\"><i>2</i><span>The guarantee directly answers the \u201cactivity, not clients\u201d scar from Day 1.</span></div><div class=\"w\"><i>3</i><span>Excluding post-handover campaign running protects the <b>margin and the positioning</b> at once.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A keep-working-free guarantee is expensive and that is the point \u2014 it transfers the exact risk the prior-agency objection is about.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q7</span><span class=\"fbar\"><i style=\"width:68.1%\"></i></span><span class=\"pg num\">062<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q7 \u00b7 Solopreneur",title:"Sarah Chen answers Q7",html:"<div class=\"slide\" data-i=\"62\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q7 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">50 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 7</u><p>Your offer block: price, guarantee, what's included, and what is explicitly NOT included.</p></div><div class=\"answer\"><u>How they answer it</u><p>$4,000, six weeks, built alongside you. Includes every asset and the recordings. Does not include ad spend or ongoing management.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A fixed price and a fixed six weeks make the commitment legible to a nervous first-time buyer.</span></div><div class=\"w\"><i>2</i><span>Including recordings converts a service into an asset they keep \u2014 worth more than a discount.</span></div><div class=\"w\"><i>3</i><span>Excluding ad spend and management stops the engagement <b>quietly becoming a retainer</b> for free.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cBuilt alongside you\u201d is simultaneously the delivery model, the guarantee and the differentiator. One phrase carrying three jobs is a sign the offer is tight.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q7</span><span class=\"fbar\"><i style=\"width:69.4%\"></i></span><span class=\"pg num\">063<i> / 230</i></span></div></div>"},
