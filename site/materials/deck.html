<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 3-Day AI RevOps Workshop: Master Deck</title>
<meta name="robots" content="noindex">
<style>
/* This palette is playbook.html's, kept name-for-name on purpose. The 29
   diagrams are lifted out of the playbook with their markup intact, and they
   paint themselves with `fill="var(--accent)"`, `var(--teal)` and friends
   directly in attributes. An undefined custom property in a fill attribute is
   not ignored; it computes to solid black, so dropping one token here silently
   turns labelled nodes into black slabs. Do not rename these to match the
   deck's own --violet/--a tokens; add, never substitute. */
:root{
  --bg:#f6f7f9;--panel:#fff;--panel-2:#fbfcfd;--ink:#0f1216;--ink-2:#454b57;--ink-3:#878d99;
  --line:#e6e8ec;--line-2:#d6d9df;
  --accent:#5b4bd6;--accent-2:#efedfd;--accent-ink:#3a2fa8;
  --teal:#0f9e75;--teal-bg:#e3f6ef;--amber:#b8790f;--amber-bg:#fbefda;
  --pink:#c23a68;--pink-bg:#fbe9f0;--blue:#2f6fd0;--blue-bg:#e8f0fb;
  --green:#3b8a1f;--green-bg:#eaf5e2;--gold:#a06a12;--gold-bg:#f8efd8;--danger:#c23a68;
  --shadow:0 1px 2px rgba(16,19,24,.04),0 8px 30px rgba(16,19,24,.09);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0c0e13;--panel:#151821;--panel-2:#1a1e28;--ink:#f2f4f8;--ink-2:#b4bac6;--ink-3:#7a818e;
  --line:#252a35;--line-2:#333a48;
  --accent:#8e83f0;--accent-2:#211f3c;--accent-ink:#bcb4fb;
  --teal:#3ec79b;--teal-bg:#123027;--amber:#e0a63f;--amber-bg:#332612;
  --pink:#e97aa2;--pink-bg:#331722;--blue:#6aa3ec;--blue-bg:#122237;
  --green:#7cc65a;--green-bg:#1a2c11;--gold:#d9ab54;--gold-bg:#2e2513;--danger:#e97aa2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}

.top{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;z-index:30;
     background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;text-decoration:none;color:inherit}
.tmark{position:relative;display:block;width:25px;height:25px;flex:none}
.tmark img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tmark .tmk-white{display:none}
[data-theme="dark"] .tmark .tmk-ink{display:none}
[data-theme="dark"] .tmark .tmk-white{display:block}
.tname{font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.tdot{color:var(--ink-3);font-weight:400;margin:0 1px}
.top b{font-size:13px;font-weight:700;white-space:nowrap}
.top .sp{flex:1}
.filters{display:flex;gap:4px;align-items:center}
.filters button{font:inherit;font-size:12px;font-weight:650;color:var(--ink-2);background:none;border:1px solid var(--line);
                border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.filters button:hover{border-color:var(--ink-3)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.top a,.top .ib{font:inherit;font-size:12px;color:var(--ink-2);background:none;border:1px solid var(--line);border-radius:7px;
                padding:4px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}

.stagewrap{position:fixed;inset:46px 0 56px;display:flex;align-items:center;justify-content:center;padding:18px}
.stage{position:relative;width:100%;max-width:1180px;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);
       border-radius:16px;box-shadow:var(--shadow);overflow:hidden}

.nav{position:fixed;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;
     background:var(--panel);border-top:1px solid var(--line);z-index:30}
.nav button{font:inherit;font-size:13px;font-weight:650;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
            border-radius:8px;padding:7px 13px;cursor:pointer}
.nav button:hover{border-color:var(--ink-3)}
.nav .prog{flex:1;height:5px;background:var(--line);border-radius:20px;overflow:hidden;cursor:pointer}
.nav .prog i{display:block;height:100%;background:linear-gradient(90deg,#5b4bd6,#8b5cf6);border-radius:20px;transition:width .25s}
.nav .count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:112px;text-align:center}
.nav .count b{color:var(--ink);font-weight:700}

/* overview grid; essential once the deck is 200+ slides long */
.ov{position:fixed;inset:46px 0 56px;background:var(--bg);z-index:25;overflow:auto;padding:18px;display:none}
.ov.on{display:block}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:1400px;margin:0 auto}
.ovc{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:9px 10px;cursor:pointer;min-width:0}
.ovc:hover{border-color:var(--ink-3)}
.ovc.now{border-color:#5b4bd6;box-shadow:0 0 0 2px rgba(91,75,214,.16)}
.ovc u{text-decoration:none;display:flex;gap:6px;align-items:center;font-size:10px;font-weight:800;letter-spacing:.06em;
       text-transform:uppercase;color:var(--ink-3)}
.ovc u s{text-decoration:none;margin-left:auto;font-variant-numeric:tabular-nums}
.ovc b{display:block;font-size:12px;font-weight:700;line-height:1.28;margin-top:5px;color:var(--ink);
       display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ovh{max-width:1400px;margin:0 auto 12px;font-size:13px;color:var(--ink-3)}
.ovsec{max-width:1400px;margin:18px auto 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* ============================================================ design tokens */
:root{
  --violet:#5b4bd6; --violet-2:#efedfd; --violet-ink:#3a2fa8; --violet-deep:#2a2178;
  --blue:#2f6fd0;   --blue-2:#e8f0fb;   --blue-ink:#1c4d99;   --blue-deep:#12356b;
  --teal:#0f9e75;   --teal-2:#e3f6ef;   --teal-ink:#0a6e51;   --teal-deep:#064c38;
  --amber:#b8790f;  --amber-2:#fbefda;  --amber-ink:#8a5a09;  --amber-deep:#5e3d06;
  --pink:#c23a68;   --pink-2:#fbe9ef;   --pink-ink:#96274d;   --pink-deep:#6a1a36;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
/* A slide sets --a/--a2/--aink once; every child reads those, so one attribute
   on the slide repaints the whole composition for that day. */
.slide[data-accent="violet"]{--a:var(--violet);--a2:var(--violet-2);--aink:var(--violet-ink);--adeep:var(--violet-deep)}
.slide[data-accent="blue"]  {--a:var(--blue);  --a2:var(--blue-2);  --aink:var(--blue-ink);  --adeep:var(--blue-deep)}
.slide[data-accent="teal"]  {--a:var(--teal);  --a2:var(--teal-2);  --aink:var(--teal-ink);  --adeep:var(--teal-deep)}
.slide[data-accent="amber"] {--a:var(--amber); --a2:var(--amber-2); --aink:var(--amber-ink);--adeep:var(--amber-deep)}
.slide[data-accent="pink"]  {--a:var(--pink);  --a2:var(--pink-2);  --aink:var(--pink-ink); --adeep:var(--pink-deep)}
[data-theme="dark"] .slide[data-accent="violet"]{--a2:#211f3c;--aink:#bcb4fb}
[data-theme="dark"] .slide[data-accent="blue"]  {--a2:#122237;--aink:#9cc3f5}
[data-theme="dark"] .slide[data-accent="teal"]  {--a2:#123027;--aink:#6fdcb4}
[data-theme="dark"] .slide[data-accent="amber"] {--a2:#332612;--aink:#e8bf6b}
[data-theme="dark"] .slide[data-accent="pink"]  {--a2:#33151f;--aink:#f093b2}

/* ========================================================= stage and frame */
/* container-type:size is what lets every measurement below be relative to the
   SLIDE rather than the browser window. cqw = 1% of stage width. */
.stage{container-type:size;container-name:stage}

.slide{
  position:absolute;inset:0;display:none;padding:0;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-columns:100%;
  opacity:0;transition:opacity .28s ease;
}
.slide.on{display:grid;opacity:1}

/* --- top rail: where you are ------------------------------------------- */
.srail{
  display:flex;align-items:center;gap:1.1cqw;
  padding:2.4cqh 3.4cqw 0;min-width:0;
}
.srail .daychip{
  flex:none;display:inline-flex;align-items:center;gap:.6cqw;
  font-size:max(11px,1.15cqw);font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:#fff;background:var(--a);border-radius:2cqw;padding:.55cqh 1.1cqw;
}
.srail .daychip u{text-decoration:none;opacity:.72;font-weight:700}
.srail .sect{
  font-size:max(11px,1.15cqw);font-weight:700;letter-spacing:.075em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.srail .sp{flex:1 1 auto;min-width:.8cqw}
.srail .step{
  flex:none;font-size:max(11px,1.05cqw);font-weight:700;color:var(--aink);background:var(--a2);
  border-radius:2cqw;padding:.45cqh 1cqw;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.srail .dots{flex:none;display:flex;gap:.35cqw;align-items:center}
.srail .dots i{width:.5cqw;height:.5cqw;border-radius:50%;background:var(--line-2);display:block}
.srail .dots i.now{background:var(--a);transform:scale(1.45)}
.srail .dots i.done{background:var(--a);opacity:.42}

/* --- body -------------------------------------------------------------- */
.sbody{
  min-height:0;min-width:0;overflow:hidden;
  padding:1.5cqh 3.4cqw;
  display:flex;flex-direction:column;gap:1.5cqh;
}

/* --- footer: what this is, and where -------------------------------------- */
.sfoot{
  display:flex;align-items:center;gap:1.1cqw;
  padding:0 3.4cqw 2.2cqh;min-width:0;
}
.sfoot .ftitle{
  font-size:max(11px,1.15cqw);font-weight:650;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.sfoot .fbar{flex:1 1 auto;height:.45cqh;min-width:2cqw;background:var(--line);border-radius:2cqw;overflow:hidden}
.sfoot .fbar i{display:block;height:100%;background:var(--a);border-radius:2cqw}
.sfoot .pg{
  flex:none;font-family:var(--mono);font-size:max(11px,1.15cqw);font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.sfoot .pg i{font-style:normal;color:var(--ink-3);font-weight:500}

/* inverted slides (covers) carry the frame in white */
.slide.inv{background:linear-gradient(145deg,var(--a),var(--adeep));color:#fff}
.slide.inv .srail .sect,.slide.inv .sfoot .ftitle{color:rgba(255,255,255,.72)}
.slide.inv .srail .daychip{background:rgba(255,255,255,.18)}
.slide.inv .srail .step{background:rgba(255,255,255,.16);color:#fff}
.slide.inv .sfoot .pg{color:rgba(255,255,255,.92)}
.slide.inv .sfoot .pg i{color:rgba(255,255,255,.55)}
.slide.inv .sfoot .fbar{background:rgba(255,255,255,.2)}
.slide.inv .sfoot .fbar i{background:#fff}
.slide.inv .srail .dots i{background:rgba(255,255,255,.3)}
.slide.inv .srail .dots i.now{background:#fff}

/* ============================================================== typography */
.k{font-size:1.2cqw;text-transform:uppercase;letter-spacing:.1em;color:var(--aink);font-weight:800}
.h1{font-size:4.6cqw;line-height:1.03;letter-spacing:-.03em;font-weight:830;max-width:17ch}
.h2{font-size:3.05cqw;line-height:1.08;letter-spacing:-.022em;font-weight:780;max-width:24ch}
.h3{font-size:2.2cqw;line-height:1.12;letter-spacing:-.015em;font-weight:760}
.lede{font-size:1.72cqw;line-height:1.46;color:var(--ink-2);max-width:62ch}
.lede em{color:var(--ink);font-style:normal;font-weight:700}
.slide.inv .lede{color:rgba(255,255,255,.88)}
.slide.inv .k{color:rgba(255,255,255,.8)}
.dim{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* ============================================================== primitives */
/* chips ------------------------------------------------------------------ */
.chips{display:flex;gap:.7cqw;flex-wrap:wrap;align-items:center}
.chip{
  font-size:1.2cqw;font-weight:700;border-radius:2cqw;padding:.55cqh 1.1cqw;
  background:var(--a2);color:var(--aink);white-space:nowrap;
}
.chip.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.chip.solid{background:var(--a);color:#fff}
.chip.w{background:rgba(255,255,255,.16);color:#fff}
.chip b{font-weight:800}

/* support cards ---------------------------------------------------------- */
.cards{display:grid;gap:1cqw;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));align-items:stretch}
.card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:1.15cqw;
  padding:1.5cqh 1.3cqw;display:flex;flex-direction:column;gap:.7cqh;min-width:0;
}
.card .cn{
  flex:none;width:2.5cqw;height:2.5cqw;border-radius:.65cqw;background:var(--a2);color:var(--aink);
  font-weight:850;font-size:1.35cqw;display:flex;align-items:center;justify-content:center;
}
.card .ct{font-size:1.55cqw;font-weight:750;line-height:1.16;letter-spacing:-.01em}
.card .cb{font-size:1.3cqw;line-height:1.42;color:var(--ink-2)}
.card.accent{background:var(--a2);border-color:transparent}
.card.accent .cn{background:var(--a);color:#fff}
.slide.inv .card{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.slide.inv .card .ct{color:#fff}
.slide.inv .card .cb{color:rgba(255,255,255,.82)}
.slide.inv .card .cn{background:rgba(255,255,255,.2);color:#fff}

/* numbered rows ---------------------------------------------------------- */
.rows{display:flex;flex-direction:column;gap:.85cqh;min-height:0}
.rows .r{
  display:flex;gap:1.1cqw;align-items:center;min-width:0;
  background:var(--panel-2);border:1px solid var(--line);border-radius:1cqw;
  padding:1.1cqh 1.3cqw;
}
.rows .r .n{
  flex:none;width:2.8cqw;height:2.8cqw;border-radius:.7cqw;background:var(--a2);color:var(--aink);
  font-weight:850;font-size:1.4cqw;display:flex;align-items:center;justify-content:center;
}
.rows .r .rt{font-size:1.6cqw;font-weight:730;letter-spacing:-.01em;min-width:0}
.rows .r .rs{font-size:1.28cqw;color:var(--ink-2);line-height:1.35;min-width:0}
.rows .r .rmeta{margin-left:auto;text-align:right;flex:none;display:flex;flex-direction:column;gap:.2cqh}
.rows .r .rmeta b{font-size:1.25cqw;font-weight:750;color:var(--aink);font-variant-numeric:tabular-nums}
.rows .r .rmeta span{font-size:max(11px,1.1cqw);color:var(--ink-3)}
.rows .r.hl{border-color:var(--a);background:var(--a2)}

/* key/value strip -------------------------------------------------------- */
.strip{
  display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:1cqw;overflow:hidden;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));
}
.strip .s{background:var(--panel);padding:1.1cqh 1.1cqw;display:flex;flex-direction:column;gap:.25cqh;min-width:0}
.strip .s u{text-decoration:none;font-size:max(11px,1.02cqw);font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.strip .s b{font-size:2cqw;font-weight:820;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.05}
.strip .s span{font-size:max(11px,1.08cqw);color:var(--ink-2);line-height:1.3}
.strip .s.on{background:var(--a2)}
.strip .s.on b{color:var(--aink)}

/* takeaway / rule bar ---------------------------------------------------- */
.bar{
  display:flex;align-items:center;gap:1cqw;border-radius:1cqw;padding:1.1cqh 1.3cqw;
  background:var(--a2);border-left:.45cqw solid var(--a);min-width:0;
}
.bar .bl{
  flex:none;font-size:max(11px,1.02cqw);font-weight:850;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--a);border-radius:.5cqw;padding:.3cqh .8cqw;
}
.bar .bt{font-size:1.4cqw;line-height:1.38;color:var(--ink);font-weight:600;min-width:0}
.bar .bt em{font-style:normal;font-weight:800;color:var(--aink)}
.bar.warn{background:var(--amber-2);border-left-color:var(--amber)}
.bar.warn .bl{background:var(--amber)}
.slide.inv .bar{background:rgba(255,255,255,.12);border-left-color:#fff}
.slide.inv .bar .bt{color:#fff}
.slide.inv .bar .bl{background:#fff;color:var(--adeep)}

/* footnote --------------------------------------------------------------- */
.foot{font-size:max(11px,1.15cqw);line-height:1.4;color:var(--ink-3);border-left:.26cqw solid var(--line-2);padding-left:.9cqw}
.foot b{color:var(--ink-2);font-weight:700}

/* ================================================================ diagrams */
.viz{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
/* Without this the SVGs (which carry a viewBox and no width/height) fall back
   to the 300px CSS default and render as a stamp in the middle of the slide.
   That was the single worst visual defect in the previous deck. */
.viz svg{width:100%;height:100%;max-width:100%;max-height:100%;overflow:visible;display:block}
.vizrow{display:grid;gap:1.2cqw;min-height:0;flex:1 1 auto;grid-template-columns:minmax(0,var(--split,1.9fr)) minmax(0,1fr)}
.vizcol{display:flex;flex-direction:column;gap:.8cqh;min-height:0;min-width:0}
.annots{display:flex;flex-direction:column;gap:.75cqh;min-height:0;flex:1 1 auto;justify-content:space-between}
.annot{
  display:flex;gap:.9cqw;align-items:flex-start;background:var(--panel-2);
  border:1px solid var(--line);border-radius:.9cqw;padding:.95cqh 1.05cqw;min-width:0;
}
.annot .an{
  flex:none;width:2.1cqw;height:2.1cqw;border-radius:50%;background:var(--a);color:#fff;
  font-weight:850;font-size:max(11px,1.15cqw);display:flex;align-items:center;justify-content:center;
}
.annot .at{font-size:1.3cqw;font-weight:740;line-height:1.2;letter-spacing:-.005em}
.annot .ab{font-size:max(11px,1.15cqw);color:var(--ink-2);line-height:1.36;margin-top:.15cqh}
.legend{display:flex;flex-wrap:wrap;gap:.6cqw;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:.45cqw;font-size:max(11px,1.1cqw);font-weight:650;color:var(--ink-2)}
.legend .lg i{width:.95cqw;height:.95cqw;border-radius:.25cqw;display:block;flex:none}

/* ================================================================ matrices */
.matrix{
  display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:1cqw;overflow:hidden;min-height:0;
}
.matrix .mc{background:var(--panel);padding:.95cqh 1.05cqw;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.2cqh}
.matrix .mc.head{background:var(--panel-2)}
.matrix .mc.head b{font-size:1.25cqw;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--aink)}
.matrix .mc.rowh b{font-size:1.32cqw;font-weight:760;color:var(--ink)}
.matrix .mc span{font-size:1.2cqw;line-height:1.34;color:var(--ink-2)}
.matrix .mc.on{background:var(--a2)}

/* ================================================================ big stat */
.statwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:1.6cqw;align-items:center;flex:1 1 auto;min-height:0}
.statbig{font-size:7.2cqw;font-weight:860;letter-spacing:-.04em;line-height:.98;color:var(--a);font-variant-numeric:tabular-nums}
.statsub{font-size:1.45cqw;color:var(--ink-2);line-height:1.4;margin-top:.8cqh}
.bars{display:flex;flex-direction:column;gap:.9cqh}
.bars .bx{display:flex;flex-direction:column;gap:.35cqh}
.bars .bx .bhd{display:flex;align-items:baseline;gap:.6cqw;font-size:1.22cqw}
.bars .bx .bhd b{font-weight:750;color:var(--ink)}
.bars .bx .bhd span{margin-left:auto;font-weight:800;color:var(--aink);font-variant-numeric:tabular-nums}
.bars .bx .tr{height:1.5cqh;background:var(--line);border-radius:2cqw;overflow:hidden}
.bars .bx .tr i{display:block;height:100%;border-radius:2cqw;background:var(--line-2)}

 {day:"Agenda",section:"The week",title:"Three Days, One Working Funnel",html:"<div class=\"slide\" data-i=\"3\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The week</span><span class=\"sp\"></span><span class=\"step num\">3 / 9</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">What we build together</div><div class=\"h2\">Three Days, One Working Funnel</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Decide what you sell, and who to</div><div class=\"rs\">Offer and positioning, the value equation, the buyer persona, the prospect list, the funnel, the webinar date, and every channel connected.</div></div><div class=\"rmeta\"><b>Day 1</b><span>one strategy doc</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Build every element</div><div class=\"rs\">Traffic limits, the Tantra Pro Funnel, the Tantra Pro Flow, run of show, close chain.</div></div><div class=\"rmeta\"><b>Day 2</b><span>pages \u00b7 sequences \u00b7 close</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Make an AI run it, then prove it works</div><div class=\"rs\">Claude Code on every tool, automations proven, the dashboard, a small test run, the worst step and the weekly experiment loop.</div></div><div class=\"rmeta\"><b>Day 3</b><span>live, instrumented, improving</span></div></div></div><div class=\"bar\"><span class=\"bl\">Each day</span><span class=\"bt\">Teaching, questions you answer live while the reasoning is fresh, and one generated output in your inbox the same evening.</span></div><div class=\"foot\">Day 2 is the heavy build day: fewer questions, far more building.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Three Days, One Working Funnel</span><span class=\"fbar\"><i style=\"width:33.3%\"></i></span><span class=\"pg num\">004<i> / 158</i></span></div></div>"},
 {day:"Agenda",section:"The week",title:"The Daily Rhythm",html:"<div class=\"slide\" data-i=\"4\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The week</span><span class=\"sp\"></span><span class=\"step num\">4 / 9</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">How each session runs</div><div class=\"h2\">Watch \u2192 Answer \u2192 Receive \u2192 Do</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Watch</div><div class=\"rs\">The live session, with the build happening on screen.</div></div><div class=\"rmeta\"><b>~30 min</b><span>teaching</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Answer</div><div class=\"rs\">The day's 8 to 9 questions, on your own screen, while you watch.</div></div><div class=\"rmeta\"><b>~15 min</b><span>in parallel</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Ask</div><div class=\"rs\">Open Q&A on your own funnel, not on the theory.</div></div><div class=\"rmeta\"><b>~15 min</b><span>live Q&amp;A</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Receive</div><div class=\"rs\">Your generated output: a PDF and a live link.</div></div><div class=\"rmeta\"><b>Same day</b><span>by evening</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Do</div><div class=\"rs\">One short task that unblocks tomorrow's session.</div></div><div class=\"rmeta\"><b>20 to 30 min</b><span>tonight</span></div></div></div><div class=\"bar\"><span class=\"bl\">Why questions run live</span><span class=\"bt\">An answer you give while the reasoning is fresh is far more specific than one you fill in a form three days later.</span></div><div class=\"foot\">Answers save to your own device as you type, and you can change them until the day closes.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The Daily Rhythm</span><span class=\"fbar\"><i style=\"width:44.4%\"></i></span><span class=\"pg num\">005<i> / 158</i></span></div></div>"},
 {day:"Agenda",section:"Housekeeping",title:"How to Get the Most Out of This Week",html:"<div class=\"slide\" data-i=\"5\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">Housekeeping</span><span class=\"sp\"></span><span class=\"step num\">5 / 9</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Before we start</div><div class=\"h2\">Three Things That Decide How Much You Get Out of This</div><div class=\"lede\">The difference between the people who finish the week with a live funnel and the people who finish with notes comes down to three habits, all decided in the first ten minutes.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Answer as your real business</div><div class=\"cb\">Not the business you plan to have. The generated output keys off every answer, and a hypothetical ICP produces a hypothetical funnel.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Keep the questions open in a second window</div><div class=\"cb\">The questions are designed to be answered <em>during</em> the session, while the reasoning behind each one is still in front of you.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Put the homework in your calendar now</div><div class=\"cb\">Twenty to thirty minutes each evening. Every task is chosen because the next day's session is blocked without it.</div></div></div><div class=\"bar\"><span class=\"bl\">Ask anything</span><span class=\"bt\">Questions in chat throughout. We read them out in the Q&A block rather than losing them.</span></div><div class=\"foot\">Sessions are recorded, but the live Q&A on your own funnel is the part that cannot be replayed.</div></div><div class=\"sfoot\"><span class=\"ftitle\">How to Get the Most Out of This Week</span><span class=\"fbar\"><i style=\"width:55.6%\"></i></span><span class=\"pg num\">006<i> / 158</i></span></div></div>"},
 {day:"Agenda",section:"The spine",title:"The Three Businesses We Follow All Week",html:"<div class=\"slide\" data-i=\"6\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The spine</span><span class=\"sp\"></span><span class=\"step num\">6 / 9</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Follow one of these</div><div class=\"h2\">Three Businesses, Followed From Day 1 to Day 3</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">SE</span><div style=\"min-width:0\"><div class=\"rt\">SendFlow</div><div class=\"rs\">B2B SaaS \u00b7 sales-engagement platform: self-serve + outbound, selling at $490/seat/mo.</div></div><div class=\"rmeta\"><b>B2B SaaS</b><span>32 people</span></div></div><div class=\"r\"><span class=\"n\">AP</span><div style=\"min-width:0\"><div class=\"rt\">Apex Growth</div><div class=\"rs\">B2B consultancy \u00b7 professional services: referral + outbound, selling at \u00a312,000 / 90 days.</div></div><div class=\"rmeta\"><b>B2B consulting brand</b><span>11 people</span></div></div><div class=\"r\"><span class=\"n\">SA</span><div style=\"min-width:0\"><div class=\"rt\">Sarah Chen</div><div class=\"rs\">Independent consultant \u00b7 one person: content + referral, selling at $4,000 / 6 weeks.</div></div><div class=\"rmeta\"><b>Solopreneur</b><span>Just her</span></div></div></div><div class=\"bar\"><span class=\"bl\">Pick the closest one now</span><span class=\"bt\">Every question this week is answered three times, once by each. Follow the lane nearest your own shape and the answers become a template.</span></div><div class=\"foot\">These are composites built to cover the three shapes of business in the room, not named clients.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The Three Businesses We Follow All Week</span><span class=\"fbar\"><i style=\"width:66.7%\"></i></span><span class=\"pg num\">007<i> / 158</i></span></div></div>"},
 {day:"Agenda",section:"The system",title:"One System for Every B2B Business",html:"<div class=\"slide\" data-i=\"7\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The system</span><span class=\"sp\"></span><span class=\"step num\">7 / 9</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The system</div><div class=\"h2\" style=\"font-size:2.35cqw\">One System for Every B2B Business</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg class=\"sysv sysv-d\" viewBox=\"0 0 1000 650\" role=\"img\" aria-label=\"One funnel system for every B2B business. Two sources of people, a cold audience reached by outreach and traffic pulled from every platform, flow into value-first engagement and then a year of continuing value. From every stage, anyone ready steps up into the customer lane at the top. Underneath, every stage is counted and automations and an AI agent run each step.\"><defs><marker id=\"SYSTEM_svT\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><rect x=\"30\" y=\"20\" width=\"940\" height=\"74\" rx=\"16\" fill=\"var(--teal-bg)\"/><text x=\"500\" y=\"52\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"800\" font-size=\"17\">Customers step up at whichever stage they are ready</text><text x=\"500\" y=\"76\" text-anchor=\"middle\" class=\"svmute\" font-size=\"14\">buy, book a call or subscribe: the door is open at every stage, not only at the end</text><path id=\"SYSTEM_sv-p1\" d=\"M260 225 C340 225 340 320 410 320 L970 320\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"6 6\" opacity=\".5\"/><path id= "13\">Ads, search, social posts,</text><text x=\"58\" y=\"462\" class=\"svmute\" font-size=\"13\">content, partners and</text><text x=\"58\" y=\"480\" class=\"svmute\" font-size=\"13\">referrals, all pointing</text><text x=\"58\" y=\"498\" class=\"svmute\" font-size=\"13\">at one place</text><rect x=\"410\" y=\"245\" width=\"250\" height=\"170\" rx=\"14\" class=\"node\"/><rect x=\"410\" y=\"245\" width=\"250\" height=\"5\" rx=\"2.5\" fill=\"var(--amber)\"/><circle cx=\"440\" cy=\"271\" r=\"12\" fill=\"var(--amber)\"/><text x=\"440\" y=\"276\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"13\">3</text><text x=\"428\" y=\"295\" class=\"svlabel\" font-size=\"15\">Engage With Value</text><text x=\"428\" y=\"314\" class=\"svlabel\" font-size=\"15\">First</text><text x=\"428\" y=\"339\" class=\"svmute\" font-size=\"13\">A live session, a video or</text><text x=\"428\" y=\"357\" class=\"svmute\" font-size=\"13\">a workshop day: they get</text><text x=\"428\" y=\"375\" class=\"svmute\" font-size=\"13\">real value before</text><text x=\"428\" y=\"393\" class=\"svmute\" font-size=\"13\">anyone asks for money</text><rect x=\"730\" y=\"245\" width=\"240\" height=\"170\" rx=\"14\" class=\"node\"/><rect x=\"730\" y=\"245\" width=\"240\" height=\"5\" rx=\"2.5\" fill=\"var(--teal)\"/><circle cx=\"760\" cy=\"271\" r=\"12\" fill=\"var(--teal)\"/><text x=\"760\" y=\"276\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"13\">4</text><text x=\"748\" y=\"295\" class=\"svlabel\" font-size=\"15\">Value for the Whole</text><text x=\"748\" y=\"314\" class=\"svlabel\" font-size=\"15\">Journey</text><text x=\"748\" y=\"339\" class=\"svmute\" font-size=\"13\">Reminders, follow-ups,</text><text x=\"748\" y=\"357\" class=\"svmute\" font-size=\"13\">a weekly newsletter and</text><text x=\"748\" y=\"375\" class=\"svmute\" font-size=\"13\">community, for a year</text><text x=\"748\" y=\"393\" class=\"svmute\" font-size=\"13\">after the first touch</text><text x=\"150\" y=\"332\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">counted: replies, visits</text><text x=\"150\" y=\"542\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">counted: clicks by source</text><text x=\"535\" y=\"437\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">counted: attendance, watch depth</text><text x=\"850\" y=\"437\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">counted: opens, replies, renewals</text><path id=\"SYSTEM_sv-d1\" d=\"M150 140 L150 94\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.4\" marker-end=\"url(#SYSTEM_svT)\"/><path id=\"SYSTEM_sv-d2\" d=\"M260 400 C318 400 335 300 335 94\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.4\" marker-end=\"url(#SYSTEM_svT)\"/><path id=\"SYSTEM_sv-d3\" d=\"M535 245 L535 94\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.4\" marker-end=\"url(#SYSTEM_svT)\"/><path id=\"SYSTEM_sv-d4\" d=\"M850 245 L850 94\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.4\" marker-end=\"url(#SYSTEM_svT)\"/><circle r=\"5\" fill=\"var(--teal)\" class=\"sysv-dot\"><animateMotion dur=\"3.4s\" repeatCount=\"indefinite\" begin=\"0.40s\"><mpath href=\"#sv-d1\"/></animateMotion></circle><circle r=\"5\" fill=\"var(--teal)\" class=\"sysv-dot\"><animateMotion dur=\"3.4s\" repeatCount=\"indefinite\" begin=\"1.70s\"><mpath href=\"#sv-d2\"/></animateMotion></circle><circle r=\"5\" fill=\"var(--teal)\" class=\"sysv-dot\"><animateMotion dur=\"3.4s\" repeatCount=\"indefinite\" begin=\"1.10s\"><mpath href=\"#sv-d3\"/></animateMotion></circle><circle r=\"5\" fill=\"var(--teal)\" class=\"sysv-dot\"><animateMotion dur=\"3.4s\" repeatCount=\"indefinite\" begin=\"2.30s\"><mpath href=\"#sv-d4\"/></animateMotion></circle><rect x=\"30\" y=\"592\" width=\"940\" height=\"44\" rx=\"12\" fill=\"var(--accent)\"/><text x=\"500\" y=\"620\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"15\">Every stage is counted and every rate calculated \u00b7 automations and an AI agent run every step</text></svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Every box is a counted event</div><div class=\"ab\">Not an estimate. Each step fires one logged event, and the count of that event is the metric.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">A rate is a division, never a symbol</div><div class=\"ab\">One fetched count divided by another. If you cannot fetch both, you do not have the rate.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">The last band is where the money compounds</div><div class=\"ab\">Acquisition is linear. Retention multiplies every buyer you have ever acquired.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Left to right is the journey. Top to bottom is what you can measure about it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">One System for Every B2B Business</span><span class=\"fbar\"><i style=\"width:77.8%\"></i></span><span class=\"pg num\">008<i> / 158</i></span></div></div>"},
 {day:"Agenda",section:"The system",title:"Where Your Offers Live",html:"<div class=\"slide\" data-i=\"8\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The system</span><span class=\"sp\"></span><span class=\"step num\">8 / 9</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Where your offers live</div><div class=\"h2\" style=\"font-size:2.35cqw\">The Value Ladder</div><div class=\"viz\"><svg viewBox=\"0 0 860 486\" role=\"img\" aria-label=\"Value ladder staircase: five ascending rungs plotted with commitment on the horizontal axis and value delivered and trust earned on the vertical axis. Rungs are attention, lead, entry offer, core program and flagship. A narrowing wedge behind the stairs shows the audience shrinking at each rung, and a dashed ascension path climbs the steps.\">\n          <defs>\n            <marker id=\"LADDER_va\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- axes -->\n          <line x1=\"90\" y1=\"438\" x2=\"838\" y2=\"438\" class=\"axis\"/>\n          <line x1=\"90\" y1=\"42\" x2=\"90\" y2=\"438\" class=\"axis\"/>\n          <text x=\"464\" y=\"470\" text-anchor=\"middle\" class=\"svsub\" font-size=\"11.5\">COMMITMENT  \u2192  attention \u00b7 contact details \u00b7 money \u00b7 more money</text>\n          <text transform=\"translate(28,240) rotate(-90)\" text-anchor=\"middle\" class=\"svsub\" font-size=\"11.5\">VALUE DELIVERED \u00b7 TRUST EARNED  \u2192</text>\n          <!-- steps -->\n          <g>\n            <rect x=\"90\" y=\"370\" width=\"146\" height=\"68\" fill=\"#a5b4fc\"/>\n            <rect x=\"236\" y=\"302\" width=\"146\" height=\"136\" fill=\"#818cf8\"/>\n            <rect x=\"382\" y=\"234\" width=\"146\" height=\"204\" fill=\"#6366f1\"/>\n            <rect x=\"528\" y=\"166\" width=\"146\" height=\"272\" fill=\"#7c3aed\"/>\n            <rect x=\"674\" y=\"98\" width=\"146\" height=\"340\" fill=\"#0f9e75\"/>\n          </g>\n          <!-- step labels -->\n          <g text-anchor=\"middle\">\n            <text x=\"163\" y=\"392\" class=\"svwhite\" font-size=\"12\">Attention</text><text x=\"163\" y=\"409\" class=\"svwhite2\" font-size=\"10\">free content</text><text x=\"163\" y=\"425\" class=\"svwhite2\" font-size=\"10\">costs them nothing</text>\n            <text x=\"309\" y=\"324\" class=\"svwhite\" font-size=\"12\">Lead</text><text x=\"309\" y=\"341\" class=\"svwhite2\" font-size=\"10\">opt-in / registration</text><text x=\"309\" y=\"357\" class=\"svwhite2\" font-size=\"10\">costs them an email</text>\n            <text x=\"455\" y=\"256\" class=\"svwhite\" font-size=\"12\">Entry offer</text><text x=\"455\" y=\"273\" class=\"svwhite2\" font-size=\"10\">small, self-liquidating</text><text x=\"455\" y=\"289\" class=\"svwhite2\" font-size=\"10\">pays for your traffic</text>\n            <text x=\"601\" y=\"188\" class=\"svwhite\" font-size=\"12\">Core program</text><text x=\"601\" y=\"205\" class=\"svwhite2\" font-size=\"10\">the transformation</text><text x=\"601\" y=\"221\" class=\"svwhite2\" font-size=\"10\">course \u00b7 community \u00b7 calls</text>\n            <text x=\"747\" y=\"120\" class=\"svwhite\" font-size=\"12\">Flagship</text><text x=\"747\" y=\"137\" class=\"svwhite2\" font-size=\"10\">done-with-you, long horizon</text><text x=\"747\" y=\"153\" class=\"svwhite2\" font-size=\"10\">your highest-trust buyers</text>\n          </g>\n          <!-- ascension path -->\n          <path d=\"M120 356 H206 V288 H352 V220 H498 V152 H644 V84 H790\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.4\" stroke-dasharray=\"6 6\" class=\"flowline\" marker-end=\"url(#LADDER_va)\" opacity=\".95\"/>\n          <!-- how many people stand on each rung: bar width IS the audience -->\n          <text x=\"90\" y=\"20\" class=\"svsub\" font-size=\"10.5\">HOW MANY PEOPLE STAND ON EACH RUNG</text>\n          <g text-anchor=\"middle\" font-size=\"10\">\n            <rect x=\"98\" y=\"30\" width=\"130\" height=\"9\" rx=\"4.5\" fill=\"var(--accent)\" opacity=\".85\"/>\n            <text x=\"163\" y=\"52\" class=\"svmute\">everyone who arrives</text>\n            <rect x=\"273\" y=\"30\" width=\"72\" height=\"9\" rx=\"4.5\" fill=\"var(--accent)\" opacity=\".7\"/>\n            <text x=\"309\" y=\"52\" class=\"svmute\">a fraction opt in</text>\n            <rect x=\"435\" y=\"30\" width=\"40\" height=\"9\" rx=\"4.5\" fill=\"var(--accent)\" opacity=\".55\"/>\n            <text x=\"455\" y=\"52\" class=\"svmute\">a fraction of those buy</text>\n            <rect x=\"590\" y=\"30\" width=\"22\" height=\"9\" rx=\"4.5\" fill=\"var(--accent)\" opacity=\".42\"/>\n            <text x=\"601\" y=\"52\" class=\"svmute\">some buyers climb</text>\n            <rect x=\"741\" y=\"30\" width=\"12\" height=\"9\" rx=\"4.5\" fill=\"var(--teal)\" opacity=\".8\"/>\n            <text x=\"747\" y=\"52\" class=\"svmute\">a handful reach the top</text>\n          </g>\n          <line x1=\"90\" y1=\"60\" x2=\"820\" y2=\"60\" stroke=\"var(--line-2)\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">One rung per funnel</div><div class=\"cb\">This week's funnel sells one rung. The rung above is Day 3's ascension work.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Price sets the mechanism</div><div class=\"cb\">A page can close four figures. Five figures needs a conversation in the chain.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">The rung above is the cheapest revenue you own</div><div class=\"cb\">Someone who just bought is the warmest buyer you will ever have.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Find your rung, then look directly above it. That gap is Day 3's scale plan.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Where Your Offers Live</span><span class=\"fbar\"><i style=\"width:88.9%\"></i></span><span class=\"pg num\">009<i> / 158</i></span></div></div>"},
 {day:"Agenda",section:"The rule",title:"One Rule for the Whole Week",html:"<div class=\"slide\" data-i=\"9\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The rule</span><span class=\"sp\"></span><span class=\"step num\">9 / 9</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">One rule for the whole week</div><div class=\"h2\">Never Model Your Funnel With Invented Rates</div><div class=\"lede\">Every step you build this week gets instrumented. The count of an event is the metric; a conversion rate is one count divided by another. If you cannot fetch it, you cannot fix it; you are optimising by vibes.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Count, don't estimate</div><div class=\"cb\">Every step fires one logged event. The number of times it fired is the only number that counts.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">A rate is a division</div><div class=\"cb\">Fetched count \u00f7 fetched count. A rate you typed into a spreadsheet is a wish with a percent sign.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Name the source</div><div class=\"cb\">For every number on your dashboard, you should be able to say which system it came from.</div></div></div><div class=\"bar\"><span class=\"bl\">Why this is rule one</span><span class=\"bt\">Every decision from Day 3 onward (which channel to fund, which step to fix) is only as good as the numbers underneath it.</span></div><div class=\"foot\">Illustrative figures do appear in this deck, to show the <em>shape</em> of an argument. Every one of them is labelled as a teaching model where it appears.</div></div><div class=\"sfoot\"><span class=\"ftitle\">One Rule for the Whole Week</span><span class=\"fbar\"><i style=\"width:100.0%\"></i></span><span class=\"pg num\">010<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Session 1 of 3",title:"Day 1: Decide what you sell, and who to",html:"<div class=\"slide inv\" data-i=\"10\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Session 1 of 3</span><span class=\"sp\"></span><span class=\"step num\">1 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"coverwrap\"><div style=\"display:flex;align-items:flex-end;gap:2cqw\"><div class=\"daynum\">1</div><div style=\"flex:1;min-width:0;padding-bottom:1.2cqh\"><div class=\"k\">Day 1 \u00b7 60 min</div><div class=\"h1\" style=\"font-size:3.9cqw\">Decide what you sell, and who to</div><div class=\"lede\" style=\"margin-top:.8cqh\">Eight tasks. Each adds a section to one strategy doc, and Day 2 builds every page, email and invite from it.</div></div></div><div class=\"cards\" style=\"--n:4\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">The offer</div><div class=\"cb\">Sentence, method, value equation</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">The buyer</div><div class=\"cb\">Persona, then a verified list</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">The funnel</div><div class=\"cb\">Shape, topic, date and time</div></div><div class=\"card\"><div class=\"cn\">4</div><div class=\"ct\">The channels</div><div class=\"cb\">Domains warming, Cloudflare token live</div></div></div><div class=\"bar\"><span class=\"bl\">You leave with</span><span class=\"bt\">One strategy doc, a verified prospect list, and every channel connected with warm-up running.</span></div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Day 1: Decide what you sell, and who to</span><span class=\"fbar\"><i style=\"width:2.2%\"></i></span><span class=\"pg num\">011<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 index",title:"Today's Session",html:"<div class=\"slide\" data-i=\"11\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 index</span><span class=\"sp\"></span><span class=\"step num\">2 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Session index</div><div class=\"h2\">Eight Steps, One Strategy Doc</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Offer and positioning</div><div class=\"rs\">Steps 1 and 2: the sentence, the method and the voice.</div></div><div class=\"rmeta\"><b>7 min</b><span>the offer</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">The value equation</div><div class=\"rs\">Step 3: score four levers, fix the two lowest.</div></div><div class=\"rmeta\"><b>4 min</b><span>pressure test</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Buyer persona and prospect list</div><div class=\"rs\">Steps 4 and 5: from 20 customers to a verified list.</div></div><div class=\"rmeta\"><b>9 min</b><span>the buyer</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Funnel, event line and channels</div><div class=\"rs\">Steps 6 to 8: the shape, the date, then every channel and the Cloudflare token.</div></div><div class=\"rmeta\"><b>10 min</b><span>setup</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Your 8 questions</div><div class=\"rs\">Answered as each step ends, on your own screen.</div></div><div class=\"rmeta\"><b>15 min</b><span>your turn</span></div></div><div class=\"r\"><span class=\"n\">6</span><div style=\"min-width:0\"><div class=\"rt\">Q&A on your own funnel</div><div class=\"rs\">Not on the theory: on yours.</div></div><div class=\"rmeta\"><b>15 min</b><span>live Q&amp;A</span></div></div></div><div class=\"bar\"><span class=\"bl\">Tonight</span><span class=\"bt\">One task, 20 minutes: if Step 4 was short on real conversations, send five customers one question.</span></div><div class=\"foot\">Times are a guide. Questions run long when the room is working, and that is the point.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Today's Session</span><span class=\"fbar\"><i style=\"width:4.3%\"></i></span><span class=\"pg num\">012<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 payoff",title:"What You Walk Out With Today",html:"<div class=\"slide\" data-i=\"12\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 payoff</span><span class=\"sp\"></span><span class=\"step num\">3 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">By the end of this session</div><div class=\"h2\">What You Walk Out With Today</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">An offer a stranger can repeat</div><div class=\"rs\">One sentence, a named method, and the two weakest value levers fixed.</div></div><div class=\"rmeta\"><b>Steps 1 to 3</b><span>the offer</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">A buyer persona traced to customers</div><div class=\"rs\">Account fields for the data vendor, the signer, and the objection in their words.</div></div><div class=\"rmeta\"><b>Step 4</b><span>the buyer</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">A verified prospect list</div><div class=\"rs\">Named people in a sheet, every email checked.</div></div><div class=\"rmeta\"><b>Step 5</b><span>the list</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Your funnel and your event line</div><div class=\"rs\">The shape and why, then title, date, time, length and platform.</div></div><div class=\"rmeta\"><b>Steps 6 and 7</b><span>the funnel</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Every channel connected</div><div class=\"rs\">Domains warming, LinkedIn, WhatsApp and calendar live, Cloudflare token tested.</div></div><div class=\"rmeta\"><b>Step 8</b><span>the channels</span></div></div></div><div class=\"bar\"><span class=\"bl\">The hard wait</span><span class=\"bt\">New sending domains need 2 to 3 weeks of warm-up. Step 8 starts that clock today.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">What You Walk Out With Today</span><span class=\"fbar\"><i style=\"width:6.5%\"></i></span><span class=\"pg num\">013<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 1",title:"Write the Offer",html:"<div class=\"slide\" data-i=\"13\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 1</span><span class=\"sp\"></span><span class=\"step num\">4 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 1 \u00b7 the offer</div><div class=\"h2\">Write the Offer in One Sentence</div><div class=\"lede\">I help [who] go from [before] to [after] using [mechanism], in [time], or [guarantee]. Every page, email and invite on Day 2 repeats this sentence.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Outcome in the sentence</div><div class=\"cb\">Put the tool in the mechanism slot. \u201cOutreach software\u201d is a tool. \u201cTen booked calls a month\u201d is an outcome.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Read it aloud</div><div class=\"cb\">To someone outside your business. If they ask a follow-up question, rewrite it.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Place it on your ladder</div><div class=\"cb\">Entry, core or flagship. Name and price the rung above it, even if it is not built yet.</div></div></div><div class=\"bar\"><span class=\"bl\">For a SaaS company</span><span class=\"bt\">\u201cWe help B2B software companies of 11 to 50 staff go from ad hoc demos to a steady weekly demo calendar using a three-channel invite system, in 60 days, or we keep working at no charge until you get there.\u201d</span></div><div class=\"foot\">Proof: a stranger repeats it back correctly, and two rungs are named and priced.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Write the Offer</span><span class=\"fbar\"><i style=\"width:8.7%\"></i></span><span class=\"pg num\">014<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Your offer in one sentence: I help [who] go from [before] to [after] using [method], in [time], or [guarantee].",html:"<div class=\"slide\" data-i=\"14\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">5 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 1 of 8</span><span class=\"qk\">Short answer \u00b7 18+ words</span><span class=\"qtime\">\u23f1 3 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your offer in one sentence: I help [who] go from [before] to [after] using [method], in [time], or [guarantee].</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Outcome first</u><span>The result the buyer gets, with the tool kept in the method slot.</span></div><div class=\"qc\"><u>Every slot filled</u><span>Who, before, after, method, time and guarantee.</span></div><div class=\"qc\"><u>Fixed after Step 3</u><span>The two weakest value levers are changed in the sentence itself.</span></div></div><div class=\"foot\"><b>Why this one:</b> Every page, email and invite on Day 2 repeats this sentence. If a stranger cannot repeat it back, no channel fixes it.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your offer in one sentence: I help [who] go from [before] to [after] using [method], in [time], or [guarantee].</span><span class=\"fbar\"><i style=\"width:10.9%\"></i></span><span class=\"pg num\">015<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q1 \u00b7 B2B SaaS",title:"SendFlow Answers Q1",html:"<div class=\"slide\" data-i=\"15\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q1 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">6 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 1</u><p>Your offer in one sentence: I help [who] go from [before] to [after] using [method], in [time], or [guarantee].</p></div><div class=\"answer\"><u>How they answer it</u><p>We help VPs of Sales go from reps sending 15 manual touches a day to 200 personalised ones using Profile-to-Message, live in a week, or your first month is free.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The before and after are both counts: 15 manual touches against 200 personalised ones.</span></div><div class=\"w\"><i>2</i><span>The method is <b>named</b>, so it can go on every page as the reason this works.</span></div><div class=\"w\"><i>3</i><span>\u201cLive in a week\u201d turns the time slot into a promise the buyer can check.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The guarantee is tied to speed, the lever SaaS buyers doubt most.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow Answers Q1</span><span class=\"fbar\"><i style=\"width:13.0%\"></i></span><span class=\"pg num\">016<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q1 \u00b7 B2B consulting brand",title:"Apex Growth Answers Q1",html:"<div class=\"slide\" data-i=\"16\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q1 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">7 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 1</u><p>Your offer in one sentence: I help [who] go from [before] to [after] using [method], in [time], or [guarantee].</p></div><div class=\"answer\"><u>How they answer it</u><p>I help professional-services partners go from referral-dependent to a predictable pipeline using the Partner Pipeline System, inside 90 days, or we keep working at no charge until it runs.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The before state is a word partners use about themselves: referral-dependent.</span></div><div class=\"w\"><i>2</i><span>The 90-day window matches the engagement, so the sentence and the invoice agree.</span></div><div class=\"w\"><i>3</i><span>The method name reappears on Day 2 in the headline and the pitch.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">At \u00a312,000 the guarantee carries the risk, so it promises more work, not a refund.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth Answers Q1</span><span class=\"fbar\"><i style=\"width:15.2%\"></i></span><span class=\"pg num\">017<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q1 \u00b7 Solopreneur",title:"Sarah Chen Answers Q1",html:"<div class=\"slide\" data-i=\"17\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q1 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">8 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 1</u><p>Your offer in one sentence: I help [who] go from [before] to [after] using [method], in [time], or [guarantee].</p></div><div class=\"answer\"><u>How they answer it</u><p>I help founders go from selling only when they aren't delivering to a funnel that runs either way, in six weeks, with every asset built alongside you.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The before state is a behaviour the founder recognises: selling only between projects.</span></div><div class=\"w\"><i>2</i><span>No refund promised. <b>Built alongside you</b> is the risk reversal.</span></div><div class=\"w\"><i>3</i><span>Six weeks is short enough to feel safe at $4,000.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A solo offer can sell the working relationship itself: every asset built alongside the buyer.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen Answers Q1</span><span class=\"fbar\"><i style=\"width:17.4%\"></i></span><span class=\"pg num\">018<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 2",title:"Position It With a Named Method and Voice",html:"<div class=\"slide\" data-i=\"18\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 2</span><span class=\"sp\"></span><span class=\"step num\">9 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 2 \u00b7 positioning</div><div class=\"h2\">Position It With a Named Method and Voice</div><div class=\"lede\">An unnamed method sounds like every competitor. A named one gives buyers a reason to choose you, and gives Day 2 one name and one voice for every asset.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Name the method</div><div class=\"cb\">Two to four words. Three to five steps, one line on why each is needed.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Say why the alternative fails</div><div class=\"cb\">One line on the obvious alternative: an agency, a tool on its own, or doing nothing.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Write the voice and the proof</div><div class=\"cb\">Three words you sound like, three you never do. Each result with a number, a name and a date, or \u201cnone yet\u201d. Never invent one.</div></div></div><div class=\"bar\"><span class=\"bl\">For a SaaS company</span><span class=\"bt\">\u201cThe Demo Engine: list, invite, remind, follow up. Ads alone fail because nobody named is invited; here every invite goes to a named buyer.\u201d</span></div><div class=\"foot\">Proof: the method has named steps and a reason for each.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Position It With a Named Method and Voice</span><span class=\"fbar\"><i style=\"width:19.6%\"></i></span><span class=\"pg num\">019<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Your method: its name, its 3 to 5 steps in order, and why the obvious alternative fails.",html:"<div class=\"slide\" data-i=\"19\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">10 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 2 of 8</span><span class=\"qk\">Short answer \u00b7 15+ words</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your method: its name, its 3 to 5 steps in order, and why the obvious alternative fails.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Named</u><span>Two to four words that describe the change, not the tool.</span></div><div class=\"qc\"><u>Three to five steps</u><span>In order, each one needed.</span></div><div class=\"qc\"><u>The alternative</u><span>One line on why the obvious alternative fails.</span></div></div><div class=\"foot\"><b>Why this one:</b> An unnamed method sounds like every competitor. A named one gives buyers a reason to choose you and gives Day 2 one name to put on every asset.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your method: its name, its 3 to 5 steps in order, and why the obvious alternative fails.</span><span class=\"fbar\"><i style=\"width:21.7%\"></i></span><span class=\"pg num\">020<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q2 \u00b7 B2B SaaS",title:"SendFlow Answers Q2",html:"<div class=\"slide\" data-i=\"20\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q2 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">11 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 2</u><p>Your method: its name, its 3 to 5 steps in order, and why the obvious alternative fails.</p></div><div class=\"answer\"><u>How they answer it</u><p>Profile-to-Message. 1 Enrich the person, not the company. 2 Write from their own signals. 3 Send inside safe daily caps. 4 Route replies to a human. A tool on its own fails because reps stop opening it.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Step one (enrich the person, not the company) is the claim that makes it memorable.</span></div><div class=\"w\"><i>2</i><span>Four steps, short enough for a VP Sales to repeat to their team.</span></div><div class=\"w\"><i>3</i><span>\u201cA tool on its own fails because reps stop opening it\u201d names the buyer's own history.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The last step says where automation stops. That answers the fear of robotic outreach.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow Answers Q2</span><span class=\"fbar\"><i style=\"width:23.9%\"></i></span><span class=\"pg num\">021<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q2 \u00b7 B2B consulting brand",title:"Apex Growth Answers Q2",html:"<div class=\"slide\" data-i=\"21\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q2 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">12 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 2</u><p>Your method: its name, its 3 to 5 steps in order, and why the obvious alternative fails.</p></div><div class=\"answer\"><u>How they answer it</u><p>The Partner Pipeline System. 1 Map the referral pattern you already have. 2 Turn it into an offer. 3 Build one repeatable channel. 4 Hand the rhythm to the team. Agencies fail because they sell activity, not a channel the firm owns.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Step one starts from the referrals the firm already has, so nothing feels thrown away.</span></div><div class=\"w\"><i>2</i><span>The alternative is <b>an agency</b>, the exact thing this buyer has tried and regretted.</span></div><div class=\"w\"><i>3</i><span>Each step is a stage of the 90 days, so the method doubles as the delivery plan.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The final step hands the rhythm to the firm. That answers \u201cwhat happens when you leave?\u201d</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth Answers Q2</span><span class=\"fbar\"><i style=\"width:26.1%\"></i></span><span class=\"pg num\">022<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q2 \u00b7 Solopreneur",title:"Sarah Chen Answers Q2",html:"<div class=\"slide\" data-i=\"22\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q2 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">13 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 2</u><p>Your method: its name, its 3 to 5 steps in order, and why the obvious alternative fails.</p></div><div class=\"answer\"><u>How they answer it</u><p>Build-With, Not Build-For. 1 Decide together. 2 I build, you watch. 3 You build, I watch. 4 You own it. Done-for-you fails because the funnel rots the day the freelancer leaves.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Steps two and three swap roles, which shows the hand-over instead of claiming it.</span></div><div class=\"w\"><i>2</i><span>The alternative, done-for-you, is what her buyers usually buy and later regret.</span></div><div class=\"w\"><i>3</i><span>It needs no software, which suits a one-person business.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The method name is the promise: build with, not build for.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen Answers Q2</span><span class=\"fbar\"><i style=\"width:28.3%\"></i></span><span class=\"pg num\">023<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 3",title:"Score the Offer on the Value Equation",html:"<div class=\"slide\" data-i=\"23\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 3</span><span class=\"sp\"></span><span class=\"step num\">14 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 3 \u00b7 the value equation</div><div class=\"h2\" style=\"font-size:2.35cqw\">Score the Offer on the Value Equation</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 2 860 529\" role=\"img\" aria-label=\"Offer architecture. Top: the value equation shown as a fraction, dream outcome times perceived likelihood, over time delay times effort and sacrifice, with four levers on the right showing which direction to push each. Bottom: five stacked components, transformation, mechanism, proof, guarantee, bonuses, assembling into a single offer statement with a three-tier price strip.\">\n          <defs>\n            <marker id=\"OFFER_oa\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"20\" y=\"24\" class=\"svsub\" font-size=\"11\">FIRST \u00b7 IS THE VALUE THERE AT ALL?</text>\n          <text x=\"26\" y=\"128\" class=\"svlabel\" font-size=\"17\">VALUE</text>\n          <text x=\"98\" y=\"128\" class=\"svmute\" font-size=\"19\">=</text>\n          <!-- numerator: things that create value -->\n          <rect x=\"128\" y=\"50\" width=\"400\" height=\"58\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"216\" y=\"72\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12\">Dream outcome</text>\n          <text x=\"216\" y=\"90\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\"what exactly do I get?\"</text>\n          <text x=\"328\" y=\"80\" text-anchor=\"middle\" class=\"svmute\" font-size=\"13\">\u00d7</text>\n          <text x=\"440\" y=\"72\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12\">Perceived likelihood</text>\n          <text x=\"440\" y=\"90\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\"will it work for me?\"</text>\n          <line x1=\"128\" y1=\"124\" x2=\"528\" y2=\"124\" stroke=\"var(--ink-2)\" stroke-width=\"2.5\"/>\n          <!-- denominator: things that destroy value -->\n          <rect x=\"128\" y=\"140\" width=\"400\" height=\"58\" rx=\"12\" fill=\"var(--pink-bg)\"/>\n          <text x=\"216\" y=\"162\" text-anchor=\"middle\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"12\">Time delay</text>\n          <text x=\"216\" y=\"180\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\"how long until it works?\"</text>\n          <text x=\"328\" y=\"170\" text-anchor=\"middle\" class=\"svmute\" font-size=\"13\">\u00d7</text>\n          <text x=\"440\" y=\"162\" text-anchor=\"middle\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"12\">Effort &amp; sacrifice</text>\n          <text x=\"440\" y=\"180\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\"what do I have to do?\"</text>\n          <!-- levers -->\n          <g font-size=\"10.5\">\n            <rect x=\"556\" y=\"48\" width=\"288\" height=\"38\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/>\n            <text x=\"570\" y=\"64\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11\">\u2191 Dream outcome</text><text x=\"570\" y=\"78\" class=\"svmute\">make it specific, and make it theirs</text>\n            <rect x=\"556\" y=\"92\" width=\"288\" height=\"38\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/>\n            <text x=\"570\" y=\"108\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11\">\u2191 Perceived likelihood</text><text x=\"570\" y=\"122\" class=\"svmute\">proof, detail, and a real guarantee</text>\n            <rect x=\"556\" y=\"136\" width=\"288\" height=\"38\" rx=\"9\" class=\"node\" stroke=\"var(--pink)\"/>\n            <text x=\"570\" y=\"152\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"11\">\u2193 Time delay</text><text x=\"570\" y=\"166\" class=\"svmute\">engineer a win in the first week</text>\n            <rect x=\"556\" y=\"180\" width=\"288\" height=\"38\" rx=\"9\" class=\"node\" stroke=\"var(--pink)\"/>\n            <text x=\"570\" y=\"196\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"11\">\u2193 Effort &amp; sacrifice</text><text x=\"570\" y=\"210\" class=\"svmute\">do more of the work for them</text>\n          </g>\n          <text x=\"20\" y=\"224\" class=\"svmute\" font-size=\"10.5\">Beginners push the top: bigger promises, more testimonials. The hard, defensible work is at the bottom: removing time and effort.</text>\n          <line x1=\"20\" y1=\"240\" x2=\"840\" y2=\"240\" class=\"gridline\"/>\n          <!-- offer stack -->\n          <text x=\"20\" y=\"266\" class=\"svsub\" font-size=\"11\">THEN \u00b7 STACK THE PIECES INTO ONE STATEMENT</text>\n          <g font-size=\"11.5\">\n            <rect x=\"24\" y=\"282\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"299\" fill=\"var(--accent-ink)\" font-weight=\"700\">1 \u00b7 Transformation</text><text x=\"40\" y=\"314\" class=\"svmute\" font-size=\"10\">the after-state they are actually buying</text>\n            <rect x=\"24\" y=\"330\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"347\" fill=\"var(--accent-ink)\" font-weight=\"700\">2 \u00b7 Mechanism</text><text x=\"40\" y=\"362\" class=\"svmute\" font-size=\"10\">why your way works when theirs didn't</text>\n            <rect x=\"24\" y=\"378\" width=\"290\" height=\"4
