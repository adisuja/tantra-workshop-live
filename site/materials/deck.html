2\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"395\" fill=\"var(--accent-ink)\" font-weight=\"700\">3 \u00b7 Proof</text><text x=\"40\" y=\"410\" class=\"svmute\" font-size=\"10\">evidence it has worked before, for someone like them</text>\n            <rect x=\"24\" y=\"426\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"443\" fill=\"var(--accent-ink)\" font-weight=\"700\">4 \u00b7 Guarantee</text><text x=\"40\" y=\"458\" class=\"svmute\" font-size=\"10\">who carries the risk: you, or them</text>\n            <rect x=\"24\" y=\"474\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"491\" fill=\"var(--accent-ink)\" font-weight=\"700\">5 \u00b7 Bonuses</text><text x=\"40\" y=\"506\" class=\"svmute\" font-size=\"10\">removes the last objection, nothing else</text>\n          </g>\n          <path d=\"M324 399 L392 399\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" marker-end=\"url(#OFFER_oa)\" class=\"flowline\"/>\n          <rect x=\"406\" y=\"292\" width=\"438\" height=\"216\" rx=\"14\" fill=\"var(--accent)\"/>\n          <text x=\"428\" y=\"320\" class=\"svwhite\" font-size=\"12.5\">THE OFFER \u00b7 one sentence a stranger understands</text>\n          <g class=\"svwhite2\" font-size=\"12.5\">\n            <text x=\"428\" y=\"352\">I help <tspan font-weight=\"700\" fill=\"#fff\">[who]</tspan> go from <tspan font-weight=\"700\" fill=\"#fff\">[before]</tspan></text>\n            <text x=\"428\" y=\"376\">to <tspan font-weight=\"700\" fill=\"#fff\">[after]</tspan> using <tspan font-weight=\"700\" fill=\"#fff\">[mechanism]</tspan>,</text>\n            <text x=\"428\" y=\"400\">in <tspan font-weight=\"700\" fill=\"#fff\">[time]</tspan>, or <tspan font-weight=\"700\" fill=\"#fff\">[guarantee]</tspan>.</text>\n          </g>\n          <line x1=\"428\" y1=\"422\" x2=\"822\" y2=\"422\" stroke=\"rgba(255,255,255,.28)\" stroke-width=\"1\"/>\n          <text x=\"428\" y=\"444\" class=\"svwhite2\" font-size=\"10.5\">and it sells at three points on your ladder:</text>\n          <g font-size=\"10.5\">\n            <rect x=\"428\" y=\"458\" width=\"122\" height=\"30\" rx=\"8\" fill=\"rgba(255,255,255,.17)\"/><text x=\"489\" y=\"474\" text-anchor=\"middle\" class=\"svwhite\">entry</text>\n            <rect x=\"558\" y=\"458\" width=\"122\" height=\"30\" rx=\"8\" fill=\"rgba(255,255,255,.17)\"/><text x=\"619\" y=\"474\" text-anchor=\"middle\" class=\"svwhite\">core</text>\n            <rect x=\"688\" y=\"458\" width=\"134\" height=\"30\" rx=\"8\" fill=\"rgba(255,255,255,.17)\"/><text x=\"755\" y=\"474\" text-anchor=\"middle\" class=\"svwhite\">flagship</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Score four levers out of 10</div><div class=\"ab\">Dream outcome and perceived likelihood on top; time delay and effort underneath. Score honestly.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Write one change per lever</div><div class=\"ab\">A number and a deadline, proof a sceptic sees in ten seconds, a win in week one, or a step you do for the buyer.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Fix the two lowest</div><div class=\"ab\">Make those two changes, then update the Step 1 sentence to match.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">For a SaaS company: time delay scores 3 because setup takes six weeks. The change: \u201cfirst campaign live in week one, and we do the setup.\u201d</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Score the Offer on the Value Equation</span><span class=\"fbar\"><i style=\"width:30.4%\"></i></span><span class=\"pg num\">024<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 4",title:"Define the Buyer Persona",html:"<div class=\"slide\" data-i=\"24\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 4</span><span class=\"sp\"></span><span class=\"step num\">15 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 4 \u00b7 the buyer</div><div class=\"h2\" style=\"font-size:2.35cqw\">Define the Buyer Persona</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 512\" role=\"img\" aria-label=\"Buyer persona canvas. On the left, five narrowing bands: market, firmographics, stack and spend signals, trigger, and your buyer. On the right, a persona card listing role and seniority, goal, challenge, where they look, buying process, and objection. Along the bottom, a negative-criteria strip listing who to deliberately exclude.\">\n          <defs>\n            <marker id=\"ICP_ia\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"28\" class=\"svsub\" font-size=\"11\">THE ACCOUNT \u00b7 narrow until only winnable companies are left</text>\n          <g text-anchor=\"middle\">\n            <rect x=\"16\" y=\"52\" width=\"400\" height=\"60\" rx=\"12\" class=\"node\"/>\n            <text x=\"216\" y=\"78\" class=\"svlabel\" font-size=\"12.5\">Your market</text><text x=\"216\" y=\"95\" class=\"svmute\" font-size=\"10\">everyone who could technically buy: far too many</text>\n            <rect x=\"44\" y=\"124\" width=\"344\" height=\"60\" rx=\"12\" fill=\"var(--accent-2)\"/>\n            <text x=\"216\" y=\"150\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Firmographics</text><text x=\"216\" y=\"167\" class=\"svmute\" font-size=\"10\">headcount \u00b7 revenue band \u00b7 industry \u00b7 geography</text>\n            <rect x=\"72\" y=\"196\" width=\"288\" height=\"60\" rx=\"12\" fill=\"var(--accent-2)\"/>\n            <text x=\"216\" y=\"222\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Stack &amp; spend signals</text><text x=\"216\" y=\"239\" class=\"svmute\" font-size=\"10\">what they already pay for, and to whom</text>\n            <rect x=\"100\" y=\"268\" width=\"232\" height=\"60\" rx=\"12\" fill=\"var(--accent-2)\"/>\n            <text x=\"216\" y=\"294\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Trigger</text><text x=\"216\" y=\"311\" class=\"svmute\" font-size=\"10\">the event that makes it urgent now</text>\n            <rect x=\"128\" y=\"340\" width=\"176\" height=\"60\" rx=\"12\" fill=\"var(--accent)\"/>\n            <text x=\"216\" y=\"366\" class=\"svwhite\" font-size=\"12.5\">YOUR BUYER</text><text x=\"216\" y=\"383\" class=\"svwhite2\" font-size=\"10\">the account you can win</text>\n          </g>\n          <path d=\"M306 372 C372 372 392 300 448 258\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-dasharray=\"5 6\" class=\"flowline\" marker-end=\"url(#ICP_ia)\"/>\n          <text x=\"326\" y=\"394\" class=\"svmute\" font-size=\"10\">then: who signs?</text>\n          <!-- persona card -->\n          <rect x=\"452\" y=\"52\" width=\"392\" height=\"348\" rx=\"14\" class=\"node\"/>\n          <rect x=\"452\" y=\"52\" width=\"392\" height=\"34\" rx=\"14\" fill=\"var(--accent-2)\"/>\n          <rect x=\"452\" y=\"72\" width=\"392\" height=\"14\" fill=\"var(--accent-2)\"/>\n          <text x=\"470\" y=\"70\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">THE PERSON INSIDE THE ACCOUNT</text>\n          <g>\n            <text x=\"470\" y=\"110\" class=\"svlabel\" font-size=\"11.5\">Role &amp; seniority</text><text x=\"470\" y=\"126\" class=\"svmute\" font-size=\"10\">senior enough to say yes without a committee</text>\n            <line x1=\"470\" y1=\"140\" x2=\"826\" y2=\"140\" class=\"gridline\"/>\n            <text x=\"470\" y=\"158\" class=\"svlabel\" font-size=\"11.5\">Goal</text><text x=\"470\" y=\"174\" class=\"svmute\" font-size=\"10\">the one number they are personally measured on</text>\n            <line x1=\"470\" y1=\"188\" x2=\"826\" y2=\"188\" class=\"gridline\"/>\n            <text x=\"470\" y=\"206\" class=\"svlabel\" font-size=\"11.5\">Challenge</text><text x=\"470\" y=\"222\" class=\"svmute\" font-size=\"10\">what is stopping them hitting that number</text>\n            <line x1=\"470\" y1=\"236\" x2=\"826\" y2=\"236\" class=\"gridline\"/>\n            <text x=\"470\" y=\"254\" class=\"svlabel\" font-size=\"11.5\">Where they look</text><text x=\"470\" y=\"270\" class=\"svmute\" font-size=\"10\">publications \u00b7 communities \u00b7 who they already follow</text>\n            <line x1=\"470\" y1=\"284\" x2=\"826\" y2=\"284\" class=\"gridline\"/>\n            <text x=\"470\" y=\"302\" class=\"svlabel\" font-size=\"11.5\">Buying process</text><text x=\"470\" y=\"318\" class=\"svmute\" font-size=\"10\">who else has to sign, and how long it takes</text>\n            <line x1=\"470\" y1=\"332\" x2=\"826\" y2=\"332\" class=\"gridline\"/>\n            <text x=\"470\" y=\"350\" class=\"svlabel\" font-size=\"11.5\">The objection</text><text x=\"470\" y=\"366\" class=\"svmute\" font-size=\"10\">the one sentence that kills the deal every time</text>\n          </g>\n          <!-- negative criteria -->\n          <rect x=\"16\" y=\"420\" width=\"828\" height=\"74\" rx=\"12\" fill=\"var(--pink-bg)\"/>\n          <text x=\"34\" y=\"446\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"11.5\">NEGATIVE CRITERIA \u00b7 the accounts you deliberately refuse</text>\n          <text x=\"34\" y=\"466\" class=\"svmute\" font-size=\"10.5\">too small to afford the outcome \u00b7 too big to buy without procurement \u00b7 wrong geography to deliver in</text>\n          <text x=\"34\" y=\"483\" class=\"svmute\" font-size=\"10.5\">\u00b7 no budget owner in the room \u00b7 a trigger you can't influence. Writing these down is what stops a good list going bad.</text>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">The account: fields 1 to 4</div><div class=\"ab\">Headcount, revenue, industry and geography. This is what you type into a data vendor in Step 5.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">The person: fields 5 to 9</div><div class=\"ab\">The signer, their goal, their challenge, where they get information, and the objection that kills deals.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">The trigger: field 10</div><div class=\"ab\">The event that makes it urgent this quarter: funding, a new hire, a launch, a rule change.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">List your 20 best customers. Any value shared by more than half goes in. What your worst five share becomes at least three exclusions.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Define the Buyer Persona</span><span class=\"fbar\"><i style=\"width:32.6%\"></i></span><span class=\"pg num\">025<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Your buyer: headcount, industry, geography, the role that signs, and the objection that kills deals, in their words.",html:"<div class=\"slide\" data-i=\"25\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">16 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 3 of 8</span><span class=\"qk\">Long answer \u00b7 25+ words</span><span class=\"qtime\">\u23f1 3 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your buyer: headcount, industry, geography, the role that signs, and the objection that kills deals, in their words.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Filterable</u><span>Headcount, industry and geography as bands, never \u201cSMB\u201d.</span></div><div class=\"qc\"><u>One signer</u><span>A role that can say yes alone, and the number they are judged on.</span></div><div class=\"qc\"><u>Verbatim objection</u><span>Their words, from a real conversation, in quotes.</span></div></div><div class=\"foot\"><b>Why this one:</b> The account fields go into a data vendor in Step 5. The signer and the objection are who Day 2's copy speaks to.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your buyer: headcount, industry, geography, the role that signs, and the objection that kills deals, in their words.</span><span class=\"fbar\"><i style=\"width:34.8%\"></i></span><span class=\"pg num\">026<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q3 \u00b7 B2B SaaS",title:"SendFlow Answers Q3",html:"<div class=\"slide\" data-i=\"26\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q3 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">17 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 3</u><p>Your buyer: headcount, industry, geography, the role that signs, and the objection that kills deals, in their words.</p></div><div class=\"answer\"><u>How they answer it</u><p>B2B software, 20 to 80 staff, US and Canada, already paying for a sales-engagement tool. Signer: VP Sales, judged on pipeline per rep per month. Objection: \u201cOur reps won't use another tool. We've rolled out two this year and both died.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Bands at both ends give the data vendor a floor and a ceiling.</span></div><div class=\"w\"><i>2</i><span>Pipeline per rep per month is how the VP Sales is judged, so copy can quote it.</span></div><div class=\"w\"><i>3</i><span>The objection is about <b>adoption</b>, not price. A discount would not answer it.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The last clause (already paying for a tool) is a buying signal, not a demographic.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow Answers Q3</span><span class=\"fbar\"><i style=\"width:37.0%\"></i></span><span class=\"pg num\">027<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q3 \u00b7 B2B consulting brand",title:"Apex Growth Answers Q3",html:"<div class=\"slide\" data-i=\"27\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q3 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">18 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 3</u><p>Your buyer: headcount, industry, geography, the role that signs, and the objection that kills deals, in their words.</p></div><div class=\"answer\"><u>How they answer it</u><p>Professional-services firms, 25 to 120 staff, UK and Ireland, no in-house marketing. Signer: Managing Partner, judged on fee income per partner. Objection: \u201cWe tried an agency before and it produced a lot of activity and no clients.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Fee income per partner is the number the signer is judged on.</span></div><div class=\"w\"><i>2</i><span>UK and Ireland keeps delivery and payment simple.</span></div><div class=\"w\"><i>3</i><span>The objection names <b>the agency</b> they already tried, so every page must answer it.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">No in-house marketing is the gap the offer fills, written as a filter.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth Answers Q3</span><span class=\"fbar\"><i style=\"width:39.1%\"></i></span><span class=\"pg num\">028<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q3 \u00b7 Solopreneur",title:"Sarah Chen Answers Q3",html:"<div class=\"slide\" data-i=\"28\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q3 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">19 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 3</u><p>Your buyer: headcount, industry, geography, the role that signs, and the objection that kills deals, in their words.</p></div><div class=\"answer\"><u>How they answer it</u><p>Consultancies and studios, 3 to 12 people, English-speaking, founder still selling and delivering. Signer: the founder, judged on whether next quarter is already visible. Objection: \u201cWe're too small and too messy for this.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The founder still sells and delivers, which is the exact pain she fixes.</span></div><div class=\"w\"><i>2</i><span>\u201cIs next quarter visible\u201d is how a founder keeps score.</span></div><div class=\"w\"><i>3</i><span>The objection is <b>too small and too messy</b>, so her copy must say that is who it is for.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Three to 12 people keeps her out of deals she cannot serve alone.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen Answers Q3</span><span class=\"fbar\"><i style=\"width:41.3%\"></i></span><span class=\"pg num\">029<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 5",title:"Build the Prospect List",html:"<div class=\"slide\" data-i=\"29\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 5</span><span class=\"sp\"></span><span class=\"step num\">20 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 5 \u00b7 the list</div><div class=\"h2\">Build the Prospect List</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Apollo</div><div class=\"rs\">B2B contacts filtered by title, headcount, industry and location, exported with work emails.</div></div><div class=\"rmeta\"><b>Most budgets</b><span>first list</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">LinkedIn Sales Navigator</div><div class=\"rs\">Finds members by role, size and recent activity. It does not export emails.</div></div><div class=\"rmeta\"><b>LinkedIn</b><span>outreach</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">ZoomInfo or Clay</div><div class=\"rs\">ZoomInfo for mid-market buyers and intent signals. Clay to find the trigger and fill email gaps.</div></div><div class=\"rmeta\"><b>Larger budget</b><span>or field 10</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">BuiltWith</div><div class=\"rs\">Lists websites that run a given tool, when buyers are defined by what they already pay for.</div></div><div class=\"rmeta\"><b>Tool-defined</b><span>buyers</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">An email verifier</div><div class=\"rs\">NeverBounce, ZeroBounce, or the check built into your sending tool.</div></div><div class=\"rmeta\"><b>Always</b><span>before sending</span></div></div></div><div class=\"bar\"><span class=\"bl\">How</span><span class=\"bt\">Enter persona fields 1 to 5 as filters and exclusions as negative filters. Export a few hundred to 1,000 people, remove duplicates and current customers, verify every email, and check cold-outreach rules (GDPR in the EU and UK).</span></div><div class=\"foot\">Prices change often. Check each vendor's own pricing page before you buy.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Build the Prospect List</span><span class=\"fbar\"><i style=\"width:43.5%\"></i></span><span class=\"pg num\">030<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Which database builds your first prospect list?",html:"<div class=\"slide\" data-i=\"30\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">21 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 4 of 8</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which database builds your first prospect list?</div><div class=\"qopts\" style=\"--oc:3;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Apollo</span></span><span class=\"qopt\"><i>B</i><span>LinkedIn Sales Navigator</span></span><span class=\"qopt\"><i>C</i><span>ZoomInfo</span></span><span class=\"qopt\"><i>D</i><span>Clay</span></span><span class=\"qopt\"><i>E</i><span>BuiltWith</span></span><span class=\"qopt\"><i>F</i><span>My own CRM or customer list</span></span><span class=\"qopt\"><i>G</i><span>Other (name it)</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One database</u><span>Picked for how your buyers are found, not for the brand.</span></div><div class=\"qc\"><u>Filters from the persona</u><span>The buyer fields in, the exclusions as negative filters.</span></div><div class=\"qc\"><u>Verified</u><span>Every email checked before anything sends.</span></div></div><div class=\"foot\"><b>Why this one:</b> A persona earns money only once it becomes named people with verified emails. Day 2's invites go to this list.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which database builds your first prospect list?</span><span class=\"fbar\"><i style=\"width:45.7%\"></i></span><span class=\"pg num\">031<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q4 \u00b7 B2B SaaS",title:"SendFlow Answers Q4",html:"<div class=\"slide\" data-i=\"31\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q4 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">22 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which database builds your first prospect list?</p></div><div class=\"answer\"><u>How they answer it</u><p>Apollo: titles Head of Sales and VP Sales, 20 to 80 staff, US and Canada, then a verifier before any send.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The title filter matches the signer from the persona.</span></div><div class=\"w\"><i>2</i><span>The staff band comes straight from the buyer answer.</span></div><div class=\"w\"><i>3</i><span>The verifier protects the <b>warming domains</b> from bounces.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Apollo exports work emails, which cold email needs.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow Answers Q4</span><span class=\"fbar\"><i style=\"width:47.8%\"></i></span><span class=\"pg num\">032<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q4 \u00b7 B2B consulting brand",title:"Apex Growth Answers Q4",html:"<div class=\"slide\" data-i=\"32\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q4 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">23 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which database builds your first prospect list?</p></div><div class=\"answer\"><u>How they answer it</u><p>LinkedIn Sales Navigator: we run LinkedIn outreach, and partners rarely list work emails in the databases.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>It suits the LinkedIn outreach the firm already runs.</span></div><div class=\"w\"><i>2</i><span>Calendar invites still need emails, so a verifier sits behind it.</span></div><div class=\"w\"><i>3</i><span>The channel decides the database, <b>not the other way round</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Sales Navigator finds partners by role, even where no email is listed.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth Answers Q4</span><span class=\"fbar\"><i style=\"width:50.0%\"></i></span><span class=\"pg num\">033<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q4 \u00b7 Solopreneur",title:"Sarah Chen Answers Q4",html:"<div class=\"slide\" data-i=\"33\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q4 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">24 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which database builds your first prospect list?</p></div><div class=\"answer\"><u>How they answer it</u><p>My own CRM or customer list: past enquiries and referrals first, then Apollo on the free tier.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The free tier of a database fills the gap later.</span></div><div class=\"w\"><i>2</i><span>It costs nothing, which matters at her size.</span></div><div class=\"w\"><i>3</i><span>Past enquiries have <b>already opted in</b> to hearing from her.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Her own enquiries are warmer than any bought list.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen Answers Q4</span><span class=\"fbar\"><i style=\"width:52.2%\"></i></span><span class=\"pg num\">034<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 6",title:"Pick Your Funnel",html:"<div class=\"slide\" data-i=\"34\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 6</span><span class=\"sp\"></span><span class=\"step num\">25 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 6 \u00b7 the funnel</div><div class=\"h2\" style=\"font-size:2.35cqw\">Pick Your Funnel</div><div class=\"vizrow\" style=\"--split:1.08fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 754\" role=\"img\" aria-label=\"Funnel type taxonomy. Three decision questions across the top, then four family panels: teach to sell, give value first, sell now and ascend later, and let a human or partner close. Each family lists its funnel types with a one-time build-hour estimate. The webinar, workshop or challenge, and reverse squeeze types are marked as the three covered in depth.\">\n          <defs>\n            <marker id=\"TYPES_fa\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- decision spine -->\n          <rect x=\"16\" y=\"14\" width=\"258\" height=\"50\" rx=\"11\" fill=\"var(--accent-2)\"/>\n          <text x=\"145\" y=\"34\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">1 \u00b7 How much do they</text>\n          <text x=\"145\" y=\"50\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">already believe?</text>\n          <rect x=\"301\" y=\"14\" width=\"258\" height=\"50\" rx=\"11\" fill=\"var(--accent-2)\"/>\n          <text x=\"430\" y=\"34\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">2 \u00b7 How big is</text>\n          <text x=\"430\" y=\"50\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">the ticket?</text>\n          <rect x=\"586\" y=\"14\" width=\"258\" height=\"50\" rx=\"11\" fill=\"var(--accent-2)\"/>\n          <text x=\"715\" y=\"34\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">3 \u00b7 Who closes:</text>\n          <text x=\"715\" y=\"50\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">a page, or a person?</text>\n          <g fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.5\" opacity=\".55\" marker-end=\"url(#TYPES_fa)\">\n            <path d=\"M276 39 H297\"/><path d=\"M561 39 H582\"/>\n          </g>\n\n          <!-- family 1 -->\n          <rect x=\"16\" y=\"92\" width=\"406\" height=\"286\" rx=\"14\" class=\"node\"/>\n          <text x=\"34\" y=\"118\" class=\"svlabel\" font-size=\"12.5\">TEACH TO SELL</text>\n          <text x=\"34\" y=\"136\" class=\"svmute\" font-size=\"10\">they must believe a new idea before they'll buy</text>\n          <g font-size=\"11\">\n            <rect x=\"32\" y=\"150\" width=\"374\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"48\" y=\"171\" fill=\"var(--accent-ink)\" font-weight=\"700\">\u25c6 Webinar funnel</text><text x=\"390\" y=\"171\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">39 h</text>\n            <rect x=\"32\" y=\"191\" width=\"374\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"48\" y=\"212\" fill=\"var(--accent-ink)\" font-weight=\"700\">\u25c6 Workshop \u00b7 challenge funnel</text><text x=\"390\" y=\"212\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">50 h</text>\n            <rect x=\"32\" y=\"232\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"253\" class=\"svlabel\">Webinar that doesn't matter</text><text x=\"390\" y=\"253\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">32 h</text>\n            <rect x=\"32\" y=\"273\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"294\" class=\"svlabel\">Sideways sales letter</text><text x=\"390\" y=\"294\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">34 h</text>\n            <rect x=\"32\" y=\"314\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"335\" class=\"svlabel\">Product launch</text><text x=\"390\" y=\"335\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">52 h</text>\n          </g>\n\n          <!-- family 2 -->\n          <rect x=\"438\" y=\"92\" width=\"406\" height=\"286\" rx=\"14\" class=\"node\"/>\n          <text x=\"456\" y=\"118\" class=\"svlabel\" font-size=\"12.5\">GIVE VALUE FIRST</text>\n          <text x=\"456\" y=\"136\" class=\"svmute\" font-size=\"10\">they don't trust you with an email address yet</text>\n          <g font-size=\"11\">\n            <rect x=\"454\" y=\"150\" width=\"374\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"470\" y=\"171\" fill=\"var(--accent-ink)\" font-weight=\"700\">\u25c6 Reverse squeeze</text><text x=\"812\" y=\"171\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">33 h</text>\n            <rect x=\"454\" y=\"191\" width=\"374\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"470\" y=\"212\" fill=\"var(--accent-ink)\" font-weight=\"700\">\u25c6 Reverse squeeze \u00b7 dual-path</text><text x=\"812\" y=\"212\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">34 h</text>\n            <rect x=\"454\" y=\"232\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"253\" class=\"svlabel\">Book authority</text><text x=\"812\" y=\"253\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">56 h</text>\n            <rect x=\"454\" y=\"273\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"294\" class=\"svlabel\">Hub &amp; spoke</text><text x=\"812\" y=\"294\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">44 h</text>\n            <rect x=\"454\" y=\"314\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"335\" class=\"svlabel\">Community</text><text x=\"812\" y=\"335\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">54 h</text>\n          </g>\n\n          <!-- family 3 -->\n          <rect x=\"16\" y=\"394\" width=\"406\" height=\"326\" rx=\"14\" class=\"node\"/>\n          <text x=\"34\" y=\"420\" class=\"svlabel\" font-size=\"12.5\">SELL NOW, ASCEND LATER</text>\n          <text x=\"34\" y=\"438\" class=\"svmute\" font-size=\"10\">the first offer is small enough to buy on impulse</text>\n          <g font-size=\"11\">\n            <rect x=\"32\" y=\"452\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"473\" class=\"svlabel\">Self-liquidating offer</text><text x=\"390\" y=\"473\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">32 h</text>\n            <rect x=\"32\" y=\"493\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"514\" class=\"svlabel\">Tripwire + one-click upsell</text><text x=\"390\" y=\"514\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">33 h</text>\n            <rect x=\"32\" y=\"534\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"555\" class=\"svlabel\">Free + shipping</text><text x=\"390\" y=\"555\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">41 h</text>\n            <rect x=\"32\" y=\"575\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"596\" class=\"svlabel\">Unlock-all order bump</text><text x=\"390\" y=\"596\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">23 h</text>\n            <rect x=\"32\" y=\"616\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"637\" class=\"svlabel\">Downsell</text><text x=\"390\" y=\"637\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">32 h</text>\n            <rect x=\"32\" y=\"657\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"678\" class=\"svlabel\">Waterfall \u00b7 retargeting layers</text><text x=\"390\" y=\"678\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">35 h</text>\n          </g>\n\n          <!-- family 4 -->\n          <rect x=\"438\" y=\"394\" width=\"406\" height=\"244\" rx=\"14\" class=\"node\"/>\n          <text x=\"456\" y=\"420\" class=\"svlabel\" font-size=\"12.5\">LET A HUMAN OR PARTNER CLOSE</text>\n          <text x=\"456\" y=\"438\" class=\"svmute\" font-size=\"10\">a page can't carry the objection; a conversation has to</text>\n          <g font-size=\"11\">\n            <rect x=\"454\" y=\"452\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"473\" class=\"svlabel\">Book a call</text><text x=\"812\" y=\"473\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">41 h</text>\n            <rect x=\"454\" y=\"493\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"514\" class=\"svlabel\">Social following \u2192 DM</text><text x=\"812\" y=\"514\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">31 h</text>\n            <rect x=\"454\" y=\"534\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"555\" class=\"svlabel\">Final funnel \u00b7 no sales page</text><text x=\"812\" y=\"555\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">32 h</text>\n            <rect x=\"454\" y=\"575\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"596\" class=\"svlabel\">Partnership \u00b7 JV</text><text x=\"812\" y=\"596\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">31 h</text>\n          </g>\n          <text x=\"456\" y=\"666\" class=\"svmute\" font-size=\"10.5\">Highest trust required, lowest volume,</text>\n          <text x=\"456\" y=\"683\" class=\"svmute\" font-size=\"10.5\">and the only family where your calendar,</text>\n          <text x=\"456\" y=\"700\" class=\"svmute\" font-size=\"10.5\">not your traffic, is the constraint.</text>\n          <line x1=\"16\" y1=\"734\" x2=\"844\" y2=\"734\" class=\"gridline\"/>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Answer the three questions</div><div class=\"ab\">How much your buyers already believe, how big the ticket is, and who closes: a page or a person.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Match your answers</div><div class=\"ab\">One idea to reframe: a webinar. Must try it to believe it: a workshop or challenge. Never heard of you: a reverse squeeze.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Book the build hours</div><div class=\"ab\">The hours on the diagram are one-time build estimates. Running the funnel takes weekly time on top.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Write one sentence naming your funnel and the answer that decided it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Pick Your Funnel</span><span class=\"fbar\"><i style=\"width:54.3%\"></i></span><span class=\"pg num\">035<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Which funnel are you building?",html:"<div class=\"slide\" data-i=\"35\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">26 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 5 of 8</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which funnel are you building?</div><div class=\"qopts\" style=\"--oc:2;max-height:22cqh\"><span class=\"qopt\"><i>A</i><span>Webinar funnel</span></span><span class=\"qopt\"><i>B</i><span>Workshop or challenge funnel</span></span><span class=\"qopt\"><i>C</i><span>Reverse squeeze funnel</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Belief</u><span>How much your buyers already believe.</span></div><div class=\"qc\"><u>Ticket</u><span>How big the price is.</span></div><div class=\"qc\"><u>Who closes</u><span>A page, or a person on a call.</span></div></div><div class=\"foot\"><b>Why this one:</b> The funnel decides which Day 2 guide you build and where your hours go.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which funnel are you building?</span><span class=\"fbar\"><i style=\"width:56.5%\"></i></span><span class=\"pg num\">036<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q5 \u00b7 B2B SaaS",title:"SendFlow Answers Q5",html:"<div class=\"slide\" data-i=\"36\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q5 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">27 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which funnel are you building?</p></div><div class=\"answer\"><u>How they answer it</u><p>Webinar funnel: VPs of Sales know the category but not the method, and a person closes the annual deals on a demo call.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Annual deals close on a demo call, which a webinar leads into.</span></div><div class=\"w\"><i>2</i><span>Monthly seats can still check out on a page.</span></div><div class=\"w\"><i>3</i><span>The choice rests on <b>belief and who closes</b>, not on the product.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Buyers know the category, so one idea needs reframing: a webinar.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow Answers Q5</span><span class=\"fbar\"><i style=\"width:58.7%\"></i></span><span class=\"pg num\">037<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Q5 \u00b7 B2B consulting brand",title:"Apex Growth Answers Q5",html:"<div class=\"slide\" data-i=\"37\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q5 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">28 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which funnel are you building?</p></div><div class=\"answer\"><u>How they answer it</u><p>Webinar funnel: partners don't believe pipeline can be systematised, so one idea has to be reframed before the offer lands.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>At \u00a312,000 a person closes, and a webinar sets up that call.</span></div><div class=\"w\"><i>2</i><span>The session answers the agency objection before the offer.</span></div><div class=\"w\"><i>3</i><span>A reverse squeeze would give away the method <b>without the call</b> this ticket needs.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Partners doubt pipeline can be systematised, so the belief is the blocker.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth Answers Q5</span><span class=\"fbar\"><i style=\"width:60.9%\"></i></span><span class=\"pg num\">038<i> / 158<  {day:"Day 1",section:"Q5 \u00b7 Solopreneur",title:"Sarah Chen Answers Q5",html:"<div class=\"slide\" data-i=\"38\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q5 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">29 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which funnel are you building?</p></div><div class=\"answer\"><u>How they answer it</u><p>Reverse squeeze funnel: nobody has heard of me yet, and my ticket is too small to justify a call on every lead.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A reverse squeeze has no live date for one person to staff.</span></div><div class=\"w\"><i>2</i><span>Her ticket is too small for a call on every lead.</span></div><div class=\"w\"><i>3</i><span>It trades urgency for <b>content that keeps working</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Nobody knows her yet, so value has to come before any ask.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen Answers Q5</span><span class=\"fbar\"><i style=\"width:63.0%\"></i></span><span class=\"pg num\">039<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 7",title:"Set the Webinar Topic, Date and Time",html:"<div class=\"slide\" data-i=\"39\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 7</span><span class=\"sp\"></span><span class=\"step num\">30 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 7 \u00b7 the event</div><div class=\"h2\">Set the Webinar Topic, Date and Time</div><div class=\"lede\">Every invite, reminder and page on Day 2 carries the topic and the date. Set them once now, so nothing is rewritten later.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Topic</div><div class=\"cb\">The outcome your buyer wants, plus your method's name. Would your persona give up an hour for this title?</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Date</div><div class=\"cb\">Count forward: new sending domains need 2 to 3 weeks of warm-up, and invites need time to land after that.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Time</div><div class=\"cb\">In your audience's time zone, not yours. Across zones, pick the hour that is working hours for most.</div></div></div><div class=\"bar\"><span class=\"bl\">For a SaaS company</span><span class=\"bt\">\u201cHow B2B Software Teams Fill Their Demo Calendar Without Ads. A Thursday three weeks after the workshop, 11:00 ET (16:00 UK), 60 minutes, on Zoom.\u201d</span></div><div class=\"foot\">Reverse squeeze: set the day the video goes live. Challenge: set the date of day one.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Set the Webinar Topic, Date and Time</span><span class=\"fbar\"><i style=\"width:65.2%\"></i></span><span class=\"pg num\">040<i> / 158</i></span></div></div>"},

 {day:"Day 1",section:"Q6 \u00b7 Solopreneur",title:"Sarah Chen Answers Q6",html:"<div class=\"slide\" data-i=\"43\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q6 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">34 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 6</u><p>Your event line: title, date, time with time zone, length and platform.</p></div><div class=\"answer\"><u>How they answer it</u><p>Reverse squeeze: the \u201cSell While You Deliver\u201d video goes live on a Thursday three weeks out, 08:00 ET, replay open for 14 days.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>08:00 ET catches founders before delivery starts.</span></div><div class=\"w\"><i>2</i><span>The replay window adds urgency without a live date.</span></div><div class=\"w\"><i>3</i><span>One line still holds <b>title, date and time</b>, so Day 2 reads it the same way.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A reverse squeeze has a launch day, not a session time.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen Answers Q6</span><span class=\"fbar\"><i style=\"width:73.9%\"></i></span><span class=\"pg num\">044<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 8",title:"Connect Every Channel",html:"<div class=\"slide\" data-i=\"44\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 8</span><span class=\"sp\"></span><span class=\"step num\">35 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 8 \u00b7 the channels</div><div class=\"h2\">Connect Every Channel</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Outreach domains</div><div class=\"rs\">Two or three that resemble your main one: owned at GoDaddy or registered at Cloudflare Registrar, DNS in Cloudflare. Never cold email from your main domain.</div></div><div class=\"rmeta\"><b>GoDaddy or</b><span>Cloudflare</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Mailboxes, authenticated</div><div class=\"rs\">A few per domain in Google Workspace. SPF, DKIM and DMARC in Cloudflare DNS, then connected in Tantra, which warms them.</div></div><div class=\"rmeta\"><b>2 to 3 weeks</b><span>warm-up</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">LinkedIn and WhatsApp</div><div class=\"rs\">LinkedIn connected in Tantra, headline stating the Step 1 outcome. A WhatsApp sender for opted-in reminders.</div></div><div class=\"rmeta\"><b>Day 2</b><span>sends from these</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Calendar and booking link</div><div class=\"rs\">The Google Calendar you take calls on, and a Cal.com discovery-call booking link. Invites send from Tantra.</div></div><div class=\"rmeta\"><b>Cal.com</b><span>booking</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Cloudflare API token</div><div class=\"rs\">Lets your agent add DNS records and deploy the Day 3 automations.</div></div><div class=\"rmeta\"><b>Next slide</b><span>how</span></div></div></div><div class=\"bar\"><span class=\"bl\">Why today</span><span class=\"bt\">Domain warm-up is the only task with a fixed wait. Start it now or the event date moves.</span></div><div class=\"foot\">Click-by-click screens for domains, DNS records and warm-up: the Day 2 Cold Email guide, steps 1 to 6.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Connect Every Channel</span><span class=\"fbar\"><i style=\"width:76.1%\"></i></span><span class=\"pg num\">045<i> / 158</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 8",title:"Create and Test the Cloudflare API Token",html:"<div class=\"slide\" data-i=\"45\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 8</span><span class=\"sp\"></span><span class=\"step num\">36 / 46</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 8 \u00b7 Cloudflare</div><div class=\"h2\">Create and Test the Cloudflare API Token</div><div class=\"lede\">In Cloudflare, open My Profile, then API Tokens, then Create Token.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">DNS token</div><div class=\"cb\">Use the Edit zone DNS template and choose your outreach domains under Zone Resources.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Workers token</div><div class=\"cb\">Running Day 3's automations on Cloudflare Workers? Create a second token from the Edit Cloudflare Workers template.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Store it, then test it</div><div class=\"cb\">Copy each token once into your password manager or the project's .env file. Never paste it into a doc or a chat.</div></div></div><div class=\"bar\"><span class=\"bl\">The test</span><span class=\"bt\"><code>curl https://api.cloudflare.com/client/v4/user/tokens/verify -H \"Authorization: Bearer YOUR_TOKEN\"</code> answers \u201cThis API Token is valid and active\u201d.</span></div><div class=\"foot\">Proof for Step 8: SPF, DKIM and DMARC pass in MXToolbox; warm-up is on; LinkedIn, WhatsApp and calendar show connected; the token test says valid.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Create and Test the Cloudflare API Token</span><span class=\"fbar\"><i style=\"width:78.3%\"></i></span><span class=\"pg num\">046<i> / 158</i></span></div></div>"},

 {day:"Day 2",section:"Day 2 \u00b7 payoff",title:"What You Walk Out With Today",html:"<div class=\"slide\" data-i=\"58\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 payoff</span><span class=\"sp\"></span><span class=\"step num\">3 / 52</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Stay to the end because</div><div class=\"h2\">By the End of This Session You Will Have</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Your channels and first messages</div><div class=\"rs\">The channels you will run, with an opening line for each.</div></div><div class=\"rmeta\"><b>Q1 and Q2</b><span>traffic</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Two headlines to test</div><div class=\"rs\">One benefit-led, one problem-led using your Day 1 objection.</div></div><div class=\"rmeta\"><b>Q3</b><span>the page</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">A reminder cadence</div><div class=\"rs\">Which touches every registrant gets, at their time.</div></div><div class=\"rmeta\"><b>Q4</b><span>show-up</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Your pitch and path to payment</div><div class=\"rs\">The minute the offer lands, the price, and how a buyer pays.</div></div><div class=\"rmeta\"><b>Q5 and Q6</b><span>the close</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">A follow-up for non-buyers</div><div class=\"rs\">The first message, when it sends, and on which channel.</div></div><div class=\"rmeta\"><b>Q7</b><span>follow-up</span></div></div></div><div class=\"bar\"><span class=\"bl\">The heaviest day</span><span class=\"bt\">More gets built today than on any other. Yesterday's strategy doc, with the objection and the proof, is what makes it possible.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">What You Walk Out With Today</span><span class=\"fbar\"><i style=\"width:5.8%\"></i></span><span class=\"pg num\">059<i> / 158</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 sequencing",title:"Build the Core Before the Traffic",html:"<div class=\"slide\" data-i=\"59\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 sequencing</span><span class=\"sp\"></span><span class=\"step num\">4 / 52</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Build in this order, and only this order</div><div class=\"h2\">The Funnel Core Before the Traffic</div><div class=\"lede\">Build the pages, sequences, delivery and close first. Attach traffic on top of a finished machine. People do it backwards, switch on traffic into a half-built funnel, and burn a list they can never un-burn.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Traffic is the cheapest thing to add</div><div class=\"cb\">And the most expensive thing to waste. A list that has seen a broken funnel does not get a second first impression.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">A half-built funnel teaches you nothing</div><div class=\"cb\">If three steps are missing, a bad result tells you nothing about the steps that do exist.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Rehearse before you send</div><div class=\"cb\">A tech rehearsal before the first live session is the step people skip and the one they regret publicly.</div></div></div><div class=\"bar\"><span class=\"bl\">The gate</span><span class=\"bt\">Nothing goes out to a real list until one person has walked the whole funnel end to end, including a real purchase.</span></div><div class=\"foot\">Source: the pre-launch QA gate and rehearsal ritual across the build and webinar playbooks.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Build the Core Before the Traffic</span><span class=\"fbar\"><i style=\"width:7.7%\"></i></span><span class=\"pg num\">060<i> / 158</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S1",title:"Daily Caps, per Channel",html:"<div class=\"slide\" data-i=\"60\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S1</span><span class=\"sp\"></span><span class=\"step num\">5 / 52</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">S1 \u00b7 traffic</div><div class=\"h2\" style=\"font-size:2.35cqw\">Daily Limits, and the Weekly Scale-or-Fix Gate</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 560\" role=\"img\" aria-label=\"Traffic channel operating limits table for cold calendar, cold email, LinkedIn outreach, paid ads and content (blog and social), each with its daily caps and the failure that breaks it. Below, a weekly decision gate splitting into three outcomes: scale when click-through is at least three percent and conversion at least one and a half percent with bounce at or under two percent; hold and change one variable otherwise; and fix immediately when open rate is under fifteen percent, click-through under one percent, or bounce over five percent.\">\n          <defs>\n            <marker id=\"LIMITS_t1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">DAILY OPERATING LIMITS \u00b7 go over them and you lose the asset, not just the campaign</text>\n          <line x1=\"16\" y1=\"36\" x2=\"844\" y2=\"36\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <text x=\"32\" y=\"52\" class=\"svmute\" font-size=\"9.5\">CHANNEL</text><text x=\"200\" y=\"52\" class=\"svmute\" font-size=\"9.5\">THE LIMITS</text><text x=\"832\" y=\"52\" text-anchor=\"end\" class=\"svmute\" font-size=\"9.5\">WHAT BREAKS IF YOU IGNORE THEM</text>\n          <g font-size=\"10.5\">\n            <rect x=\"16\" y=\"62\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"80\" class=\"svlabel\" font-size=\"11\">Cold calendar</text><text x=\"32\" y=\"96\" class=\"svmute\" font-size=\"9.5\">invites from outreach inboxes</text>\n            <text x=\"200\" y=\"80\" class=\"svsub\">20/day per cold inbox \u00b7 50/day once warmed \u00b7 never above 200/day \u00b7 SPF + DKIM + DMARC first</text>\n            <text x=\"200\" y=\"96\" class=\"svmute\" font-size=\"9.5\">outreach domains only, never your main brand domain</text>\n            <text x=\"832\" y=\"96\" text-anchor=\"end\" fill=\"var(--pink)\" font-size=\"10\">the domain, permanently</text>\n\n            <rect x=\"16\" y=\"112\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"130\" class=\"svlabel\" font-size=\"11\">Cold email</text><text x=\"32\" y=\"146\" class=\"svmute\" font-size=\"9.5\">sequenced outreach</text>\n            <text x=\"200\" y=\"130\" class=\"svsub\">20/day unwarmed \u2192 50/day warmed \u00b7 2 to 3 weeks of warm-up \u00b7 verify the list below 1% bounce</text>\n            <text x=\"200\" y=\"146\" class=\"svmute\" font-size=\"9.5\">reject any purchased list with more than 2% duplicates</text>\n            <text x=\"832\" y=\"146\" text-anchor=\"end\" fill=\"var(--pink)\" font-size=\"10\">inbox placement for every domain</text>\n\n            <rect x=\"16\" y=\"162\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"180\" class=\"svlabel\" font-size=\"11\">LinkedIn outreach</text><text x=\"32\" y=\"196\" class=\"svmute\" font-size=\"9.5\">connect \u00b7 message \u00b7 InMail</text>\n            <text x=\"200\" y=\"180\" class=\"svsub\">connection requests about 15 to 20/day to start \u00b7 keep Tantra's defaults for messages and InMail</text>\n            <text x=\"200\" y=\"196\" class=\"svmute\" font-size=\"9.5\">LinkedIn publishes no exact limits \u00b7 limits are per account, across every campaign</text>\n            <text x=\"832\" y=\"196\" text-anchor=\"end\" fill=\"var(--pink)\" font-size=\"10\">the account, with no appeal</text>\n\n            <rect x=\"16\" y=\"212\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"230\" class=\"svlabel\" font-size=\"11\">Paid ads</text><text x=\"32\" y=\"246\" class=\"svmute\" font-size=\"9.5\">cold + retargeting</text>\n            <text x=\"200\" y=\"230\" class=\"svsub\">smallest viable budget first \u00b7 one variable per test \u00b7 retargeting pool live from day one</text>\n            <text x=\"200\" y=\"246\" class=\"svmute\" font-size=\"9.5\">prove the funnel converts on cheap learning traffic before you scale spend</text>\n            <text x=\"832\" y=\"246\" text-anchor=\"end\" fill=\"var(--pink)\" font-size=\"10\">your budget, fastest of all</text>\n\n            <rect x=\"16\" y=\"262\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"280\" class=\"svlabel\" font-size=\"11\">Blog and social</text><text x=\"32\" y=\"296\" class=\"svmute\" font-size=\"9.5\">the only channel that compounds</text>\n            <text x=\"200\" y=\"280\" class=\"svsub\">batch, never improvise \u00b7 1 pillar \u2192 5 clips \u2192 quotes \u00b7 post to the event every 3 days</text>\n            <text x=\"200\" y=\"296\" class=\"svmute\" font-size=\"9.5\">every link UTM-tagged, or none of this is attributable</text>\n            <text x=\"832\" y=\"296\" text-anchor=\"end\" fill=\"var(--amber)\" font-size=\"10\">nothing; it just quietly stops</text>\n          </g>\n          <!-- decision gate -->\n          <line x1=\"16\" y1=\"320\" x2=\"844\" y2=\"320\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <rect x=\"330\" y=\"334\" width=\"200\" height=\"44\" rx=\"11\" fill=\"var(--accent)\"/>\n          <text x=\"430\" y=\"352\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"12\">EVERY WEEK, PER CHANNEL</text>\n          <text x=\"430\" y=\"368\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"10\">read the numbers, then pick one</text>\n          <g fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.6\" opacity=\".6\" marker-end=\"url(#LIMITS_t1)\">\n            <path d=\"M380 378 C380 400 220 396 150 410\"/>\n            <path d=\"M430 378 L430 410\"/>\n            <path d=\"M480 378 C480 400 640 396 710 410\"/>\n          </g>\n          <rect x=\"16\" y=\"416\" width=\"268\" height=\"128\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"150\" y=\"440\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12.5\">SCALE IT</text>\n          <text x=\"150\" y=\"462\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">CTR \u2265 3%  AND  conv \u2265 1.5%</text>\n          <text x=\"150\" y=\"479\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">AND  bounce \u2264 2%</text>\n          <line x1=\"44\" y1=\"494\" x2=\"256\" y2=\"494\" stroke=\"var(--teal)\" opacity=\".3\"/>\n          <text x=\"150\" y=\"514\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Add volume. Add inboxes or</text>\n          <text x=\"150\" y=\"530\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">budget, not new variables.</text>\n\n          <rect x=\"296\" y=\"416\" width=\"268\" height=\"128\" rx=\"12\" fill=\"var(--amber-bg)\"/>\n          <text x=\"430\" y=\"440\" text-anchor=\"middle\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"12.5\">HOLD AND TUNE</text>\n          <text x=\"430\" y=\"462\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">anywhere between the two</text>\n          <text x=\"430\" y=\"479\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">bands on either side</text>\n          <line x1=\"324\" y1=\"494\" x2=\"536\" y2=\"494\" stroke=\"var(--amber)\" opacity=\".3\"/>\n          <text x=\"430\" y=\"514\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Change exactly one variable.</text>\n          <text x=\"430\" y=\"530\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Re-measure before touching another.</text>\n\n          <rect x=\"576\" y=\"416\" width=\"268\" height=\"128\" rx=\"12\" fill=\"var(--pink-bg)\"/>\n          <text x=\"710\" y=\"440\" text-anchor=\"middle\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"12.5\">FIX IT TODAY</text>\n          <text x=\"710\" y=\"462\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">open &lt; 15%  OR  bounce &gt; 5%</text>\n          <text x=\"710\" y=\"479\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">stop sending on that inbox now</text>\n          <line x1=\"604\" y1=\"494\" x2=\"816\" y2=\"494\" stroke=\"var(--pink)\" opacity=\".3\"/>\n          <text x=\"710\" y=\"514\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">CTR &lt; 1%: the inbox is fine.</text>\n          <text x=\"710\" y=\"530\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Rewrite the offer, keep sending.</text>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Every channel has an operating ceiling</div><div class=\"ab\">These are policy limits, not targets. Exceeding them risks the account or the domain, not just the campaign.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Volume comes from more senders, never more sends</div><div class=\"ab\">Cold email scales by adding warmed inboxes at 30 to 50 sends a day each, not by pushing one inbox harder.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Message limits track accept rate</div><div class=\"ab\">On LinkedIn the connection cap and the message cap move together. A low accept rate lowers your ceiling automatically.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Read the cap for each channel you ticked, and write it into your plan before you send anything.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Daily Caps, per Channel</span><span class=\"fbar\"><i style=\"width:9.6%\"></i></span><span class=\"pg num\">061<i> / 158</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S1",title:"Email Infrastructure, Before Anything",html:"<div class=\"slide\" data-i=\"61\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S1</span><span class=\"sp\"></span><span class=\"step num\">6 / 52</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Cold email hygiene</div><div class=\"h2\">The Four Things That Decide Whether You Land or Bounce</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Dedicated sending domains</div><div class=\"rs\">Never your main domain. A burned domain takes your whole company's email with it.</div></div><div class=\"rmeta\"><b>Setup</b><span>day one</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">SPF, DKIM and DMARC</div><div class=\"rs\">All three, verified. Any one missing and a growing share of mail is filtered before a human sees it.</div></div><div class=\"rmeta\"><b>Setup</b><span>day one</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Two to three weeks of warm-up</div><div class=\"rs\">Gradual volume ramp before real sending. It started on Day 1, Step 8.</div></div><div class=\"rmeta\"><b>Wait</b><span>2 to 3 weeks</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Thirty to fifty sends per inbox per day</div><div class=\"rs\">The hygiene ceiling. More inboxes, not more sends per inbox.</div></div><div class=\"rmeta\"><b>Ongoing</b><span>per inbox</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">A master list, checked before every launch</div><div class=\"rs\">So the same person is not messaged on three channels in one week.</div></div><div class=\"rmeta\"><b>Ongoing</b><span>every send</span></div></div></div><div class=\"bar\"><span class=\"bl\">Why this is on the build day</span><span class=\"bt\">Warm-up is the only task this week with a hard external wait. Everything else can be compressed by working harder; this cannot.</span></div><div class=\"foot\">Source: the traffic playbook and the master-list discipline in the webinar playbook.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Email Infrastructure, Before Anything</span><span class=\"fbar\"><i style=\"width:11.5%\"></i></span><span class=\"pg num\">062<i> / 158</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S2",title:"What the Tantra Pro Funnel Page Must Not Have",html:"<div class=\"slide\" data-i=\"62\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S2</span><span class=\"sp\"></span><span class=\"step num\">7 / 52</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">S2 \u00b7 the page</div><div class=\"h2\" style=\"font-size:2.35cqw\">What the Page Has, and What It Must Not Have</div><div class=\"viz\"><svg viewBox=\"0 0 860 476\" role=\"img\" aria-label=\"Landing page wireframe: the Tantra Pro Funnel page with nine blocks: logo and trust strip, headline and subhead, video, three proof points, registration form above the fold, the named mechanism, testimonials, an FAQ, and a sticky call to action. Beside it: the conversion figure, the form fields, and what the page must not have.\">\n          <rect x=\"16\" y=\"14\" width=\"828\" height=\"34\" rx=\"9\" fill=\"var(--teal)\"/>\n          <text x=\"430\" y=\"34\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"12.5\">TANTRA PRO FUNNEL \u00b7 the registration page</text>\n\n          <rect x=\"16\" y=\"60\" width=\"508\" height=\"400\" rx=\"12\" class=\"node\" stroke=\"var(--teal)\"/>\n          <g font-size=\"10.5\">\n            <rect x=\"34\" y=\"76\" width=\"472\" height=\"26\" rx=\"6\" fill=\"var(--line)\"/><text x=\"48\" y=\"93\" class=\"svsub\" font-size=\"10\">logo + trust strip (logos, counts, certifications)</text>\n            <rect x=\"34\" y=\"110\" width=\"472\" height=\"44\" rx=\"6\" fill=\"var(--teal-bg)\"/><text x=\"48\" y=\"128\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11\">Headline + subhead</text><text x=\"48\" y=\"145\" class=\"svmute\" font-size=\"9.5\">promise, then the mechanism in one line</text>\n            <rect x=\"34\" y=\"162\" wi
