 {day:"Day 3",section:"Day 3B \u00b7 step 2",title:"Symptom, cause, one change",html:"<div class=\"slide\" data-i=\"192\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 step 2</span><span class=\"sp\"></span><span class=\"step num\">40 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 2 \u00b7 find it</div><div class=\"h2\" style=\"font-size:2.35cqw\">The symptom, the cause, and the one thing to change</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 584\" role=\"img\" aria-label=\"Leak diagnosis matrix with eight rows. Each row names a symptom, the likely cause, and the single element to experiment on: entry page not earning the start, drop-off on specific questions, low completion overall, the result not earning the click to price, the offer not landing, checkout friction, weak upsell take, and high channel cost per buyer.\">\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">WORK TOP TO BOTTOM \u2014 THE FIRST ROW THAT MATCHES IS YOUR WEEK</text>\n          <line x1=\"16\" y1=\"34\" x2=\"844\" y2=\"34\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <text x=\"32\" y=\"50\" class=\"svmute\" font-size=\"9.5\">THE SYMPTOM</text>\n          <text x=\"316\" y=\"50\" class=\"svmute\" font-size=\"9.5\">WHAT IT USUALLY MEANS</text>\n          <text x=\"590\" y=\"50\" class=\"svmute\" font-size=\"9.5\">CHANGE EXACTLY THIS</text>\n          <g font-size=\"10\">\n            <rect x=\"16\" y=\"60\" width=\"828\" height=\"62\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"80\" class=\"svlabel\" font-size=\"10.5\">Visits, but almost no starts</text><text x=\"32\" y=\"96\" class=\"svmute\" font-size=\"9\">session \u2192 start is your lowest rate</text>\n            <text x=\"316\" y=\"88\" class=\"svsub\" font-size=\"9.5\">The page isn't earning the first click</text>\n            <text x=\"590\" y=\"80\" class=\"svsub\" font-size=\"9.5\">Headline \u00b7 the time promise \u00b7 the hero</text><text x=\"590\" y=\"96\" class=\"svsub\" font-size=\"9.5\">image \u00b7 page speed \u00b7 CTA above the fold</text>\n\n            <rect x=\"16\" y=\"128\" width=\"828\" height=\"62\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"148\" class=\"svlabel\" font-size=\"10.5\">A cliff at one specific question</text><text x=\"32\" y=\"164\" class=\"svmute\" font-size=\"9\">visible only in per-step drop-off</text>\n            <text x=\"316\" y=\"156\" class=\"svsub\" font-size=\"9.5\">That question creates friction or confusion</text>\n            <text x=\"590\" y=\"148\" class=\"svsub\" font-size=\"9.5\">Cut it, reorder it, or reword it. Add a</text><text x=\"590\" y=\"164\" class=\"svsub\" font-size=\"9.5\">breather screen before it.</text>\n\n            <rect x=\"16\" y=\"196\" width=\"828\" height=\"62\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"216\" class=\"svlabel\" font-size=\"10.5\">Low completion across the board</text><text x=\"32\" y=\"232\" class=\"svmute\" font-size=\"9\">no single cliff, everyone thins out</text>\n            <text x=\"316\" y=\"224\" class=\"svsub\" font-size=\"9.5\">It's simply too long</text>\n            <text x=\"590\" y=\"216\" class=\"svsub\" font-size=\"9.5\">Cut the count. Show progress. Tighten</text><text x=\"590\" y=\"232\" class=\"svsub\" font-size=\"9.5\">the clusters. Shorter almost always wins.</text>\n\n            <rect x=\"16\" y=\"264\" width=\"828\" height=\"62\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"284\" class=\"svlabel\" font-size=\"10.5\">They see the result, not the price</text><text x=\"32\" y=\"300\" class=\"svmute\" font-size=\"9\">result \u2192 offer view is low</text>\n            <text x=\"316\" y=\"292\" class=\"svsub\" font-size=\"9.5\">The result doesn't earn the next click</text>\n            <text x=\"590\" y=\"284\" class=\"svsub\" font-size=\"9.5\">How the score is presented \u00b7 echoing their</text><text x=\"590\" y=\"300\" class=\"svsub\" font-size=\"9.5\">own words back \u00b7 the CTA label itself</text>\n\n            <rect x=\"16\" y=\"332\" width=\"828\" height=\"62\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"352\" class=\"svlabel\" font-size=\"10.5\">They see the price and stop</text><text x=\"32\" y=\"368\" class=\"svmute\" font-size=\"9\">offer view \u2192 checkout start is low</text>\n            <text x=\"316\" y=\"360\" class=\"svsub\" font-size=\"9.5\">The offer isn't landing, or the price isn't framed</text>\n            <text x=\"590\" y=\"352\" class=\"svsub\" font-size=\"9.5\">Tier framing \u00b7 anchoring \u00b7 which tier is</text><text x=\"590\" y=\"368\" class=\"svsub\" font-size=\"9.5\">preselected \u00b7 the guarantee \u00b7 renewal clarity</text>\n\n            <rect x=\"16\" y=\"400\" width=\"828\" height=\"62\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"420\" class=\"svlabel\" font-size=\"10.5\">They start checkout and vanish</text><text x=\"32\" y=\"436\" class=\"svmute\" font-size=\"9\">the most expensive leak you have</text>\n            <text x=\"316\" y=\"428\" class=\"svsub\" font-size=\"9.5\">Friction or a trust gap at the final step</text>\n            <text x=\"590\" y=\"420\" class=\"svsub\" font-size=\"9.5\">Wallets first \u00b7 fewer fields \u00b7 trust strip \u00b7</text><text x=\"590\" y=\"436\" class=\"svsub\" font-size=\"9.5\">fix auth failures \u00b7 correct currency and locale</text>\n\n            <rect x=\"16\" y=\"468\" width=\"828\" height=\"50\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"488\" class=\"svlabel\" font-size=\"10.5\">Nobody takes the upsell</text><text x=\"32\" y=\"504\" class=\"svmute\" font-size=\"9\">free money you're leaving behind</text>\n            <text x=\"316\" y=\"496\" class=\"svsub\" font-size=\"9.5\">Wrong offer, wrong price, or wrong order</text>\n            <text x=\"590\" y=\"496\" class=\"svsub\" font-size=\"9.5\">The offer itself \u00b7 its price \u00b7 the ladder order</text>\n\n            <rect x=\"16\" y=\"524\" width=\"828\" height=\"50\" rx=\"8\" fill=\"var(--pink-bg)\"/>\n            <text x=\"32\" y=\"544\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"10.5\">One channel's cost per buyer is high</text><text x=\"32\" y=\"560\" class=\"svmute\" font-size=\"9\">the funnel is fine \u2014 the traffic isn't</text>\n            <text x=\"316\" y=\"552\" class=\"svsub\" font-size=\"9.5\">Weak creative, or the wrong list entirely</text>\n            <text x=\"590\" y=\"552\" class=\"svsub\" font-size=\"9.5\">The hook and the list \u2014 or move the budget</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">The symptom is a rate, not a feeling</div><div class=\"ab\">Read it off the funnel report. The worst step relative to your own other steps \u2014 not the one you find most annoying.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">The cause is usually friction, trust, or audience</div><div class=\"ab\">People who start and abandon have accepted the price. People who never start have not accepted the promise. Different fixes entirely.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">One change, named in advance</div><div class=\"ab\">The element, the variant and the metric that should move \u2014 all three written down before the experiment starts.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Every row is a symptom you can read from a report and a fix you can ship this week.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Symptom, cause, one change</span><span class=\"fbar\"><i style=\"width:56.3%\"></i></span><span class=\"pg num\">193<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 step 3",title:"Six steps, one lap a week",html:"<div class=\"slide\" data-i=\"193\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 step 3</span><span class=\"sp\"></span><span class=\"step num\">41 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 3 \u00b7 the loop</div><div class=\"h2\" style=\"font-size:2.35cqw\">Six steps, one lap per week, forever</div><div class=\"viz\"><svg viewBox=\"0 22 860 410\" role=\"img\" aria-label=\"The weekly optimisation loop drawn as a ring of six steps: observe, locate, hypothesise, experiment, measure, and keep or revert, with the ring returning to observe. Side panels list the daily, weekly, monthly and quarterly cadence and the four signs the loop is working.\">\n          <defs>\n            <marker id=\"LOOP_l1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <circle cx=\"262\" cy=\"232\" r=\"150\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"7 9\" class=\"flowline\" opacity=\".5\"/>\n          <g font-size=\"10.5\">\n            <circle cx=\"262\" cy=\"82\" r=\"46\" fill=\"var(--accent)\"/><text x=\"262\" y=\"78\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">OBSERVE</text><text x=\"262\" y=\"94\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"9\">fetch both reports</text>\n            <circle cx=\"392\" cy=\"157\" r=\"46\" fill=\"var(--accent-2)\"/><text x=\"392\" y=\"153\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">LOCATE</text><text x=\"392\" y=\"169\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">the single worst step</text>\n            <circle cx=\"392\" cy=\"307\" r=\"46\" fill=\"var(--accent-2)\"/><text x=\"392\" y=\"299\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">HYPOTH-</text><text x=\"392\" y=\"313\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">ESISE</text><text x=\"392\" y=\"329\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">one reason, one fix</text>\n            <circle cx=\"262\" cy=\"382\" r=\"46\" fill=\"var(--accent-2)\"/><text x=\"262\" y=\"378\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">EXPERIMENT</text><text x=\"262\" y=\"394\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">50 / 50, one change</text>\n            <circle cx=\"132\" cy=\"307\" r=\"46\" fill=\"var(--accent-2)\"/><text x=\"132\" y=\"303\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">MEASURE</text><text x=\"132\" y=\"319\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">wait for a real sample</text>\n            <circle cx=\"132\" cy=\"157\" r=\"46\" fill=\"#0f9e75\"/><text x=\"132\" y=\"150\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11\">KEEP OR</text><text x=\"132\" y=\"164\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11\">REVERT</text><text x=\"132\" y=\"180\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"9\">then log it</text>\n          </g>\n          <text x=\"262\" y=\"226\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"12\">ONE LAP</text>\n          <text x=\"262\" y=\"244\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10.5\">per week</text>\n          <rect x=\"452\" y=\"40\" width=\"392\" height=\"184\" rx=\"12\" class=\"node\"/>\n          <text x=\"472\" y=\"66\" class=\"svlabel\" font-size=\"11.5\">THE CADENCE</text>\n          <g font-size=\"10\">\n            <text x=\"472\" y=\"90\" class=\"svsub\" font-size=\"10.5\">Daily \u00b7 automated</text><text x=\"472\" y=\"106\" class=\"svmute\">fetch both reports; alert if a step rate falls sharply</text>\n            <text x=\"472\" y=\"124\" class=\"svsub\" font-size=\"10.5\">Weekly \u00b7 you and the agent</text><text x=\"472\" y=\"140\" class=\"svmute\">confirm the bottleneck, launch one experiment, read last week's</text>\n            <text x=\"472\" y=\"158\" class=\"svsub\" font-size=\"10.5\">Monthly</text><text x=\"472\" y=\"174\" class=\"svmute\">re-pull spend, rebalance budget, prune dead questions and upsells</text>\n            <text x=\"472\" y=\"192\" class=\"svsub\" font-size=\"10.5\">Quarterly</text><text x=\"472\" y=\"208\" class=\"svmute\">revisit the diagnostic itself \u2014 are these still the right axes?</text>\n          </g>\n          <rect x=\"452\" y=\"240\" width=\"392\" height=\"184\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"472\" y=\"266\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11.5\">YOU'RE DOING IT RIGHT WHEN</text>\n          <g font-size=\"10.5\" class=\"svsub\">\n            <text x=\"472\" y=\"292\">\u00b7 Every step rate is fetched, never guessed</text>\n            <text x=\"472\" y=\"316\">\u00b7 You know today's bottleneck without thinking</text>\n            <text x=\"472\" y=\"340\">\u00b7 Every buyer maps to a channel, and budget</text>\n            <text x=\"486\" y=\"356\">follows cost-per-buyer, not cost-per-click</text>\n            <text x=\"472\" y=\"380\">\u00b7 Exactly one experiment runs per leak</text>\n            <text x=\"472\" y=\"404\">\u00b7 This month's worst step beats last month's</text>\n          </g>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Observe, locate, hypothesise</div><div class=\"cb\">Pull both standing reports, find the worst step, and write down what you think is causing it before you touch anything.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Experiment, measure, keep or revert</div><div class=\"cb\">One change, run to a stable gap rather than a good-looking day, then promote it or roll it back \u2014 and log the result either way.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Logging the failures is the compounding part</div><div class=\"cb\">A reverted experiment you wrote down is knowledge. One you did not is an experiment you will run again next quarter.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Thirty minutes a week. This loop is the entire job once the funnel is live.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Six steps, one lap a week</span><span class=\"fbar\"><i style=\"width:57.7%\"></i></span><span class=\"pg num\">194<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 step 3",title:"The four cadences",html:"<div class=\"slide\" data-i=\"194\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 step 3</span><span class=\"sp\"></span><span class=\"step num\">42 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">How often to look</div><div class=\"h2\" style=\"font-size:2.6cqw\">Four cadences, four different questions</div><div class=\"matrix fill\" style=\"grid-template-columns:minmax(0,.85fr) repeat(2,minmax(0,1fr))\"><div class=\"mc head\"></div><div class=\"mc head\"><b>What you do</b></div><div class=\"mc head\"><b>What you are asking</b></div><div class=\"mc rowh\"><b>Daily</b></div><div class=\"mc\"><span>An automated fetch, and an alert if a step rate drops or cost per buyer spikes.</span></div><div class=\"mc\"><span>Has something broken?</span></div><div class=\"mc rowh\"><b>Weekly</b></div><div class=\"mc\"><span>Pull both reports, name the worst step, run one experiment per live leak.</span></div><div class=\"mc\"><span>What is the worst step right now?</span></div><div class=\"mc rowh\"><b>Monthly</b></div><div class=\"mc\"><span>Rebalance spend toward the lowest cost per buyer; prune dead questions and upsells.</span></div><div class=\"mc\"><span>Where should the money go?</span></div><div class=\"mc rowh\"><b>Quarterly</b></div><div class=\"mc\"><span>Re-validate the score axes and the band-to-tier rule from Day 2.</span></div><div class=\"mc\"><span>Is the offer itself still the right diagnosis?</span></div></div><div class=\"foot\">The quarterly row is the one almost nobody runs. It treats the <em>offer</em> as a hypothesis to keep re-scoring, not just the funnel around it.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The four cadences</span><span class=\"fbar\"><i style=\"width:59.2%\"></i></span><span class=\"pg num\">195<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 step 4",title:"Same spend, redistributed",html:"<div class=\"slide\" data-i=\"195\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 step 4</span><span class=\"sp\"></span><span class=\"step num\">43 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 4 \u00b7 the money</div><div class=\"h2\" style=\"font-size:2.35cqw\">Same spend, redistributed by cost per buyer</div><div class=\"viz\"><svg viewBox=\"0 0 860 452\" role=\"img\" aria-label=\"Channel budget reallocation. Five channels each show spend, buyers and cost per buyer, with a before-and-after budget bar. Budget shifts away from the highest cost per buyer toward the lowest, holding total spend constant, producing more buyers for the same money.\">\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">READ THE COST PER BUYER COLUMN FIRST \u2014 EVERYTHING ELSE IS DECORATION</text>\n          <line x1=\"16\" y1=\"34\" x2=\"844\" y2=\"34\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <text x=\"32\" y=\"52\" class=\"svmute\" font-size=\"9.5\">CHANNEL</text>\n          <text x=\"196\" y=\"52\" class=\"svmute\" font-size=\"9.5\">SPEND</text>\n          <text x=\"282\" y=\"52\" class=\"svmute\" font-size=\"9.5\">BUYERS</text>\n          <text x=\"372\" y=\"52\" class=\"svmute\" font-size=\"9.5\">COST PER BUYER</text>\n          <text x=\"530\" y=\"52\" class=\"svmute\" font-size=\"9.5\">THIS MONTH'S BUDGET</text>\n          <text x=\"712\" y=\"52\" class=\"svmute\" font-size=\"9.5\">NEXT MONTH'S</text>\n          <g font-size=\"10.5\">\n            <rect x=\"16\" y=\"62\" width=\"828\" height=\"50\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"92\" class=\"svlabel\" font-size=\"10.5\">Content</text>\n            <text x=\"196\" y=\"92\" class=\"svsub\">$800</text><text x=\"282\" y=\"92\" class=\"svsub\">14</text>\n            <text x=\"372\" y=\"92\" fill=\"var(--teal)\" font-weight=\"700\">$57</text>\n            <rect x=\"530\" y=\"80\" width=\"60\" height=\"18\" rx=\"4\" fill=\"var(--accent)\" opacity=\".5\"/>\n            <rect x=\"712\" y=\"80\" width=\"112\" height=\"18\" rx=\"4\" fill=\"var(--teal)\"/>\n            <text x=\"612\" y=\"93\" class=\"svmute\" font-size=\"9\">\u2191 fund it</text>\n\n            <rect x=\"16\" y=\"118\" width=\"828\" height=\"50\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"148\" class=\"svlabel\" font-size=\"10.5\">LinkedIn outreach</text>\n            <text x=\"196\" y=\"148\" class=\"svsub\">$1,200</text><text x=\"282\" y=\"148\" class=\"svsub\">11</text>\n            <text x=\"372\" y=\"148\" fill=\"var(--teal)\" font-weight=\"700\">$109</text>\n            <rect x=\"530\" y=\"136\" width=\"82\" height=\"18\" rx=\"4\" fill=\"var(--accent)\" opacity=\".5\"/>\n            <rect x=\"712\" y=\"136\" width=\"108\" height=\"18\" rx=\"4\" fill=\"var(--teal)\"/>\n            <text x=\"634\" y=\"149\" class=\"svmute\" font-size=\"9\">\u2191 fund it</text>\n\n            <rect x=\"16\" y=\"174\" width=\"828\" height=\"50\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"204\" class=\"svlabel\" font-size=\"10.5\">Cold email</text>\n            <text x=\"196\" y=\"204\" class=\"svsub\">$1,000</text><text x=\"282\" y=\"204\" class=\"svsub\">6</text>\n            <text x=\"372\" y=\"204\" fill=\"var(--amber)\" font-weight=\"700\">$167</text>\n            <rect x=\"530\" y=\"192\" width=\"70\" height=\"18\" rx=\"4\" fill=\"var(--accent)\" opacity=\".5\"/>\n            <rect x=\"712\" y=\"192\" width=\"70\" height=\"18\" rx=\"4\" fill=\"var(--amber)\"/>\n            <text x=\"622\" y=\"205\" class=\"svmute\" font-size=\"9\">\u2192 hold</text>\n\n            <rect x=\"16\" y=\"230\" width=\"828\" height=\"50\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"260\" class=\"svlabel\" font-size=\"10.5\">Paid ads</text>\n            <text x=\"196\" y=\"260\" class=\"svsub\">$2,400</text><text x=\"282\" y=\"260\" class=\"svsub\">8</text>\n            <text x=\"372\" y=\"260\" fill=\"var(--pink)\" font-weight=\"700\">$300</text>\n            <rect x=\"530\" y=\"248\" width=\"150\" height=\"18\" rx=\"4\" fill=\"var(--accent)\" opacity=\".5\"/>\n            <rect x=\"712\" y=\"248\" width=\"76\" height=\"18\" rx=\"4\" fill=\"var(--pink)\"/>\n            <text x=\"692\" y=\"261\" class=\"svmute\" font-size=\"9\">\u2193 halve it</text>\n\n            <rect x=\"16\" y=\"286\" width=\"828\" height=\"50\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"316\" class=\"svlabel\" font-size=\"10.5\">Cold calendar</text>\n            <text x=\"196\" y=\"316\" class=\"svsub\">$600</text><text x=\"282\" y=\"316\" class=\"svsub\">1</text>\n            <text x=\"372\" y=\"316\" fill=\"var(--pink)\" font-weight=\"700\">$600</text>\n            <rect x=\"530\" y=\"304\" width=\"40\" height=\"18\" rx=\"4\" fill=\"var(--accent)\" opacity=\".5\"/>\n            <rect x=\"712\" y=\"304\" width=\"14\" height=\"18\" rx=\"4\" fill=\"var(--pink)\"/>\n            <text x=\"738\" y=\"317\" class=\"svmute\" font-size=\"9\">\u2193 cut to a test</text>\n          </g>\n          <line x1=\"16\" y1=\"352\" x2=\"844\" y2=\"352\" class=\"gridline\"/>\n          <rect x=\"16\" y=\"366\" width=\"828\" height=\"72\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"36\" y=\"390\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11.5\">Total spend: unchanged. Expected buyers: materially higher.</text>\n          <text x=\"36\" y=\"410\" class=\"svmute\" font-size=\"10.5\">You didn't find a new channel, write better copy or increase your budget. You moved money from a channel costing $300\u2013600 a buyer into channels</text>\n          <text x=\"36\" y=\"428\" class=\"svmute\" font-size=\"10.5\">costing $57\u2013109. This is the highest-return hour of the month, and most people never spend it because the report isn't built. Yours is.</text>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Follow cost per buyer, never cost per click</div><div class=\"cb\">A cheap click that never converts is the most expensive traffic you own. This rule appears three separate times in the source material.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Shrink a losing channel, do not kill it</div><div class=\"cb\">Cut it to the smallest size that still produces a readable number. Kill it entirely and you can never tell whether it recovered.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Your own hours are a channel budget</div><div class=\"cb\">For an organic channel the reallocation is hours, not money \u2014 but it is the same decision and the same arithmetic.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Same total spend. The only thing that changes is which channel it sits in.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Same spend, redistributed</span><span class=\"fbar\"><i style=\"width:60.6%\"></i></span><span class=\"pg num\">196<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 step 5",title:"A year of contact on four rails",html:"<div class=\"slide\" data-i=\"196\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 step 5</span><span class=\"sp\"></span><span class=\"step num\">44 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 5 \u00b7 the year</div><div class=\"h2\" style=\"font-size:2.35cqw\">A year of contact on four rails</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 512\" role=\"img\" aria-label=\"The fifty-two week growth engine. A twelve-topic rotation feeds four delivery rails \u2014 email, messaging, SMS and a newsletter \u2014 across four audience segments: non-buyers, buyers, lapsed contacts and advocates, each with its own cadence and purpose. A reactivation branch returns lapsed contacts to the top of the funnel.\">\n          <defs>\n            <marker id=\"ENGINE52_g1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">ONE TOPIC ROTATION \u00b7 FOUR RAILS \u00b7 FOUR SEGMENTS</text>\n          <rect x=\"16\" y=\"38\" width=\"196\" height=\"196\" rx=\"12\" fill=\"var(--accent-2)\"/>\n          <text x=\"114\" y=\"64\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">12-TOPIC ROTATION</text>\n          <text x=\"114\" y=\"82\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">one theme per month, reused</text>\n          <text x=\"114\" y=\"96\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">across every rail and segment</text>\n          <g font-size=\"9.5\" class=\"svmute\">\n            <text x=\"36\" y=\"122\">\u00b7 the problem, restated</text>\n            <text x=\"36\" y=\"140\">\u00b7 the mechanism, one step</text>\n            <text x=\"36\" y=\"158\">\u00b7 a customer story</text>\n            <text x=\"36\" y=\"176\">\u00b7 a common mistake</text>\n            <text x=\"36\" y=\"194\">\u00b7 a tool or template</text>\n            <text x=\"36\" y=\"212\">\u00b7 an invitation back in</text>\n          </g>\n          <text x=\"114\" y=\"228\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">\u2026repeat, twice a year</text>\n          <g fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.6\" opacity=\".55\" marker-end=\"url(#ENGINE52_g1)\">\n            <path d=\"M212 90 C244 90 238 74 262 72\" class=\"flowline\"/>\n            <path d=\"M212 112 C244 112 238 128 262 130\" class=\"flowline\"/>\n            <path d=\"M212 158 C244 158 238 186 262 188\" class=\"flowline\"/>\n            <path d=\"M212 186 C244 186 238 244 262 246\" class=\"flowline\"/>\n          </g>\n          <g font-size=\"10\">\n            <rect x=\"266\" y=\"52\" width=\"180\" height=\"40\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"280\" y=\"70\" class=\"svlabel\" font-size=\"10.5\">Email</text><text x=\"280\" y=\"84\" class=\"svmute\" font-size=\"9\">weekly \u00b7 the workhorse</text>\n            <rect x=\"266\" y=\"110\" width=\"180\" height=\"40\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"280\" y=\"128\" class=\"svlabel\" font-size=\"10.5\">Messaging</text><text x=\"280\" y=\"142\" class=\"svmute\" font-size=\"9\">fortnightly \u00b7 highest read rate</text>\n            <rect x=\"266\" y=\"168\" width=\"180\" height=\"40\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"280\" y=\"186\" class=\"svlabel\" font-size=\"10.5\">SMS</text><text x=\"280\" y=\"200\" class=\"svmute\" font-size=\"9\">rare \u00b7 only for time-critical</text>\n            <rect x=\"266\" y=\"226\" width=\"180\" height=\"40\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"280\" y=\"244\" class=\"svlabel\" font-size=\"10.5\">Newsletter</text><text x=\"280\" y=\"258\" class=\"svmute\" font-size=\"9\">monthly \u00b7 the depth play</text>\n          </g>\n          <g font-size=\"10\">\n            <rect x=\"480\" y=\"52\" width=\"364\" height=\"48\" rx=\"9\" fill=\"var(--panel-2)\"/>\n            <text x=\"496\" y=\"72\" class=\"svlabel\" font-size=\"10.5\">Non-buyers</text><text x=\"496\" y=\"88\" class=\"svmute\" font-size=\"9\">the biggest segment \u00b7 keep teaching, re-invite each cycle</text>\n            <rect x=\"480\" y=\"108\" width=\"364\" height=\"48\" rx=\"9\" fill=\"var(--panel-2)\"/>\n            <text x=\"496\" y=\"128\" class=\"svlabel\" font-size=\"10.5\">Buyers</text><text x=\"496\" y=\"144\" class=\"svmute\" font-size=\"9\">onboarding first, then ascension \u2014 they already trust you</text>\n            <rect x=\"480\" y=\"164\" width=\"364\" height=\"48\" rx=\"9\" fill=\"var(--amber-bg)\"/>\n            <text x=\"496\" y=\"184\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">Lapsed</text><text x=\"496\" y=\"200\" class=\"svmute\" font-size=\"9\">one reactivation offer, then reduce frequency \u2014 don't burn them</text>\n            <rect x=\"480\" y=\"220\" width=\"364\" height=\"48\" rx=\"9\" fill=\"var(--teal-bg)\"/>\n            <text x=\"496\" y=\"240\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"10.5\">Advocates</text><text x=\"496\" y=\"256\" class=\"svmute\" font-size=\"9\">ask for referrals and reviews \u2014 your cheapest acquisition channel</text>\n          </g>\n          <path d=\"M662 268 C662 300 400 300 200 300 L120 300 C104 300 96 292 96 278 L96 246\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-dasharray=\"6 7\" marker-end=\"url(#ENGINE52_g1)\" class=\"flowline\"/>\n          <text x=\"420\" y=\"292\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">advocates and reactivated contacts re-enter at the top of the funnel \u2014 this is what makes it an engine rather than a broadcast</text>\n          <line x1=\"16\" y1=\"326\" x2=\"844\" y2=\"326\" class=\"gridline\"/>\n          <text x=\"16\" y=\"350\" class=\"svlabel\" font-size=\"11.5\">THE THREE RULES THAT KEEP IT ALIVE</text>\n          <g font-size=\"10.5\">\n            <rect x=\"16\" y=\"364\" width=\"268\" height=\"118\" rx=\"11\" class=\"node\"/>\n            <text x=\"32\" y=\"388\" class=\"svlabel\" font-size=\"10.5\">1 \u00b7 Segment or die</text>\n            <text x=\"32\" y=\"410\" class=\"svmute\" font-size=\"9.5\">Sending everyone the same message is</text>\n            <text x=\"32\" y=\"426\" class=\"svmute\" font-size=\"9.5\">how a list stops opening. The four tags</text>\n            <text x=\"32\" y=\"442\" class=\"svmute\" font-size=\"9.5\">from Day 2 are the segmentation \u2014 you</text>\n            <text x=\"32\" y=\"458\" class=\"svmute\" font-size=\"9.5\">already built it, so use it.</text>\n\n            <rect x=\"296\" y=\"364\" width=\"268\" height=\"118\" rx=\"11\" class=\"node\"/>\n            <text x=\"312\" y=\"388\" class=\"svlabel\" font-size=\"10.5\">2 \u00b7 Value before ask, always</text>\n            <text x=\"312\" y=\"410\" class=\"svmute\" font-size=\"9.5\">A rough ratio: four useful sends for</text>\n            <text x=\"312\" y=\"426\" class=\"svmute\" font-size=\"9.5\">every one that asks for something.</text>\n            <text x=\"312\" y=\"442\" class=\"svmute\" font-size=\"9.5\">Invert it and your open rate decays</text>\n            <text x=\"312\" y=\"458\" class=\"svmute\" font-size=\"9.5\">until the list is worthless.</text>\n\n            <rect x=\"576\" y=\"364\" width=\"268\" height=\"118\" rx=\"11\" class=\"node\"/>\n            <text x=\"592\" y=\"388\" class=\"svlabel\" font-size=\"10.5\">3 \u00b7 Let people leave quietly</text>\n            <text x=\"592\" y=\"410\" class=\"svmute\" font-size=\"9.5\">A visible unsubscribe and a \"less often\"</text>\n            <text x=\"592\" y=\"426\" class=\"svmute\" font-size=\"9.5\">option protect deliverability for</text>\n            <text x=\"592\" y=\"442\" class=\"svmute\" font-size=\"9.5\">everyone else. People who can't leave</text>\n            <text x=\"592\" y=\"458\" class=\"svmute\" font-size=\"9.5\">mark you as spam instead.</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Four rails, one calendar</div><div class=\"ab\">Email, messaging, SMS and a newsletter, planned as one schedule rather than four teams improvising separately.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Behavioural tagging sits on top</div><div class=\"ab\">The same four tags from Day 3 decide who gets which rail. Without them a year-long programme is one broadcast repeated fifty-two times.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Reactivation is the cheapest list you own</div><div class=\"ab\">People who already bought, or already nearly bought, cost nothing to reach again and convert far better than cold traffic.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Schedule it once. The alternative is deciding what to send, every week, forever.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">A year of contact on four rails</span><span class=\"fbar\"><i style=\"width:62.0%\"></i></span><span class=\"pg num\">197<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 step 6",title:"Customers re-enter, they do not exit",html:"<div class=\"slide\" data-i=\"197\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 step 6</span><span class=\"sp\"></span><span class=\"step num\">45 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 6 \u00b7 the wheel</div><div class=\"h2\" style=\"font-size:2.35cqw\">Customers never exit \u2014 they re-enter</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 720 506\" role=\"img\" aria-label=\"RevOps flywheel: three arcs \u2014 attract, engage, delight \u2014 rotate around RevOps at the hub; retained customers re-enter through referrals, renewals and expansion.\">\n          <defs>\n            <marker id=\"FLYWHEEL_fm\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--ink-2)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"FLYWHEEL_fmg\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- outer re-entry loop -->\n          <path d=\"M143.5 375 A250 250 0 0 1 360 0\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2\" stroke-dasharray=\"8 8\" class=\"flowline\" marker-end=\"url(#FLYWHEEL_fmg)\" opacity=\".85\"/>\n          <text x=\"92\" y=\"250\" text-anchor=\"middle\" transform=\"rotate(-90 92 250)\" class=\"svsub\" font-size=\"12\">retained customers re-enter the top</text>\n          <!-- three stage arcs -->\n          <circle cx=\"360\" cy=\"250\" r=\"175\" fill=\"none\" stroke=\"#6366f1\" stroke-width=\"46\" stroke-dasharray=\"350 750\" transform=\"rotate(212.7 360 250)\"/>\n          <circle cx=\"360\" cy=\"250\" r=\"175\" fill=\"none\" stroke=\"#9333ea\" stroke-width=\"46\" stroke-dasharray=\"350 750\" transform=\"rotate(332.7 360 250)\"/>\n          <circle cx=\"360\" cy=\"250\" r=\"175\" fill=\"none\" stroke=\"#0f9e75\" stroke-width=\"46\" stroke-dasharray=\"350 750\" transform=\"rotate(92.7 360 250)\"/>\n          <!-- on-arc labels -->\n          <text x=\"360\" y=\"76\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"16\">Attract</text>\n          <text x=\"511.6\" y=\"338.5\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"16\" transform=\"rotate(-60 511.6 338.5)\">Engage</text>\n          <text x=\"208.4\" y=\"338.5\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"16\" transform=\"rotate(60 208.4 338.5)\">Delight</text>\n          <!-- momentum arrows at gaps (clockwise) -->\n          <g fill=\"none\" stroke=\"var(--ink-2)\" stroke-width=\"2\" marker-end=\"url(#FLYWHEEL_fm)\" opacity=\".7\">\n            <path d=\"M497.9 142.2 A175 175 0 0 1 522.2 184.4\"/>\n            <path d=\"M384.4 423.3 A175 175 0 0 1 335.6 423.3\"/>\n            <path d=\"M197.8 184.4 A175 175 0 0 1 222.1 142.2\"/>\n          </g>\n          <!-- hub -->\n          <circle cx=\"360\" cy=\"250\" r=\"92\" fill=\"var(--panel)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n          <text x=\"360\" y=\"218\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"800\" font-size=\"18\">RevOps</text>\n          <text x=\"360\" y=\"236\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10.5\">owns the 4 drivers</text>\n          <g font-size=\"11\" font-weight=\"600\">\n            <text x=\"315\" y=\"262\" text-anchor=\"middle\" fill=\"var(--accent-ink)\">People</text>\n            <text x=\"405\" y=\"262\" text-anchor=\"middle\" fill=\"var(--accent-ink)\">Process</text>\n            <text x=\"318\" y=\"282\" text-anchor=\"middle\" fill=\"var(--accent-ink)\">Data</text>\n            <text x=\"404\" y=\"282\" text-anchor=\"middle\" fill=\"var(--accent-ink)\">Tech</text>\n          </g>\n          <!-- stage metric labels (outside) -->\n          <g font-size=\"11\">\n            <text x=\"360\" y=\"26\" text-anchor=\"middle\" class=\"svmute\">CPL \u00b7 lead quality \u00b7 sourced revenue</text>\n            <text x=\"600\" y=\"392\" text-anchor=\"middle\" class=\"svmute\">win rate \u00b7 cycle length</text>\n            <text x=\"120\" y=\"392\" text-anchor=\"middle\" class=\"svmute\">NPS \u00b7 churn \u00b7 expansion</text>\n          </g>\n          <!-- re-entry contributions -->\n          <g font-size=\"11.5\" font-weight=\"600\" fill=\"var(--teal)\">\n            <text x=\"360\" y=\"470\" text-anchor=\"middle\">referral \u2192 new pipeline \u00b7 renewal \u2192 retention \u00b7 expansion \u2192 funds the next hire</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Each turn lowers the cost of the next</div><div class=\"ab\">A customer who refers reduces the acquisition cost of the person they refer to roughly nothing.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">The first win is the hinge</div><div class=\"ab\">The 48 hours after payment decide churn. A fast, small, visible win is worth more than a comprehensive slow one.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Ascension is the cheapest revenue there is</div><div class=\"ab\">Someone who just bought is the warmest buyer you will ever have. If there is no rung above, that gap is your largest single lever.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Not one enormous month \u2014 a wheel that gets slightly easier to turn each time.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Customers re-enter, they do not exit</span><span class=\"fbar\"><i style=\"width:63.4%\"></i></span><span class=\"pg num\">198<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 step 6",title:"The lever that multiplies the others",html:"<div class=\"slide\" data-i=\"198\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 step 6</span><span class=\"sp\"></span><span class=\"step num\">46 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The only lever that multiplies</div><div class=\"h2\">Retention</div><div class=\"lede\">Doubling your traffic doubles your buyers. Doubling your retention doubles the value of every buyer you have <em>ever</em> acquired, and every one you ever will.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">It is retroactive</div><div class=\"cb\">Every other lever affects future customers only. Retention reaches backwards across your whole customer base at once.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">It lowers acquisition cost</div><div class=\"cb\">A higher lifetime value means you can afford to pay more per customer than your competitors and still profit.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">It is decided in 48 hours</div><div class=\"cb\">Not in month six. The window immediately after payment is where churn is set, and almost nobody staffs it.</div></div></div><div class=\"bar\"><span class=\"bl\">Which is why</span><span class=\"bt\">The 48 hours after someone pays deserve more of your attention than the 48 days before.</span></div><div class=\"foot\">This is why the last question of the workshop is about your retention mechanism rather than your next campaign.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The lever that multiplies the others</span><span class=\"fbar\"><i style=\"width:64.8%\"></i></span><span class=\"pg num\">199<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Your cost per buyer and your lifetime value \u2014 both fetched, neither guessed.",html:"<div class=\"slide\" data-i=\"199\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">47 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 7 of 12</span><span class=\"qk\">Short answer \u00b7 10+ words</span><span class=\"qtime\">\u23f1 4 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your cost per buyer and your lifetime value \u2014 both fetched, neither guessed.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 3</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Both fetched</u><span>Pulled from a report. If you estimated it, say so.</span></div><div class=\"qc\"><u>Cost your time</u><span>Unpaid founder hours are a real cost. Price them.</span></div><div class=\"qc\"><u>The ratio</u><span>Divide them. The ratio is the answer, not either number.</span></div></div><div class=\"foot\"><b>Why this one:</b> Both fetched, neither guessed. Watch the ratio rather than either number alone \u2014 $600 to acquire a customer is neither high nor low until you know what that customer is worth.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your cost per buyer and your lifetime value \u2014 both fetched, neither guessed.</span><span class=\"fbar\"><i style=\"width:66.2%\"></i></span><span class=\"pg num\">200<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q7 \u00b7 B2B SaaS",title:"SendFlow answers Q7",html:"<div class=\"slide\" data-i=\"200\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q7 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">48 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 7</u><p>Your cost per buyer and your lifetime value \u2014 both fetched, neither guessed.</p></div><div class=\"answer\"><u>How they answer it</u><p>$310 per buyer blended. Lifetime value $4,900 at current churn. Ratio around 16\u00d7 \u2014 we should be spending far more than we are.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Both numbers are fetched from reports rather than estimated.</span></div><div class=\"w\"><i>2</i><span>Lifetime value is calculated at <b>current churn</b>, not at hoped-for churn.</span></div><div class=\"w\"><i>3</i><span>The conclusion is the right one: a high ratio means they should be spending more, not less.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A very healthy ratio is a signal to spend more, not a reason to feel comfortable. Underspending against a 16\u00d7 ratio is leaving growth on the table every month.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q7</span><span class=\"fbar\"><i style=\"width:67.6%\"></i></span><span class=\"pg num\">201<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q7 \u00b7 B2B consulting brand",title:"Apex Growth answers Q7",html:"<div class=\"slide\" data-i=\"201\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q7 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">49 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 7</u><p>Your cost per buyer and your lifetime value \u2014 both fetched, neither guessed.</p></div><div class=\"answer\"><u>How they answer it</u><p>Cost per buyer \u00a3640 from LinkedIn time costed at our own rate. Lifetime value \u00a318,400 with the retainer attached. Ratio comfortably healthy.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>LinkedIn time is <b>costed at their own billing rate</b>, not treated as free.</span></div><div class=\"w\"><i>2</i><span>Lifetime value includes the retainer, which is where most of the value actually sits.</span></div><div class=\"w\"><i>3</i><span>Costing time is what makes an organic channel comparable to a paid one at all.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Costing LinkedIn time at their own billing rate is the step almost everyone skips \u2014 and it is the only way an organic channel's cost becomes comparable to a paid one.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q7</span><span class=\"fbar\"><i style=\"width:69.0%\"></i></span><span class=\"pg num\">202<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q7 \u00b7 Solopreneur",title:"Sarah Chen answers Q7",html:"<div class=\"slide\" data-i=\"202\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q7 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">50 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 7</u><p>Your cost per buyer and your lifetime value \u2014 both fetched, neither guessed.</p></div><div class=\"answer\"><u>How they answer it</u><p>Cost per buyer is effectively my time: about 6 hours per client. Lifetime value $4,600. I need to cost my time properly before I can call this fetched.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>She names the gap rather than filling it \u2014 her time is not yet costed.</span></div><div class=\"w\"><i>2</i><span>Six hours per client is a real measurement; what is missing is a <b>rate to multiply it by</b>.</span></div><div class=\"w\"><i>3</i><span>Until that rate exists, the ratio cannot be computed and she says so.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Refusing to call an uncosted number \u201cfetched\u201d is the most disciplined answer on this slide. An honest gap beats a confident guess, because you can close a gap.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q7</span><span class=\"fbar\"><i style=\"width:70.4%\"></i></span><span class=\"pg num\">203<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Which channel has your lowest cost per buyer?",html:"<div class=\"slide\" data-i=\"203\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">51 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 8 of 12</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which channel has your lowest cost per buyer?</div><div class=\"qopts\" style=\"--oc:3;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Content &amp; organic</span></span><span class=\"qopt\"><i>B</i><span>LinkedIn outreach</span></span><span class=\"qopt\"><i>C</i><span>Cold email</span></span><span class=\"qopt\"><i>D</i><span>Paid ads</span></span><span class=\"qopt\"><i>E</i><span>Referrals</span></span><span class=\"qopt\"><i>F</i><span>Partner placements</span></span><span class=\"qopt\"><i>G</i><span>Not enough data yet</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Per buyer</u><span>Spend divided by buyers from that channel. Not clicks, not leads.</span></div><div class=\"qc\"><u>Fetched</u><span>From the acquisition report, not from memory.</span></div><div class=\"qc\"><u>Enough data</u><span>\u201cNot enough data yet\u201d is a legitimate and useful answer.</span></div></div><div class=\"foot\"><b>Why this one:</b> Cost per BUYER, not per click. A cheap click that never converts is the most expensive traffic you own \u2014 and budget should follow the lowest cost per buyer, every time.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which channel has your lowest cost per buyer?</span><span class=\"fbar\"><i style=\"width:71.8%\"></i></span><span class=\"pg num\">204<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q8 \u00b7 B2B SaaS",title:"SendFlow answers Q8",html:"<div class=\"slide\" data-i=\"204\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q8 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">52 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 8</u><p>Which channel has your lowest cost per buyer?</p></div><div class=\"answer\"><u>How they answer it</u><p>Cold email \u2014 ads cost us triple. Moving half the ad budget into more warmed inboxes.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Cold email wins on cost per buyer even though ads deliver more clicks.</span></div><div class=\"w\"><i>2</i><span>They move <b>half</b> the budget, not all of it, so the comparison stays alive.</span></div><div class=\"w\"><i>3</i><span>More warmed inboxes is the correct way to scale this channel \u2014 never more sends per inbox.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Moving half the ad budget rather than all of it keeps the comparison alive. Killing a channel entirely means you can never tell whether it recovered.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q8</span><span class=\"fbar\"><i style=\"width:73.2%\"></i></span><span class=\"pg num\">205<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q8 \u00b7 B2B consulting brand",title:"Apex Growth answers Q8",html:"<div class=\"slide\" data-i=\"205\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q8 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">53 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 8</u><p>Which channel has your lowest cost per buyer?</p></div><div class=\"answer\"><u>How they answer it</u><p>Content &amp; organic \u2014 by a distance. Doubling content time and cutting cold calendar to a test.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Content wins clearly once their time is costed properly.</span></div><div class=\"w\"><i>2</i><span>Cold calendar is cut to a <b>test, not to zero</b>, preserving the signal.</span></div><div class=\"w\"><i>3</i><span>Doubling content time is a reallocation of hours, which is the only budget they have.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Cutting cold calendar to a test rather than to zero is the same discipline: shrink a losing channel to the smallest size that still produces a readable number.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q8</span><span class=\"fbar\"><i style=\"width:74.6%\"></i></span><span class=\"pg num\">206<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q8 \u00b7 Solopreneur",title:"Sarah Chen answers Q8",html:"<div class=\"slide\" data-i=\"206\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q8 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">54 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 8</u><p>Which channel has your lowest cost per buyer?</p></div><div class=\"answer\"><u>How they answer it</u><p>Not enough data yet \u2014 content is my only channel, so there's nothing to compare against.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>With one channel there is nothing to compare against, and she says so.</span></div><div class=\"w\"><i>2</i><span>This makes the real next step <b>a second channel</b>, not an optimisation of the first.</span></div><div class=\"w\"><i>3</i><span>Naming the gap prevents a false conclusion drawn from a single data point.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cNot enough data yet\u201d is the honest answer when there is one channel, and it sets the actual priority: get a second channel readable before optimising the first.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q8</span><span class=\"fbar\"><i style=\"width:76.1%\"></i></span><span class=\"pg num\">207<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"What is your single worst step right now?",html:"<div class=\"slide\" data-i=\"207\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">55 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 9 of 12</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">What is your single worst step right now?</div><div class=\"qopts\" style=\"--oc:3;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Visit \u2192 opt-in</span></span><span class=\"qopt\"><i>B</i><span>Opt-in \u2192 qualified</span></span><span class=\"qopt\"><i>C</i><span>Qualified \u2192 engaged</span></span><span class=\"qopt\"><i>D</i><span>Engaged \u2192 offer seen</span></span><span class=\"qopt\"><i>E</i><span>Offer seen \u2192 checkout started</span></span><span class=\"qopt\"><i>F</i><span>Checkout started \u2192 purchase</span></span><span class=\"qopt\"><i>G</i><span>Purchase \u2192 renewal</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One step</u><span>The single worst, relative to your own other steps.</span></div><div class=\"qc\"><u>From the report</u><span>Read it off the funnel report, don't nominate a favourite.</span></div><div class=\"qc\"><u>A cause</u><span>Name whether it's friction, trust, or the wrong audience.</span></div></div><div class=\"foot\"><b>Why this one:</b> One step. Not three. The lowest rate relative to the rest of your own funnel \u2014 and you fix that one before touching anything else, because fixing five at once teaches you nothing.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">What is your single worst step right now?</span><span class=\"fbar\"><i style=\"width:77.5%\"></i></span><span class=\"pg num\">208<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q9 \u00b7 B2B SaaS",title:"SendFlow answers Q9",html:"<div class=\"slide\" data-i=\"208\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q9 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">56 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 9</u><p>What is your single worst step right now?</p></div><div class=\"answer\"><u>How they answer it</u><p>Checkout started \u2192 purchase \u2014 people begin and abandon, so it's friction or trust, not price.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>People start checkout and abandon, which rules price out as the cause.</span></div><div class=\"w\"><i>2</i><span>They correctly identify it as <b>friction or trust</b>, since price was accepted at the start.</span></div><div class=\"w\"><i>3</i><span>That diagnosis points at concrete fixes: wallets first, fewer fields, a trust strip.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Diagnosing started-and-abandoned as friction or trust rather than price is correct \u2014 someone who began checkout has already accepted the price.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q9</span><span class=\"fbar\"><i style=\"width:78.9%\"></i></span><span class=\"pg num\">209<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q9 \u00b7 B2B consulting brand",title:"Apex Growth answers Q9",html:"<div class=\"slide\" data-i=\"209\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q9 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">57 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 9</u><p>What is your single worst step right now?</p></div><div class=\"answer\"><u>How they answer it</u><p>Offer seen \u2192 checkout started \u2014 they read the whole page and don't book. The ask is too big for a first interaction.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>They read the whole page and still do not book, so attention is not the problem.</span></div><div class=\"w\"><i>2</i><span>The diagnosis is <b>commitment size</b>, not persuasion.</span></div><div class=\"w\"><i>3</i><span>That points at shrinking the ask rather than rewriting the page.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cThe ask is too big for a first interaction\u201d is a diagnosis about commitment size, not about copy \u2014 and it leads to a completely different experiment than a headline test would.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q9</span><span class=\"fbar\"><i style=\"width:80.3%\"></i></span><span class=\"pg num\">210<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q9 \u00b7 Solopreneur",title:"Sarah Chen answers Q9",html:"<div class=\"slide\" data-i=\"210\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q9 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">58 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 9</u><p>What is your single worst step right now?</p></div><div class=\"answer\"><u>How they answer it</u><p>Qualified \u2192 engaged \u2014 barely a third show up, and I only send two reminders.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Barely a third of qualified registrants attend.</span></div><div class=\"w\"><i>2</i><span>Only two reminders are sent, against the <b>six-touch structure</b> from Day 2.</span></div><div class=\"w\"><i>3</i><span>This is the cheapest lift available: the acquisition cost is already spent.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A third showing up with two reminders is a sequence problem, and it is the cheapest step in the whole funnel to fix \u2014 these are people you have already paid to acquire.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q9</span><span class=\"fbar\"><i style=\"width:81.7%\"></i></span><span class=\"p  {day:"Day 3",section:"Your turn",title:"Your one experiment this week: which element, which variant, which metric should move?",html:"<div class=\"slide\" data-i=\"211\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">59 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 10 of 12</span><span class=\"qk\">Long answer \u00b7 20+ words</span><span class=\"qtime\">\u23f1 4 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your one experiment this week: which element, which variant, which metric should move?</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 3</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One element</u><span>A single thing changed. Not a redesign.</span></div><div class=\"qc\"><u>One metric</u><span>The specific rate that should move, named before you start.</span></div><div class=\"qc\"><u>A stopping rule</u><span>Run it until the gap is stable, not until it looks good.</span></div></div><div class=\"foot\"><b>Why this one:</b> One change per leak. Two at once and you cannot attribute the result \u2014 if it moves you don't know which change did it, and if it drops you don't know which to undo.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your one experiment this week: which element, which variant, which metric should move?</span><span class=\"fbar\"><i style=\"width:83.1%\"></i></span><span class=\"pg num\">212<i> / 230</i></span></div></div>"},

<script>
// theme ---------------------------------------------------------------------
const stTheme=localStorage.getItem("tantra-theme");
if(stTheme)document.documentElement.dataset.theme=stTheme;
document.getElementById("theme").onclick=()=>{
  const n=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=n;localStorage.setItem("tantra-theme",n);
};

const stage=document.getElementById("stage");
const TOTAL=SLIDES.length;

// day filter ----------------------------------------------------------------
// One master deck, narrowed to a day for live delivery. The page number on the
// slide stays GLOBAL — renumbering per filter would mean the number on screen
// disagreed with the number in the handout.
let filter="all";
function inFilter(i){return filter==="all"||SLIDES[i].day===filter}
function filtered(){const o=[];for(let i=0;i<TOTAL;i++)if(inFilter(i))o.push(i);return o}

let cur=0;

function mount(i){
  stage.innerHTML=SLIDES[i].html;
  const el=stage.firstElementChild;
  if(el)requestAnimationFrame(()=>el.classList.add("on"));
}

function show(i){
  cur=Math.max(0,Math.min(TOTAL-1,i));
  mount(cur);
  const f=filtered(), at=f.indexOf(cur);
  document.getElementById("count").innerHTML=
    `<b>${cur+1}</b> / ${TOTAL}` + (filter==="all"?"":` &nbsp;·&nbsp; ${at<0?"–":at+1} of ${f.length} in ${filter}`);
  document.getElementById("progf").style.width=((cur+1)/TOTAL*100)+"%";
  [...document.querySelectorAll(".ovc")].forEach(c=>c.classList.toggle("now",+c.dataset.i===cur));
  location.hash=cur;
}

// Navigation respects the filter: on Day 2, Next stops at the end of Day 2
// rather than sliding silently into Day 3 mid-session.
function step(d){
  const f=filtered();
  if(!f.length)return;
  let at=f.indexOf(cur);
  if(at<0){                       // current slide is outside the filter
    at=d>0?-1:f.length;
    for(let k=0;k<f.length;k++){ if(f[k]>cur){at=d>0?k-1:k;break;} }
  }
  const nx=Math.max(0,Math.min(f.length-1,at+d));
  show(f[nx]);
}

function setFilter(v){
  filter=v;
  [...document.querySelectorAll(".filters button")].forEach(b=>b.classList.toggle("on",b.dataset.f===v));
  const f=filtered();
  if(f.length&&!inFilter(cur))show(f[0]);else show(cur);
}
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>setFilter(b.dataset.f));

// overview ------------------------------------------------------------------
const ov=document.getElementById("ov");
(function buildOverview(){
  let h="",lastDay=null;
  for(let i=0;i<TOTAL;i++){
    const s=SLIDES[i];
    if(s.day!==lastDay){
      if(lastDay!==null)h+="</div>";
      h+=`<div class="ovsec">${s.day}</div><div class="ovgrid">`;
      lastDay=s.day;
    }
    h+=`<div class="ovc" data-i="${i}"><u>${s.section}<s>${String(i+1).padStart(3,"0")}</s></u><b>${s.title}</b></div>`;
  }
  h+="</div>";
  document.getElementById("ovbody").innerHTML=h;
  document.querySelectorAll(".ovc").forEach(c=>c.onclick=()=>{toggleOv(false);show(+c.dataset.i)});
})();
function toggleOv(on){ov.classList.toggle("on",on===undefined?!ov.classList.contains("on"):on)}
document.getElementById("ovbtn").onclick=()=>toggleOv();

// input ---------------------------------------------------------------------
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.getElementById("progwrap").onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  show(Math.round((e.clientX-r.left)/r.width*(TOTAL-1)));
};
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();step(1)}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();step(-1)}
  if(e.key==="Home")show(0);
  if(e.key==="End")show(TOTAL-1);
  if(e.key==="o"||e.key==="O")toggleOv();
  if(e.key==="Escape")toggleOv(false);
});

// A pasted "#77" link is how one person sends another person a slide out of
// 211. Without this the hash changes, the browser does not reload, and nothing
// moves — the link silently does nothing.
addEventListener("hashchange",()=>{
  const h=parseInt(location.hash.slice(1));
  if(Number.isFinite(h)&&h!==cur)show(h);
});

const h0=parseInt(location.hash.slice(1));
show(Number.isFinite(h0)?h0:0);
</script>
