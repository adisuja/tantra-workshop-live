 {day:"Day 3",section:"Day 3 \u00b7 task 3.3",title:"Check Every Automation Fires",html:"<div class=\"slide\" data-i=\"122\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 task 3.3</span><span class=\"sp\"></span><span class=\"step num\">15 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Task 3.3 \u00b7 automations</div><div class=\"h2\" style=\"font-size:2.35cqw\">Check Every Automation Fires</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 600\" role=\"img\" aria-label=\"Eight automations laid out as trigger, condition and action rows: registration confirmation and reminders, event page to registration to CRM sync, the landing page API, behavioural sync back to the CRM, calendar outreach import, the pipeline stage tracker, the reply and bounce parser polling every sixty seconds, and the messaging reminder engine polling every five minutes.\">\n          <defs>\n            <marker id=\"AUTO_a1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"40\" y=\"24\" class=\"svmute\" font-size=\"9.5\">TRIGGER</text>\n          <text x=\"330\" y=\"24\" class=\"svmute\" font-size=\"9.5\">CONDITION</text>\n          <text x=\"600\" y=\"24\" class=\"svmute\" font-size=\"9.5\">ACTION</text>\n          <line x1=\"16\" y1=\"34\" x2=\"844\" y2=\"34\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <g fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.4\" opacity=\".45\" marker-end=\"url(#AUTO_a1)\">\n            <path d=\"M300 62 L322 62\"/><path d=\"M566 62 L588 62\"/>\n            <path d=\"M300 134 L322 134\"/><path d=\"M566 134 L588 134\"/>\n            <path d=\"M300 206 L322 206\"/><path d=\"M566 206 L588 206\"/>\n            <path d=\"M300 278 L322 278\"/><path d=\"M566 278 L588 278\"/>\n            <path d=\"M300 350 L322 350\"/><path d=\"M566 350 L588 350\"/>\n            <path d=\"M300 422 L322 422\"/><path d=\"M566 422 L588 422\"/>\n            <path d=\"M300 494 L322 494\"/><path d=\"M566 494 L588 494\"/>\n            <path d=\"M300 566 L322 566\"/><path d=\"M566 566 L588 566\"/>\n          </g>\n          <g font-size=\"10\">\n            <rect x=\"16\" y=\"44\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"60\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">1 \u00b7 Someone registers</text><text x=\"30\" y=\"74\" class=\"svmute\" font-size=\"9\">native to your event platform</text>\n            <rect x=\"322\" y=\"44\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"66\" class=\"svsub\">always</text>\n            <rect x=\"588\" y=\"44\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"60\" class=\"svlabel\" font-size=\"10.5\">Confirmation + the reminder set</text><text x=\"602\" y=\"74\" class=\"svmute\" font-size=\"9\">T\u221224h \u00b7 T\u22121h \u00b7 live \u00b7 replay at +24h</text>\n\n            <rect x=\"16\" y=\"116\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"132\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">2 \u00b7 A lead form is submitted</text><text x=\"30\" y=\"146\" class=\"svmute\" font-size=\"9\">from a social event page</text>\n            <rect x=\"322\" y=\"116\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"132\" class=\"svsub\">not already registered</text><text x=\"336\" y=\"145\" class=\"svmute\" font-size=\"9\">dedupe on email</text>\n            <rect x=\"588\" y=\"116\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"132\" class=\"svlabel\" font-size=\"10.5\">Register them \u00b7 create the contact</text><text x=\"602\" y=\"146\" class=\"svmute\" font-size=\"9\">\u00b7 calendar hold \u00b7 log the row</text>\n\n            <rect x=\"16\" y=\"188\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"204\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">3 \u00b7 Your own page posts a form</text><text x=\"30\" y=\"218\" class=\"svmute\" font-size=\"9\">the branded funnel page</text>\n            <rect x=\"322\" y=\"188\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"204\" class=\"svsub\">passes validation</text><text x=\"336\" y=\"217\" class=\"svmute\" font-size=\"9\">server-side, never trust the browser</text>\n            <rect x=\"588\" y=\"188\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"204\" class=\"svlabel\" font-size=\"10.5\">Same three writes, then redirect</text><text x=\"602\" y=\"218\" class=\"svmute\" font-size=\"9\">to the thank-you page</text>\n\n            <rect x=\"16\" y=\"260\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"276\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">4 \u00b7 A behavioural event fires</text><text x=\"30\" y=\"290\" class=\"svmute\" font-size=\"9\">joined live \u00b7 watched replay \u00b7 no-show \u00b7 voted</text>\n            <rect x=\"322\" y=\"260\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"276\" class=\"svsub\">route by event type</text><text x=\"336\" y=\"289\" class=\"svmute\" font-size=\"9\">bulk imports skip the sheet write</text>\n            <rect x=\"588\" y=\"260\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"276\" class=\"svlabel\" font-size=\"10.5\">Apply the tag \u00b7 update the row</text><text x=\"602\" y=\"290\" class=\"svmute\" font-size=\"9\">this is what the four tags are for</text>\n\n            <rect x=\"16\" y=\"332\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"348\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">5 \u00b7 You run the outreach import</text><text x=\"30\" y=\"362\" class=\"svmute\" font-size=\"9\">manual, from your outreach sheet</text>\n            <rect x=\"322\" y=\"332\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"348\" class=\"svsub\">contact exists?</text><text x=\"336\" y=\"361\" class=\"svmute\" font-size=\"9\">update if yes, create if no</text>\n            <rect x=\"588\" y=\"332\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"348\" class=\"svlabel\" font-size=\"10.5\">Write back status + contact id</text><text x=\"602\" y=\"362\" class=\"svmute\" font-size=\"9\">so the sheet never double-sends</text>\n\n            <rect x=\"16\" y=\"404\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"420\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">6 \u00b7 A tag is added to a contact</text><text x=\"30\" y=\"434\" class=\"svmute\" font-size=\"9\">or an appointment is confirmed</text>\n            <rect x=\"322\" y=\"404\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"420\" class=\"svsub\">match tag \u2192 stage</text><text x=\"336\" y=\"433\" class=\"svmute\" font-size=\"9\">remove the trigger tag after</text>\n            <rect x=\"588\" y=\"404\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"420\" class=\"svlabel\" font-size=\"10.5\">Move the pipeline stage</text><text x=\"602\" y=\"434\" class=\"svmute\" font-size=\"9\">removing the tag prevents re-firing</text>\n\n            <rect x=\"16\" y=\"476\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--amber-bg)\"/><text x=\"30\" y=\"492\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">7 \u00b7 Inbox poll \u00b7 every 60 seconds</text><text x=\"30\" y=\"506\" class=\"svmute\" font-size=\"9\">replies and delivery failures</text>\n            <rect x=\"322\" y=\"476\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"492\" class=\"svsub\">parse: accepted / declined /</text><text x=\"336\" y=\"505\" class=\"svsub\" font-size=\"9.5\">tentative / bounced</text>\n            <rect x=\"588\" y=\"476\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"492\" class=\"svlabel\" font-size=\"10.5\">Set reply status \u00b7 flag bounces</text><text x=\"602\" y=\"506\" class=\"svmute\" font-size=\"9\">a bounce you don't record gets re-sent</text>\n\n            <rect x=\"16\" y=\"548\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--amber-bg)\"/><text x=\"30\" y=\"564\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">8 \u00b7 Scheduler \u00b7 every 5 minutes</text><text x=\"30\" y=\"578\" class=\"svmute\" font-size=\"9\">compares now against event time</text>\n            <rect x=\"322\" y=\"548\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"564\" class=\"svsub\">\u00b13 min window \u00b7 not yet tagged sent</text><text x=\"336\" y=\"577\" class=\"svmute\" font-size=\"9\">24h \u00b7 1h \u00b7 15m \u00b7 live \u00b7 +1/2/3 days</text>\n            <rect x=\"588\" y=\"548\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"564\" class=\"svlabel\" font-size=\"10.5\">Tag the contact \u2192 messaging sends</text><text x=\"602\" y=\"578\" class=\"svmute\" font-size=\"9\">wait-nodes between sends, or you get flagged</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Fill the register</div><div class=\"ab\">Claude Code lists each automation's trigger, action, tool and honest status. Route A: GoHighLevel workflows. Route B: Cloudflare Workers.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Point Tantra's webhooks</div><div class=\"ab\">RSVP, reply, bounce and unsubscribe events go to your workflow or Worker, so every response lands on the contact.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Test 1, 3 and 4 with real contacts</div><div class=\"ab\">Register yourself and attend; register a second address and don't show. Claude Code reads both back and confirms every tag and stage.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Automations 7 and 8 run on a schedule, because inboxes and clocks send no webhooks. Proof: the no-show contact gets its tag without you touching anything.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Check Every Automation Fires</span><span class=\"fbar\"><i style=\"width:33.3%\"></i></span><span class=\"pg num\">123<i> / 158</i></span></div></div>"},

 {day:"Day 3",section:"Day 3 \u00b7 task 3.6",title:"Read the Dashboard and Find the Worst Step",html:"<div class=\"slide\" data-i=\"133\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 task 3.6</span><span class=\"sp\"></span><span class=\"step num\">26 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Task 3.6 \u00b7 the worst step</div><div class=\"h2\" style=\"font-size:2.6cqw\">Read the Dashboard and Find the Worst Step</div><div class=\"matrix fill\" style=\"grid-template-columns:minmax(0,.85fr) repeat(2,minmax(0,1fr))\"><div class=\"mc head\"></div><div class=\"mc head\"><b>Usually means</b></div><div class=\"mc head\"><b>Swap this</b></div><div class=\"mc rowh\"><b>Sends go out, few visits</b></div><div class=\"mc\"><span>Wrong list or weak hook: a traffic problem.</span></div><div class=\"mc\"><span>The outreach template in Tantra, or the list.</span></div><div class=\"mc rowh\"><b>Visits, few registrations</b></div><div class=\"mc\"><span>The page isn't earning the click.</span></div><div class=\"mc\"><span>The landing page headline and hero.</span></div><div class=\"mc rowh\"><b>Registrations, low show rate</b></div><div class=\"mc\"><span>Reminders aren't landing.</span></div><div class=\"mc\"><span>One reminder template, or its timing.</span></div><div class=\"mc rowh\"><b>Attendees, few CTA clicks</b></div><div class=\"mc\"><span>The offer isn't landing.</span></div><div class=\"mc\"><span>The offer slide and the CTA.</span></div><div class=\"mc rowh\"><b>CTA clicks, few calls or sales</b></div><div class=\"mc\"><span>Friction after the click.</span></div><div class=\"mc\"><span>The booking page or the follow-up email.</span></div><div class=\"mc rowh\"><b>One channel's cost per buyer is high</b></div><div class=\"mc\"><span>The funnel is fine; that channel's traffic isn't.</span></div><div class=\"mc\"><span>Move budget to the cheapest channel.</span></div></div><div class=\"foot\">Read five numbers when the run finishes: registration rate, show rate, CTA click rate, buyers and cost per buyer. The lowest rate, or the one that dropped, is the worst step. Name one, not three.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Read the Dashboard and Find the Worst Step</span><span class=\"fbar\"><i style=\"width:57.8%\"></i></span><span class=\"pg num\">134<i> / 158</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Which step do you expect to be your worst?",html:"<div class=\"slide\" data-i=\"134\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">27 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 5 of 8</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which step do you expect to be your worst?</div><div class=\"qopts\" style=\"--oc:2;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Sends go out, few visits</span></span><span class=\"qopt\"><i>B</i><span>Visits, few registrations</span></span><span class=\"qopt\"><i>C</i><span>Registrations, low show rate</span></span><span class=\"qopt\"><i>D</i><span>Attendees, few CTA clicks</span></span><span class=\"qopt\"><i>E</i><span>CTA clicks, few calls or sales</span></span><span class=\"qopt\"><i>F</i><span>One channel's cost per buyer is high</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One step</u><span>Not three.</span></div><div class=\"qc\"><u>A reason</u><span>Why you expect it.</span></div><div class=\"qc\"><u>The swap</u><span>Which page or template changes.</span></div></div><div class=\"foot\"><b>Why this one:</b> Your guess now; the dashboard decides after the test run. The table names the swap.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which step do you expect to be your worst?</span><span class=\"fbar\"><i style=\"width:60.0%\"></i></span><span class=\"pg num\">135<i> / 158</i></span></div></div>"},
 {day:"Day 3",section:"Q5 \u00b7 B2B SaaS",title:"SendFlow Answers Q5",html:"<div class=\"slide\" data-i=\"135\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q5 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">28 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which step do you expect to be your worst?</p></div><div class=\"answer\"><u>How they answer it</u><p>Sends go out, few visits: the list or the hook is wrong, so the cold email template gets swapped first.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The cold email template gets swapped first.</span></div><div class=\"w\"><i>2</i><span>It is a traffic problem, not a funnel one.</span></div><div class=\"w\"><i>3</i><span>The guess is <b>checked against the run</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A new list is the biggest unknown.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow Answers Q5</span><span class=\"fbar\"><i style=\"width:62.2%\"></i></span><span class=\"pg num\">136<i> / 158</i></span></div></div>"},
 {day:"Day 3",section:"Q5 \u00b7 B2B consulting brand",title:"Apex Growth Answers Q5",html:"<div class=\"slide\" data-i=\"136\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q5 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">29 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which step do you expect to be your worst?</p></div><div class=\"answer\"><u>How they answer it</u><p>Attendees, few CTA clicks: partners enjoy the session and don't book. Swap the offer slide.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The offer slide is the swap.</span></div><div class=\"w\"><i>2</i><span>The rate is attendee to CTA click.</span></div><div class=\"w\"><i>3</i><span>It points at <b>one slide</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Partners enjoy the session and do not book.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth Answers Q5</span><span class=\"fbar\"><i style=\"width:64.4%\"></i></span><span class=\"pg num\">137<i> / 158</i></span></div></div>"},
 {day:"Day 3",section:"Q5 \u00b7 Solopreneur",title:"Sarah Chen Answers Q5",html:"<div class=\"slide\" data-i=\"137\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q5 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">30 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 5</u><p>Which step do you expect to be your worst?</p></div><div class=\"answer\"><u>How they answer it</u><p>Visits, few registrations: people read Part 1 and leave before the opt-in. Move the bridge earlier.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The bridge moves earlier.</span></div><div class=\"w\"><i>2</i><span>Depth events show where they leave.</span></div><div class=\"w\"><i>3</i><span>One change, <b>one rate to read</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Readers leave Part 1 before the bridge.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen Answers Q5</span><span class=\"fbar\"><i style=\"width:66.7%\"></i></span><span class=\"pg num\">138<i> / 158</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 task 3.7",title:"Swap One Thing, Keep the Winner",html:"<div class=\"slide\" data-i=\"138\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 task 3.7</span><span class=\"sp\"></span><span class=\"step num\">31 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Task 3.7 \u00b7 the loop</div><div class=\"h2\" style=\"font-size:2.35cqw\">Swap One Thing, Read the Dashboard, Keep the Winner</div><div class=\"viz\"><svg viewBox=\"0 22 860 410\" role=\"img\" aria-label=\"The weekly optimisation loop drawn as a ring of six steps: observe, locate, hypothesise, experiment, measure, and keep or revert, with the ring returning to observe. Side panels list the daily, weekly, monthly and quarterly cadence and the four signs the loop is working.\">\n          <defs>\n            <marker id=\"LOOP_l1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <circle cx=\"262\" cy=\"232\" r=\"150\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"7 9\" class=\"flowline\" opacity=\".5\"/>\n          <g font-size=\"10.5\">\n            <circle cx=\"262\" cy=\"82\" r=\"46\" fill=\"var(--accent)\"/><text x=\"262\" y=\"78\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">OBSERVE</text><text x=\"262\" y=\"94\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"9\">read the dashboard</text>\n            <circle cx=\"392\" cy=\"157\" r=\"46\" fill=\"var(--accent-2)\"/><text x=\"392\" y=\"153\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">LOCATE</text><text x=\"392\" y=\"169\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">the single worst step</text>\n            <circle cx=\"392\" cy=\"307\" r=\"46\" fill=\"var(--accent-2)\"/><text x=\"392\" y=\"299\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">HYPOTH-</text><text x=\"392\" y=\"313\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">ESISE</text><text x=\"392\" y=\"329\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">one reason, one fix</text>\n            <circle cx=\"262\" cy=\"382\" r=\"46\" fill=\"var(--accent-2)\"/><text x=\"262\" y=\"378\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">EXPERIMENT</text><text x=\"262\" y=\"394\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">50 / 50, one change</text>\n            <circle cx=\"132\" cy=\"307\" r=\"46\" fill=\"var(--accent-2)\"/><text x=\"132\" y=\"303\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">MEASURE</text><text x=\"132\" y=\"319\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">wait for a real sample</text>\n            <circle cx=\"132\" cy=\"157\" r=\"46\" fill=\"#0f9e75\"/><text x=\"132\" y=\"150\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11\">KEEP OR</text><text x=\"132\" y=\"164\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11\">REVERT</text><text x=\"132\" y=\"180\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"9\">then log it</text>\n          </g>\n          <text x=\"262\" y=\"226\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"12\">ONE LAP</text>\n          <text x=\"262\" y=\"244\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10.5\">per week</text>\n          <rect x=\"452\" y=\"40\" width=\"392\" height=\"184\" rx=\"12\" class=\"node\"/>\n          <text x=\"472\" y=\"66\" class=\"svlabel\" font-size=\"11.5\">THE CADENCE</text>\n          <g font-size=\"10\">\n            <text x=\"472\" y=\"90\" class=\"svsub\" font-size=\"10.5\">Daily \u00b7 automated</text><text x=\"472\" y=\"106\" class=\"svmute\">refresh the dashboard; alert if a step rate falls sharply</text>\n            <text x=\"472\" y=\"124\" class=\"svsub\" font-size=\"10.5\">Weekly \u00b7 you and the agent</text><text x=\"472\" y=\"140\" class=\"svmute\">confirm the bottleneck, launch one experiment, read last week's</text>\n            <text x=\"472\" y=\"158\" class=\"svsub\" font-size=\"10.5\">Monthly</text><text x=\"472\" y=\"174\" class=\"svmute\">re-pull spend, rebalance budget, retire losing variants</text>\n            <text x=\"472\" y=\"192\" class=\"svsub\" font-size=\"10.5\">Quarterly</text><text x=\"472\" y=\"208\" class=\"svmute\">revisit the offer and persona: still the right ones?</text>\n          </g>\n          <rect x=\"452\" y=\"240\" width=\"392\" height=\"184\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"472\" y=\"266\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11.5\">YOU'RE DOING IT RIGHT WHEN</text>\n          <g font-size=\"10.5\" class=\"svsub\">\n            <text x=\"472\" y=\"292\">\u00b7 Every step rate is fetched, never guessed</text>\n            <text x=\"472\" y=\"316\">\u00b7 You know today's bottleneck without thinking</text>\n            <text x=\"472\" y=\"340\">\u00b7 Every buyer maps to a channel, and budget</text>\n            <text x=\"486\" y=\"356\">follows cost-per-buyer, not cost-per-click</text>\n            <text x=\"472\" y=\"380\">\u00b7 Exactly one experiment runs per leak</text>\n            <text x=\"472\" y=\"404\">\u00b7 This month's worst step beats last month's</text>\n          </g>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">One variant of the named element</div><div class=\"cb\">Claude Code drafts it: a second landing page, or a second version of the Tantra step template.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Split the next run in half</div><div class=\"cb\">Each half carries its own utm_content, so the dashboard counts A and B separately. A gap of a handful of people means run it again.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Keep the winner, log it</div><div class=\"cb\">Revert the loser in the spec. Log the change, the date, the metric you expected to move and the result.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Claude Code can refresh the dashboard, flag the worst step and propose a variant before the review. You decide what ships. Put the review in your calendar as a recurring event.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Swap One Thing, Keep the Winner</span><span class=\"fbar\"><i style=\"width:68.9%\"></i></span><span class=\"pg num\">139<i> / 158</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Your first experiment: what you swap, the number that decides the winner, and when you read it.",html:"<div class=\"slide\" data-i=\"139\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">32 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 6 of 8</span><span class=\"qk\">Short answer \u00b7 15+ words</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your first experiment: what you swap, the number that decides the winner, and when you read it.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 3</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One swap</u><span>A page or a template, not both.</span></div><div class=\"qc\"><u>One number</u><span>The rate that decides the winner.</span></div><div class=\"qc\"><u>A read date</u><span>After the run finishes.</span></div></div><div class=\"foot\"><b>Why this one:</b> One swap per run, judged on the dashboard, is how the funnel improves without guessing.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your first experiment: what you swap, the number that decides the winner, and when you read it.</span><span class=\"fbar\"><i style=\"width:71.1%\"></i></span><span class=\"pg num\">140<i> / 158</i></span></div></div>"},
 {day:"Day 3",section:"Q6 \u00b7 B2B SaaS",title:"SendFlow Answers Q6",html:"<div class=\"slide\" data-i=\"140\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q6 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">33 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 6</u><p>Your first experiment: what you swap, the number that decides the winner, and when you read it.</p></div><div class=\"answer\"><u>How they answer it</u><p>The cold email opening line. Variant B names the objection. Send to visit rate decides it. Read after 500 sends, on the Monday warm-up ends.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Send to visit is the rate the swap should move.</span></div><div class=\"w\"><i>2</i><span>500 sends is big enough to read.</span></div><div class=\"w\"><i>3</i><span>The read date is <b>after the run</b>, not during it.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Variant B names the objection.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow Answers Q6</span><span class=\"fbar\"><i style=\"width:73.3%\"></i></span><span class=\"pg num\">141<i> / 158</i></span></div></div>"},
 {day:"Day 3",section:"Q6 \u00b7 B2B consulting brand",title:"Apex Growth Answers Q6",html:"<div class=\"slide\" data-i=\"141\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q6 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">34 / 45</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 6</u><p>Your first experiment: what you swap, the number that decides the winner, and when you read it.</p></div><div class=\"answer\"><u>How they answer it</u><p>The offer slide. Variant B offers a 20-minute pipeline review instead of a strategy call. Attendee to CTA click decides it. Read the day after the session.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Attendee to CTA click is the rate.</span></div><div class=\"w\"><i>2</i><span>Read the day after the session.</span></div><div class=\"w\"><i>3</i><span>Everything else in the session <b>stays the same</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A smaller ask than a strategy call.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth Answers Q6</span><span class=\"fbar\"><i style=\"width:75.6%\"></i></span><span class=\"pg num\">142<i> / 158</i></span></div></div>"},

<script>
// theme ---------------------------------------------------------------------
const stTheme=localStorage.getItem("tantra-theme");
if(stTheme)document.documentElement.dataset.theme=stTheme;
document.getElementById("theme").onclick=()=>{
  const n=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=n;localStorage.setItem("tantra-theme",n);
};

const stage=document.getElementById("stage");
const TOTAL=SLIDES.length;

// day filter ----------------------------------------------------------------
// One master deck, narrowed to a day for live delivery. The page number on the
// slide stays GLOBAL; renumbering per filter would mean the number on screen
// disagreed with the number in the handout.
let filter="all";
function inFilter(i){return filter==="all"||SLIDES[i].day===filter}
function filtered(){const o=[];for(let i=0;i<TOTAL;i++)if(inFilter(i))o.push(i);return o}

let cur=0;

function mount(i){
  stage.innerHTML=SLIDES[i].html;
  const el=stage.firstElementChild;
  if(el)requestAnimationFrame(()=>el.classList.add("on"));
}

function show(i){
  cur=Math.max(0,Math.min(TOTAL-1,i));
  mount(cur);
  const f=filtered(), at=f.indexOf(cur);
  document.getElementById("count").innerHTML=
    `<b>${cur+1}</b> / ${TOTAL}` + (filter==="all"?"":` &nbsp;·&nbsp; ${at<0?"-":at+1} of ${f.length} in ${filter}`);
  document.getElementById("progf").style.width=((cur+1)/TOTAL*100)+"%";
  [...document.querySelectorAll(".ovc")].forEach(c=>c.classList.toggle("now",+c.dataset.i===cur));
  location.hash=cur;
}

// Navigation respects the filter: on Day 2, Next stops at the end of Day 2
// rather than sliding silently into Day 3 mid-session.
function step(d){
  const f=filtered();
  if(!f.length)return;
  let at=f.indexOf(cur);
  if(at<0){                       // current slide is outside the filter
    at=d>0?-1:f.length;
    for(let k=0;k<f.length;k++){ if(f[k]>cur){at=d>0?k-1:k;break;} }
  }
  const nx=Math.max(0,Math.min(f.length-1,at+d));
  show(f[nx]);
}

function setFilter(v){
  filter=v;
  [...document.querySelectorAll(".filters button")].forEach(b=>b.classList.toggle("on",b.dataset.f===v));
  const f=filtered();
  if(f.length&&!inFilter(cur))show(f[0]);else show(cur);
}
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>setFilter(b.dataset.f));

// overview ------------------------------------------------------------------
const ov=document.getElementById("ov");
(function buildOverview(){
  let h="",lastDay=null;
  for(let i=0;i<TOTAL;i++){
    const s=SLIDES[i];
    if(s.day!==lastDay){
      if(lastDay!==null)h+="</div>";
      h+=`<div class="ovsec">${s.day}</div><div class="ovgrid">`;
      lastDay=s.day;
    }
    h+=`<div class="ovc" data-i="${i}"><u>${s.section}<s>${String(i+1).padStart(3,"0")}</s></u><b>${s.title}</b></div>`;
  }
  h+="</div>";
  document.getElementById("ovbody").innerHTML=h;
  document.querySelectorAll(".ovc").forEach(c=>c.onclick=()=>{toggleOv(false);show(+c.dataset.i)});
})();
function toggleOv(on){ov.classList.toggle("on",on===undefined?!ov.classList.contains("on"):on)}
document.getElementById("ovbtn").onclick=()=>toggleOv();

// input ---------------------------------------------------------------------
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.getElementById("progwrap").onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  show(Math.round((e.clientX-r.left)/r.width*(TOTAL-1)));
};
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();step(1)}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();step(-1)}
  if(e.key==="Home")show(0);
  if(e.key==="End")show(TOTAL-1);
  if(e.key==="o"||e.key==="O")toggleOv();
  if(e.key==="Escape")toggleOv(false);
});

// Two link shapes jump into the deck. A pasted "#77" is how one person sends
// another a single slide out of 230. A "#day-2" from the command centre opens
// the first slide of that day. Both need this handler: changing the hash never
// reloads the page, so without it the link silently does nothing.
function slideFromHash(){
  const raw=(location.hash.slice(1)||"").trim();
  const dm=/^day-?(\d+)$/i.exec(raw);
  if(dm){const want="Day "+dm[1];for(let i=0;i<TOTAL;i++)if(SLIDES[i].day===want)return i;return null;}
  const h=parseInt(raw);
  return Number.isFinite(h)?h:null;
}
addEventListener("hashchange",()=>{
  const t=slideFromHash();
  if(t!==null&&t!==cur)show(t);
});

const t0=slideFromHash();
show(t0===null?0:t0);
</script>
