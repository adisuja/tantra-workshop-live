 {day:"Day 2",section:"Q4 \u00b7 B2B SaaS",title:"SendFlow answers Q4",html:"<div class=\"slide\" data-i=\"112\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q4 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">28 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which channels can you actually send your reminders on?</p></div><div class=\"answer\"><u>How they answer it</u><p>Email \u00b7 WhatsApp \u00b7 SMS \u2014 we practise what we sell, so this doubles as a demo.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Three channels, all already operated in-house, so nothing new has to be learned this week.</span></div><div class=\"w\"><i>2</i><span>Running them doubles as a <b>working demonstration</b> of the product being sold.</span></div><div class=\"w\"><i>3</i><span>SMS is viable because their buyer expects operational messages from a sales tool.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Using their own reminder stack as a live demo is a genuine multiplier \u2014 the prospect experiences the product before the offer slide.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q4</span><span class=\"fbar\"><i style=\"width:41.2%\"></i></span><span class=\"pg num\">113<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q4 \u00b7 B2B consulting brand",title:"Apex Growth answers Q4",html:"<div class=\"slide\" data-i=\"113\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q4 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">29 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which channels can you actually send your reminders on?</p></div><div class=\"answer\"><u>How they answer it</u><p>Email \u00b7 WhatsApp \u2014 no SMS, wrong register for partners at this seniority.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Two channels, chosen to match how senior partners actually accept messages.</span></div><div class=\"w\"><i>2</i><span>SMS is excluded as the <b>wrong register</b> for this buyer, not because it is hard.</span></div><div class=\"w\"><i>3</i><span>WhatsApp carries the urgent touches \u2014 T\u22121h and T\u221215m \u2014 where email is too slow.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Cutting SMS on register grounds is the same discipline as cutting cold email. Consistency about who you are is worth more than one extra touchpoint.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q4</span><span class=\"fbar\"><i style=\"width:42.6%\"></i></span><span class=\"pg num\">114<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q4 \u00b7 Solopreneur",title:"Sarah Chen answers Q4",html:"<div class=\"slide\" data-i=\"114\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q4 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">30 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which channels can you actually send your reminders on?</p></div><div class=\"answer\"><u>How they answer it</u><p>Email \u2014 four touches, not six. Better to ship four that work than six I can't maintain.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>One channel and four touches, sized to what one person can sustain indefinitely.</span></div><div class=\"w\"><i>2</i><span>She names the trade-off explicitly rather than aspiring to the full six.</span></div><div class=\"w\"><i>3</i><span>The T\u221224h touch is kept, because it is the one with the <b>largest effect on show-up</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Four touches she maintains beats six she abandons in week three. The honest capacity answer is almost always the higher-converting one over a quarter.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q4</span><span class=\"fbar\"><i style=\"width:44.1%\"></i></span><span class=\"pg num\">115<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Your turn",title:"Your run of show: where does the offer land, and who owns each of the five roles?",html:"<div class=\"slide\" data-i=\"115\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">31 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 5 of 13</span><span class=\"qk\">Long answer \u00b7 25+ words</span><span class=\"qtime\">\u23f1 6 min</span><span class=\"qtime\">Day 2 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your run of show: where does the offer land, and who owns each of the five roles?</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 2</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Offer has a minute</u><span>A time on the clock, decided now, not felt on the day.</span></div><div class=\"qc\"><u>Five named roles</u><span>Host, tech, chat, content moderator, DMs \u2014 with real names.</span></div><div class=\"qc\"><u>A rehearsal</u><span>A tech run before the day. This is the step people skip and regret.</span></div></div><div class=\"foot\"><b>Why this one:</b> A role with nobody's name on it is a role nobody does. Name actual people \u2014 and put the offer where the structure says it goes, not where it feels comfortable.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your run of show: where does the offer land, and who owns each of the five roles?</span><span class=\"fbar\"><i style=\"width:45.6%\"></i></span><span class=\"pg num\">116<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q5 \u00b7 B2B SaaS",title:"SendFlow answers Q5",html:"<div class=\"slide\" data-i=\"116\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q5 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">32 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 5</u><p>Your run of show: where does the offer land, and who owns each of the five roles?</p></div><div class=\"answer\"><u>How they answer it</u><p>Offer at 45 and repeated in chat every 5 minutes. Host our founder; tech and chat our two SDRs; content moderator our head of growth.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Offer at minute 45 of a 60-minute session, after the content has earned it.</span></div><div class=\"w\"><i>2</i><span>The CTA is <b>reposted in chat every five minutes</b>, not stated once from the stage.</span></div><div class=\"w\"><i>3</i><span>Five roles across four people, which is the minimum for a session that does not drop questions.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Repeating the CTA in chat every five minutes is the detail most teams miss \u2014 attendees arrive late and leave early, so a single mention reaches only part of the room.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q5</span><span class=\"fbar\"><i style=\"width:47.1%\"></i></span><span class=\"pg num\">117<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q5 \u00b7 B2B consulting brand",title:"Apex Growth answers Q5",html:"<div class=\"slide\" data-i=\"117\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q5 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">33 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 5</u><p>Your run of show: where does the offer land, and who owns each of the five roles?</p></div><div class=\"answer\"><u>How they answer it</u><p>Offer at minute 48, after the third proof block. Host me; content moderator and chat both my ops lead; tech my VA; DMs my associate.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The offer lands after the third proof block \u2014 sequenced by content, not by timer.</span></div><div class=\"w\"><i>2</i><span>Every role has a named person, including the DMs role most teams forget entirely.</span></div><div class=\"w\"><i>3</i><span>Minute 48 leaves a full <b>12 minutes of Q&A</b>, where the close actually happens at this ticket.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Placing the offer after the third proof block ties the pitch to evidence rather than to the clock. At a five-figure ticket that ordering is worth more than the extra three minutes.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q5</span><span class=\"fbar\"><i style=\"width:48.5%\"></i></span><span class=\"pg num\">118<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q5 \u00b7 Solopreneur",title:"Sarah Chen answers Q5",html:"<div class=\"slide\" data-i=\"118\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q5 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">34 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 5</u><p>Your run of show: where does the offer land, and who owns each of the five roles?</p></div><div class=\"answer\"><u>How they answer it</u><p>Offer at 45. I'm doing all five roles, which I know is wrong, so I'm pre-recording the polls and keeping chat closed until Q&amp;A.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>She states plainly that one person covering five roles is wrong, rather than hiding it.</span></div><div class=\"w\"><i>2</i><span>Pre-recording the polls removes the highest-risk live task from her hands.</span></div><div class=\"w\"><i>3</i><span>Closing chat until Q&A is a <b>deliberate trade</b>: less interaction, zero dropped messages.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Naming the constraint honestly \u2014 one person, five roles \u2014 and then engineering around it with pre-recorded polls is a better answer than pretending the roles are covered.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q5</span><span class=\"fbar\"><i style=\"width:50.0%\"></i></span><span class=\"pg num\">119<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Your turn",title:"Which link of your close chain is missing?",html:"<div class=\"slide\" data-i=\"119\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">35 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 6 of 13</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 2 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which link of your close chain is missing?</div><div class=\"qopts\" style=\"--oc:3;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Booking page with qualification fields</span></span><span class=\"qopt\"><i>B</i><span>Reminders on booked calls</span></span><span class=\"qopt\"><i>C</i><span>Scripts &amp; objection battlecards</span></span><span class=\"qopt\"><i>D</i><span>Proposal template</span></span><span class=\"qopt\"><i>E</i><span>Checkout</span></span><span class=\"qopt\"><i>F</i><span>Onboarding sequence after payment</span></span><span class=\"qopt\"><i>G</i><span>Nothing \u2014 it's all built</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One link</u><span>The first one that breaks, not every gap you can think of.</span></div><div class=\"qc\"><u>Be honest</u><span>The embarrassing answer is the valuable one.</span></div><div class=\"qc\"><u>Costed</u><span>Roughly what it leaks per month \u2014 that's how it gets prioritised.</span></div></div><div class=\"foot\"><b>Why this one:</b> Be honest about this one. The missing link is where your revenue is leaking right now, and it is usually the cheapest thing in the chain to fix.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which link of your close chain is missing?</span><span class=\"fbar\"><i style=\"width:51.5%\"></i></span><span class=\"pg num\">120<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q6 \u00b7 B2B SaaS",title:"SendFlow answers Q6",html:"<div class=\"slide\" data-i=\"120\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q6 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">36 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 6</u><p>Which link of your close chain is missing?</p></div><div class=\"answer\"><u>How they answer it</u><p>Proposal template \u2014 we send and then just hope. No watchdog at all.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The proposal goes out with no follow-up scheduled \u2014 no watchdog at any interval.</span></div><div class=\"w\"><i>2</i><span>This leaks at the <b>most expensive point</b> in the funnel, after all acquisition cost is spent.</span></div><div class=\"w\"><i>3</i><span>A fix is one automation: a timed check that fires if no response lands within N days.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cSend and hope\u201d is the most common leak in the whole chain, and the only one where a single scheduled follow-up recovers revenue that is already won.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q6</span><span class=\"fbar\"><i style=\"width:52.9%\"></i></span><span class=\"pg num\">121<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q6 \u00b7 B2B consulting brand",title:"Apex Growth answers Q6",html:"<div class=\"slide\" data-i=\"121\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q6 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">37 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 6</u><p>Which link of your close chain is missing?</p></div><div class=\"answer\"><u>How they answer it</u><p>Reminders on booked calls \u2014 embarrassing, because it's the cheapest one to fix.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Booked calls have no reminders, so no-shows are absorbed rather than prevented.</span></div><div class=\"w\"><i>2</i><span>They name it as embarrassing, which is the right instinct \u2014 the <b>cheapest fix is usually the open one</b>.</span></div><div class=\"w\"><i>3</i><span>At \u00a312k a recovered no-show pays for the entire automation many times over.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Booking reminders are the cheapest link to fix and among the highest-yield, which is exactly why the honest answer here is worth more than a sophisticated one.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q6</span><span class=\"fbar\"><i style=\"width:54.4%\"></i></span><span class=\"pg num\">122<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q6 \u00b7 Solopreneur",title:"Sarah Chen answers Q6",html:"<div class=\"slide\" data-i=\"122\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q6 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">38 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 6</u><p>Which link of your close chain is missing?</p></div><div class=\"answer\"><u>How they answer it</u><p>Proposal template \u2014 I write each one from scratch and it costs me half a day.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Writing every proposal from scratch costs roughly half a day of unbilled time.</span></div><div class=\"w\"><i>2</i><span>For a one-person business this is a <b>capacity leak</b>, not just a conversion one.</span></div><div class=\"w\"><i>3</i><span>A template plus the Day 1 offer block makes this a one-hour fix, once.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Half a day per proposal is a margin problem disguised as an admin problem. Templating it converts unpaid hours directly into capacity.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q6</span><span class=\"fbar\"><i style=\"width:55.9%\"></i></span><span class=\"pg num\">123<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Your turn",title:"Who works each stage of your pipeline?",html:"<div class=\"slide\" data-i=\"123\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">39 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 7 of 13</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 2 \u00b7 answer on your own screen</span></div><div class=\"qq\">Who works each stage of your pipeline?</div><div class=\"qopts\" style=\"--oc:2;max-height:22cqh\"><span class=\"qopt\"><i>A</i><span>Just me \u2014 every stage</span></span><span class=\"qopt\"><i>B</i><span>Me plus one helper (setter or assistant)</span></span><span class=\"qopt\"><i>C</i><span>Setter \u00b7 closer \u00b7 coordinator \u2014 three people</span></span><span class=\"qopt\"><i>D</i><span>An AI agent drafts, a human approves every touch</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Roles, not heads</u><span>Setter, closer and coordinator \u2014 say who plays each, even if it is you three times.</span></div><div class=\"qc\"><u>Honest</u><span>Pick what you actually have this month, not the team you plan to hire.</span></div><div class=\"qc\"><u>Drives the build</u><span>Just you means every follow-up must fire on its own.</span></div></div><div class=\"foot\"><b>Why this one:</b> Every stage needs an owner, even when one person owns them all. An unowned stage is where a lead waits until it goes cold.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Who works each stage of your pipeline?</span><span class=\"fbar\"><i style=\"width:57.4%\"></i></span><span class=\"pg num\">124<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q7 \u00b7 B2B SaaS",title:"SendFlow answers Q7",html:"<div class=\"slide\" data-i=\"124\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q7 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">40 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 7</u><p>Who works each stage of your pipeline?</p></div><div class=\"answer\"><u>How they answer it</u><p>Setter \u00b7 closer \u00b7 coordinator \u2014 our two SDRs set, the founder closes, RevOps coordinates.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>SDRs set, the founder closes, RevOps keeps the data clean.</span></div><div class=\"w\"><i>2</i><span>The <b>coordinator role</b> is the one most teams skip, and it is the one that keeps stages honest.</span></div><div class=\"w\"><i>3</i><span>Every hand-off is a stage change the CRM can trigger.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Three roles, three people, and a clean hand-off at the booking \u2014 the shape the pipeline was designed for.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q7</span><span class=\"fbar\"><i style=\"width:58.8%\"></i></span><span class=\"pg num\">125<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q7 \u00b7 B2B consulting brand",title:"Apex Growth answers Q7",html:"<div class=\"slide\" data-i=\"125\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q7 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">41 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 7</u><p>Who works each stage of your pipeline?</p></div><div class=\"answer\"><u>How they answer it</u><p>Setter \u00b7 closer \u00b7 coordinator \u2014 a business developer books, a partner closes, our office manager keeps the CRM honest.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A business developer books, a partner closes, the office manager coordinates.</span></div><div class=\"w\"><i>2</i><span>Partner time is spent <b>only on held calls</b>, which is where it earns.</span></div><div class=\"w\"><i>3</i><span>The office manager enforces the six-hour data-fix rule.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A partner-led firm can still separate the roles \u2014 and has to, or partners end up chasing bookings.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q7</span><span class=\"fbar\"><i style=\"width:60.3%\"></i></span><span class=\"pg num\">126<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q7 \u00b7 Solopreneur",title:"Sarah Chen answers Q7",html:"<div class=\"slide\" data-i=\"126\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q7 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">42 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 7</u><p>Who works each stage of your pipeline?</p></div><div class=\"answer\"><u>How they answer it</u><p>Just me, every stage \u2014 which is exactly why it has to fire on its own.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>She owns all eleven stages herself.</span></div><div class=\"w\"><i>2</i><span>Nothing can depend on her <b>remembering</b> \u2014 the pipeline has to move itself.</span></div><div class=\"w\"><i>3</i><span>Her build priority is reminders and recovery, not reporting.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">One person, every stage \u2014 which is the strongest possible argument for automating every follow-up.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q7</span><span class=\"fbar\"><i style=\"width:61.8%\"></i></span><span class=\"pg num\">127<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Your turn",title:"How does your offer close?",html:"<div class=\"slide\" data-i=\"127\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">43 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 8 of 13</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 2 \u00b7 answer on your own screen</span></div><div class=\"qq\">How does your offer close?</div><div class=\"qopts\" style=\"--oc:2;max-height:22cqh\"><span class=\"qopt\"><i>A</i><span>Booked call, always</span></span><span class=\"qopt\"><i>B</i><span>Direct checkout, always</span></span><span class=\"qopt\"><i>C</i><span>Both \u2014 a call above a price, checkout below it</span></span><span class=\"qopt\"><i>D</i><span>Application first, then a call</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One path or two</u><span>Call, checkout, or both split by price.</span></div><div class=\"qc\"><u>Price-aware</u><span>Above roughly a thousand, a page rarely carries the objection alone.</span></div><div class=\"qc\"><u>Matches the offer</u><span>It has to agree with the offer block you wrote on Day 1.</span></div></div><div class=\"foot\"><b>Why this one:</b> How the offer closes decides which stages your pipeline needs \u2014 a checkout skips the whole call chain.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">How does your offer close?</span><span class=\"fbar\"><i style=\"width:63.2%\"></i></span><span class=\"pg num\">128<i> / 230</i></span></div></div>"},

 {day:"Day 3",section:"Day 3 \u00b7 index",title:"Today's session",html:"<div class=\"slide\" data-i=\"154\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 index</span><span class=\"sp\"></span><span class=\"step num\">2 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Session index</div><div class=\"h2\">Two halves \u2014 make it live, then make it improve</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">What you load before you ask</div><div class=\"rs\">The whole difference between a template and your funnel.</div></div><div class=\"rmeta\"><b>4 min</b><span>context</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Part A \u00b7 build, instrument, launch</div><div class=\"rs\">The ritual, eleven events, the pipeline, three automations, real traffic.</div></div><div class=\"rmeta\"><b>26 min</b><span>the build</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Your first six questions</div><div class=\"rs\">Answered live, three ways each.</div></div><div class=\"rmeta\"><b>15 min</b><span>your turn</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Part B \u00b7 read the numbers</div><div class=\"rs\">Unit economics, the worst leak, the weekly lap and the year.</div></div><div class=\"rmeta\"><b>25 min</b><span>the loop</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Your second six questions</div><div class=\"rs\">Economics, the leak, the experiment, ascension and retention.</div></div><div class=\"rmeta\"><b>15 min</b><span>your turn</span></div></div><div class=\"r\"><span class=\"n\">6</span><div style=\"min-width:0\"><div class=\"rt\">The full offer, walked on screen</div><div class=\"rs\">What continues after this week, and exactly what it costs.</div></div><div class=\"rmeta\"><b>10 min</b><span>the close</span></div></div></div><div class=\"bar\"><span class=\"bl\">Tonight</span><span class=\"bt\">Touch nothing. Let the traffic run \u2014 reading numbers after four hours is how people kill things that were working.</span></div><div class=\"foot\">Times are a guide \u2014 questions run long when the room is working, and that is the point.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Today's session</span><span class=\"fbar\"><i style=\"width:2.8%\"></i></span><span class=\"pg num\">155<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 payoff",title:"What you walk out with today",html:"<div class=\"slide\" data-i=\"155\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 payoff</span><span class=\"sp\"></span><span class=\"step num\">3 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Stay to the end because</div><div class=\"h2\">By the end of this session you will have</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">A funnel at a real URL</div><div class=\"rs\">Deployed, on a named host, with eleven events firing into two destinations.</div></div><div class=\"rmeta\"><b>Q1\u2013Q2, Q6</b><span>live</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">A pipeline that moves itself</div><div class=\"rs\">Every stage with a trigger, and three automations watched firing on a real contact.</div></div><div class=\"rmeta\"><b>Q3\u2013Q4</b><span>event-driven</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">A test campaign with a stop rule</div><div class=\"rs\">Small budget, one first number, and the threshold at which you halt.</div></div><div class=\"rmeta\"><b>Q5</b><span>launched</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">A ratio, and your single worst step</div><div class=\"rs\">Cost per buyer against lifetime value, both fetched \u2014 and the leak named from the report.</div></div><div class=\"rmeta\"><b>Q7\u2013Q9</b><span>diagnosed</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">One experiment and a weekly review</div><div class=\"rs\">One element, one metric, a rule for calling it \u2014 and thirty minutes in your calendar.</div></div><div class=\"rmeta\"><b>Q10\u2013Q12</b><span>running</span></div></div></div><div class=\"bar\"><span class=\"bl\">Today's traffic is not for sales</span><span class=\"bt\">It is to find out which assumption was wrong while being wrong is still cheap.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">What you walk out with today</span><span class=\"fbar\"><i style=\"width:4.2%\"></i></span><span class=\"pg num\">156<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 context",title:"What you give it before you ask",html:"<div class=\"slide\" data-i=\"156\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 context</span><span class=\"sp\"></span><span class=\"step num\">4 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The whole difference</div><div class=\"h2\">What you load before you ask</div><div class=\"lede\">\u201cBuild me a funnel\u201d gets you a template. Your conversion engine, your spec outline and a build checklist get you <em>your</em> funnel. We use Claude Code as the worked example, but the ritual works in any agentic tool.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Context beats instruction</div><div class=\"cb\">A file describing your actual offer outperforms three paragraphs describing what you want. Supply artefacts, not adjectives.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Say what not to build</div><div class=\"cb\">Constraints shape output more reliably than instructions. A short anti-scope document prevents surface area you would have to maintain.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Make it interview you</div><div class=\"cb\">An agent that restates your spec before building gives you one cheap chance to catch a misunderstanding. One that starts coding gives you an expensive one, later.</div></div></div><div class=\"bar\"><span class=\"bl\">The rule</span><span class=\"bt\">No code until the spec is restated and approved. This is phase three, and it is the whole trick.</span></div><div class=\"foot\">Source: the agentic build ritual, <b>00-START-HERE</b> in the assessment context pack.</div></div><div class=\"sfoot\"><span class=\"ftitle\">What you give it before you ask</span><span class=\"fbar\"><i style=\"width:5.6%\"></i></span><span class=\"pg num\">157<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 step 1",title:"The build ritual, phase by phase",html:"<div class=\"slide\" data-i=\"157\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 step 1</span><span class=\"sp\"></span><span class=\"step num\">5 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 1 \u00b7 the ritual</div><div class=\"h2\" style=\"font-size:2.35cqw\">The phases \u2014 and why it refuses to skip ahead</div><div class=\"viz\"><svg viewBox=\"0 50 860 436\" role=\"img\" aria-label=\"The build ritual as eight phases: load the context, run the interview, author and approve the spec, scaffold and theme, build the funnel core, wire commerce and lifecycle, instrument every step, then quality-assure and deploy. A gate between phase two and three shows that no code is written until the spec is approved. A feedback arrow returns from deploy to the spec.\">\n          <defs>\n            <marker id=\"RITUAL_b1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"RITUAL_b2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.6\" opacity=\".6\" marker-end=\"url(#RITUAL_b1)\">\n            <path d=\"M212 96 L232 96\" class=\"flowline\"/><path d=\"M408 96 L428 96\" class=\"flowline\"/>\n            <path d=\"M604 96 L624 96\" class=\"flowline\"/>\n            <path d=\"M212 268 L232 268\" class=\"flowline\"/><path d=\"M408 268 L428 268\" class=\"flowline\"/>\n            <path d=\"M604 268 L624 268\" class=\"flowline\"/>\n            <path d=\"M740 140 C740 176 120 176 120 220\" class=\"flowline\"/>\n          </g>\n          <g>\n            <rect x=\"16\" y=\"64\" width=\"196\" height=\"64\" rx=\"11\" fill=\"var(--accent-2)\"/>\n            <text x=\"34\" y=\"86\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">1 \u00b7 Load the context</text>\n            <text x=\"34\" y=\"104\" class=\"svmute\" font-size=\"9.5\">conversion engine \u00b7 spec outline</text>\n            <text x=\"34\" y=\"118\" class=\"svmute\" font-size=\"9.5\">\u00b7 build checklist \u00b7 brand assets</text>\n\n            <rect x=\"232\" y=\"64\" width=\"196\" height=\"64\" rx=\"11\" fill=\"var(--accent-2)\"/>\n            <text x=\"250\" y=\"86\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">2 \u00b7 Run the interview</text>\n            <text x=\"250\" y=\"104\" class=\"svmute\" font-size=\"9.5\">the agent asks, you answer.</text>\n            <text x=\"250\" y=\"118\" class=\"svmute\" font-size=\"9.5\">It fills the gaps you left.</text>\n\n            <rect x=\"428\" y=\"64\" width=\"196\" height=\"64\" rx=\"11\" fill=\"var(--accent)\"/>\n            <text x=\"446\" y=\"86\" class=\"svwhite\" font-size=\"11.5\">3 \u00b7 Approve the spec</text>\n            <text x=\"446\" y=\"104\" class=\"svwhite2\" font-size=\"9.5\">it restates everything back.</text>\n            <text x=\"446\" y=\"118\" class=\"svwhite2\" font-size=\"9.5\">Nothing is built until you say yes.</text>\n\n            <rect x=\"624\" y=\"64\" width=\"196\" height=\"64\" rx=\"11\" fill=\"var(--accent-2)\"/>\n            <text x=\"642\" y=\"86\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">4 \u00b7 Scaffold + theme</text>\n            <text x=\"642\" y=\"104\" class=\"svmute\" font-size=\"9.5\">one project, one spec file,</text>\n            <text x=\"642\" y=\"118\" class=\"svmute\" font-size=\"9.5\">brand tokens bound to variables</text>\n\n            <rect x=\"16\" y=\"236\" width=\"196\" height=\"64\" rx=\"11\" fill=\"var(--accent-2)\"/>\n            <text x=\"34\" y=\"258\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">5 \u00b7 Build the core</text>\n            <text x=\"34\" y=\"276\" class=\"svmute\" font-size=\"9.5\">every screen the spec declares,</text>\n            <text x=\"34\" y=\"290\" class=\"svmute\" font-size=\"9\">rendered from the spec, not by hand</text>\n\n            <rect x=\"232\" y=\"236\" width=\"196\" height=\"64\" rx=\"11\" fill=\"var(--accent-2)\"/>\n            <text x=\"250\" y=\"258\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">6 \u00b7 Commerce + lifecycle</text>\n            <text x=\"250\" y=\"276\" class=\"svmute\" font-size=\"9.5\">checkout \u00b7 webhook verified</text>\n            <text x=\"250\" y=\"290\" class=\"svmute\" font-size=\"9.5\">server-side \u00b7 onboarding triggered</text>\n\n            <rect x=\"428\" y=\"236\" width=\"196\" height=\"64\" rx=\"11\" fill=\"#0f9e75\"/>\n            <text x=\"446\" y=\"258\" class=\"svwhite\" font-size=\"11.5\">7 \u00b7 Instrument everything</text>\n            <text x=\"446\" y=\"276\" class=\"svwhite2\" font-size=\"9.5\">one event per step, one source</text>\n            <text x=\"446\" y=\"290\" class=\"svwhite2\" font-size=\"9.5\">per event. No step left dark.</text>\n\n            <rect x=\"624\" y=\"236\" width=\"196\" height=\"64\" rx=\"11\" fill=\"var(--accent-2)\"/>\n            <text x=\"642\" y=\"258\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">8 \u00b7 QA, deploy, hand over</text>\n            <text x=\"642\" y=\"276\" class=\"svmute\" font-size=\"9.5\">375 / 768 / 1280px \u00b7 live URL</text>\n            <text x=\"642\" y=\"290\" class=\"svmute\" font-size=\"9.5\">\u00b7 a one-page operator guide</text>\n          </g>\n          <text x=\"330\" y=\"166\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\u2193 no code is written above this line \u2193</text>\n          <path d=\"M820 268 C844 268 852 300 852 330 L852 344\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-dasharray=\"6 6\" class=\"flowline\"/>\n          <path d=\"M852 344 C852 356 844 362 832 362 L60 362 C40 362 32 356 32 344 L32 320\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-dasharray=\"6 6\" marker-end=\"url(#RITUAL_b2)\" class=\"flowline\"/>\n          <text x=\"440\" y=\"356\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\" style=\"paint-order:stroke;stroke:var(--panel);stroke-width:7px;stroke-linejoin:round\">every later change goes back through the spec \u2014 never straight into the code</text>\n          <rect x=\"16\" y=\"384\" width=\"828\" height=\"88\" rx=\"12\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <text x=\"36\" y=\"408\" class=\"svlabel\" font-size=\"11.5\">THE SIX RULES THE AGENT IS GIVEN UP FRONT</text>\n          <text x=\"36\" y=\"428\" class=\"svmute\" font-size=\"10\">1 \u00b7 Build the funnel core first, traffic second.   2 \u00b7 Traffic is upstream and variable \u2014 it only feeds one URL.</text>\n          <text x=\"36\" y=\"444\" class=\"svmute\" font-size=\"10\">3 \u00b7 Every metric must be real and fetchable \u2014 never model with invented conversion rates.   4 \u00b7 Keep every stage; skip nothing.</text>\n          <text x=\"36\" y=\"460\" class=\"svmute\" font-size=\"10\">5 \u00b7 One spec file drives everything; nothing per-brand is hardcoded.   6 \u00b7 Build the optimisation loop, not just the funnel.</text>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Foundations before features</div><div class=\"cb\">The spec, the theme layer and the primitives come first. Building a page before the theme exists guarantees a rewrite.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Instrumentation is its own phase</div><div class=\"cb\">Not something bolted on at the end. An event added after launch has no history behind it, which is exactly when you need history.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">QA and compliance before deploy</div><div class=\"cb\">Three personas walked end to end, every conditional branch exercised, one real purchase, webhook confirmed.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Each phase gates the next. Skipping one does not save time \u2014 it moves the cost later and multiplies it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">The build ritual, phase by phase</span><span class=\"fbar\"><i style=\"width:7.0%\"></i></span><span class=\"pg num\">158<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 step 1",title:"What it becomes",html:"<div class=\"slide\" data-i=\"158\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 step 1</span><span class=\"sp\"></span><span class=\"step num\">6 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">What it becomes</div><div class=\"h2\" style=\"font-size:2.35cqw\">The orchestrator \u2014 context in, operations out</div><div class=\"lede\">Once your engine, spec and asset list live in one place that an agent can read, the build is the smaller half of what you have made. The larger half is that anyone on your team can ask a question about your funnel and get an answer in two seconds.</div><div class=\"viz\"><svg viewBox=\"0 1 800 330\" role=\"img\" aria-label=\"Architecture: context inputs feed a central AI orchestrator with state and knowledge, which drives read, write and compute tools to produce live outputs.\">\n          <defs>\n            <marker id=\"ORCH_mkOffer2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"ORCH_ob\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- column headers -->\n          <text x=\"82\" y=\"24\" text-anchor=\"middle\" class=\"svmute\" font-size=\"11\" font-weight=\"700\" letter-spacing=\".05em\">CONTEXT IN</text>\n          <text x=\"303\" y=\"24\" text-anchor=\"middle\" class=\"svmute\" font-size=\"11\" font-weight=\"700\" letter-spacing=\".05em\">ORCHESTRATOR</text>\n          <text x=\"544\" y=\"24\" text-anchor=\"middle\" class=\"svmute\" font-size=\"11\" font-weight=\"700\" letter-spacing=\".05em\">TOOLS</text>\n          <text x=\"721\" y=\"24\" text-anchor=\"middle\" class=\"svmute\" font-size=\"11\" font-weight=\"700\" letter-spacing=\".05em\">OUTPUTS</text>\n          <!-- input->orch -->\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" opacity=\".6\" marker-end=\"url(#ORCH_mkOffer2)\">\n            <path d=\"M158 65 C182 65 178 96 196 100\"/>\n            <path d=\"M158 119 C182 119 182 128 196 132\"/>\n            <path d=\"M158 173 C182 173 182 168 196 172\"/>\n            <path d=\"M158 227 C182 227 178 208 196 204\"/>\n          </g>\n          <!-- orch<->tools -->\n          <g fill=\"none\" stroke-width=\"1.6\" marker-end=\"url(#ORCH_ob)\" opacity=\".75\">\n            <path d=\"M416 110 C446 96 448 84 468 84\" stroke=\"var(--teal)\" class=\"flowline\"/>\n            <path d=\"M416 158 C446 158 448 165 468 165\" stroke=\"var(--teal)\" class=\"flowline\"/>\n            <path d=\"M416 206 C446 220 448 246 468 247\" stroke=\"var(--teal)\" class=\"flowline\"/>\n          </g>\n          <g fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1\" opacity=\".4\" stroke-dasharray=\"3 4\">\n            <path d=\"M468 96 C448 108 446 120 418 124\"/>\n            <path d=\"M468 177 C448 177 446 178 418 176\"/>\n            <path d=\"M468 235 C448 208 446 200 418 220\"/>\n          </g>\n          <!-- tools->outputs -->\n          <g fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.6\" opacity=\".7\" marker-end=\"url(#ORCH_ob)\">\n            <path d=\"M620 84 C640 84 628 84 648 84\" class=\"flowline\"/>\n            <path d=\"M620 165 C640 165 628 165 648 165\" class=\"flowline\"/>\n            <path d=\"M620 247 C640 247 628 247 648 247\" class=\"flowline\"/>\n          </g>\n          <!-- inputs -->\n          <g font-size=\"12.5\">\n            <rect x=\"8\" y=\"44\" width=\"150\" height=\"42\" rx=\"10\" fill=\"var(--accent-2)\"/><text x=\"24\" y=\"60\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Offer + ICP</text><text x=\"24\" y=\"75\" class=\"svmute\" font-size=\"10.5\">from Day 1</text>\n            <rect x=\"8\" y=\"98\" width=\"150\" height=\"42\" rx=\"10\" fill=\"var(--accent-2)\"/><text x=\"24\" y=\"114\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Pages + templates</text><text x=\"24\" y=\"129\" class=\"svmute\" font-size=\"10.5\">from Day 2</text>\n            <rect x=\"8\" y=\"152\" width=\"150\" height=\"42\" rx=\"10\" fill=\"var(--accent-2)\"/><text x=\"24\" y=\"168\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Brand + proof</text><text x=\"24\" y=\"183\" class=\"svmute\" font-size=\"10.5\">the engine</text>\n            <rect x=\"8\" y=\"206\" width=\"150\" height=\"42\" rx=\"10\" fill=\"var(--accent-2)\"/><text x=\"24\" y=\"222\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Live funnel data</text><text x=\"24\" y=\"237\" class=\"svmute\" font-size=\"10.5\">UTM \u00b7 CRM feeds</text>\n          </g>\n          <!-- orchestrator -->\n          <rect x=\"196\" y=\"44\" width=\"214\" height=\"212\" rx=\"16\" fill=\"var(--panel)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n          <rect x=\"196\" y=\"44\" width=\"214\" height=\"34\" rx=\"16\" fill=\"var(--accent)\"/>\n          <rect x=\"196\" y=\"62\" width=\"214\" height=\"16\" fill=\"var(--accent)\"/>\n          <text x=\"303\" y=\"61\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"13\">AI orchestrator \u00b7 Claude Code</text>\n          <g font-size=\"11.5\">\n            <rect x=\"208\" y=\"88\" width=\"190\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"222\" y=\"105\" fill=\"var(--accent-ink)\" font-weight=\"600\">Routing &amp; planning</text>\n            <rect x=\"208\" y=\"128\" width=\"190\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"222\" y=\"145\" fill=\"var(--accent-ink)\" font-weight=\"600\">State + memory store</text>\n            <rect x=\"208\" y=\"168\" width=\"190\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"218\" y=\"185\" fill=\"var(--accent-ink)\" font-weight=\"600\">Knowledge \u2014 all funnel context</text>\n            <rect x=\"208\" y=\"208\" width=\"190\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"222\" y=\"225\" fill=\"var(--accent-ink)\" font-weight=\"600\">Approval gates \u00b7 retries</text>\n          </g>\n          <!-- tools -->\n          <g font-size=\"12\">\n            <rect x=\"470\" y=\"60\" width=\"150\" height=\"48\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"486\" y=\"79\" class=\"svlabel\" font-size=\"12.5\">Read</text><text x=\"486\" y=\"95\" class=\"svmute\" font-size=\"10.5\">search \u00b7 queries \u00b7 scrape</text>\n            <rect x=\"470\" y=\"141\" width=\"150\" height=\"48\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"486\" y=\"160\" class=\"svlabel\" font-size=\"12.5\">Write</text><text x=\"486\" y=\"176\" class=\"svmute\" font-size=\"10.5\">CRM \u00b7 publish \u00b7 send</text>\n            <rect x=\"470\" y=\"223\" width=\"150\" height=\"48\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"486\" y=\"242\" class=\"svlabel\" font-size=\"12.5\">Compute</text><text x=\"486\" y=\"258\" class=\"svmute\" font-size=\"10.5\">code \u00b7 funnel math</text>\n          </g>\n          <!-- outputs -->\n          <g font-size=\"12\">\n            <rect x=\"648\" y=\"60\" width=\"146\" height=\"48\" rx=\"10\" fill=\"var(--teal-bg)\"/><text x=\"664\" y=\"79\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12.5\">Live AI website</text><text x=\"664\" y=\"95\" class=\"svmute\" font-size=\"10.5\">built &amp; deployed</text>\n            <rect x=\"648\" y=\"141\" width=\"146\" height=\"48\" rx=\"10\" fill=\"var(--teal-bg)\"/><text x=\"664\" y=\"160\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12.5\">Ops running 24/7</text><text x=\"664\" y=\"176\" class=\"svmute\" font-size=\"10.5\">no one babysitting</text>\n            <rect x=\"648\" y=\"223\" width=\"146\" height=\"48\" rx=\"10\" fill=\"var(--teal-bg)\"/><text x=\"664\" y=\"242\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12.5\">Instant answers</text><text x=\"664\" y=\"258\" class=\"svmute\" font-size=\"10.5\">knowledge on tap</text>\n          </g>\n          <!-- knowledge unlock callout -->\n          <path d=\"M303 256 L303 300 L470 300\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\" marker-end=\"url(#ORCH_mkOffer2)\" opacity=\".7\"/>\n          <rect x=\"470\" y=\"286\" width=\"322\" height=\"30\" rx=\"15\" fill=\"var(--amber-bg)\"/><text x=\"486\" y=\"302\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"11.5\">Any team question \u2192 answered in 2 seconds</text>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Perfecting it is a trap</div><div class=\"cb\">You can refine an orchestrator forever. The win arrives the first day someone else uses it, not the day it is finished.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Knowledge you can reach beats knowledge you have</div><div class=\"cb\">\u201cWhat is our offer for cold LinkedIn leads?\u201d should be a two-second question, not an archaeology project.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">It is tool-agnostic</div><div class=\"cb\">The value is in the assembled context, not the model reading it. Change tools and the context comes with you.</div></div></div><div class=\"bar\"><span class=\"bl\">The real unlock</span><span class=\"bt\">The build is a one-week project. The reachable context is what keeps paying every week after.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">What it becomes</span><span class=\"fbar\"><i style=\"width:8.5%\"></i></span><span class=\"pg num\">159<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 step 2",title:"Eleven events, two destinations",html:"<div class=\"slide\" data-i=\"159\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 step 2</span><span class=\"sp\"></span><span class=\"step num\">7 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 2 \u00b7 instrument it</div><div class=\"h2\">Eleven events, named once, sent to two places</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1\u20134</span><div style=\"min-width:0\"><div class=\"rt\">session \u00b7 start \u00b7 qualify \u00b7 answer</div><div class=\"rs\">Where they arrive, and where they stall inside the questions.</div></div><div class=\"rmeta\"><b>Per-step</b><span>drop-off</span></div></div><div class=\"r\"><span class=\"n\">5\u20137</span><div style=\"min-width:0\"><div class=\"rt\">complete \u00b7 goals \u00b7 result view</div><div class=\"rs\">Whether the middle of the funnel actually landed.</div></div><div class=\"rmeta\"><b>Engagement</b><span>depth</span></div></div><div class=\"r\"><span class=\"n\">8\u20139</span><div style=\"min-width:0\"><div class=\"rt\">offer view \u00b7 checkout start</div><div class=\"rs\">Whether the price landed, separately from whether the offer did.</div></div><div class=\"rmeta\"><b>Commercial</b><span>intent</span></div></div><div class=\"r\"><span class=\"n\">10\u201311</span><div style=\"min-width:0\"><div class=\"rt\">purchase \u00b7 upsell take</div><div class=\"rs\">Confirmed server-side by webhook. Never trusted from the browser.</div></div><div class=\"rmeta\"><b>Revenue</b><span>server-side</span></div></div><div class=\"r\"><span class=\"n\">\u00d72</span><div style=\"min-width:0\"><div class=\"rt\">Two destinations, always</div><div class=\"rs\">Your analytics platform and an endpoint you own. One can be switched off by someone else.</div></div><div class=\"rmeta\"><b>Rule</b><span>own a copy</span></div></div></div><div class=\"bar\"><span class=\"bl\">Event four pays for itself</span><span class=\"bt\">Aggregate completion rate tells you something is wrong. Per-question drop-off tells you exactly which question to delete.</span></div><div class=\"foot\">Source: the eleven core events, <b>01-assessment-funnel-blueprint</b>. Adapt the verbs to your funnel \u2014 a call-closed funnel swaps checkout for booking \u2014 but keep the eleven slots.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Eleven events, two destinations</span><span class=\"fbar\"><i style=\"width:9.9%\"></i></span><span class=\"pg num\">160<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 step 3",title:"Stages that move themselves",html:"<div class=\"slide\" data-i=\"160\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 step 3</span><span class=\"sp\"></span><span class=\"step num\">8 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 3 \u00b7 the pipeline</div><div class=\"h2\" style=\"font-size:2.35cqw\">Every stage with a trigger, and one guard each</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 596\" role=\"img\" aria-label=\"An eleven-stage sales pipeline drawn as a descending chain: form filled, evaluation call scheduled, qualified, sales call held, follow-up, proposal sent, proposal accepted, payment completed, onboarding, and delivery. Two side exits branch off: no-show with a rebooking recovery, and unqualified into a thirty-day nurture. Each stage names the automation that guards it, and a conversion percentage sits on each transition.\">\n          <defs>\n            <marker id=\"CRM_p1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"CRM_p2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">THE MAIN CHAIN \u00b7 every stage writes itself, none of it is typed in by hand</text>\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" opacity=\".6\" marker-end=\"url(#CRM_p1)\">\n            <path d=\"M232 68 L232 84\"/><path d=\"M232 128 L232 144\"/><path d=\"M232 188 L232 204\"/><path d=\"M232 248 L232 264\"/>\n            <path d=\"M232 308 L232 324\"/><path d=\"M232 368 L232 384\"/><path d=\"M232 428 L232 444\"/><path d=\"M232 488 L232 504\"/>\n          </g>\n          <g font-size=\"10.5\">\n            <rect x=\"60\" y=\"34\" width=\"344\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"76\" y=\"55\" fill=\"var(--accent-ink)\" font-weight=\"700\">1 \u00b7 Form filled</text><text x=\"388\" y=\"55\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">342</text>\n            <rect x=\"60\" y=\"94\" width=\"344\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"76\" y=\"115\" class=\"svlabel\">2 \u00b7 Evaluation call scheduled</text><text x=\"388\" y=\"115\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">85</text>\n            <rect x=\"60\" y=\"154\" width=\"344\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"76\" y=\"175\" class=\"svlabel\">3 \u00b7 Qualified</text><text x=\"388\" y=\"175\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">62</text>\n            <rect x=\"60\" y=\"214\" width=\"344\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"76\" y=\"235\" class=\"svlabel\">4 \u00b7 Sales call held</text><text x=\"388\" y=\"235\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">55</text>\n            <rect x=\"60\" y=\"274\" width=\"344\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"76\" y=\"295\" class=\"svlabel\">5 \u00b7 Follow-up</text><text x=\"388\" y=\"295\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">12</text>\n            <rect x=\"60\" y=\"334\" width=\"344\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"76\" y=\"355\" class=\"svlabel\">6 \u00b7 Proposal sent</text><text x=\"388\" y=\"355\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">18</text>\n            <rect x=\"60\" y=\"394\" width=\"344\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"76\" y=\"415\" class=\"svlabel\">7 \u00b7 Proposal accepted</text><text x=\"388\" y=\"415\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">15</text>\n            <rect x=\"60\" y=\"454\" width=\"344\" height=\"34\" rx=\"8\" fill=\"var(--teal-bg)\"/><text x=\"76\" y=\"475\" fill=\"var(--teal)\" font-weight=\"700\">8 \u00b7 Payment completed</text><text x=\"388\" y=\"475\" text-anchor=\"end\" fill=\"var(--teal)\" font-size=\"10\">14</text>\n            <rect x=\"60\" y=\"514\" width=\"344\" height=\"34\" rx=\"8\" fill=\"var(--teal-bg)\"/><text x=\"76\" y=\"535\" fill=\"var(--teal)\" font-weight=\"700\">9 \u00b7 Onboarding \u2192 10 \u00b7 Delivery</text><text x=\"388\" y=\"535\" text-anchor=\"end\" fill=\"var(--teal)\" font-size=\"10\">14</text>\n          </g>\n          <g class=\"svmute\" font-size=\"9.5\">\n            <text x=\"246\" y=\"80\">12%</text><text x=\"246\" y=\"140\">68%</text><text x=\"246\" y=\"200\">90%</text><text x=\"246\" y=\"260\">85%</text>\n            <text x=\"246\" y=\"320\">50%</text><text x=\"246\" y=\"380\">40%</text><text x=\"246\" y=\"440\">95%</text><text x=\"246\" y=\"500\">100%</text>\n          </g>\n          <!-- the automation guarding each stage -->\n          <text x=\"440\" y=\"22\" class=\"svsub\" font-size=\"11\">WHAT GUARDS IT</text>\n          <g class=\"svmute\" font-size=\"10\">\n            <text x=\"440\" y=\"55\">lead ingest \u00b7 ghosted-lead recovery</text>\n            <text x=\"440\" y=\"115\">confirmation + two reminders</text>\n            <text x=\"440\" y=\"175\">score threshold, then hand-off</text>\n            <text x=\"440\" y=\"235\">call recording + notes sync</text>\n            <text x=\"440\" y=\"295\">nurture between calls</text>\n            <text x=\"440\" y=\"349\">proposal watchdog \u2014</text><text x=\"440\" y=\"362\">pings if unopened</text>\n            <text x=\"440\" y=\"415\">move straight to closing</text>\n            <text x=\"440\" y=\"475\">payment webhook \u2192 finance</text>\n            <text x=\"440\" y=\"529\">welcome, day-one check-in,</text><text x=\"440\" y=\"542\">review scheduler</text>\n          </g>\n          <!-- exits -->\n          <path d=\"M406 111 C440 111 440 126 440 148 L440 556 C440 570 434 576 424 576\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.6\" stroke-dasharray=\"5 6\" opacity=\".5\"/>\n          <path d=\"M60 111 C40 111 32 118 32 132 L32 566 C32 578 40 584 52 584\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"0\" />\n          <rect x=\"612\" y=\"94\" width=\"232\" height=\"60\" rx=\"10\" fill=\"var(--amber-bg)\"/>\n          <text x=\"628\" y=\"116\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">EXIT A \u00b7 No show</text>\n          <text x=\"628\" y=\"133\" class=\"svmute\" font-size=\"9.5\">automatic rebook link, then two nudges.</text>\n          <text x=\"628\" y=\"147\" class=\"svmute\" font-size=\"9.5\">A booked call you lose is still a warm lead.</text>\n          <path d=\"M406 111 C480 111 540 118 606 120\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.6\" marker-end=\"url(#CRM_p2)\" class=\"flowline\"/>\n          <rect x=\"612\" y=\"160\" width=\"232\" height=\"60\" rx=\"10\" fill=\"var(--amber-bg)\"/>\n          <text x=\"628\" y=\"182\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">EXIT B \u00b7 Unqualified</text>\n          <text x=\"628\" y=\"199\" class=\"svmute\" font-size=\"9.5\">30-day nurture, then back to the top.</text>\n          <text x=\"628\" y=\"213\" class=\"svmute\" font-size=\"9.5\">Unqualified today \u2260 unqualified forever.</text>\n          <path d=\"M406 171 C480 171 540 182 606 186\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.6\" marker-end=\"url(#CRM_p2)\" class=\"flowline\"/>\n          <rect x=\"612\" y=\"250\" width=\"232\" height=\"132\" rx=\"10\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <text x=\"628\" y=\"274\" class=\"svlabel\" font-size=\"11\">THE FOUR FIELDS</text>\n          <text x=\"628\" y=\"294\" class=\"svmute\" font-size=\"9.5\">Every contact carries, at minimum:</text>\n          <text x=\"628\" y=\"314\" class=\"svsub\" font-size=\"10\">\u00b7 source \u2014 which channel found them</text>\n          <text x=\"628\" y=\"332\" class=\"svsub\" font-size=\"10\">\u00b7 the UTM, intact, end to end</text>\n          <text x=\"628\" y=\"350\" class=\"svsub\" font-size=\"10\">\u00b7 the four tags from Day 2</text>\n          <text x=\"628\" y=\"368\" class=\"svsub\" font-size=\"10\">\u00b7 their diagnostic score and band</text>\n          <rect x=\"612\" y=\"394\" width=\"232\" height=\"154\" rx=\"10\" fill=\"var(--pink-bg)\"/>\n          <text x=\"628\" y=\"418\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"11\">WHERE IT GOES WRONG</text>\n          <text x=\"628\" y=\"440\" class=\"svmute\" font-size=\"9.5\">A stage that a human has to update by</text>\n          <text x=\"628\" y=\"456\" class=\"svmute\" font-size=\"9.5\">hand is a stage that will be wrong by</text>\n          <text x=\"628\" y=\"472\" class=\"svmute\" font-size=\"9.5\">Friday. If a transition can't be triggered</text>\n          <text x=\"628\" y=\"488\" class=\"svmute\" font-size=\"9.5\">by an event, either find the event or</text>\n          <text x=\"628\" y=\"504\" class=\"svmute\" font-size=\"9.5\">delete the stage.</text>\n          <text x=\"628\" y=\"528\" class=\"svsub\" font-size=\"9.5\">Ten honest stages beat twenty</text>\n          <text x=\"628\" y=\"543\" class=\"svsub\" font-size=\"9.5\">aspirational ones.</text>\n          <text x=\"60\" y=\"576\" class=\"svmute\" font-size=\"9.5\">Counts and percentages shown are a teaching model, not client results \u2014 yours will differ and that's the point.</text>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">A stage needs a trigger, or it needs deleting</div><div class=\"ab\">If a transition cannot be fired by an event, find the event or drop the stage. A stage nobody updates is worse than no stage.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Remove the tag that moved them</div><div class=\"ab\">A trigger tag left in place re-fires the same automation forever. Clearing it in the same workflow is the fix \u2014 and the most common omission.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Granularity you will not maintain is noise</div><div class=\"ab\">Four stages you keep current produce real numbers this afternoon. Eleven you abandon produce a report nobody trusts.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Read down the stages and ask, for each one: what event moves someone in, and what clears it?</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Stages that move themselves</span><span class=\"fbar\"><i style=\"width:11.3%\"></i></span><span class=\"pg num\">161<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 step 3",title:"Two pipeline models",html:"<div class=\"slide\" data-i=\"161\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 step 3</span><span class=\"sp\"></span><span class=\"step num\">9 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Pick one, do not blend</div><div class=\"h2\" style=\"font-size:2.6cqw\">Two pipeline models appear in the source material</div><div class=\"matrix fill\" style=\"grid-template-columns:minmax(0,.85fr) repeat(2,minmax(0,1fr))\"><div class=\"mc head\"></div><div class=\"mc head\"><b>Single detailed pipeline</b></div><div class=\"mc head\"><b>Split marketing + sales</b></div><div class=\"mc rowh\"><b>Shape</b></div><div class=\"mc\"><span>One pipeline, roughly eleven stages, covering enquiry through delivery.</span></div><div class=\"mc\"><span>Two pipelines \u2014 a marketing one for event attendance, a sales one for the deal.</span></div><div class=\"mc rowh\"><b>Strength</b></div><div class=\"mc\"><span>One view of the whole journey; nothing falls between two systems.</span></div><div class=\"mc\"><span>Each pipeline stays short, and marketing reporting does not pollute sales forecasting.</span></div><div class=\"mc rowh\"><b>Cost</b></div><div class=\"mc\"><span>Long pipelines are the ones people stop updating.</span></div><div class=\"mc\"><span>A contact exists in two places, so the hand-off between them has to be automated.</span></div><div class=\"mc rowh\"><b>Fits</b></div><div class=\"mc\"><span>A team where one person owns the whole journey.</span></div><div class=\"mc\"><span>A team where marketing and sales are genuinely different people.</span></div><div class=\"mc rowh\"><b>Watch for</b></div><div class=\"mc\"><span>Stages with no trigger \u2014 they will be wrong within a week.</span></div><div class=\"mc\"><span>Contacts stuck in marketing because the hand-off never fired.</span></div></div><div class=\"foot\">These are genuinely different systems in the source material, not two views of one. Choose on team shape, not on stage count \u2014 and choose now, because this afternoon's reports read from it.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Two pipeline models</span><span class=\"fbar\"><i style=\"width:12.7%\"></i></span><span class=\"pg num\">162<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 step 4",title:"Trigger \u2192 condition \u2192 action",html:"<div class=\"slide\" data-i=\"162\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 step 4</span><span class=\"sp\"></span><span class=\"step num\">10 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 4 \u00b7 automations</div><div class=\"h2\" style=\"font-size:2.35cqw\">Trigger \u2192 condition \u2192 action, and the loop trap</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 600\" role=\"img\" aria-label=\"Eight automations laid out as trigger, condition and action rows: registration confirmation and reminders, event page to registration to CRM sync, the landing page API, behavioural sync back to the CRM, calendar outreach import, the pipeline stage tracker, the reply and bounce parser polling every sixty seconds, and the messaging reminder engine polling every five minutes.\">\n          <defs>\n            <marker id=\"AUTO_a1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"40\" y=\"24\" class=\"svmute\" font-size=\"9.5\">TRIGGER</text>\n          <text x=\"330\" y=\"24\" class=\"svmute\" font-size=\"9.5\">CONDITION</text>\n          <text x=\"600\" y=\"24\" class=\"svmute\" font-size=\"9.5\">ACTION</text>\n          <line x1=\"16\" y1=\"34\" x2=\"844\" y2=\"34\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <g fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.4\" opacity=\".45\" marker-end=\"url(#AUTO_a1)\">\n            <path d=\"M300 6
