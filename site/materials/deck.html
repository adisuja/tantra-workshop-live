2 L322 62\"/><path d=\"M566 62 L588 62\"/>\n            <path d=\"M300 134 L322 134\"/><path d=\"M566 134 L588 134\"/>\n            <path d=\"M300 206 L322 206\"/><path d=\"M566 206 L588 206\"/>\n            <path d=\"M300 278 L322 278\"/><path d=\"M566 278 L588 278\"/>\n            <path d=\"M300 350 L322 350\"/><path d=\"M566 350 L588 350\"/>\n            <path d=\"M300 422 L322 422\"/><path d=\"M566 422 L588 422\"/>\n            <path d=\"M300 494 L322 494\"/><path d=\"M566 494 L588 494\"/>\n            <path d=\"M300 566 L322 566\"/><path d=\"M566 566 L588 566\"/>\n          </g>\n          <g font-size=\"10\">\n            <rect x=\"16\" y=\"44\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"60\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">1 \u00b7 Someone registers</text><text x=\"30\" y=\"74\" class=\"svmute\" font-size=\"9\">native to your event platform</text>\n            <rect x=\"322\" y=\"44\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"66\" class=\"svsub\">always</text>\n            <rect x=\"588\" y=\"44\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"60\" class=\"svlabel\" font-size=\"10.5\">Confirmation + the reminder set</text><text x=\"602\" y=\"74\" class=\"svmute\" font-size=\"9\">T\u221224h \u00b7 T\u22121h \u00b7 live \u00b7 replay at +24h</text>\n\n            <rect x=\"16\" y=\"116\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"132\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">2 \u00b7 A lead form is submitted</text><text x=\"30\" y=\"146\" class=\"svmute\" font-size=\"9\">from a social event page</text>\n            <rect x=\"322\" y=\"116\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"132\" class=\"svsub\">not already registered</text><text x=\"336\" y=\"145\" class=\"svmute\" font-size=\"9\">dedupe on email</text>\n            <rect x=\"588\" y=\"116\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"132\" class=\"svlabel\" font-size=\"10.5\">Register them \u00b7 create the contact</text><text x=\"602\" y=\"146\" class=\"svmute\" font-size=\"9\">\u00b7 calendar hold \u00b7 log the row</text>\n\n            <rect x=\"16\" y=\"188\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"204\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">3 \u00b7 Your own page posts a form</text><text x=\"30\" y=\"218\" class=\"svmute\" font-size=\"9\">the branded funnel page</text>\n            <rect x=\"322\" y=\"188\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"204\" class=\"svsub\">passes validation</text><text x=\"336\" y=\"217\" class=\"svmute\" font-size=\"9\">server-side, never trust the browser</text>\n            <rect x=\"588\" y=\"188\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"204\" class=\"svlabel\" font-size=\"10.5\">Same three writes, then redirect</text><text x=\"602\" y=\"218\" class=\"svmute\" font-size=\"9\">to the thank-you page</text>\n\n            <rect x=\"16\" y=\"260\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"276\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">4 \u00b7 A behavioural event fires</text><text x=\"30\" y=\"290\" class=\"svmute\" font-size=\"9\">joined live \u00b7 watched replay \u00b7 no-show \u00b7 voted</text>\n            <rect x=\"322\" y=\"260\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"276\" class=\"svsub\">route by event type</text><text x=\"336\" y=\"289\" class=\"svmute\" font-size=\"9\">bulk imports skip the sheet write</text>\n            <rect x=\"588\" y=\"260\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"276\" class=\"svlabel\" font-size=\"10.5\">Apply the tag \u00b7 update the row</text><text x=\"602\" y=\"290\" class=\"svmute\" font-size=\"9\">this is what the four tags are for</text>\n\n            <rect x=\"16\" y=\"332\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"348\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">5 \u00b7 You run the outreach import</text><text x=\"30\" y=\"362\" class=\"svmute\" font-size=\"9\">manual, from your outreach sheet</text>\n            <rect x=\"322\" y=\"332\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"348\" class=\"svsub\">contact exists?</text><text x=\"336\" y=\"361\" class=\"svmute\" font-size=\"9\">update if yes, create if no</text>\n            <rect x=\"588\" y=\"332\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"348\" class=\"svlabel\" font-size=\"10.5\">Write back status + contact id</text><text x=\"602\" y=\"362\" class=\"svmute\" font-size=\"9\">so the sheet never double-sends</text>\n\n            <rect x=\"16\" y=\"404\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--accent-2)\"/><text x=\"30\" y=\"420\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">6 \u00b7 A tag is added to a contact</text><text x=\"30\" y=\"434\" class=\"svmute\" font-size=\"9\">or an appointment is confirmed</text>\n            <rect x=\"322\" y=\"404\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"420\" class=\"svsub\">match tag \u2192 stage</text><text x=\"336\" y=\"433\" class=\"svmute\" font-size=\"9\">remove the trigger tag after</text>\n            <rect x=\"588\" y=\"404\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"420\" class=\"svlabel\" font-size=\"10.5\">Move the pipeline stage</text><text x=\"602\" y=\"434\" class=\"svmute\" font-size=\"9\">removing the tag prevents re-firing</text>\n\n            <rect x=\"16\" y=\"476\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--amber-bg)\"/><text x=\"30\" y=\"492\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">7 \u00b7 Inbox poll \u00b7 every 60 seconds</text><text x=\"30\" y=\"506\" class=\"svmute\" font-size=\"9\">replies and delivery failures</text>\n            <rect x=\"322\" y=\"476\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"492\" class=\"svsub\">parse: accepted / declined /</text><text x=\"336\" y=\"505\" class=\"svsub\" font-size=\"9.5\">tentative / bounced</text>\n            <rect x=\"588\" y=\"476\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"492\" class=\"svlabel\" font-size=\"10.5\">Set reply status \u00b7 flag bounces</text><text x=\"602\" y=\"506\" class=\"svmute\" font-size=\"9\">a bounce you don't record gets re-sent</text>\n\n            <rect x=\"16\" y=\"548\" width=\"284\" height=\"36\" rx=\"8\" fill=\"var(--amber-bg)\"/><text x=\"30\" y=\"564\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">8 \u00b7 Scheduler \u00b7 every 5 minutes</text><text x=\"30\" y=\"578\" class=\"svmute\" font-size=\"9\">compares now against event time</text>\n            <rect x=\"322\" y=\"548\" width=\"244\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"336\" y=\"564\" class=\"svsub\">inside a window, \u00b13 min</text><text x=\"336\" y=\"577\" class=\"svmute\" font-size=\"9\">24h \u00b7 1h \u00b7 15m \u00b7 live \u00b7 +1/2/3 days</text>\n            <rect x=\"588\" y=\"548\" width=\"256\" height=\"36\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"602\" y=\"564\" class=\"svlabel\" font-size=\"10.5\">Tag the contact \u2192 messaging sends</text><text x=\"602\" y=\"578\" class=\"svmute\" font-size=\"9\">wait-nodes between sends, or you get flagged</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Three first: confirm, capture, tag</div><div class=\"ab\">Everything else is leverage you add once the first three are provably reliable \u2014 meaning you watched them fire on a real contact.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Capture is the one that fails silently</div><div class=\"ab\">A page that stops writing to the CRM loses leads without any error anywhere. It needs its own check.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Parse replies and bounces</div><div class=\"ab\">Unrecorded bounces get re-sent, and repeated sends to dead addresses burn the sending domain you spent three weeks warming.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Each automation is a thing that can break while you are busy. Build three you can debug, not six you cannot.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Trigger \u2192 condition \u2192 action</span><span class=\"fbar\"><i style=\"width:14.1%\"></i></span><span class=\"pg num\">163<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 step 5",title:"Spend little, measure properly",html:"<div class=\"slide\" data-i=\"163\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 step 5</span><span class=\"sp\"></span><span class=\"step num\">11 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 5 \u00b7 real traffic</div><div class=\"h2\" style=\"font-size:2.35cqw\">Spend little, measure properly</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 528\" role=\"img\" aria-label=\"Test campaign plan. Four channels each with a small test volume and the first number to read. Below, three reading zones: green means scale, amber means tune one variable, red means stop and fix, each with its thresholds. A footer explains reading the funnel report and the acquisition report together.\">\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">SPEND LITTLE, MEASURE PROPERLY \u00b7 the goal today is learning, not revenue</text>\n          <line x1=\"16\" y1=\"34\" x2=\"844\" y2=\"34\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <g font-size=\"10.5\">\n            <rect x=\"16\" y=\"46\" width=\"204\" height=\"118\" rx=\"11\" class=\"node\"/>\n            <text x=\"32\" y=\"70\" class=\"svlabel\" font-size=\"11.5\">Cold email</text>\n            <text x=\"32\" y=\"92\" class=\"svsub\">Send 300\u2013500, no more</text>\n            <text x=\"32\" y=\"110\" class=\"svmute\" font-size=\"9.5\">across your warmed inboxes only</text>\n            <line x1=\"32\" y1=\"122\" x2=\"204\" y2=\"122\" class=\"gridline\"/>\n            <text x=\"32\" y=\"140\" class=\"svmute\" font-size=\"9.5\">Read first: <tspan class=\"svlabel\" font-size=\"10\">bounce rate</tspan></text>\n            <text x=\"32\" y=\"156\" class=\"svmute\" font-size=\"9.5\">above 5% and nothing else matters</text>\n\n            <rect x=\"232\" y=\"46\" width=\"204\" height=\"118\" rx=\"11\" class=\"node\"/>\n            <text x=\"248\" y=\"70\" class=\"svlabel\" font-size=\"11.5\">LinkedIn</text>\n            <text x=\"248\" y=\"92\" class=\"svsub\">100\u2013150 touches</text>\n            <text x=\"248\" y=\"110\" class=\"svmute\" font-size=\"9.5\">inside the daily caps, no exceptions</text>\n            <line x1=\"248\" y1=\"122\" x2=\"420\" y2=\"122\" class=\"gridline\"/>\n            <text x=\"248\" y=\"140\" class=\"svmute\" font-size=\"9.5\">Read first: <tspan class=\"svlabel\" font-size=\"10\">accept rate</tspan></text>\n            <text x=\"248\" y=\"156\" class=\"svmute\" font-size=\"9.5\">low accept = wrong list, not bad copy</text>\n\n            <rect x=\"448\" y=\"46\" width=\"204\" height=\"118\" rx=\"11\" class=\"node\"/>\n            <text x=\"464\" y=\"70\" class=\"svlabel\" font-size=\"11.5\">Paid ads</text>\n            <text x=\"464\" y=\"92\" class=\"svsub\">The smallest viable budget</text>\n            <text x=\"464\" y=\"110\" class=\"svmute\" font-size=\"9.5\">2 creatives, 1 audience, 1 variable</text>\n            <line x1=\"464\" y1=\"122\" x2=\"636\" y2=\"122\" class=\"gridline\"/>\n            <text x=\"464\" y=\"140\" class=\"svmute\" font-size=\"9.5\">Read first: <tspan class=\"svlabel\" font-size=\"10\">cost per lead</tspan></text>\n            <text x=\"464\" y=\"156\" class=\"svmute\" font-size=\"9.5\">not cost per click \u2014 clicks don't buy</text>\n\n            <rect x=\"664\" y=\"46\" width=\"180\" height=\"118\" rx=\"11\" class=\"node\"/>\n            <text x=\"680\" y=\"70\" class=\"svlabel\" font-size=\"11.5\">Content</text>\n            <text x=\"680\" y=\"92\" class=\"svsub\">3\u20135 posts</text>\n            <text x=\"680\" y=\"110\" class=\"svmute\" font-size=\"9.5\">every link UTM-tagged</text>\n            <line x1=\"680\" y1=\"122\" x2=\"828\" y2=\"122\" class=\"gridline\"/>\n            <text x=\"680\" y=\"140\" class=\"svmute\" font-size=\"9.5\">Read first: <tspan class=\"svlabel\" font-size=\"10\">clicks to page</tspan></text>\n            <text x=\"680\" y=\"156\" class=\"svmute\" font-size=\"9.5\">engagement is not traffic</text>\n          </g>\n          <text x=\"16\" y=\"198\" class=\"svsub\" font-size=\"11\">THEN READ IT \u2014 AND ONLY THEN DECIDE</text>\n          <g font-size=\"10.5\">\n            <rect x=\"16\" y=\"212\" width=\"268\" height=\"150\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n            <text x=\"150\" y=\"238\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12.5\">GREEN \u00b7 scale it</text>\n            <text x=\"150\" y=\"262\" text-anchor=\"middle\" class=\"svsub\">CTR \u2265 3%</text>\n            <text x=\"150\" y=\"280\" text-anchor=\"middle\" class=\"svsub\">conversion \u2265 1.5%</text>\n            <text x=\"150\" y=\"298\" text-anchor=\"middle\" class=\"svsub\">bounce \u2264 2%</text>\n            <line x1=\"44\" y1=\"312\" x2=\"256\" y2=\"312\" stroke=\"var(--teal)\" opacity=\".3\"/>\n            <text x=\"150\" y=\"332\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Add volume. Do not add</text>\n            <text x=\"150\" y=\"348\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">new variables at the same time.</text>\n\n            <rect x=\"296\" y=\"212\" width=\"268\" height=\"150\" rx=\"12\" fill=\"var(--amber-bg)\"/>\n            <text x=\"430\" y=\"238\" text-anchor=\"middle\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"12.5\">AMBER \u00b7 tune one thing</text>\n            <text x=\"430\" y=\"262\" text-anchor=\"middle\" class=\"svsub\">landing conversion below</text>\n            <text x=\"430\" y=\"280\" text-anchor=\"middle\" class=\"svsub\">roughly 4% on cold traffic,</text>\n            <text x=\"430\" y=\"298\" text-anchor=\"middle\" class=\"svsub\">or 9% on warm</text>\n            <line x1=\"324\" y1=\"312\" x2=\"536\" y2=\"312\" stroke=\"var(--amber)\" opacity=\".3\"/>\n            <text x=\"430\" y=\"332\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Change one element. Headline</text>\n            <text x=\"430\" y=\"348\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">first \u2014 it's the cheapest test.</text>\n\n            <rect x=\"576\" y=\"212\" width=\"268\" height=\"150\" rx=\"12\" fill=\"var(--pink-bg)\"/>\n            <text x=\"710\" y=\"238\" text-anchor=\"middle\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"12.5\">RED \u00b7 stop and fix</text>\n            <text x=\"710\" y=\"262\" text-anchor=\"middle\" class=\"svsub\">open &lt; 15% \u00b7 CTR &lt; 1%</text>\n            <text x=\"710\" y=\"280\" text-anchor=\"middle\" class=\"svsub\">bounce &gt; 5%</text>\n            <text x=\"710\" y=\"298\" text-anchor=\"middle\" class=\"svsub\">or any event not firing</text>\n            <line x1=\"604\" y1=\"312\" x2=\"816\" y2=\"312\" stroke=\"var(--pink)\" opacity=\".3\"/>\n            <text x=\"710\" y=\"332\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Pause that channel today.</text>\n            <text x=\"710\" y=\"348\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Volume will not rescue it.</text>\n          </g>\n          <rect x=\"16\" y=\"382\" width=\"828\" height=\"130\" rx=\"12\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <text x=\"36\" y=\"406\" class=\"svlabel\" font-size=\"11.5\">YOU NEED BOTH REPORTS, TOGETHER</text>\n          <g font-size=\"10\">\n            <text x=\"36\" y=\"430\" class=\"svsub\" font-size=\"10.5\">The funnel report</text>\n            <text x=\"36\" y=\"448\" class=\"svmute\">every event count and the rate between each pair \u2014 this tells you</text>\n            <text x=\"36\" y=\"464\" class=\"svmute\">WHERE it leaks, regardless of who sent the traffic.</text>\n            <text x=\"452\" y=\"430\" class=\"svsub\" font-size=\"10.5\">The acquisition report</text>\n            <text x=\"452\" y=\"448\" class=\"svmute\">clicks, spend, buyers and cost-per-buyer per channel \u2014 this tells</text>\n            <text x=\"452\" y=\"464\" class=\"svmute\">you WHO to send more of, and who to stop paying for.</text>\n            <line x1=\"36\" y1=\"478\" x2=\"824\" y2=\"478\" class=\"gridline\"/>\n            <text x=\"36\" y=\"498\" class=\"svmute\">One without the other lies to you: a great funnel fed by the wrong channel looks broken, and a bad funnel fed by a great channel looks fine \u2014 until you scale it.</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">QA before a single real visitor</div><div class=\"ab\">Three personas walked end to end, every conditional branch exercised, one real purchase made, the webhook confirmed, and the pages checked at phone, tablet and laptop widths.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Enough volume to be readable</div><div class=\"ab\">Aim for roughly a hundred funnel starts before you draw any conclusion. Below that you are reading one person's bad afternoon.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">A first number and a stop rule</div><div class=\"ab\">Decide, before launch, which metric you read first and the threshold at which you halt rather than push on.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Smoke-test in production first, then turn on the smallest budget \u2014 never the other way round.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Spend little, measure properly</span><span class=\"fbar\"><i style=\"width:15.5%\"></i></span><span class=\"pg num\">164<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3 \u00b7 step 5",title:"The QA gate",html:"<div class=\"slide\" data-i=\"164\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3 \u00b7 step 5</span><span class=\"sp\"></span><span class=\"step num\">12 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Before real traffic</div><div class=\"h2\">The gate everything has to pass</div><div class=\"lede\">This is the list that separates a launch from an incident. Every item is something the source material calls out as a failure people actually had.</div><div class=\"check fill\"><div class=\"ck\"><span class=\"box\"></span><div style=\"min-width:0\"><div class=\"ct\">Three personas walked end to end</div><div class=\"cs\">Different answer paths, so every conditional branch is exercised at least once.</div></div><span class=\"cmin\">20 min</span></div><div class=\"ck\"><span class=\"box\"></span><div style=\"min-width:0\"><div class=\"ct\">One real purchase, with the webhook confirmed</div><div class=\"cs\">Real money, then refunded. A test-mode purchase does not prove the live webhook fires.</div></div><span class=\"cmin\">10 min</span></div><div class=\"ck\"><span class=\"box\"></span><div style=\"min-width:0\"><div class=\"ct\">Every page checked at phone, tablet and laptop widths</div><div class=\"cs\">375, 768 and 1280 pixels. Most funnel traffic arrives on the narrowest of the three.</div></div><span class=\"cmin\">15 min</span></div><div class=\"ck\"><span class=\"box\"></span><div style=\"min-width:0\"><div class=\"ct\">Keyboard-only pass and reduced-motion check</div><div class=\"cs\">If it cannot be completed without a mouse, a share of your traffic cannot complete it.</div></div><span class=\"cmin\">10 min</span></div><div class=\"ck\"><span class=\"box\"></span><div style=\"min-width:0\"><div class=\"ct\">Smoke test in production before any spend</div><div class=\"cs\">In production, not staging. Then the smallest budget \u2014 never the reverse.</div></div><span class=\"cmin\">10 min</span></div></div><div class=\"bar warn\"><span class=\"bl\">The rule</span><span class=\"bt\">Nothing goes to a real list until one person has walked the whole funnel end to end, including a real purchase.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">The QA gate</span><span class=\"fbar\"><i style=\"width:16.9%\"></i></span><span class=\"pg num\">165<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Which AI tool will you build with?",html:"<div class=\"slide\" data-i=\"165\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">13 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 1 of 12</span><span class=\"qk\">Choose one</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which AI tool will you build with?</div><div class=\"qopts\" style=\"--oc:2;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Claude Code</span></span><span class=\"qopt\"><i>B</i><span>Cursor</span></span><span class=\"qopt\"><i>C</i><span>Codex</span></span><span class=\"qopt\"><i>D</i><span>Another agentic tool</span></span><span class=\"qopt\"><i>E</i><span>Not decided yet</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Pick one</u><span>Switching tools mid-build costs you the whole context you've loaded.</span></div><div class=\"qc\"><u>Load context first</u><span>Your engine, spec outline and asset list, before the first request.</span></div><div class=\"qc\"><u>Say what NOT to build</u><span>Constraints shape output more reliably than instructions do.</span></div></div><div class=\"foot\"><b>Why this one:</b> We use Claude Code as the worked example, but the ritual is tool-agnostic. What decides the result is not the tool \u2014 it is how much context you load before you ask for anything.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which AI tool will you build with?</span><span class=\"fbar\"><i style=\"width:18.3%\"></i></span><span class=\"pg num\">166<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q1 \u00b7 B2B SaaS",title:"SendFlow answers Q1",html:"<div class=\"slide\" data-i=\"166\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q1 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">14 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 1</u><p>Which AI tool will you build with?</p></div><div class=\"answer\"><u>How they answer it</u><p>Claude Code \u2014 plus our existing sequence copy, so it matches the voice already in market.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>They load existing sequence copy so the output matches the voice already in market.</span></div><div class=\"w\"><i>2</i><span>That copy is <b>proven context</b>, not a description of a voice \u2014 a far stronger input.</span></div><div class=\"w\"><i>3</i><span>One tool, chosen because it already sits in their deploy workflow.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Feeding it copy already in market is the highest-leverage context there is \u2014 the output inherits a voice that has already been tested on real buyers.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q1</span><span class=\"fbar\"><i style=\"width:19.7%\"></i></span><span class=\"pg num\">167<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q1 \u00b7 B2B consulting brand",title:"Apex Growth answers Q1",html:"<div class=\"slide\" data-i=\"167\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q1 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">15 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 1</u><p>Which AI tool will you build with?</p></div><div class=\"answer\"><u>How they answer it</u><p>Claude Code \u2014 loading the engine, the spec outline, the asset list and our brand guide.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Engine, spec outline, asset list and brand guide \u2014 four artefacts, loaded up front.</span></div><div class=\"w\"><i>2</i><span>The brand guide encodes the Day 1 anti-adjectives, so the output is <b>constrained by voice</b>.</span></div><div class=\"w\"><i>3</i><span>Nothing here describes the business in the prompt; it is all supplied as context files.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Four artefacts loaded before the first request. This is the difference between \u201cbuild me a funnel\u201d producing a template and producing <em>their</em> funnel.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q1</span><span class=\"fbar\"><i style=\"width:21.1%\"></i></span><span class=\"pg num\">168<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q1 \u00b7 Solopreneur",title:"Sarah Chen answers Q1",html:"<div class=\"slide\" data-i=\"168\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q1 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">16 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 1</u><p>Which AI tool will you build with?</p></div><div class=\"answer\"><u>How they answer it</u><p>Claude Code \u2014 and a document of everything I explicitly do NOT want it to build.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>She leads with an explicit <b>anti-scope document</b> rather than a feature list.</span></div><div class=\"w\"><i>2</i><span>Constraints prevent the agent inventing surface area she would have to maintain alone.</span></div><div class=\"w\"><i>3</i><span>This is the same discipline as her Day 1 anti-adjectives, applied to the build.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A document of what NOT to build is the single cheapest quality lever available to a solo operator \u2014 it prevents the scope sprawl there is nobody else to clean up.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q1</span><span class=\"fbar\"><i style=\"width:22.5%\"></i></span><span class=\"pg num\">169<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Write your eleven event names exactly as they'll appear in analytics.",html:"<div class=\"slide\" data-i=\"169\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">17 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 2 of 12</span><span class=\"qk\">Long answer \u00b7 20+ words</span><span class=\"qtime\">\u23f1 5 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Write your eleven event names exactly as they'll appear in analytics.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 3</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Eleven names</u><span>One per funnel step, covering arrival through upsell.</span></div><div class=\"qc\"><u>Exact strings</u><span>Lowercase, underscored, spelled as they will appear in analytics.</span></div><div class=\"qc\"><u>Server-confirmed</u><span>Purchase confirmed server-side, never trusted from the browser.</span></div></div><div class=\"foot\"><b>Why this one:</b> Name them once and never rename them. Every report, audience and automation you build for the rest of the year keys off these strings \u2014 a rename is a breaking change that orphans your history.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Write your eleven event names exactly as they'll appear in analytics.</span><span class=\"fbar\"><i style=\"width:23.9%\"></i></span><span class=\"pg num\">170<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q2 \u00b7 B2B SaaS",title:"SendFlow answers Q2",html:"<div class=\"slide\" data-i=\"170\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q2 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">18 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 2</u><p>Write your eleven event names exactly as they'll appear in analytics.</p></div><div class=\"answer\"><u>How they answer it</u><p>lp_session, quiz_start, qual_complete, q_answer, assessment_complete, goals_complete, result_view, plan_view, checkout_start, purchase, upsell_take.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Eleven names that track the canonical set: session, start, qualify, answer, complete, result, plan, checkout, purchase, upsell.</span></div><div class=\"w\"><i>2</i><span>The names match the product's internal language, so <b>reports need no translation</b>.</span></div><div class=\"w\"><i>3</i><span>Purchase is confirmed by webhook, not by the browser reaching a thank-you page.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Their names mirror the product's own vocabulary \u2014 quiz, plan, upsell \u2014 which means a report is readable by someone who has never seen the funnel diagram.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q2</span><span class=\"fbar\"><i style=\"width:25.4%\"></i></span><span class=\"pg num\">171<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q2 \u00b7 B2B consulting brand",title:"Apex Growth answers Q2",html:"<div class=\"slide\" data-i=\"171\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q2 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">19 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 2</u><p>Write your eleven event names exactly as they'll appear in analytics.</p></div><div class=\"answer\"><u>How they answer it</u><p>lp_session, reg_start, qualify_complete, step_answer, session_attend, goals_complete, result_view, offer_view, booking_start, booking_complete, purchase.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The set is adapted to a call-closed funnel: booking_start and booking_complete replace checkout.</span></div><div class=\"w\"><i>2</i><span>session_attend is included because <b>attendance is their real conversion step</b>.</span></div><div class=\"w\"><i>3</i><span>Same eleven slots, different verbs \u2014 the structure survives the change of funnel type.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Their set swaps checkout for booking, because the close is a call. The eleven slots are the same shape \u2014 what changes is which real-world action each one records.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q2</span><span class=\"fbar\"><i style=\"width:26.8%\"></i></span><span class=\"pg num\">172<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q2 \u00b7 Solopreneur",title:"Sarah Chen answers Q2",html:"<div class=\"slide\" data-i=\"172\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q2 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">20 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 2</u><p>Write your eleven event names exactly as they'll appear in analytics.</p></div><div class=\"answer\"><u>How they answer it</u><p>visit, optin, qualified, answered, engaged, goals, result, offer, checkout, purchase, upsell \u2014 short names so I don't fat-finger them.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Deliberately short names, chosen to reduce typing errors in her own queries.</span></div><div class=\"w\"><i>2</i><span>She states the reason out loud, which is what makes it a decision rather than laziness.</span></div><div class=\"w\"><i>3</i><span>The <b>order still matches the funnel</b>, so a report reads top to bottom as the journey.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Short names are a legitimate engineering choice when one person types every query. Fewer characters is fewer chances to mistype a filter at 11pm.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q2</span><span class=\"fbar\"><i style=\"width:28.2%\"></i></span><span class=\"pg num\">173<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Your pipeline stages, and the trigger that moves a contact into each one.",html:"<div class=\"slide\" data-i=\"173\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">21 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 3 of 12</span><span class=\"qk\">Long answer \u00b7 25+ words</span><span class=\"qtime\">\u23f1 5 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your pipeline stages, and the trigger that moves a contact into each one.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 3</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Event per transition</u><span>Name the trigger that moves a contact in, for every stage.</span></div><div class=\"qc\"><u>No manual moves</u><span>A stage nobody updates reliably is worse than no stage.</span></div><div class=\"qc\"><u>Remove the trigger</u><span>After a tag moves a contact, clear it \u2014 or it re-fires forever.</span></div></div><div class=\"foot\"><b>Why this one:</b> If a transition cannot be fired by an event, either find the event or delete the stage. A stage that only moves when someone remembers to drag a card is a stage that is always wrong.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your pipeline stages, and the trigger that moves a contact into each one.</span><span class=\"fbar\"><i style=\"width:29.6%\"></i></span><span class=\"pg num\">174<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q3 \u00b7 B2B SaaS",title:"SendFlow answers Q3",html:"<div class=\"slide\" data-i=\"174\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q3 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">22 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 3</u><p>Your pipeline stages, and the trigger that moves a contact into each one.</p></div><div class=\"answer\"><u>How they answer it</u><p>Trial started \u2192 activated (first sequence sent) \u2192 qualified (seats &gt;3) \u2192 paid \u2192 onboarded \u2192 expanded. Every one event-driven, no manual moves.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Six stages, each moved by a product event rather than a human updating a record.</span></div><div class=\"w\"><i>2</i><span>\u201cQualified\u201d has a numeric rule \u2014 seats greater than three \u2014 so it is never a judgement call.</span></div><div class=\"w\"><i>3</i><span>Expansion is a stage, which makes <b>Day 3's ascension work visible in the pipeline</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Every transition event-driven with no manual moves is the ideal, and achievable here precisely because the product itself emits the events.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q3</span><span class=\"fbar\"><i style=\"width:31.0%\"></i></span><span class=\"pg num\">175<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q3 \u00b7 B2B consulting brand",title:"Apex Growth answers Q3",html:"<div class=\"slide\" data-i=\"175\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q3 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">23 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 3</u><p>Your pipeline stages, and the trigger that moves a contact into each one.</p></div><div class=\"answer\"><u>How they answer it</u><p>Form filled (form submit) \u2192 call scheduled (booking webhook) \u2192 qualified (score &gt;70) \u2192 call held (calendar completed) \u2192 proposal sent \u2192 accepted \u2192 paid (payment webhook).</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Seven stages, each with a named trigger: form submit, booking webhook, score, calendar completion.</span></div><div class=\"w\"><i>2</i><span>Qualification fires on <b>score above 70</b>, reusing the Day 1 banding rule directly.</span></div><div class=\"w\"><i>3</i><span>Payment lands via webhook, so the pipeline and the bank agree without anyone reconciling.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Mixing webhook triggers with a score threshold is the right hybrid for a call-closed funnel \u2014 some transitions are events, and qualification is a calculation over events.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q3</span><span class=\"fbar\"><i style=\"width:32.4%\"></i></span><span class=\"pg num\">176<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q3 \u00b7 Solopreneur",title:"Sarah Chen answers Q3",html:"<div class=\"slide\" data-i=\"176\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q3 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">24 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 3</u><p>Your pipeline stages, and the trigger that moves a contact into each one.</p></div><div class=\"answer\"><u>How they answer it</u><p>Four stages only: enquiry, call booked, proposal sent, paid. I had nine and updated none of them.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Four stages, down from nine she admits she never updated.</span></div><div class=\"w\"><i>2</i><span>Each remaining stage maps to something that <b>visibly happens</b>: enquiry, call, proposal, payment.</span></div><div class=\"w\"><i>3</i><span>A pipeline she actually maintains produces real numbers on Day 3; a detailed one she abandons does not.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Cutting nine stages to four is the correct direction. Pipeline granularity you do not maintain is not detail \u2014 it is noise that makes every report untrustworthy.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q3</span><span class=\"fbar\"><i style=\"width:33.8%\"></i></span><span class=\"pg num\">177<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Which three automations are you building first?",html:"<div class=\"slide\" data-i=\"177\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">25 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 4 of 12</span><span class=\"qk\">Choose at least 3</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which three automations are you building first?</div><div class=\"qopts\" style=\"--oc:2;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Confirmation &amp; reminder set</span></span><span class=\"qopt\"><i>B</i><span>Page \u2192 CRM capture</span></span><span class=\"qopt\"><i>C</i><span>Behavioural tagging</span></span><span class=\"qopt\"><i>D</i><span>Pipeline stage tracker</span></span><span class=\"qopt\"><i>E</i><span>Reply &amp; bounce parser</span></span><span class=\"qopt\"><i>F</i><span>Timed messaging engine</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Three, not six</u><span>Build three that work before adding a fourth.</span></div><div class=\"qc\"><u>Capture is non-negotiable</u><span>A page that doesn't write to the CRM loses leads silently.</span></div><div class=\"qc\"><u>Watch it fire</u><span>Each one verified on a real contact before you trust it.</span></div></div><div class=\"foot\"><b>Why this one:</b> Confirm, capture, tag. Everything else is leverage you add once the first three are provably reliable \u2014 and \u201cprovably\u201d means you have watched them fire on a real contact, not a test one.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which three automations are you building first?</span><span class=\"fbar\"><i style=\"width:35.2%\"></i></span><span class=\"pg num\">178<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q4 \u00b7 B2B SaaS",title:"SendFlow answers Q4",html:"<div class=\"slide\" data-i=\"178\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q4 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">26 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which three automations are you building first?</p></div><div class=\"answer\"><u>How they answer it</u><p>Page \u2192 CRM capture \u00b7 Behavioural tagging \u00b7 Reply &amp; bounce parser \u2014 unrecorded bounces get re-sent, and that kills domains.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>They swap confirmations for a reply and bounce parser, because cold email is their main channel.</span></div><div class=\"w\"><i>2</i><span>Unrecorded bounces get re-sent, and repeated sends to dead addresses <b>burn the sending domain</b>.</span></div><div class=\"w\"><i>3</i><span>A burned domain takes weeks to replace, which makes this the highest-cost failure they face.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Prioritising the bounce parser over confirmations is a channel-specific call and the right one: unrecorded bounces get re-sent, and re-sending to a dead address is what kills a domain.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q4</span><span class=\"fbar\"><i style=\"width:36.6%\"></i></span><span class=\"pg num\">179<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q4 \u00b7 B2B consulting brand",title:"Apex Growth answers Q4",html:"<div class=\"slide\" data-i=\"179\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q4 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">27 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which three automations are you building first?</p></div><div class=\"answer\"><u>How they answer it</u><p>Confirmation &amp; reminder set \u00b7 Page \u2192 CRM capture \u00b7 Behavioural tagging \u2014 without tagging the follow-up branch is guesswork.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The canonical three: confirm, capture, tag \u2014 appropriate for a call-closed funnel.</span></div><div class=\"w\"><i>2</i><span>Without tagging, the post-session follow-up branch is <b>guesswork rather than routing</b>.</span></div><div class=\"w\"><i>3</i><span>Confirmations matter most here because the conversion step is attending something.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Behavioural tagging is the one that decides whether the follow-up branch is targeted or guessed, which is why it belongs in the first three rather than the second.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q4</span><span class=\"fbar\"><i style=\"width:38.0%\"></i></span><span class=\"pg num\">180<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q4 \u00b7 Solopreneur",title:"Sarah Chen answers Q4",html:"<div class=\"slide\" data-i=\"180\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q4 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">28 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 4</u><p>Which three automations are you building first?</p></div><div class=\"answer\"><u>How they answer it</u><p>Confirmation &amp; reminder set \u00b7 Page \u2192 CRM capture \u00b7 Behavioural tagging \u2014 the minimum I can actually debug alone.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The same canonical three, chosen explicitly for debuggability rather than coverage.</span></div><div class=\"w\"><i>2</i><span>Each automation is a <b>thing that can fail silently</b> while she is heads-down delivering.</span></div><div class=\"w\"><i>3</i><span>Three is what one person can verify end to end in an afternoon.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cThe minimum I can actually debug alone\u201d is the correct sizing rule for automation in a one-person business \u2014 every automation is a thing that can break while she is with a client.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q4</span><span class=\"fbar\"><i style=\"width:39.4%\"></i></span><span class=\"pg num\">181<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Your test campaign: channel, volume, budget, and the first number you'll read.",html:"<div class=\"slide\" data-i=\"181\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">29 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 5 of 12</span><span class=\"qk\">Short answer \u00b7 12+ words</span><span class=\"qtime\">\u23f1 3 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your test campaign: channel, volume, budget, and the first number you'll read.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 3</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>A first number</u><span>The single metric you read first, decided before launch.</span></div><div class=\"qc\"><u>A stop rule</u><span>The threshold at which you halt rather than push on.</span></div><div class=\"qc\"><u>Enough volume</u><span>Enough sessions that the result isn't one person's bad afternoon.</span></div></div><div class=\"foot\"><b>Why this one:</b> Small enough that being wrong is cheap. Big enough that the result isn't noise. Today's traffic is not for sales \u2014 it is to find out which assumption was wrong while being wrong is still cheap.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your test campaign: channel, volume, budget, and the first number you'll read.</span><span class=\"fbar\"><i style=\"width:40.8%\"></i></span><span class=\"pg num\">182<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q5 \u00b7 B2B SaaS",title:"SendFlow answers Q5",html:"<div class=\"slide\" data-i=\"182\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q5 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">30 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 5</u><p>Your test campaign: channel, volume, budget, and the first number you'll read.</p></div><div class=\"answer\"><u>How they answer it</u><p>Cold email, 400 sends across four warmed inboxes, plus $300 of ads. First number: bounce rate. Above 5% and we stop everything.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>400 sends across four warmed inboxes keeps per-inbox volume inside the hygiene ceiling.</span></div><div class=\"w\"><i>2</i><span>Bounce rate is read first because it is the number that can <b>destroy the channel itself</b>.</span></div><div class=\"w\"><i>3</i><span>The stop rule is explicit and numeric: above 5%, stop everything.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A stated stop rule \u2014 above 5% bounce and everything halts \u2014 is the mark of an operator rather than an optimist. Most teams discover their threshold after the damage.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q5</span><span class=\"fbar\"><i style=\"width:42.3%\"></i></span><span class=\"pg num\">183<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q5 \u00b7 B2B consulting brand",title:"Apex Growth answers Q5",html:"<div class=\"slide\" data-i=\"183\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q5 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">31 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 5</u><p>Your test campaign: channel, volume, budget, and the first number you'll read.</p></div><div class=\"answer\"><u>How they answer it</u><p>LinkedIn, 150 touches over five days, no budget. First number: accept rate \u2014 if that's low, the list is wrong and nothing else matters.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>150 touches over five days, comfortably inside LinkedIn's per-day connection caps.</span></div><div class=\"w\"><i>2</i><span>Accept rate first, because a low one means the <b>list is wrong and nothing else matters</b>.</span></div><div class=\"w\"><i>3</i><span>Zero budget makes the cost purely time, which still needs costing on Day 3.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Reading accept rate first is diagnostically smart: if the list is wrong, every downstream number is measuring the wrong audience and tells you nothing.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q5</span><span class=\"fbar\"><i style=\"width:43.7%\"></i></span><span class=\"pg num\">184<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q5 \u00b7 Solopreneur",title:"Sarah Chen answers Q5",html:"<div class=\"slide\" data-i=\"184\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q5 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">32 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 5</u><p>Your test campaign: channel, volume, budget, and the first number you'll read.</p></div><div class=\"answer\"><u>How they answer it</u><p>Content only, 5 posts, zero budget. First number: clicks to the page. Engagement is not traffic and I keep forgetting that.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Five posts, zero budget \u2014 the only test available without spend.</span></div><div class=\"w\"><i>2</i><span>Clicks to the page, not likes: <b>engagement is not traffic</b>.</span></div><div class=\"w\"><i>3</i><span>She names her own recurring mistake, which is how it stops being a recurring mistake.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cEngagement is not traffic\u201d is the most useful sentence on this slide. Organic vanity metrics are the easiest place for a solo operator to feel productive and learn nothing.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q5</span><span class=\"fbar\"><i style=\"width:45.1%\"></i></span><span class=\"pg num\">185<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Your turn",title:"Where does this deploy, and what is the live URL?",html:"<div class=\"slide\" data-i=\"185\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">33 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 6 of 12</span><span class=\"qk\">Short answer \u00b7 5+ words</span><span class=\"qtime\">\u23f1 1 min</span><span class=\"qtime\">Day 3 \u00b7 answer on your own screen</span></div><div class=\"qq\">Where does this deploy, and what is the live URL?</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 3</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>A named host</u><span>Where it physically runs. Not \u201cthe cloud\u201d.</span></div><div class=\"qc\"><u>A real URL</u><span>The address you will paste into a campaign this week.</span></div><div class=\"qc\"><u>A date</u><span>When it goes live, on the calendar.</span></div></div><div class=\"foot\"><b>Why this one:</b> A funnel that isn't deployed isn't a funnel. Name the host and the domain now \u2014 \u201cwe'll sort hosting later\u201d is how a built funnel sits unlaunched for a month.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Where does this deploy, and what is the live URL?</span><span class=\"fbar\"><i style=\"width:46.5%\"></i></span><span class=\"pg num\">186<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q6 \u00b7 B2B SaaS",title:"SendFlow answers Q6",html:"<div class=\"slide\" data-i=\"186\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q6 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">34 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 6</u><p>Where does this deploy, and what is the live URL?</p></div><div class=\"answer\"><u>How they answer it</u><p>Our existing app host, on a marketing subdomain \u2014 it's already in our deploy pipeline so there's nothing new to learn.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>It ships through their existing deploy pipeline, so nothing new has to be learned.</span></div><div class=\"w\"><i>2</i><span>A marketing subdomain <b>inherits the main domain's trust</b> without touching the app.</span></div><div class=\"w\"><i>3</i><span>No new infrastructure means no new thing to debug on launch day.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Deploying into the pipeline they already run means zero new operational surface \u2014 no new credentials, no new failure mode, nothing new to learn under time pressure.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q6</span><span class=\"fbar\"><i style=\"width:47.9%\"></i></span><span class=\"pg num\">187<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q6 \u00b7 B2B consulting brand",title:"Apex Growth answers Q6",html:"<div class=\"slide\" data-i=\"187\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q6 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">35 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 6</u><p>Where does this deploy, and what is the live URL?</p></div><div class=\"answer\"><u>How they answer it</u><p>Static host on a subdomain of our main site, so it inherits domain trust. Live by Friday.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A subdomain of the main site, chosen so it inherits established domain trust.</span></div><div class=\"w\"><i>2</i><span>A static host keeps it fast and removes any server to maintain.</span></div><div class=\"w\"><i>3</i><span>\u201cLive by Friday\u201d is a <b>date, not an intention</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Inheriting domain trust matters disproportionately at this ticket \u2014 a five-figure buyer checking the URL should land on something that is visibly part of the firm.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q6</span><span class=\"fbar\"><i style=\"width:49.3%\"></i></span><span class=\"pg num\">188<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Q6 \u00b7 Solopreneur",title:"Sarah Chen answers Q6",html:"<div class=\"slide\" data-i=\"188\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Q6 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">36 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 6</u><p>Where does this deploy, and what is the live URL?</p></div><div class=\"answer\"><u>How they answer it</u><p>Free static host on a subdomain. It costs nothing and loads in under a second, which is all I need.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A free static host, which costs nothing and has nothing to maintain.</span></div><div class=\"w\"><i>2</i><span>Sub-second load is a <b>real conversion lever</b> on the first step of the funnel.</span></div><div class=\"w\"><i>3</i><span>She names what she needs and stops there, rather than over-provisioning.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Free and sub-second is the right specification for a business with no budget \u2014 and page speed is one of the few technical levers that genuinely moves the first conversion step.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q6</span><span class=\"fbar\"><i style=\"width:50.7%\"></i></span><span class=\"pg num\">189<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 the turn",title:"Half two \u2014 now read what it tells you",html:"<div class=\"slide\" data-i=\"189\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 the turn</span><span class=\"sp\"></span><span class=\"step num\">37 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Part B</div><div class=\"h2\">A live funnel is the start of the job, not the end of it</div><div class=\"lede\">It is built, instrumented and taking real traffic. That traffic is now telling you something, and the rest of this session is the discipline of listening to it: know your unit economics, find the single worst step, change one thing, measure, keep or revert.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">You now have numbers instead of opinions</div><div class=\"cb\">Eleven events firing means every step of your funnel has a count behind it. That is what makes the next part possible.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">One leak at a time</div><div class=\"cb\">Fixing five things at once teaches you nothing. If the number moves you cannot say which change did it.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">The loop is what continues after today</div><div class=\"cb\">Thirty minutes a week, forever. Everything before this was the setup for it.</div></div></div><div class=\"bar\"><span class=\"bl\">Why the same session</span><span class=\"bt\">A funnel launched without the loop goes quiet in three weeks. Launching and reading belong in the same room.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Half two \u2014 now read what it tells you</span><span class=\"fbar\"><i style=\"width:52.1%\"></i></span><span class=\"pg num\">190<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 framing",title:"Why one leak at a time",html:"<div class=\"slide\" data-i=\"190\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 framing</span><span class=\"sp\"></span><span class=\"step num\">38 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Why one leak at a time</div><div class=\"h2\">Fixing five things at once teaches you nothing</div><div class=\"lede\">If the number moves you cannot say which change did it; if it drops you cannot say which to undo. One change per leak is slower per week and far faster per quarter.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Attribution is the whole point</div><div class=\"cb\">A change you cannot attribute is not a result \u2014 it is a coincidence you will try to repeat and fail to.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Polish is the enemy of progress</div><div class=\"cb\">Improving six elements slightly is worse than fixing the one step that caps everything downstream.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">The rates multiply</div><div class=\"cb\">Your worst step dominates the whole funnel. Fixing anything else while it stands is arithmetic you cannot win.</div></div></div><div class=\"bar\"><span class=\"bl\">The discipline</span><span class=\"bt\">One element, one metric, a fifty-fifty split, and enough volume that the gap is stable rather than a one-day blip.</span></div><div class=\"foot\">Source: the experiment discipline in <b>05-run-and-optimize</b>.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Why one leak at a time</span><span class=\"fbar\"><i style=\"width:53.5%\"></i></span><span class=\"pg num\">191<i> / 230</i></span></div></div>"},
 {day:"Day 3",section:"Day 3B \u00b7 step 1",title:"Two numbers decide the business",html:"<div class=\"slide\" data-i=\"191\" data-accent=\"amber\" data-day=\"Day 3\"><div class=\"srail\"><span class=\"daychip\">Day 3</span><span class=\"sect\">Day 3B \u00b7 step 1</span><span class=\"sp\"></span><span class=\"step num\">39 / 71</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 1 \u00b7 unit economics</div><div class=\"h2\">Two fetched numbers, and the ratio between them</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">CAC</span><div style=\"min-width:0\"><div class=\"rt\">What a customer costs to acquire</div><div class=\"rs\">Spend on a channel divided by buyers from that channel. Your own hours are spend.</div></div><div class=\"rmeta\"><b>Formula</b><span>spend \u00f7 buyers</span></div></div><div class=\"r\"><span class=\"n\">LTV</span><div style=\"min-width:0\"><div class=\"rt\">What they are worth over their life</div><div class=\"rs\">Average order value multiplied by one plus the repeat rate.</div></div><div class=\"rmeta\"><b>Formula</b><span>AOV \u00d7 (1+repeat)</span></div></div><div class=\"r\"><span class=\"n\">ROAS</span><div style=\"min-width:0\"><div class=\"rt\">What a channel returns</div><div class=\"rs\">Revenue from a channel divided by spend on it. Per channel, never blended.</div></div><div class=\"rmeta\"><b>Formula</b><span>revenue \u00f7 spend</span></div></div><div class=\"r\"><span class=\"n\">\u00f7</span><div style=\"min-width:0\"><div class=\"rt\">The ratio is the answer</div><div class=\"rs\">Around three times is the conventional floor. Below one you are paying for the privilege of having customers.</div></div><div class=\"rmeta\"><b>Watch</b><span>the ratio</span></div></div><div class=\"r\"><span class=\"n\">!</span><div style=\"min-width:0\"><div class=\"rt\">Cost your own time</div><div class=\"rs\">An organic channel is not free. Until your hours carry a rate, it cannot be compared with a paid one.</div></div><div class=\"rmeta\"><b>Most-skipped</b><span>step</span></div></div></div><div class=\"bar\"><span class=\"bl\">Watch the ratio, not the number</span><span class=\"bt\">$600 to acquire a customer is neither high nor low. Against $400 of lifetime value it is a business that dies; against $4,000 it is one you should be pouring money into.</span></div><div class=\"foot\">These are funnel-level definitions from the source material, not cohort-based SaaS accounting. Use them consistently rather than mixing them with another model.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Two numbers decide the business</span><span class=\"fbar\"><i style=\"width:54.9%\"></i></span><span class=\"pg num\">192<i> / 230</i></span></div></div>"},
