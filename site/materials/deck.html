 {day:"Day 1",section:"Your turn",title:"Your brand voice: three adjectives you are, and three you are deliberately not.",html:"<div class=\"slide\" data-i=\"63\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">51 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 8 of 12</span><span class=\"qk\">Short answer \u00b7 6+ words</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your brand voice: three adjectives you are, and three you are deliberately not.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Three and three</u><span>Both halves. The negatives are not optional.</span></div><div class=\"qc\"><u>Rejects copy</u><span>Each anti-adjective should kill a real sentence you've written.</span></div><div class=\"qc\"><u>Not universal</u><span>\u201cHonest\u201d and \u201chelpful\u201d describe everyone. Pick words that divide.</span></div></div><div class=\"foot\"><b>Why this one:</b> The anti-adjectives are the useful half. \u201cProfessional\u201d lets any generic sentence through; \u201cnot corporate\u201d rejects one on sight \u2014 and that is what a voice guide is for.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your brand voice: three adjectives you are, and three you are deliberately not.</span><span class=\"fbar\"><i style=\"width:70.8%\"></i></span><span class=\"pg num\">064<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q8 \u00b7 B2B SaaS",title:"SendFlow answers Q8",html:"<div class=\"slide\" data-i=\"64\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q8 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">52 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 8</u><p>Your brand voice: three adjectives you are, and three you are deliberately not.</p></div><div class=\"answer\"><u>How they answer it</u><p>Is: direct, technical, slightly irreverent. Is not: corporate, salesy, buzzword-driven.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Direct and technical match a buyer who is themselves technical and time-poor.</span></div><div class=\"w\"><i>2</i><span>\u201cNot salesy\u201d is a strong constraint for a company whose product <b>is</b> sales software.</span></div><div class=\"w\"><i>3</i><span>\u201cNot buzzword-driven\u201d rules out most of the category's stock phrases in one line.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cSlightly irreverent\u201d is the one doing the work \u2014 it is the only adjective here that a competitor would hesitate to claim.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q8</span><span class=\"fbar\"><i style=\"width:72.2%\"></i></span><span class=\"pg num\">065<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q8 \u00b7 B2B consulting brand",title:"Apex Growth answers Q8",html:"<div class=\"slide\" data-i=\"65\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q8 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">53 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 8</u><p>Your brand voice: three adjectives you are, and three you are deliberately not.</p></div><div class=\"answer\"><u>How they answer it</u><p>Is: measured, senior, plain-spoken. Is not: hypey, chummy, jargon-heavy.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>\u201cPlain-spoken\u201d is the antidote to the jargon their market associates with agencies.</span></div><div class=\"w\"><i>2</i><span>\u201cNot hypey\u201d pre-empts the exact tone that burned them with the previous vendor.</span></div><div class=\"w\"><i>3</i><span>\u201cNot chummy\u201d preserves the <b>peer-to-peer register</b> a Managing Partner expects.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Measured and senior are positioning, not personality. At this ticket the voice has to sound like the person who will actually do the work.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q8</span><span class=\"fbar\"><i style=\"width:73.6%\"></i></span><span class=\"pg num\">066<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q8 \u00b7 Solopreneur",title:"Sarah Chen answers Q8",html:"<div class=\"slide\" data-i=\"66\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q8 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">54 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 8</u><p>Your brand voice: three adjectives you are, and three you are deliberately not.</p></div><div class=\"answer\"><u>How they answer it</u><p>Is: warm, practical, honest about trade-offs. Is not: guru-ish, urgent, over-promising.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Warm and practical suit a buyer who will work directly with her every week.</span></div><div class=\"w\"><i>2</i><span>\u201cNot guru-ish\u201d is a deliberate rejection of the dominant tone in solo consulting.</span></div><div class=\"w\"><i>3</i><span>\u201cNot urgent\u201d rules out scarcity tactics, which would <b>contradict the offer itself</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cHonest about trade-offs\u201d is a voice choice that becomes a sales asset \u2014 it is the differentiator against the guru tone her market is tired of.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q8</span><span class=\"fbar\"><i style=\"width:75.0%\"></i></span><span class=\"pg num\">067<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Name your mechanism, then list its 3\u20135 steps and why each one is necessary.",html:"<div class=\"slide\" data-i=\"67\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">55 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 9 of 12</span><span class=\"qk\">Long answer \u00b7 30+ words</span><span class=\"qtime\">\u23f1 5 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Name your mechanism, then list its 3\u20135 steps and why each one is necessary.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>It has a name</u><span>Capitalised, ownable, and not a description of the category.</span></div><div class=\"qc\"><u>3\u20135 steps</u><span>Fewer than three is a slogan. More than five, nobody remembers.</span></div><div class=\"qc\"><u>A why per step</u><span>Each step must be necessary, and you must be able to say why.</span></div></div><div class=\"foot\"><b>Why this one:</b> An unnamed method is a commodity \u2014 anyone can claim they do outreach. A named method with a reason for each step is the thing you put on every page for the rest of the week.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Name your mechanism, then list its 3\u20135 steps and why each one is necessary.</span><span class=\"fbar\"><i style=\"width:76.4%\"></i></span><span class=\"pg num\">068<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q9 \u00b7 B2B SaaS",title:"SendFlow answers Q9",html:"<div class=\"slide\" data-i=\"68\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q9 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">56 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 9</u><p>Name your mechanism, then list its 3\u20135 steps and why each one is necessary.</p></div><div class=\"answer\"><u>How they answer it</u><p>Profile-to-Message. 1 Enrich the person, not the company. 2 Generate from their own signals. 3 Send inside safe daily caps. 4 Route replies to a human \u2014 automation stops where the conversation starts.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>\u201cProfile-to-Message\u201d names the transformation, not the technology.</span></div><div class=\"w\"><i>2</i><span>Step 1 is a contrarian claim \u2014 enrich the <b>person</b>, not the company \u2014 which makes it memorable.</span></div><div class=\"w\"><i>3</i><span>Step 3 names a real constraint, safe daily caps, which reads as operational competence.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The final step draws a line around the automation \u2014 <em>\u201cautomation stops where the conversation starts\u201d</em>. That single clause answers the adoption objection better than any feature list.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q9</span><span class=\"fbar\"><i style=\"width:77.8%\"></i></span><span class=\"pg num\">069<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q9 \u00b7 B2B consulting brand",title:"Apex Growth answers Q9",html:"<div class=\"slide\" data-i=\"69\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q9 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">57 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 9</u><p>Name your mechanism, then list its 3\u20135 steps and why each one is necessary.</p></div><div class=\"answer\"><u>How they answer it</u><p>The Partner Pipeline System. 1 Map the referral pattern you already have. 2 Turn it into an offer. 3 Build one repeatable channel. 4 Hand the operating rhythm to the team, so it survives you.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>\u201cThe Partner Pipeline System\u201d uses the buyer's own word \u2014 partner \u2014 in the name.</span></div><div class=\"w\"><i>2</i><span>It begins by mapping an existing referral pattern, so the firm is not asked to start from zero.</span></div><div class=\"w\"><i>3</i><span>The last step is explicitly about <b>surviving the consultant leaving</b>, which answers the scar.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Step 1 starts from what the firm already has rather than what it lacks. That is a far easier first step to say yes to than \u201cbuild a new channel\u201d.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q9</span><span class=\"fbar\"><i style=\"width:79.2%\"></i></span><span class=\"pg num\">070<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q9 \u00b7 Solopreneur",title:"Sarah Chen answers Q9",html:"<div class=\"slide\" data-i=\"70\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q9 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">58 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 9</u><p>Name your mechanism, then list its 3\u20135 steps and why each one is necessary.</p></div><div class=\"answer\"><u>How they answer it</u><p>Build-With, Not Build-For. 1 Decide together. 2 I build, you watch. 3 You build, I watch. 4 You own it \u2014 which is why it doesn't rot when I leave.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>\u201cBuild-With, Not Build-For\u201d is positioning and method in the same four words.</span></div><div class=\"w\"><i>2</i><span>The middle two steps are a <b>handover ladder</b>: I build you watch, you build I watch.</span></div><div class=\"w\"><i>3</i><span>\u201cIt doesn't rot when I leave\u201d names the failure mode of every done-for-you competitor.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The four steps are a deliberate transfer of ownership \u2014 decide, watch, do, own. The method is the anti-dependency argument, which is exactly what a solo operator should sell.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q9</span><span class=\"fbar\"><i style=\"width:80.6%\"></i></span><span class=\"pg num\">071<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Your strongest piece of proof \u2014 with a number, a name and a date.",html:"<div class=\"slide\" data-i=\"71\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">59 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 10 of 12</span><span class=\"qk\">Short answer \u00b7 12+ words</span><span class=\"qtime\">\u23f1 3 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your strongest piece of proof \u2014 with a number, a name and a date.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>A number</u><span>Something countable that changed.</span></div><div class=\"qc\"><u>A name</u><span>A person or company, with permission \u2014 or explicitly anonymised.</span></div><div class=\"qc\"><u>A date</u><span>Recent enough to be credible, specific enough to be checkable.</span></div></div><div class=\"foot\"><b>Why this one:</b> Proof is the cheapest conversion lever you own and the one most often left as a vague claim. If you have none, borrowed proof labelled as borrowed beats a confident sentence with nothing behind it.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your strongest piece of proof \u2014 with a number, a name and a date.</span><span class=\"fbar\"><i style=\"width:81.9%\"></i></span><span class=\"pg num\">072<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q10 \u00b7 B2B SaaS",title:"SendFlow answers Q10",html:"<div class=\"slide\" data-i=\"72\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q10 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">60 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 10</u><p>Your strongest piece of proof \u2014 with a number, a name and a date.</p></div><div class=\"answer\"><u>How they answer it</u><p>One customer moved from 15 manual touches per rep per day to 180 automated ones in three weeks, with reply rate holding steady.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The number is a behaviour change, not a revenue claim \u2014 easier to verify and harder to dispute.</span></div><div class=\"w\"><i>2</i><span>\u201cIn three weeks\u201d gives the prospect a timeline they can hold you to.</span></div><div class=\"w\"><i>3</i><span>Holding reply rate steady pre-empts the obvious objection that <b>volume destroys quality</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The steady reply rate is the load-bearing detail. Without it, 15 \u2192 180 reads as spam volume rather than a genuine productivity gain.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q10</span><span class=\"fbar\"><i style=\"width:83.3%\"></i></span><span class=\"pg num\">073<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q10 \u00b7 B2B consulting brand",title:"Apex Growth answers Q10",html:"<div class=\"slide\" data-i=\"73\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q10 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">61 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 10</u><p>Your strongest piece of proof \u2014 with a number, a name and a date.</p></div><div class=\"answer\"><u>How they answer it</u><p>A 40-partner firm went from 3 inbound enquiries a quarter to 11 a month within two quarters \u2014 named, with permission to use it.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>3 a quarter \u2192 11 a month is a shift in <b>cadence</b>, which is what predictability actually means.</span></div><div class=\"w\"><i>2</i><span>\u201cWithin two quarters\u201d sets a realistic expectation rather than promising overnight change.</span></div><div class=\"w\"><i>3</i><span>Permission to name the firm is stated, which is what separates proof from an anecdote.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Named, with written permission, at this ticket is worth more than three anonymous wins. The buyer will recognise the firm type immediately.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q10</span><span class=\"fbar\"><i style=\"width:84.7%\"></i></span><span class=\"pg num\">074<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q10 \u00b7 Solopreneur",title:"Sarah Chen answers Q10",html:"<div class=\"slide\" data-i=\"74\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q10 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">62 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 10</u><p>Your strongest piece of proof \u2014 with a number, a name and a date.</p></div><div class=\"answer\"><u>How they answer it</u><p>Borrowed for now: I have three unnamed before-and-afters and no permission yet. Getting written consent from two clients this week.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>She states plainly that she has no permission yet, rather than implying consent she lacks.</span></div><div class=\"w\"><i>2</i><span>Three before-and-afters exist; the gap is <b>documentation, not results</b>.</span></div><div class=\"w\"><i>3</i><span>A dated action \u2014 consent from two clients this week \u2014 turns the gap into a task, not an excuse.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Labelling proof as borrowed is not a weakness \u2014 it is the only version of this answer that survives contact with a sceptical buyer. The dated commitment to fix it is the real answer.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q10</span><span class=\"fbar\"><i style=\"width:86.1%\"></i></span><span class=\"pg num\">075<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Which dimensions does your offer actually improve?",html:"<div class=\"slide\" data-i=\"75\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">63 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 11 of 12</span><span class=\"qk\">Choose at least 3</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which dimensions does your offer actually improve?</div><div class=\"qopts\" style=\"--oc:2;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Acquisition \u2014 getting found at all</span></span><span class=\"qopt\"><i>B</i><span>Conversion \u2014 turning attention into buyers</span></span><span class=\"qopt\"><i>C</i><span>Retention \u2014 keeping the ones you win</span></span><span class=\"qopt\"><i>D</i><span>Ops &amp; data \u2014 knowing what is actually happening</span></span><span class=\"qopt\"><i>E</i><span>Pricing &amp; offer \u2014 what you sell and for how much</span></span><span class=\"qopt\"><i>F</i><span>Team &amp; process \u2014 who does what, repeatably</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>3\u20135 axes</u><span>Enough to differentiate, few enough to score quickly.</span></div><div class=\"qc\"><u>You can move it</u><span>Only pick dimensions your offer genuinely improves.</span></div><div class=\"qc\"><u>They feel it</u><span>The buyer must recognise the axis as one of their own problems.</span></div></div><div class=\"foot\"><b>Why this one:</b> These become the axes of your diagnostic. An axis you cannot genuinely move makes the whole score dishonest, and a prospect who scores badly on it will get a recommendation you cannot deliver.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which dimensions does your offer actually improve?</span><span class=\"fbar\"><i style=\"width:87.5%\"></i></span><span class=\"pg num\">076<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q11 \u00b7 B2B SaaS",title:"SendFlow answers Q11",html:"<div class=\"slide\" data-i=\"76\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q11 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">64 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 11</u><p>Which dimensions does your offer actually improve?</p></div><div class=\"answer\"><u>How they answer it</u><p>Acquisition \u00b7 Conversion \u00b7 Ops &amp; data \u2014 volume, personalisation quality and deliverability all live here.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Three axes only, each one directly touched by the product.</span></div><div class=\"w\"><i>2</i><span>\u201cOps & data\u201d is included because deliverability is genuinely a data problem for them.</span></div><div class=\"w\"><i>3</i><span>They leave out Retention and Pricing \u2014 <b>axes the tool does not move</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Retention is deliberately absent, even though it is the metric that matters most to their own business. Scoring an axis the product does not move would be dishonest.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q11</span><span class=\"fbar\"><i style=\"width:88.9%\"></i></span><span class=\"pg num\">077<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q11 \u00b7 B2B consulting brand",title:"Apex Growth answers Q11",html:"<div class=\"slide\" data-i=\"77\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q11 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">65 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 11</u><p>Which dimensions does your offer actually improve?</p></div><div class=\"answer\"><u>How they answer it</u><p>Acquisition \u00b7 Conversion \u00b7 Retention \u00b7 Ops &amp; data \u2014 the four a partner-led firm actually feels.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Retention is included because a 90-day build genuinely changes how clients are kept.</span></div><div class=\"w\"><i>2</i><span>Team & process is excluded \u2014 they advise on it but do not own it.</span></div><div class=\"w\"><i>3</i><span>Four axes suit a longer diagnostic, which fits a <b>five-figure sales conversation</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Four axes is the upper end, and justified here: a consultancy engagement touches more of the business than a tool does, so a wider diagnostic is honest.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q11</span><span class=\"fbar\"><i style=\"width:90.3%\"></i></span><span class=\"pg num\">078<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q11 \u00b7 Solopreneur",title:"Sarah Chen answers Q11",html:"<div class=\"slide\" data-i=\"78\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q11 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">66 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 11</u><p>Which dimensions does your offer actually improve?</p></div><div class=\"answer\"><u>How they answer it</u><p>Acquisition \u00b7 Conversion \u00b7 Pricing &amp; offer \u2014 lead flow, offer clarity and follow-up consistency.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Three axes keeps the diagnostic short enough for her to score by hand.</span></div><div class=\"w\"><i>2</i><span>Pricing & offer is included because repositioning is often her <b>highest-leverage first move</b>.</span></div><div class=\"w\"><i>3</i><span>Ops & data is excluded honestly \u2014 she does not build systems at that depth.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Including Pricing & offer is the sharpest choice here. It is the axis most solo consultants can actually move fastest, and the one their buyers are least willing to raise unprompted.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q11</span><span class=\"fbar\"><i style=\"width:91.7%\"></i></span><span class=\"pg num\">079<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Your three band labels, and the rule that maps a band to a recommended rung.",html:"<div class=\"slide\" data-i=\"79\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">67 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 12 of 12</span><span class=\"qk\">Long answer \u00b7 20+ words</span><span class=\"qtime\">\u23f1 5 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your three band labels, and the rule that maps a band to a recommended rung.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Three bands</u><span>Named after the state they're in, not \u201clow / medium / high\u201d.</span></div><div class=\"qc\"><u>A numeric rule</u><span>A score range that maps to a band with no judgement call.</span></div><div class=\"qc\"><u>A rung each</u><span>Every band ends at something you actually sell.</span></div></div><div class=\"foot\"><b>Why this one:</b> Write the rule down and commit to it. A written rule can be A/B tested next month; a hunch applied differently to each lead can only be argued about.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your three band labels, and the rule that maps a band to a recommended rung.</span><span class=\"fbar\"><i style=\"width:93.1%\"></i></span><span class=\"pg num\">080<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q12 \u00b7 B2B SaaS",title:"SendFlow answers Q12",html:"<div class=\"slide\" data-i=\"80\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q12 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">68 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 12</u><p>Your three band labels, and the rule that maps a band to a recommended rung.</p></div><div class=\"answer\"><u>How they answer it</u><p>Manual (0\u201340) \u2192 audit. Semi-automated (41\u201375) \u2192 platform seat. At-scale (76\u2013100) \u2192 managed programme.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The three bands are stages of automation maturity \u2014 a ladder the buyer can see themselves on.</span></div><div class=\"w\"><i>2</i><span>Each band maps to a real, purchasable rung, including the audit at the bottom.</span></div><div class=\"w\"><i>3</i><span>The score ranges are explicit, so <b>two different reps produce the same recommendation</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Band names describe a <em>stage of maturity</em>, so the prospect self-identifies before the recommendation arrives. \u201cManual\u201d is a diagnosis nobody argues with.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q12</span><span class=\"fbar\"><i style=\"width:94.4%\"></i></span><span class=\"pg num\">081<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q12 \u00b7 B2B consulting brand",title:"Apex Growth answers Q12",html:"<div class=\"slide\" data-i=\"81\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q12 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">69 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 12</u><p>Your three band labels, and the rule that maps a band to a recommended rung.</p></div><div class=\"answer\"><u>How they answer it</u><p>Referral-dependent (0\u201340) \u2192 entry diagnostic. Inconsistent (41\u201375) \u2192 the 90-day build. Scaling-blocked (76\u2013100) \u2192 retainer.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The bottom band names the problem the whole market has \u2014 dependence on referrals.</span></div><div class=\"w\"><i>2</i><span>The middle band routes to the core 90-day offer, where most of the revenue should land.</span></div><div class=\"w\"><i>3</i><span>The top band routes to the retainer, making the diagnostic an <b>ascension mechanism</b> too.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cReferral-dependent\u201d is a diagnosis a partner will accept about their own firm, which is exactly what a band label has to achieve.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q12</span><span class=\"fbar\"><i style=\"width:95.8%\"></i></span><span class=\"pg num\">082<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q12 \u00b7 Solopreneur",title:"Sarah Chen answers Q12",html:"<div class=\"slide\" data-i=\"82\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q12 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">70 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 12</u><p>Your three band labels, and the rule that maps a band to a recommended rung.</p></div><div class=\"answer\"><u>How they answer it</u><p>Feast-or-famine (0\u201340) \u2192 diagnostic. Inconsistent (41\u201375) \u2192 six-week build. Ready to scale (76\u2013100) \u2192 ongoing optimisation.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The band names are her buyers' own words, not invented category terms.</span></div><div class=\"w\"><i>2</i><span>The bottom band routes to a small paid diagnostic rather than a free call, which filters tyre-kickers.</span></div><div class=\"w\"><i>3</i><span>The top band creates the retention offer she admitted on Day 3 she <b>does not yet have</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cFeast-or-famine\u201d is the phrase her buyers already use about themselves. A band label lifted from the market's own vocabulary needs no explanation.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q12</span><span class=\"fbar\"><i style=\"width:97.2%\"></i></span><span class=\"pg num\">083<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 output",title:"What lands in your inbox tonight",html:"<div class=\"slide\" data-i=\"83\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 output</span><span class=\"sp\"></span><span class=\"step num\">71 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Day 1 output</div><div class=\"h2\">What lands in your inbox tonight</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Your ICP, persona and objection</div><div class=\"rs\">Filterable enough for a list-building tool \u2014 with the objection in their words, not yours.</div></div><div class=\"rmeta\"><b>From</b><span>Q1\u2013Q3</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Your offer sentence, rung and funnel type</div><div class=\"rs\">Pressure-tested against the value equation, with the build-hour estimate for the shape you chose.</div></div><div class=\"rmeta\"><b>From</b><span>Q4\u2013Q6</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Your five blocks and your voice guide</div><div class=\"rs\">Offer, ICP, brand, mechanism and proof in one structured file, formatted to paste into any AI tool.</div></div><div class=\"rmeta\"><b>From</b><span>Q7\u2013Q10</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Your diagnostic design</div><div class=\"rs\">Axes, weights, bands and the rule that maps a band to a recommended rung.</div></div><div class=\"rmeta\"><b>From</b><span>Q11\u2013Q12</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">A spec outline, and your three-day work plan</div><div class=\"rs\">The skeleton tomorrow's build reads directly \u2014 plus what you build on each of the next two days.</div></div><div class=\"rmeta\"><b>Generated</b><span>from all twelve</span></div></div></div><div class=\"bar\"><span class=\"bl\">Delivery</span><span class=\"bt\">PDF plus a live link, by email and WhatsApp, this evening.</span></div><div class=\"foot\">The generator runs on submitted answers only \u2014 a half-finished day produces a half-finished plan.</div></div><div class=\"sfoot\"><span class=\"ftitle\">What lands in your inbox tonight</span><span class=\"fbar\"><i style=\"width:98.6%\"></i></span><span class=\"pg num\">084<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 homework",title:"Tonight \u2014 three tasks",html:"<div class=\"slide\" data-i=\"84\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 homework</span><span class=\"sp\"></span><span class=\"step num\">72 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Tonight</div><div class=\"h2\">Three things, about an hour</div><div class=\"lede\">One of these has a hard external wait attached. It is the only task this week that cannot be compressed by working harder tomorrow \u2014 and tomorrow is the heaviest day.</div><div class=\"check fill\"><div class=\"ck\"><span class=\"box\"></span><div style=\"min-width:0\"><div class=\"ct\">Buy your sending domains and start warm-up</div><div class=\"cs\">Two to three weeks of warm-up before you can send at volume. Start it tonight or your launch date moves.</div></div><span class=\"cmin\">15 min</span></div><div class=\"ck\"><span class=\"box\"></span><div style=\"min-width:0\"><div class=\"ct\">Send the ICP questions to five real customers</div><div class=\"cs\">Their words, not your summary. You need the verbatim objection for tomorrow's page headlines.</div></div><span class=\"cmin\">10 min</span></div><div class=\"ck\"><span class=\"box\"></span><div style=\"min-width:0\"><div class=\"ct\">Every screenshot, number, testimonial and logo into one folder</div><div class=\"cs\">One place, each file renamed after the objection it answers \u2014 not three drives and a Slack thread you will search tomorrow.</div></div><span class=\"cmin\">30 min</span></div></div><div class=\"bar warn\"><span class=\"bl\">Skip nothing</span><span class=\"bt\">Day 2 builds your pages from the objection you collect tonight, and attaches a piece of proof to every one of them.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Tonight \u2014 three tasks</span><span class=\"fbar\"><i style=\"width:100.0%\"></i></span><span class=\"pg num\">085<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Session 2 of 3",title:"Day 2 \u2014 Build every element",html:"<div class=\"slide inv\" data-i=\"85\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Session 2 of 3</span><span class=\"sp\"></span><span class=\"step num\">1 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"coverwrap\"><div style=\"display:flex;align-items:flex-end;gap:2cqw\"><div class=\"daynum\">2</div><div style=\"flex:1;min-width:0;padding-bottom:1.2cqh\"><div class=\"k\">Day 2 \u00b7 ~60 min + Q&amp;A</div><div class=\"h1\" style=\"font-size:3.9cqw\">Build every element</div><div class=\"lede\" style=\"margin-top:.8cqh\">The heavy day. Traffic limits, the Tantra Pro Funnel, the Tantra Pro Flow, the run of show and the close chain.</div></div></div><div class=\"cards\" style=\"--n:4\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">S1 traffic</div><div class=\"cb\">Daily caps and the weekly gate</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">S2 pages</div><div class=\"cb\">What each version must not have</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">S3 nurture</div><div class=\"cb\">Six touches before, two branches after</div></div><div class=\"card\"><div class=\"cn\">4</div><div class=\"ct\">S4\u2013S5</div><div class=\"cb\">Run of show, then the close</div></div></div><div class=\"bar\"><span class=\"bl\">You leave with</span><span class=\"bt\">Every element built: infrastructure, channel variants, the Tantra Pro Funnel, the Tantra Pro Flow, the run of show and the close chain.</span></div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Day 2 \u2014 Build every element</span><span class=\"fbar\"><i style=\"width:1.5%\"></i></span><span class=\"pg num\">086<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 index",title:"Today's session",html:"<div class=\"slide\" data-i=\"86\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 index</span><span class=\"sp\"></span><span class=\"step num\">2 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Session index</div><div class=\"h2\">The heaviest day \u2014 what the next hour covers</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Build order</div><div class=\"rs\">Why the core comes before the traffic.</div></div><div class=\"rmeta\"><b>3 min</b><span>sequencing</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">S1 \u00b7 traffic</div><div class=\"rs\">Per-channel daily caps and email hygiene.</div></div><div class=\"rmeta\"><b>6 min</b><span>limits</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">S2 \u00b7 the page</div><div class=\"rs\">What each version has, and what it must not have.</div></div><div class=\"rmeta\"><b>5 min</b><span>pages</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">S3 \u00b7 nurture</div><div class=\"rs\">Six touches before, two branches after.</div></div><div class=\"rmeta\"><b>6 min</b><span>sequences</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">S4\u2013S5 \u00b7 delivery and close</div><div class=\"rs\">Run of show, polls, and the five-touch close chain.</div></div><div class=\"rmeta\"><b>8 min</b><span>delivery</span></div></div><div class=\"r\"><span class=\"n\">6</span><div style=\"min-width:0\"><div class=\"rt\">Your 13 questions</div><div class=\"rs\">Answered live, three ways each.</div></div><div class=\"rmeta\"><b>15 min</b><span>your turn</span></div></div></div><div class=\"bar\"><span class=\"bl\">Tonight</span><span class=\"bt\">Every API key, login and domain in one place \u2014 tomorrow you connect everything.</span></div><div class=\"foot\">Times are a guide \u2014 questions run long when the room is working, and that is the point.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Today's session</span><span class=\"fbar\"><i style=\"width:2.9%\"></i></span><span class=\"pg num\">087<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 payoff",title:"What you walk out with today",html:"<div class=\"slide\" data-i=\"87\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 payoff</span><span class=\"sp\"></span><span class=\"step num\">3 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Stay to the end because</div><div class=\"h2\">By the end of this session you will have</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Your channels, with their caps</div><div class=\"rs\">Two channels chosen, and the daily limits written down.</div></div><div class=\"rmeta\"><b>Q1</b><span>committed</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Two headlines to test</div><div class=\"rs\">One benefit-led, one problem-led using your Day 1 objection.</div></div><div class=\"rmeta\"><b>Q2</b><span>both variants</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">A form that converts</div><div class=\"rs\">Only the fields you will genuinely act on this week.</div></div><div class=\"rmeta\"><b>Q3</b><span>minimised</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">A staffed run of show</div><div class=\"rs\">Five roles with real names, and the minute the offer lands.</div></div><div class=\"rmeta\"><b>Q5</b><span>named</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Your missing close-chain link</div><div class=\"rs\">Named honestly, and costed.</div></div><div class=\"rmeta\"><b>Q6</b><span>diagnosed</span></div></div></div><div class=\"bar\"><span class=\"bl\">The heaviest day</span><span class=\"bt\">More gets built today than on any other. Yesterday's homework \u2014 the objection and the proof folder \u2014 is what makes it possible.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">What you walk out with today</span><span class=\"fbar\"><i style=\"width:4.4%\"></i></span><span class=\"pg num\">088<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 sequencing",title:"Build the core before the traffic",html:"<div class=\"slide\" data-i=\"88\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 sequencing</span><span class=\"sp\"></span><span class=\"step num\">4 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Build in this order, and only this order</div><div class=\"h2\">The funnel core before the traffic</div><div class=\"lede\">Build the pages, sequences, delivery and close first. Attach traffic on top of a finished machine. People do it backwards, switch on traffic into a half-built funnel, and burn a list they can never un-burn.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Traffic is the cheapest thing to add</div><div class=\"cb\">And the most expensive thing to waste. A list that has seen a broken funnel does not get a second first impression.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">A half-built funnel teaches you nothing</div><div class=\"cb\">If three steps are missing, a bad result tells you nothing about the steps that do exist.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Rehearse before you send</div><div class=\"cb\">A tech rehearsal before the first live session is the step people skip and the one they regret publicly.</div></div></div><div class=\"bar\"><span class=\"bl\">The gate</span><span class=\"bt\">Nothing goes out to a real list until one person has walked the whole funnel end to end, including a real purchase.</span></div><div class=\"foot\">Source: the pre-launch QA gate and rehearsal ritual across the build and webinar playbooks.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Build the core before the traffic</span><span class=\"fbar\"><i style=\"width:5.9%\"></i></span><span class=\"pg num\">089<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S1",title:"Daily caps, per channel",html:"<div class=\"slide\" data-i=\"89\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S1</span><span class=\"sp\"></span><span class=\"step num\">5 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">S1 \u00b7 traffic</div><div class=\"h2\" style=\"font-size:2.35cqw\">Daily limits, and the weekly scale-or-fix gate</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 560\" role=\"img\" aria-label=\"Traffic channel operating limits table for cold calendar, cold email, LinkedIn outreach, paid ads and content, each with its daily caps and the failure that breaks it. Below, a weekly decision gate splitting into three outcomes: scale when click-through is at least three percent and conversion at least one and a half percent with bounce at or under two percent; hold and change one variable otherwise; and fix immediately when open rate is under fifteen percent, click-through under one percent, or bounce over five percent.\">\n          <defs>\n            <marker id=\"LIMITS_t1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">DAILY OPERATING LIMITS \u00b7 exceed these and you burn the asset, not just the campaign</text>\n          <line x1=\"16\" y1=\"36\" x2=\"844\" y2=\"36\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <text x=\"32\" y=\"52\" class=\"svmute\" font-size=\"9.5\">CHANNEL</text><text x=\"200\" y=\"52\" class=\"svmute\" font-size=\"9.5\">THE LIMITS</text><text x=\"832\" y=\"52\" text-anchor=\"end\" class=\"svmute\" font-size=\"9.5\">WHAT BREAKS IF YOU IGNORE THEM</text>\n          <g font-size=\"10.5\">\n            <rect x=\"16\" y=\"62\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"80\" class=\"svlabel\" font-size=\"11\">Cold calendar</text><text x=\"32\" y=\"96\" class=\"svmute\" font-size=\"9.5\">invites from service accounts</text>\n            <text x=\"200\" y=\"80\" class=\"svsub\">20/day per cold inbox \u00b7 50/day once warmed \u00b7 SPF + DKIM + DMARC before the first send</text>\n            <text x=\"200\" y=\"96\" class=\"svmute\" font-size=\"9.5\">anonymous domains only \u2014 never your main brand domain</text>\n            <text x=\"832\" y=\"96\" text-anchor=\"end\" fill=\"var(--pink)\" font-size=\"10\">the domain, permanently</text>\n\n            <rect x=\"16\" y=\"112\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"130\" class=\"svlabel\" font-size=\"11\">Cold email</text><text x=\"32\" y=\"146\" class=\"svmute\" font-size=\"9.5\">sequenced outreach</text>\n            <text x=\"200\" y=\"130\" class=\"svsub\">20/day unwarmed \u2192 50/day warmed \u00b7 2\u20133 weeks of warm-up \u00b7 verify the list below 1% bounce</text>\n            <text x=\"200\" y=\"146\" class=\"svmute\" font-size=\"9.5\">reject any purchased list with more than 1\u20132% duplicates</text>\n            <text x=\"832\" y=\"146\" text-anchor=\"end\" fill=\"var(--pink)\" font-size=\"10\">inbox placement for every domain</text>\n\n            <rect x=\"16\" y=\"162\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"180\" class=\"svlabel\" font-size=\"11\">LinkedIn outreach</text><text x=\"32\" y=\"196\" class=\"svmute\" font-size=\"9.5\">connect \u00b7 message \u00b7 InMail</text>\n            <text x=\"200\" y=\"180\" class=\"svsub\">connects ramp 15 \u2192 75/day \u00b7 messages 50/day \u00b7 InMail 30/day \u00b7 event invites 140\u2013150/day</text>\n            <text x=\"200\" y=\"196\" class=\"svmute\" font-size=\"9.5\">75/day is the total messaging cap across campaigns \u00b7 lists export in chunks of 2,500</text>\n            <text x=\"832\" y=\"196\" text-anchor=\"end\" fill=\"var(--pink)\" font-size=\"10\">the account, with no appeal</text>\n\n            <rect x=\"16\" y=\"212\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel)\"/>\n            <text x=\"32\" y=\"230\" class=\"svlabel\" font-size=\"11\">Paid ads</text><text x=\"32\" y=\"246\" class=\"svmute\" font-size=\"9.5\">cold + retargeting</text>\n            <text x=\"200\" y=\"230\" class=\"svsub\">smallest viable budget first \u00b7 one variable per test \u00b7 retargeting pool live from day one</text>\n            <text x=\"200\" y=\"246\" class=\"svmute\" font-size=\"9.5\">prove the funnel converts on cheap learning traffic before you scale spend</text>\n            <text x=\"832\" y=\"246\" text-anchor=\"end\" fill=\"var(--pink)\" font-size=\"10\">your budget, fastest of all</text>\n\n            <rect x=\"16\" y=\"262\" width=\"828\" height=\"44\" rx=\"8\" fill=\"var(--panel-2)\"/>\n            <text x=\"32\" y=\"280\" class=\"svlabel\" font-size=\"11\">Content \u00b7 organic</text><text x=\"32\" y=\"296\" class=\"svmute\" font-size=\"9.5\">the only channel that compounds</text>\n            <text x=\"200\" y=\"280\" class=\"svsub\">batch, never improvise \u00b7 1 pillar \u2192 5 clips \u2192 quotes \u00b7 post to the event every 3 days</text>\n            <text x=\"200\" y=\"296\" class=\"svmute\" font-size=\"9.5\">every link UTM-tagged, or none of this is attributable</text>\n            <text x=\"832\" y=\"296\" text-anchor=\"end\" fill=\"var(--amber)\" font-size=\"10\">nothing \u2014 it just quietly stops</text>\n          </g>\n          <!-- decision gate -->\n          <line x1=\"16\" y1=\"320\" x2=\"844\" y2=\"320\" stroke=\"var(--line-2)\" stroke-width=\"1.5\"/>\n          <rect x=\"330\" y=\"334\" width=\"200\" height=\"44\" rx=\"11\" fill=\"var(--accent)\"/>\n          <text x=\"430\" y=\"352\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"12\">EVERY WEEK, PER CHANNEL</text>\n          <text x=\"430\" y=\"368\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"10\">read the numbers, then pick one</text>\n          <g fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.6\" opacity=\".6\" marker-end=\"url(#LIMITS_t1)\">\n            <path d=\"M380 378 C380 400 220 396 150 410\"/>\n            <path d=\"M430 378 L430 410\"/>\n            <path d=\"M480 378 C480 400 640 396 710 410\"/>\n          </g>\n          <rect x=\"16\" y=\"416\" width=\"268\" height=\"128\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"150\" y=\"440\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12.5\">SCALE IT</text>\n          <text x=\"150\" y=\"462\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">CTR \u2265 3%  AND  conv \u2265 1.5%</text>\n          <text x=\"150\" y=\"479\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">AND  bounce \u2264 2%</text>\n          <line x1=\"44\" y1=\"494\" x2=\"256\" y2=\"494\" stroke=\"var(--teal)\" opacity=\".3\"/>\n          <text x=\"150\" y=\"514\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Add volume. Add inboxes or</text>\n          <text x=\"150\" y=\"530\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">budget \u2014 not new variables.</text>\n\n          <rect x=\"296\" y=\"416\" width=\"268\" height=\"128\" rx=\"12\" fill=\"var(--amber-bg)\"/>\n          <text x=\"430\" y=\"440\" text-anchor=\"middle\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"12.5\">HOLD AND TUNE</text>\n          <text x=\"430\" y=\"462\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">anywhere between the two</text>\n          <text x=\"430\" y=\"479\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">bands on either side</text>\n          <line x1=\"324\" y1=\"494\" x2=\"536\" y2=\"494\" stroke=\"var(--amber)\" opacity=\".3\"/>\n          <text x=\"430\" y=\"514\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Change exactly one variable.</text>\n          <text x=\"430\" y=\"530\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Re-measure before touching another.</text>\n\n          <rect x=\"576\" y=\"416\" width=\"268\" height=\"128\" rx=\"12\" fill=\"var(--pink-bg)\"/>\n          <text x=\"710\" y=\"440\" text-anchor=\"middle\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"12.5\">FIX IT TODAY</text>\n          <text x=\"710\" y=\"462\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">open &lt; 15%  OR  CTR &lt; 1%</text>\n          <text x=\"710\" y=\"479\" text-anchor=\"middle\" class=\"svsub\" font-size=\"10.5\">OR  bounce &gt; 5%</text>\n          <line x1=\"604\" y1=\"494\" x2=\"816\" y2=\"494\" stroke=\"var(--pink)\" opacity=\".3\"/>\n          <text x=\"710\" y=\"514\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Stop sending on that inbox now.</text>\n          <text x=\"710\" y=\"530\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">Low open = deliverability. Low CTR = offer.</text>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Every channel has an operating ceiling</div><div class=\"ab\">These are policy limits, not targets \u2014 exceeding them risks the account or the domain, not just the campaign.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Volume comes from more senders, never more sends</div><div class=\"ab\">Cold email scales by adding warmed inboxes at 30\u201350 sends a day each, not by pushing one inbox harder.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Message limits track accept rate</div><div class=\"ab\">On LinkedIn the connection cap and the message cap move together. A low accept rate lowers your ceiling automatically.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Read the cap for each channel you ticked, and write it into your plan before you send anything.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Daily caps, per channel</span><span class=\"fbar\"><i style=\"width:7.4%\"></i></span><span class=\"pg num\">090<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S1",title:"Email infrastructure, before anything",html:"<div class=\"slide\" data-i=\"90\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S1</span><span class=\"sp\"></span><span class=\"step num\">6 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Cold email hygiene</div><div class=\"h2\">The four things that decide whether you land or bounce</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Dedicated sending domains</div><div class=\"rs\">Never your main domain. A burned domain takes your whole company's email with it.</div></div><div class=\"rmeta\"><b>Setup</b><span>day one</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">SPF, DKIM and DMARC</div><div class=\"rs\">All three, verified. Any one missing and a growing share of mail is filtered before a human sees it.</div></div><div class=\"rmeta\"><b>Setup</b><span>day one</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Two to three weeks of warm-up</div><div class=\"rs\">Gradual volume ramp before real sending. This is the hard external wait from Day 1's homework.</div></div><div class=\"rmeta\"><b>Wait</b><span>2\u20133 weeks</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Thirty to fifty sends per inbox per day</div><div class=\"rs\">The hygiene ceiling. More inboxes, not more sends per inbox.</div></div><div class=\"rmeta\"><b>Ongoing</b><span>per inbox</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">A master list, checked before every launch</div><div class=\"rs\">So the same person is not messaged on three channels in one week.</div></div><div class=\"rmeta\"><b>Ongoing</b><span>every send</span></div></div></div><div class=\"bar\"><span class=\"bl\">Why this is on the build day</span><span class=\"bt\">Warm-up is the only task this week with a hard external wait. Everything else can be compressed by working harder; this cannot.</span></div><div class=\"foot\">Source: the traffic playbook and the master-list discipline in the webinar playbook.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Email infrastructure, before anything</span><span class=\"fbar\"><i style=\"width:8.8%\"></i></span><span class=\"pg num\">091<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S2",title:"What the Tantra Pro Funnel page must not have",html:"<div class=\"slide\" data-i=\"91\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S2</span><span class=\"sp\"></span><span class=\"step num\">7 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">S2 \u00b7 the page</div><div class=\"h2\" style=\"font-size:2.35cqw\">What the page has \u2014 and what it must not have</div><div class=\"viz\"><svg viewBox=\"0 0 860 476\" role=\"img\" aria-label=\"Landing page wireframe: the Tantra Pro Funnel page with nine blocks: logo and trust strip, headline and subhead, video, three proof points, registration form above the fold, the named mechanism, testimonials, an FAQ, and a sticky call to action. Beside it: the conversion figure, the form fields, and what the page must not have.\">\n          <rect x=\"16\" y=\"14\" width=\"828\" height=\"34\" rx=\"9\" fill=\"var(--teal)\"/>\n          <text x=\"430\" y=\"34\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"12.5\">TANTRA PRO FUNNEL \u00b7 the registration page</text>\n\n          <rect x=\"16\" y=\"60\" width=\"508\" height=\"400\" rx=\"12\" class=\"node\" stroke=\"var(--teal)\"/>\n          <g font-size=\"10.5\">\n            <rect x=\"34\" y=\"76\" width=\"472\" height=\"26\" rx=\"6\" fill=\"var(--line)\"/><text x=\"48\" y=\"93\" class=\"svsub\" font-size=\"10\">logo + trust strip (logos, counts, certifications)</text>\n            <rect x=\"34\" y=\"110\" width=\"472\" height=\"44\" rx=\"6\" fill=\"var(--teal-bg)\"/><text x=\"48\" y=\"128\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11\">Headline + subhead</text><text x=\"48\" y=\"145\" class=\"svmute\" font-size=\"9.5\">promise, then the mechanism in one line</text>\n            <rect x=\"34\" y=\"162\" width=\"472\" height=\"60\" rx=\"6\" fill=\"var(--teal-bg)\"/><text x=\"48\" y=\"180\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11\">Video</text><text x=\"48\" y=\"197\" class=\"svmute\" font-size=\"9.5\">60\u201390 seconds, autoplay muted, captioned</text><text x=\"48\" y=\"213\" class=\"svmute\" font-size=\"9.5\">its only job is to make the promise credible</text>\n            <rect x=\"34\" y=\"230\" width=\"472\" height=\"28\" rx=\"6\" fill=\"var(--line)\"/><text x=\"48\" y=\"248\" class=\"svsub\" font-size=\"10\">3 proof points \u00b7 numbers, not adjectives</text>\n            <rect x=\"34\" y=\"266\" width=\"472\" height=\"54\" rx=\"6\" fill=\"var(--accent-2)\"/><text x=\"48\" y=\"283\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">Registration form \u2014 above the fold</text><text x=\"48\" y=\"298\" class=\"svmute\" font-size=\"9.5\">on a 1366\u00d7768 laptop, without scrolling</text><text x=\"48\" y=\"312\" class=\"svmute\" font-size=\"9.5\">repeat it further down; never make them hunt</text>\n            <rect x=\"34\" y=\"328\" width=\"472\" height=\"26\" rx=\"6\" fill=\"var(--line)\"/><text x=\"48\" y=\"345\" class=\"svsub\" font-size=\"10\">the mechanism, named \u2014 your 3\u20135 steps</text>\n            <rect x=\"34\" y=\"362\" width=\"472\" height=\"26\" rx=\"6\" fill=\"var(--line)\"/><text x=\"48\" y=\"379\" class=\"svsub\" font-size=\"10\">testimonials, each tagged to an objection</text>\n            <rect x=\"34\" y=\"396\" width=\"472\" height=\"26\" rx=\"6\" fill=\"var(--line)\"/><text x=\"48\" y=\"413\" class=\"svsub\" font-size=\"10\">FAQ \u2014 literally your objection list, answered</text>\n            <rect x=\"34\" y=\"430\" width=\"472\" height=\"22\" rx=\"6\" fill=\"var(--teal)\"/><text x=\"270\" y=\"445\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"10.5\">sticky CTA \u2014 follows them down the page</text>\n          </g>\n\n          <rect x=\"540\" y=\"60\" width=\"304\" height=\"100\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"692\" y=\"96\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"22\">9.6%</text>\n          <text x=\"692\" y=\"120\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">conversion \u00b7 72% scroll depth</text>\n          <text x=\"692\" y=\"140\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">teaching model</text>\n\n          <rect x=\"540\" y=\"172\" width=\"304\" height=\"120\" rx=\"12\" class=\"node\"/>\n          <text x=\"556\" y=\"196\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11\">The form, field by field</text>\n          <text x=\"556\" y=\"220\" class=\"svmute\" font-size=\"9.5\">first name \u00b7 last name \u00b7 business email</text>\n          <text x=\"556\" y=\"240\" class=\"svmute\" font-size=\"9.5\">+ profile link (you'll need it for follow-up)</text>\n          <text x=\"556\" y=\"260\" class=\"svmute\" font-size=\"9.5\">phone only if you will actually call</text>\n          <text x=\"556\" y=\"280\" class=\"svmute\" font-size=\"9.5\">every extra field costs completions</text>\n\n          <rect x=\"540\" y=\"304\" width=\"304\" height=\"156\" rx=\"12\" class=\"node\"/>\n          <text x=\"556\" y=\"328\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"11\">What it must not have</text>\n          <text x=\"556\" y=\"352\" class=\"svmute\" font-size=\"9.5\">nav links that lead off the page</text>\n          <text x=\"556\" y=\"372\" class=\"svmute\" font-size=\"9.5\">a form the visitor has to hunt for</text>\n          <text x=\"556\" y=\"392\" class=\"svmute\" font-size=\"9.5\">a block that answers no objection</text>\n          <text x=\"556\" y=\"412\" class=\"svmute\" font-size=\"9.5\">more than one action to take</text>\n          <text x=\"556\" y=\"440\" class=\"svsub\" font-size=\"10\">Every block answers one objection</text>\n          <text x=\"556\" y=\"454\" class=\"svsub\" font-size=\"10\">and drives one action.</text>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Every field costs completions</div><div class=\"cb\">The field you are tempted to add \u201cjust in case\u201d is almost always the one to cut. Enrich afterwards instead of asking.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Two headlines, deliberately opposed</div><div class=\"cb\">Benefit-led leads with the outcome. Problem-led opens with the verbatim objection you collected on Day 1.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Watch form abandonment, not just conversion</div><div class=\"cb\">People who started typing and stopped wanted to and were blocked. That number names the field to delete.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">What the page leaves out is a design decision, not an oversight.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">What the Tantra Pro Funnel page must not have</span><span class=\"fbar\"><i style=\"width:10.3%\"></i></span><span class=\"pg num\">092<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S2",title:"The number nobody watches",html:"<div class=\"slide\" data-i=\"92\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S2</span><span class=\"sp\"></span><span class=\"step num\">8 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The number nobody watches</div><div class=\"h2\" style=\"font-size:2.5cqw\">Form abandonment tells you what to delete</div><div class=\"statwrap\"><div><div class=\"statbig\">Started<br>\u2260 finished</div><div class=\"statsub\">Conversion rate tells you something is wrong. Per-field abandonment tells you exactly which field to remove \u2014 and every field you remove is a measurable lift rather than a redesign.</div></div><div class=\"bars\"><div class=\"bx\"><div class=\"bhd\"><b>Visitors who never start the form</b><span>a copy problem</span></div><div class=\"tr\"><i style=\"width:100%\"></i></div></div><div class=\"bx on\"><div class=\"bhd\"><b>Visitors who start and abandon</b><span>a &lt;b&gt;form&lt;/b&gt; problem</span></div><div class=\"tr\"><i style=\"width:100%\"></i></div></div><div class=\"bx\"><div class=\"bhd\"><b>Visitors who complete</b><span>your conversion rate</span></div><div class=\"tr\"><i style=\"width:100%\"></i></div></div></div></div><div class=\"foot\">No figures here \u2014 the point is which of the three you are measuring. Most teams track only the third and therefore cannot tell the first two apart.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The number nobody watches</span><span class=\"fbar\"><i style=\"width:11.8%\"></i></span><span class=\"pg num\">093<i> / 230</i></span></div></div>"},
