 {day:"Day 1",section:"Day 1 \u00b7 index",title:"Today's session",html:"<div class=\"slide\" data-i=\"14\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 index</span><span class=\"sp\"></span><span class=\"step num\">2 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Session index</div><div class=\"h2\">Two halves, and what each one settles</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Why a funnel beats random marketing</div><div class=\"rs\">The one structural difference.</div></div><div class=\"rmeta\"><b>3 min</b><span>framing</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Part A \u00b7 who you're for, and what you sell</div><div class=\"rs\">ICP, the offer, the funnel shape and the arithmetic.</div></div><div class=\"rmeta\"><b>27 min</b><span>strategy</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Your first six questions</div><div class=\"rs\">Answered live, three ways each.</div></div><div class=\"rmeta\"><b>15 min</b><span>your turn</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Part B \u00b7 the conversion engine</div><div class=\"rs\">Five blocks, the diagnostic, and one spec file.</div></div><div class=\"rmeta\"><b>25 min</b><span>the engine</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Your second six questions</div><div class=\"rs\">The engine, filled in with your own answers.</div></div><div class=\"rmeta\"><b>15 min</b><span>your turn</span></div></div><div class=\"r\"><span class=\"n\">6</span><div style=\"min-width:0\"><div class=\"rt\">Q&A on your own funnel</div><div class=\"rs\">Not on the theory \u2014 on yours.</div></div><div class=\"rmeta\"><b>15 min</b><span>live Q&amp;A</span></div></div></div><div class=\"bar\"><span class=\"bl\">Tonight</span><span class=\"bt\">Two tasks \u2014 one has a hard external wait, so it has to start today, and one is the proof folder tomorrow's build reads from.</span></div><div class=\"foot\">Times are a guide \u2014 questions run long when the room is working, and that is the point.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Today's session</span><span class=\"fbar\"><i style=\"width:2.8%\"></i></span><span class=\"pg num\">015<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 payoff",title:"What you walk out with today",html:"<div class=\"slide\" data-i=\"15\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 payoff</span><span class=\"sp\"></span><span class=\"step num\">3 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Stay to the end because</div><div class=\"h2\">By the end of this session you will have</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">A filterable ICP and your killer objection</div><div class=\"rs\">Specific enough to paste into a list-building tool, and the sentence every page has to answer.</div></div><div class=\"rmeta\"><b>Q1\u2013Q3</b><span>answered live</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">A one-sentence offer, on a rung</div><div class=\"rs\">Who, from, to, mechanism \u2014 and the price tier and funnel shape you commit to.</div></div><div class=\"rmeta\"><b>Q4\u2013Q6</b><span>pressure-tested</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Five context blocks, filled once</div><div class=\"rs\">Offer, ICP, brand, mechanism and proof \u2014 the well every asset draws from.</div></div><div class=\"rmeta\"><b>Q7\u2013Q10</b><span>your source of truth</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">A diagnostic that scores a visitor</div><div class=\"rs\">Your axes, your bands, and the rule that maps a band to a rung.</div></div><div class=\"rmeta\"><b>Q11\u2013Q12</b><span>committed</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">A spec outline</div><div class=\"rs\">The file tomorrow's build reads directly, rather than a brief.</div></div><div class=\"rmeta\"><b>Output</b><span>this evening</span></div></div></div><div class=\"bar\"><span class=\"bl\">The hard dependency</span><span class=\"bt\">Sending-domain warm-up takes two to three weeks. If you are running cold email, that clock starts tonight or your launch slips.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">What you walk out with today</span><span class=\"fbar\"><i style=\"width:4.2%\"></i></span><span class=\"pg num\">016<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 framing",title:"A funnel beats random marketing",html:"<div class=\"slide\" data-i=\"16\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 framing</span><span class=\"sp\"></span><span class=\"step num\">4 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The shift</div><div class=\"h2\">A funnel beats random marketing</div><div class=\"lede\">Random marketing is post-and-pray: a burst of activity, a good week, and no way to say what caused it. A funnel gives every step one job, and each step earns the next.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Every step has one job</div><div class=\"cb\">A step that does two things well cannot be diagnosed when it stops working.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Failure is locatable</div><div class=\"cb\">If someone doesn't advance, you know exactly which step lost them \u2014 and that is a fixable fact.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">It runs without a launch</div><div class=\"cb\">A campaign is a moment; a funnel is a machine. One gives you a good week, the other a business.</div></div></div><div class=\"bar\"><span class=\"bl\">The practical difference</span><span class=\"bt\">You stop asking \u201cis marketing working?\u201d and start asking \u201cwhich step is worst this week?\u201d \u2014 a question that has an answer.</span></div><div class=\"foot\">This is why Day 3 ends in a loop rather than a finish line.</div></div><div class=\"sfoot\"><span class=\"ftitle\">A funnel beats random marketing</span><span class=\"fbar\"><i style=\"width:5.6%\"></i></span><span class=\"pg num\">017<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 framing",title:"The three questions every funnel answers",html:"<div class=\"slide\" data-i=\"17\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 framing</span><span class=\"sp\"></span><span class=\"step num\">5 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Get these right first</div><div class=\"h2\">The three questions every funnel answers</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Who is this for?</div><div class=\"rs\">Specific enough that the right person thinks \u201cthat's me\u201d \u2014 and the wrong one leaves.</div></div><div class=\"rmeta\"><b>Q1\u2013Q2</b><span>today</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">What transformation?</div><div class=\"rs\">The after-state, described as their life. Never as your deliverable.</div></div><div class=\"rmeta\"><b>Q4</b><span>today</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Why now, why you?</div><div class=\"rs\">Your named mechanism \u2014 the reason this works when the last thing didn't.</div></div><div class=\"rmeta\"><b>Day 2</b><span>Q3</span></div></div></div><div class=\"bar\"><span class=\"bl\">If you cannot answer these</span><span class=\"bt\">No amount of page design, ad spend or automation downstream will rescue the funnel. This is the 90% that costs nothing.</span></div><div class=\"foot\">Everything built on Days 2 and 3 is one of these three answers, re-expressed as an asset.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The three questions every funnel answers</span><span class=\"fbar\"><i style=\"width:6.9%\"></i></span><span class=\"pg num\">018<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 1",title:"From a market to one winnable account",html:"<div class=\"slide\" data-i=\"18\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 1</span><span class=\"sp\"></span><span class=\"step num\">6 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 1 \u00b7 who you're for</div><div class=\"h2\" style=\"font-size:2.35cqw\">From a whole market to one winnable account</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 512\" role=\"img\" aria-label=\"Ideal customer profile canvas. On the left, five narrowing bands: market, firmographics, stack and spend signals, trigger, and your ICP. On the right, a persona card listing role and seniority, goal, challenge, where they look, buying process, and objection. Along the bottom, a negative-criteria strip listing who to deliberately exclude.\">\n          <defs>\n            <marker id=\"ICP_ia\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"28\" class=\"svsub\" font-size=\"11\">THE ACCOUNT \u00b7 narrow until only winnable companies are left</text>\n          <g text-anchor=\"middle\">\n            <rect x=\"16\" y=\"52\" width=\"400\" height=\"60\" rx=\"12\" class=\"node\"/>\n            <text x=\"216\" y=\"78\" class=\"svlabel\" font-size=\"12.5\">Your market</text><text x=\"216\" y=\"95\" class=\"svmute\" font-size=\"10\">everyone who could technically buy \u2014 far too many</text>\n            <rect x=\"44\" y=\"124\" width=\"344\" height=\"60\" rx=\"12\" fill=\"var(--accent-2)\"/>\n            <text x=\"216\" y=\"150\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Firmographics</text><text x=\"216\" y=\"167\" class=\"svmute\" font-size=\"10\">headcount \u00b7 revenue band \u00b7 industry \u00b7 geography</text>\n            <rect x=\"72\" y=\"196\" width=\"288\" height=\"60\" rx=\"12\" fill=\"var(--accent-2)\"/>\n            <text x=\"216\" y=\"222\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Stack &amp; spend signals</text><text x=\"216\" y=\"239\" class=\"svmute\" font-size=\"10\">what they already pay for, and to whom</text>\n            <rect x=\"100\" y=\"268\" width=\"232\" height=\"60\" rx=\"12\" fill=\"var(--accent-2)\"/>\n            <text x=\"216\" y=\"294\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"12.5\">Trigger</text><text x=\"216\" y=\"311\" class=\"svmute\" font-size=\"10\">the event that makes it urgent now</text>\n            <rect x=\"128\" y=\"340\" width=\"176\" height=\"60\" rx=\"12\" fill=\"var(--accent)\"/>\n            <text x=\"216\" y=\"366\" class=\"svwhite\" font-size=\"12.5\">YOUR ICP</text><text x=\"216\" y=\"383\" class=\"svwhite2\" font-size=\"10\">the account you can win</text>\n          </g>\n          <path d=\"M306 372 C372 372 392 300 448 258\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-dasharray=\"5 6\" class=\"flowline\" marker-end=\"url(#ICP_ia)\"/>\n          <text x=\"350\" y=\"302\" class=\"svmute\" font-size=\"10\">then: who signs?</text>\n          <!-- persona card -->\n          <rect x=\"452\" y=\"52\" width=\"392\" height=\"348\" rx=\"14\" class=\"node\"/>\n          <rect x=\"452\" y=\"52\" width=\"392\" height=\"34\" rx=\"14\" fill=\"var(--accent-2)\"/>\n          <rect x=\"452\" y=\"72\" width=\"392\" height=\"14\" fill=\"var(--accent-2)\"/>\n          <text x=\"470\" y=\"70\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">THE PERSON INSIDE THE ACCOUNT</text>\n          <g>\n            <text x=\"470\" y=\"110\" class=\"svlabel\" font-size=\"11.5\">Role &amp; seniority</text><text x=\"470\" y=\"126\" class=\"svmute\" font-size=\"10\">senior enough to say yes without a committee</text>\n            <line x1=\"470\" y1=\"140\" x2=\"826\" y2=\"140\" class=\"gridline\"/>\n            <text x=\"470\" y=\"158\" class=\"svlabel\" font-size=\"11.5\">Goal</text><text x=\"470\" y=\"174\" class=\"svmute\" font-size=\"10\">the one number they are personally measured on</text>\n            <line x1=\"470\" y1=\"188\" x2=\"826\" y2=\"188\" class=\"gridline\"/>\n            <text x=\"470\" y=\"206\" class=\"svlabel\" font-size=\"11.5\">Challenge</text><text x=\"470\" y=\"222\" class=\"svmute\" font-size=\"10\">what is stopping them hitting that number</text>\n            <line x1=\"470\" y1=\"236\" x2=\"826\" y2=\"236\" class=\"gridline\"/>\n            <text x=\"470\" y=\"254\" class=\"svlabel\" font-size=\"11.5\">Where they look</text><text x=\"470\" y=\"270\" class=\"svmute\" font-size=\"10\">publications \u00b7 communities \u00b7 who they already follow</text>\n            <line x1=\"470\" y1=\"284\" x2=\"826\" y2=\"284\" class=\"gridline\"/>\n            <text x=\"470\" y=\"302\" class=\"svlabel\" font-size=\"11.5\">Buying process</text><text x=\"470\" y=\"318\" class=\"svmute\" font-size=\"10\">who else has to sign, and how long it takes</text>\n            <line x1=\"470\" y1=\"332\" x2=\"826\" y2=\"332\" class=\"gridline\"/>\n            <text x=\"470\" y=\"350\" class=\"svlabel\" font-size=\"11.5\">The objection</text><text x=\"470\" y=\"366\" class=\"svmute\" font-size=\"10\">the one sentence that kills the deal every time</text>\n          </g>\n          <!-- negative criteria -->\n          <rect x=\"16\" y=\"420\" width=\"828\" height=\"74\" rx=\"12\" fill=\"var(--pink-bg)\"/>\n          <text x=\"34\" y=\"446\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"11.5\">NEGATIVE CRITERIA \u00b7 the accounts you deliberately refuse</text>\n          <text x=\"34\" y=\"466\" class=\"svmute\" font-size=\"10.5\">too small to afford the outcome \u00b7 too big to buy without procurement \u00b7 wrong geography to deliver in</text>\n          <text x=\"34\" y=\"483\" class=\"svmute\" font-size=\"10.5\">\u00b7 no budget owner in the room \u00b7 a trigger you can't influence. Writing these down is what stops a good list going bad.</text>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Narrow until it feels uncomfortable</div><div class=\"ab\">The fear is that you shrink the market. What actually happens is the message gets sharp enough to land.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Firmographics, then behaviour</div><div class=\"ab\">Headcount and revenue get you a list. A buying signal \u2014 already paying for something adjacent \u2014 gets you a good one.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">It must disqualify</div><div class=\"ab\">A description that nothing fails is not a description. You should be able to name who this is not for.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">You are narrowing to the account you can win, not the account you would most like to have.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">From a market to one winnable account</span><span class=\"fbar\"><i style=\"width:8.3%\"></i></span><span class=\"pg num\">019<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 1",title:"The buyer persona fields",html:"<div class=\"slide\" data-i=\"19\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 1</span><span class=\"sp\"></span><span class=\"step num\">7 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The fields that matter</div><div class=\"h2\">What a usable buyer persona actually records</div><div class=\"lede\">The source playbooks specify a buyer persona document with eight fields. Most teams fill the first three and skip the ones that decide how you sell.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">The firmographics</div><div class=\"cb\">Headcount, location, industry and revenue band. These build the list \u2014 and nothing more.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">The person</div><div class=\"cb\">Role and seniority, the goals they are measured on, and the challenges they would admit to a peer.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">The buying behaviour</div><div class=\"cb\">Where they get their information, and how they prefer to interact with a vendor. This decides your channel, not your taste.</div></div></div><div class=\"bar\"><span class=\"bl\">The field everyone skips</span><span class=\"bt\">\u201cHow they prefer to interact with a vendor\u201d is the one that tells you whether cold email is a channel or a brand liability.</span></div><div class=\"foot\">Source: buyer persona document, <b>3_growthclub_funnel_build</b>. Fill it for one account, not for a segment.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The buyer persona fields</span><span class=\"fbar\"><i style=\"width:9.7%\"></i></span><span class=\"pg num\">020<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 2",title:"Pressure-test the value, then stack it",html:"<div class=\"slide\" data-i=\"20\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 2</span><span class=\"sp\"></span><span class=\"step num\">8 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 2 \u00b7 the offer</div><div class=\"h2\" style=\"font-size:2.35cqw\">Pressure-test the value, then stack it</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 2 860 529\" role=\"img\" aria-label=\"Offer architecture. Top: the value equation shown as a fraction \u2014 dream outcome times perceived likelihood, over time delay times effort and sacrifice \u2014 with four levers on the right showing which direction to push each. Bottom: five stacked components \u2014 transformation, mechanism, proof, guarantee, bonuses \u2014 assembling into a single offer statement with a three-tier price strip.\">\n          <defs>\n            <marker id=\"OFFER_oa\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"20\" y=\"24\" class=\"svsub\" font-size=\"11\">FIRST \u00b7 IS THE VALUE THERE AT ALL?</text>\n          <text x=\"26\" y=\"128\" class=\"svlabel\" font-size=\"17\">VALUE</text>\n          <text x=\"98\" y=\"128\" class=\"svmute\" font-size=\"19\">=</text>\n          <!-- numerator: things that create value -->\n          <rect x=\"128\" y=\"50\" width=\"400\" height=\"58\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"216\" y=\"72\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12\">Dream outcome</text>\n          <text x=\"216\" y=\"90\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\"what exactly do I get?\"</text>\n          <text x=\"328\" y=\"80\" text-anchor=\"middle\" class=\"svmute\" font-size=\"13\">\u00d7</text>\n          <text x=\"440\" y=\"72\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"12\">Perceived likelihood</text>\n          <text x=\"440\" y=\"90\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\"will it work for me?\"</text>\n          <line x1=\"128\" y1=\"124\" x2=\"528\" y2=\"124\" stroke=\"var(--ink-2)\" stroke-width=\"2.5\"/>\n          <!-- denominator: things that destroy value -->\n          <rect x=\"128\" y=\"140\" width=\"400\" height=\"58\" rx=\"12\" fill=\"var(--pink-bg)\"/>\n          <text x=\"216\" y=\"162\" text-anchor=\"middle\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"12\">Time delay</text>\n          <text x=\"216\" y=\"180\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\"how long until it works?\"</text>\n          <text x=\"328\" y=\"170\" text-anchor=\"middle\" class=\"svmute\" font-size=\"13\">\u00d7</text>\n          <text x=\"440\" y=\"162\" text-anchor=\"middle\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"12\">Effort &amp; sacrifice</text>\n          <text x=\"440\" y=\"180\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10\">\"what do I have to do?\"</text>\n          <!-- levers -->\n          <g font-size=\"10.5\">\n            <rect x=\"556\" y=\"48\" width=\"288\" height=\"38\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/>\n            <text x=\"570\" y=\"64\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11\">\u2191 Dream outcome</text><text x=\"570\" y=\"78\" class=\"svmute\">make it specific, and make it theirs</text>\n            <rect x=\"556\" y=\"92\" width=\"288\" height=\"38\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/>\n            <text x=\"570\" y=\"108\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11\">\u2191 Perceived likelihood</text><text x=\"570\" y=\"122\" class=\"svmute\">proof, detail, and a real guarantee</text>\n            <rect x=\"556\" y=\"136\" width=\"288\" height=\"38\" rx=\"9\" class=\"node\" stroke=\"var(--pink)\"/>\n            <text x=\"570\" y=\"152\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"11\">\u2193 Time delay</text><text x=\"570\" y=\"166\" class=\"svmute\">engineer a win in the first week</text>\n            <rect x=\"556\" y=\"180\" width=\"288\" height=\"38\" rx=\"9\" class=\"node\" stroke=\"var(--pink)\"/>\n            <text x=\"570\" y=\"196\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"11\">\u2193 Effort &amp; sacrifice</text><text x=\"570\" y=\"210\" class=\"svmute\">do more of the work for them</text>\n          </g>\n          <text x=\"20\" y=\"224\" class=\"svmute\" font-size=\"10.5\">Beginners push the top \u2014 bigger promises, more testimonials. The hard, defensible work is at the bottom: removing time and effort.</text>\n          <line x1=\"20\" y1=\"240\" x2=\"840\" y2=\"240\" class=\"gridline\"/>\n          <!-- offer stack -->\n          <text x=\"20\" y=\"266\" class=\"svsub\" font-size=\"11\">THEN \u00b7 STACK THE PIECES INTO ONE STATEMENT</text>\n          <g font-size=\"11.5\">\n            <rect x=\"24\" y=\"282\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"299\" fill=\"var(--accent-ink)\" font-weight=\"700\">1 \u00b7 Transformation</text><text x=\"40\" y=\"314\" class=\"svmute\" font-size=\"10\">the after-state they are actually buying</text>\n            <rect x=\"24\" y=\"330\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"347\" fill=\"var(--accent-ink)\" font-weight=\"700\">2 \u00b7 Mechanism</text><text x=\"40\" y=\"362\" class=\"svmute\" font-size=\"10\">why your way works when theirs didn't</text>\n            <rect x=\"24\" y=\"378\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"395\" fill=\"var(--accent-ink)\" font-weight=\"700\">3 \u00b7 Proof</text><text x=\"40\" y=\"410\" class=\"svmute\" font-size=\"10\">evidence it has worked before, for someone like them</text>\n            <rect x=\"24\" y=\"426\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"443\" fill=\"var(--accent-ink)\" font-weight=\"700\">4 \u00b7 Guarantee</text><text x=\"40\" y=\"458\" class=\"svmute\" font-size=\"10\">who carries the risk \u2014 you, or them</text>\n            <rect x=\"24\" y=\"474\" width=\"290\" height=\"42\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"40\" y=\"491\" fill=\"var(--accent-ink)\" font-weight=\"700\">5 \u00b7 Bonuses</text><text x=\"40\" y=\"506\" class=\"svmute\" font-size=\"10\">removes the last objection, nothing else</text>\n          </g>\n          <path d=\"M324 399 L392 399\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" marker-end=\"url(#OFFER_oa)\" class=\"flowline\"/>\n          <rect x=\"406\" y=\"292\" width=\"438\" height=\"216\" rx=\"14\" fill=\"var(--accent)\"/>\n          <text x=\"428\" y=\"320\" class=\"svwhite\" font-size=\"12.5\">THE OFFER \u00b7 one sentence a stranger understands</text>\n          <g class=\"svwhite2\" font-size=\"12.5\">\n            <text x=\"428\" y=\"352\">I help <tspan font-weight=\"700\" fill=\"#fff\">[who]</tspan> go from <tspan font-weight=\"700\" fill=\"#fff\">[before]</tspan></text>\n            <text x=\"428\" y=\"376\">to <tspan font-weight=\"700\" fill=\"#fff\">[after]</tspan> using <tspan font-weight=\"700\" fill=\"#fff\">[mechanism]</tspan>,</text>\n            <text x=\"428\" y=\"400\">in <tspan font-weight=\"700\" fill=\"#fff\">[time]</tspan> \u2014 or <tspan font-weight=\"700\" fill=\"#fff\">[guarantee]</tspan>.</text>\n          </g>\n          <line x1=\"428\" y1=\"422\" x2=\"822\" y2=\"422\" stroke=\"rgba(255,255,255,.28)\" stroke-width=\"1\"/>\n          <text x=\"428\" y=\"444\" class=\"svwhite2\" font-size=\"10.5\">and it sells at three points on your ladder:</text>\n          <g font-size=\"10.5\">\n            <rect x=\"428\" y=\"458\" width=\"122\" height=\"30\" rx=\"8\" fill=\"rgba(255,255,255,.17)\"/><text x=\"489\" y=\"474\" text-anchor=\"middle\" class=\"svwhite\">entry</text>\n            <rect x=\"558\" y=\"458\" width=\"122\" height=\"30\" rx=\"8\" fill=\"rgba(255,255,255,.17)\"/><text x=\"619\" y=\"474\" text-anchor=\"middle\" class=\"svwhite\">core</text>\n            <rect x=\"688\" y=\"458\" width=\"134\" height=\"30\" rx=\"8\" fill=\"rgba(255,255,255,.17)\"/><text x=\"755\" y=\"474\" text-anchor=\"middle\" class=\"svwhite\">flagship</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Raise the top, lower the bottom</div><div class=\"ab\">Value goes up with the dream outcome and the odds of hitting it; down with time taken and effort required.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Time delay is the cheapest lever</div><div class=\"ab\">Most offers improve more by arriving sooner than by promising more. Speed is felt immediately.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Stack, then subtract</div><div class=\"ab\">Name what is included \u2014 then name what is explicitly not. The exclusions are what keep the wrong buyer out.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Four terms. Improve any one and the whole offer moves.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Pressure-test the value, then stack it</span><span class=\"fbar\"><i style=\"width:11.1%\"></i></span><span class=\"pg num\">021<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 3",title:"Twenty funnel types, grouped by job",html:"<div class=\"slide\" data-i=\"21\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 3</span><span class=\"sp\"></span><span class=\"step num\">9 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 3 \u00b7 the shape</div><div class=\"h2\" style=\"font-size:2.35cqw\">Twenty funnel types, grouped by the job they do</div><div class=\"vizrow\" style=\"--split:1.08fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 754\" role=\"img\" aria-label=\"Funnel type taxonomy. Three decision questions across the top, then four family panels: teach to sell, give value first, sell now and ascend later, and let a human or partner close. Each family lists its funnel types with a one-time build-hour estimate. The webinar, workshop or challenge, and reverse squeeze types are marked as the three covered in depth.\">\n          <defs>\n            <marker id=\"TYPES_fa\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- decision spine -->\n          <rect x=\"16\" y=\"14\" width=\"258\" height=\"50\" rx=\"11\" fill=\"var(--accent-2)\"/>\n          <text x=\"145\" y=\"34\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">1 \u00b7 How much do they</text>\n          <text x=\"145\" y=\"50\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">already believe?</text>\n          <rect x=\"301\" y=\"14\" width=\"258\" height=\"50\" rx=\"11\" fill=\"var(--accent-2)\"/>\n          <text x=\"430\" y=\"34\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">2 \u00b7 How big is</text>\n          <text x=\"430\" y=\"50\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">the ticket?</text>\n          <rect x=\"586\" y=\"14\" width=\"258\" height=\"50\" rx=\"11\" fill=\"var(--accent-2)\"/>\n          <text x=\"715\" y=\"34\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">3 \u00b7 Who closes \u2014</text>\n          <text x=\"715\" y=\"50\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"11.5\">a page, or a person?</text>\n          <g fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"1.5\" opacity=\".55\" marker-end=\"url(#TYPES_fa)\">\n            <path d=\"M276 39 H297\"/><path d=\"M561 39 H582\"/>\n          </g>\n\n          <!-- family 1 -->\n          <rect x=\"16\" y=\"92\" width=\"406\" height=\"286\" rx=\"14\" class=\"node\"/>\n          <text x=\"34\" y=\"118\" class=\"svlabel\" font-size=\"12.5\">TEACH TO SELL</text>\n          <text x=\"34\" y=\"136\" class=\"svmute\" font-size=\"10\">they must believe a new idea before they'll buy</text>\n          <g font-size=\"11\">\n            <rect x=\"32\" y=\"150\" width=\"374\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"48\" y=\"171\" fill=\"var(--accent-ink)\" font-weight=\"700\">\u25c6 Webinar funnel</text><text x=\"390\" y=\"171\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">39 h</text>\n            <rect x=\"32\" y=\"191\" width=\"374\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"48\" y=\"212\" fill=\"var(--accent-ink)\" font-weight=\"700\">\u25c6 Workshop \u00b7 challenge funnel</text><text x=\"390\" y=\"212\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">50 h</text>\n            <rect x=\"32\" y=\"232\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"253\" class=\"svlabel\">Webinar that doesn't matter</text><text x=\"390\" y=\"253\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">32 h</text>\n            <rect x=\"32\" y=\"273\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"294\" class=\"svlabel\">Sideways sales letter</text><text x=\"390\" y=\"294\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">34 h</text>\n            <rect x=\"32\" y=\"314\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"335\" class=\"svlabel\">Product launch</text><text x=\"390\" y=\"335\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">52 h</text>\n          </g>\n\n          <!-- family 2 -->\n          <rect x=\"438\" y=\"92\" width=\"406\" height=\"286\" rx=\"14\" class=\"node\"/>\n          <text x=\"456\" y=\"118\" class=\"svlabel\" font-size=\"12.5\">GIVE VALUE FIRST</text>\n          <text x=\"456\" y=\"136\" class=\"svmute\" font-size=\"10\">they don't trust you with an email address yet</text>\n          <g font-size=\"11\">\n            <rect x=\"454\" y=\"150\" width=\"374\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"470\" y=\"171\" fill=\"var(--accent-ink)\" font-weight=\"700\">\u25c6 Reverse squeeze</text><text x=\"812\" y=\"171\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">33 h</text>\n            <rect x=\"454\" y=\"191\" width=\"374\" height=\"34\" rx=\"8\" fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"470\" y=\"212\" fill=\"var(--accent-ink)\" font-weight=\"700\">\u25c6 Reverse squeeze \u00b7 dual-path</text><text x=\"812\" y=\"212\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-size=\"10\">34 h</text>\n            <rect x=\"454\" y=\"232\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"253\" class=\"svlabel\">Book authority</text><text x=\"812\" y=\"253\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">56 h</text>\n            <rect x=\"454\" y=\"273\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"294\" class=\"svlabel\">Hub &amp; spoke</text><text x=\"812\" y=\"294\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">44 h</text>\n            <rect x=\"454\" y=\"314\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"335\" class=\"svlabel\">Community</text><text x=\"812\" y=\"335\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">54 h</text>\n          </g>\n\n          <!-- family 3 -->\n          <rect x=\"16\" y=\"394\" width=\"406\" height=\"326\" rx=\"14\" class=\"node\"/>\n          <text x=\"34\" y=\"420\" class=\"svlabel\" font-size=\"12.5\">SELL NOW, ASCEND LATER</text>\n          <text x=\"34\" y=\"438\" class=\"svmute\" font-size=\"10\">the first offer is small enough to buy on impulse</text>\n          <g font-size=\"11\">\n            <rect x=\"32\" y=\"452\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"473\" class=\"svlabel\">Self-liquidating offer</text><text x=\"390\" y=\"473\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">32 h</text>\n            <rect x=\"32\" y=\"493\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"514\" class=\"svlabel\">Tripwire + one-click upsell</text><text x=\"390\" y=\"514\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">33 h</text>\n            <rect x=\"32\" y=\"534\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"555\" class=\"svlabel\">Free + shipping</text><text x=\"390\" y=\"555\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">41 h</text>\n            <rect x=\"32\" y=\"575\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"596\" class=\"svlabel\">Unlock-all order bump</text><text x=\"390\" y=\"596\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">23 h</text>\n            <rect x=\"32\" y=\"616\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"637\" class=\"svlabel\">Downsell</text><text x=\"390\" y=\"637\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">32 h</text>\n            <rect x=\"32\" y=\"657\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"48\" y=\"678\" class=\"svlabel\">Waterfall \u00b7 retargeting layers</text><text x=\"390\" y=\"678\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">35 h</text>\n          </g>\n\n          <!-- family 4 -->\n          <rect x=\"438\" y=\"394\" width=\"406\" height=\"244\" rx=\"14\" class=\"node\"/>\n          <text x=\"456\" y=\"420\" class=\"svlabel\" font-size=\"12.5\">LET A HUMAN OR PARTNER CLOSE</text>\n          <text x=\"456\" y=\"438\" class=\"svmute\" font-size=\"10\">a page can't carry the objection \u2014 a conversation has to</text>\n          <g font-size=\"11\">\n            <rect x=\"454\" y=\"452\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"473\" class=\"svlabel\">Book a call</text><text x=\"812\" y=\"473\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">41 h</text>\n            <rect x=\"454\" y=\"493\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"514\" class=\"svlabel\">Social following \u2192 DM</text><text x=\"812\" y=\"514\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">31 h</text>\n            <rect x=\"454\" y=\"534\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"555\" class=\"svlabel\">Final funnel \u00b7 no sales page</text><text x=\"812\" y=\"555\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">32 h</text>\n            <rect x=\"454\" y=\"575\" width=\"374\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"470\" y=\"596\" class=\"svlabel\">Partnership \u00b7 JV</text><text x=\"812\" y=\"596\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">31 h</text>\n          </g>\n          <text x=\"456\" y=\"666\" class=\"svmute\" font-size=\"10.5\">Highest trust required, lowest volume \u2014</text>\n          <text x=\"456\" y=\"683\" class=\"svmute\" font-size=\"10.5\">and the only family where your calendar,</text>\n          <text x=\"456\" y=\"700\" class=\"svmute\" font-size=\"10.5\">not your traffic, is the constraint.</text>\n          <line x1=\"16\" y1=\"734\" x2=\"844\" y2=\"734\" class=\"gridline\"/>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">They are not interchangeable</div><div class=\"ab\">A self-liquidating offer and a book-a-call funnel solve different problems. Picking by fashion is how you build the wrong one.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Match the ticket, not the trend</div><div class=\"ab\">The price decides how much contact time you need before the ask. That single constraint eliminates most of the twenty.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Build hours vary widely</div><div class=\"ab\">The library carries a build estimate per type. Choosing a heavier one without the hours is how week two stalls.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Find the group that matches your ticket, then choose inside it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Twenty funnel types, grouped by job</span><span class=\"fbar\"><i style=\"width:12.5%\"></i></span><span class=\"pg num\">022<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 4",title:"Six stages, every term fetched",html:"<div class=\"slide\" data-i=\"22\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 4</span><span class=\"sp\"></span><span class=\"step num\">10 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 4 \u00b7 the arithmetic</div><div class=\"h2\" style=\"font-size:2.6cqw\">The same six stages, three different businesses</div><div class=\"matrix fill\" style=\"grid-template-columns:minmax(0,.85fr) repeat(3,minmax(0,1fr))\"><div class=\"mc head\"></div><div class=\"mc head\"><b>B2B SaaS</b></div><div class=\"mc head\"><b>Consulting</b></div><div class=\"mc head\"><b>Coaching</b></div><div class=\"mc rowh\"><b>Prospects</b></div><div class=\"mc\"><span>15,000</span></div><div class=\"mc\"><span>12,000</span></div><div class=\"mc\"><span>15,000</span></div><div class=\"mc rowh\"><b>\u2192 Visitors</b></div><div class=\"mc\"><span>3,000 \u00b7 20%</span></div><div class=\"mc\"><span>2,400 \u00b7 20%</span></div><div class=\"mc\"><span>3,000 \u00b7 20%</span></div><div class=\"mc rowh\"><b>\u2192 Registrants</b></div><div class=\"mc\"><span>1,200 \u00b7 40%</span></div><div class=\"mc\"><span>960 \u00b7 40%</span></div><div class=\"mc\"><span>1,200 \u00b7 40%</span></div><div class=\"mc rowh\"><b>\u2192 Attendees</b></div><div class=\"mc\"><span>600 \u00b7 50%</span></div><div class=\"mc\"><span>480 \u00b7 50%</span></div><div class=\"mc\"><span>600 \u00b7 50%</span></div><div class=\"mc rowh\"><b>\u2192 Sales calls</b></div><div class=\"mc\"><span>150 \u00b7 25%</span></div><div class=\"mc\"><span>120 \u00b7 25%</span></div><div class=\"mc\"><span>150 \u00b7 25%</span></div><div class=\"mc rowh\"><b>\u2192 Buyers</b></div><div class=\"mc\"><span>30 \u00b7 20%</span></div><div class=\"mc\"><span>24 \u00b7 20%</span></div><div class=\"mc\"><span>30 \u00b7 20%</span></div><div class=\"mc rowh\"><b>Revenue</b></div><div class=\"mc\"><span>$3,000 MRR</span></div><div class=\"mc\"><span>$120,000</span></div><div class=\"mc\"><span>$60,000</span></div><div class=\"mc rowh\"><b>End to end</b></div><div class=\"mc\"><span>0.2%</span></div><div class=\"mc\"><span>0.2%</span></div><div class=\"mc\"><span>0.2%</span></div></div><div class=\"foot\"><b>Teaching model.</b> These figures are illustrative, from the workshop's own worked examples \u2014 not measured client results. Use the shape, not the numbers. What matters here is that all three land near <b>0.2% end to end</b> \u2014 the ticket, not the funnel, is what separates $3k from $120k.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Six stages, every term fetched</span><span class=\"fbar\"><i style=\"width:13.9%\"></i></span><span class=\"pg num\">023<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 step 4",title:"Every term is a counted event",html:"<div class=\"slide\" data-i=\"23\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 step 4</span><span class=\"sp\"></span><span class=\"step num\">11 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Step 4 \u00b7 the arithmetic</div><div class=\"h2\" style=\"font-size:2.35cqw\">Every term is a counted event with a named source</div><div class=\"viz\"><svg viewBox=\"0 16 860 433\" role=\"img\" aria-label=\"Funnel math in fetched quantities. A left-to-right rail of eight instrumented steps \u2014 visit, opt-in, qualified, engaged, offer seen, checkout started, purchase, renewal \u2014 each labelled with the system that reports it, with seven ratio markers between them. Below, a panel of five equations for buyers, revenue, customer acquisition cost, return on ad spend, and lifetime value.\">\n          <line x1=\"70\" y1=\"132\" x2=\"784\" y2=\"132\" stroke=\"var(--line-2)\" stroke-width=\"2\"/>\n          <g fill=\"var(--accent-2)\" stroke=\"var(--accent)\" stroke-width=\"2\">\n            <circle cx=\"70\" cy=\"132\" r=\"12\"/><circle cx=\"172\" cy=\"132\" r=\"12\"/><circle cx=\"274\" cy=\"132\" r=\"12\"/><circle cx=\"376\" cy=\"132\" r=\"12\"/>\n            <circle cx=\"478\" cy=\"132\" r=\"12\"/><circle cx=\"580\" cy=\"132\" r=\"12\"/>\n          </g>\n          <g fill=\"var(--teal-bg)\" stroke=\"var(--teal)\" stroke-width=\"2\">\n            <circle cx=\"682\" cy=\"132\" r=\"12\"/><circle cx=\"784\" cy=\"132\" r=\"12\"/>\n          </g>\n          <!-- ratio markers -->\n          <g font-size=\"9.5\" text-anchor=\"middle\">\n            <rect x=\"106\" y=\"124\" width=\"30\" height=\"17\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-2)\"/><text x=\"121\" y=\"133\" class=\"svmute\">r1</text>\n            <rect x=\"208\" y=\"124\" width=\"30\" height=\"17\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-2)\"/><text x=\"223\" y=\"133\" class=\"svmute\">r2</text>\n            <rect x=\"310\" y=\"124\" width=\"30\" height=\"17\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-2)\"/><text x=\"325\" y=\"133\" class=\"svmute\">r3</text>\n            <rect x=\"412\" y=\"124\" width=\"30\" height=\"17\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-2)\"/><text x=\"427\" y=\"133\" class=\"svmute\">r4</text>\n            <rect x=\"514\" y=\"124\" width=\"30\" height=\"17\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-2)\"/><text x=\"529\" y=\"133\" class=\"svmute\">r5</text>\n            <rect x=\"616\" y=\"124\" width=\"30\" height=\"17\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-2)\"/><text x=\"631\" y=\"133\" class=\"svmute\">r6</text>\n            <rect x=\"718\" y=\"124\" width=\"30\" height=\"17\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-2)\"/><text x=\"733\" y=\"133\" class=\"svmute\">r7</text>\n          </g>\n          <!-- labels: even above, odd below -->\n          <g text-anchor=\"middle\">\n            <text x=\"70\" y=\"90\" class=\"svlabel\" font-size=\"11\">Visit</text><text x=\"70\" y=\"105\" class=\"svmute\" font-size=\"9.5\">analytics</text>\n            <text x=\"274\" y=\"90\" class=\"svlabel\" font-size=\"11\">Qualified</text><text x=\"274\" y=\"105\" class=\"svmute\" font-size=\"9.5\">CRM</text>\n            <text x=\"478\" y=\"90\" class=\"svlabel\" font-size=\"11\">Offer seen</text><text x=\"478\" y=\"105\" class=\"svmute\" font-size=\"9.5\">analytics</text>\n            <text x=\"682\" y=\"90\" class=\"svlabel\" font-size=\"11\" fill=\"var(--teal)\">Purchase</text><text x=\"682\" y=\"105\" class=\"svmute\" font-size=\"9.5\">payment API</text>\n            <text x=\"172\" y=\"168\" class=\"svlabel\" font-size=\"11\">Opt-in</text><text x=\"172\" y=\"183\" class=\"svmute\" font-size=\"9.5\">analytics + CRM</text>\n            <text x=\"376\" y=\"168\" class=\"svlabel\" font-size=\"11\">Engaged</text><text x=\"376\" y=\"183\" class=\"svmute\" font-size=\"9.5\">event stream</text>\n            <text x=\"580\" y=\"168\" class=\"svlabel\" font-size=\"11\">Checkout started</text><text x=\"580\" y=\"183\" class=\"svmute\" font-size=\"9.5\">payment API</text>\n            <text x=\"784\" y=\"168\" class=\"svlabel\" font-size=\"11\" fill=\"var(--teal)\">Renewal</text><text x=\"784\" y=\"183\" class=\"svmute\" font-size=\"9.5\">payment + CRM</text>\n          </g>\n          <text x=\"20\" y=\"38\" class=\"svsub\" font-size=\"11\">THE INSTRUMENTED SPINE \u00b7 one event per step, one source per event</text>\n          <text x=\"20\" y=\"56\" class=\"svmute\" font-size=\"10\">Your stage names will differ by funnel type. The shape \u2014 count, count, count \u2014 does not.</text>\n          <!-- equations -->\n          <rect x=\"20\" y=\"212\" width=\"820\" height=\"222\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <g style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace\" font-size=\"12.5\" class=\"svlabel\">\n            <text x=\"42\" y=\"248\">Buyers   =  N_visit \u00d7 r1 \u00d7 r2 \u00d7 r3 \u00d7 r4 \u00d7 r5 \u00d7 r6</text>\n            <text x=\"42\" y=\"282\">Revenue  =  Buyers \u00d7 average order value  +  upsell revenue</text>\n            <text x=\"42\" y=\"316\">CAC      =  spend on a channel  \u00f7  buyers from that channel</text>\n            <text x=\"42\" y=\"350\">ROAS     =  revenue from a channel  \u00f7  spend on that channel</text>\n            <text x=\"42\" y=\"384\">LTV      =  average order value \u00d7 (1 + renewals \u00f7 buyers)</text>\n          </g>\n          <line x1=\"42\" y1=\"402\" x2=\"818\" y2=\"402\" class=\"gridline\"/>\n          <text x=\"42\" y=\"422\" class=\"svmute\" font-size=\"10.5\">Each r is one fetched count divided by another \u2014 so a \"conversion rate\" is a result, never an input. Nothing above is assumed.</text>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Revenue is a product, not a mystery</div><div class=\"cb\">Traffic \u00d7 each step's rate \u00d7 value per buyer. Every term on that line is something you can fetch.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">One weak step caps everything</div><div class=\"cb\">The rates multiply, so the worst one dominates. This is why Day 3 fixes one leak at a time.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Name the source per term</div><div class=\"cb\">Ad platform, analytics, CRM, payment provider. A term with no named source is a guess wearing a number.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Read it as a formula you can populate today, not a model you fill in later.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Every term is a counted event</span><span class=\"fbar\"><i style=\"width:15.3%\"></i></span><span class=\"pg num\">024<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Day 1 \u00b7 titles",title:"Naming the thing you are selling",html:"<div class=\"slide\" data-i=\"24\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Day 1 \u00b7 titles</span><span class=\"sp\"></span><span class=\"step num\">12 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Before you write a page</div><div class=\"h2\">A five-step rule for naming it</div><div class=\"lede\">The source playbooks specify a title framework, and the hard constraints in it are the useful part \u2014 they rule out most of what people instinctively write.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Verify every number first</div><div class=\"cb\">If the title contains a figure, it has to be one you can stand behind. An unverified multiplier in a headline poisons everything after it.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Seven to twelve words, containing a KPI</div><div class=\"cb\">Long enough to be specific, short enough to survive a subject line \u2014 and anchored on a number that matters to the buyer.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Ten variants, then choose</div><div class=\"cb\">Draft ten and review them against your brand. The first one you write is almost never the one that ships.</div></div></div><div class=\"bar\"><span class=\"bl\">Two styles only</span><span class=\"bt\">Benefit-driven \u2014 the outcome \u2014 or framework-named \u2014 the mechanism. Pick one; hybrids read as neither.</span></div><div class=\"foot\">Source: title-crafting framework, <b>3_growthclub_funnel_build</b>.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Naming the thing you are selling</span><span class=\"fbar\"><i style=\"width:16.7%\"></i></span><span class=\"pg num\">025<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Describe the company you sell to \u2014 headcount, revenue band, industry, geography.",html:"<div class=\"slide\" data-i=\"25\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">13 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 1 of 12</span><span class=\"qk\">Long answer \u00b7 25+ words</span><span class=\"qtime\">\u23f1 3 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Describe the company you sell to \u2014 headcount, revenue band, industry, geography.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Filterable</u><span>Every clause could be typed into a list-building tool as an actual filter.</span></div><div class=\"qc\"><u>Bounded</u><span>A floor <em>and</em> a ceiling \u2014 \u201c20\u201380 staff\u201d, never \u201cSMB and up\u201d.</span></div><div class=\"qc\"><u>Disqualifying</u><span>It rules companies out. A description nothing fails is not a description.</span></div></div><div class=\"foot\"><b>Why this one:</b> Everything downstream keys off this one paragraph. Your list filters, your headline, your objection handling and your ad targeting are all this sentence re-expressed.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Describe the company you sell to \u2014 headcount, revenue band, industry, geography.</span><span class=\"fbar\"><i style=\"width:18.1%\"></i></span><span class=\"pg num\">026<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q1 \u00b7 B2B SaaS",title:"SendFlow answers Q1",html:"<div class=\"slide\" data-i=\"26\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q1 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">14 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 1</u><p>Describe the company you sell to \u2014 headcount, revenue band, industry, geography.</p></div><div class=\"answer\"><u>How they answer it</u><p>B2B software companies, 20\u201380 staff, $3M\u2013$15M ARR, US and Canada, already paying for a sales-engagement tool they complain about.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Bands at both ends \u2014 20\u201380 staff, $3M\u2013$15M ARR \u2014 so the list builder has a floor and a ceiling.</span></div><div class=\"w\"><i>2</i><span>The last clause is a buying <b>signal</b>, not a demographic: already paying for a tool they complain about.</span></div><div class=\"w\"><i>3</i><span>Two named countries. \u201cNorth America\u201d would have swept in a market they do not sell into.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The signal clause does the real work \u2014 it turns a static firmographic list into a list of people already spending money on this problem.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q1</span><span class=\"fbar\"><i style=\"width:19.4%\"></i></span><span class=\"pg num\">027<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q1 \u00b7 B2B consulting brand",title:"Apex Growth answers Q1",html:"<div class=\"slide\" data-i=\"27\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q1 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">15 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 1</u><p>Describe the company you sell to \u2014 headcount, revenue band, industry, geography.</p></div><div class=\"answer\"><u>How they answer it</u><p>Professional-services firms, 25\u2013120 staff, \u00a35M\u2013\u00a325M turnover, UK and Ireland, partner-led with no in-house marketing function.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Turnover stated in the currency they actually invoice in, which is how their own list vendors filter.</span></div><div class=\"w\"><i>2</i><span>\u201cPartner-led with no in-house marketing function\u201d is <b>checkable from a website</b>, not an aspiration.</span></div><div class=\"w\"><i>3</i><span>UK and Ireland keeps time zones and referencing culture consistent with the proof they already hold.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">No buying-signal clause here \u2014 a structural gap replaces it. That is the right trade when the market is small enough to enumerate by hand.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q1</span><span class=\"fbar\"><i style=\"width:20.8%\"></i></span><span class=\"pg num\">028<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q1 \u00b7 Solopreneur",title:"Sarah Chen answers Q1",html:"<div class=\"slide\" data-i=\"28\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q1 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">16 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 1</u><p>Describe the company you sell to \u2014 headcount, revenue band, industry, geography.</p></div><div class=\"answer\"><u>How they answer it</u><p>Independent consultancies and studios, 3\u201312 people, $400K\u2013$2M revenue, English-speaking, founder still doing delivery and sales.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>3\u201312 people means the founder is reachable directly \u2014 there is no gatekeeper to route around.</span></div><div class=\"w\"><i>2</i><span>\u201cFounder still doing delivery and sales\u201d states the pain as an <b>observable behaviour</b>.</span></div><div class=\"w\"><i>3</i><span>The revenue band is deliberately wide, because at this size it is a weak signal and headcount is not.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">A one-person business should filter on behaviour before firmographics. The smaller the team, the more the founder's situation predicts the sale.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q1</span><span class=\"fbar\"><i style=\"width:22.2%\"></i></span><span class=\"pg num\">029<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"Who signs, and what single number are they personally measured on?",html:"<div class=\"slide\" data-i=\"29\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">17 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 2 of 12</span><span class=\"qk\">Short answer \u00b7 12+ words</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">Who signs, and what single number are they personally measured on?</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Senior enough</u><span>They can say yes without assembling a committee.</span></div><div class=\"qc\"><u>One metric</u><span>A single number their own boss asks them about \u2014 not three priorities.</span></div><div class=\"qc\"><u>Their words</u><span>The metric as it is said internally, not as a marketer would phrase it.</span></div></div><div class=\"foot\"><b>Why this one:</b> A funnel that reaches someone who cannot sign alone stalls at exactly the same step every time. The metric is how you make the page sound like their internal review rather than your brochure.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Who signs, and what single number are they personally measured on?</span><span class=\"fbar\"><i style=\"width:23.6%\"></i></span><span class=\"pg num\">030<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q2 \u00b7 B2B SaaS",title:"SendFlow answers Q2",html:"<div class=\"slide\" data-i=\"30\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q2 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">18 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 2</u><p>Who signs, and what single number are they personally measured on?</p></div><div class=\"answer\"><u>How they answer it</u><p>VP Sales. Measured on qualified pipeline created per rep per month, reported weekly.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>VP Sales is a single signer at this deal size; no procurement committee to design around.</span></div><div class=\"w\"><i>2</i><span>Pipeline created <b>per rep per month</b> is normalised, so it survives the team growing or shrinking.</span></div><div class=\"w\"><i>3</i><span>It is an activity-linked metric, which is why a tool that changes rep behaviour can move it.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cReported weekly\u201d is the sharpest part. A metric with a review cadence attached tells you how often your buyer feels the pain \u2014 and therefore how often to show up.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q2</span><span class=\"fbar\"><i style=\"width:25.0%\"></i></span><span class=\"pg num\">031<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q2 \u00b7 B2B consulting brand",title:"Apex Growth answers Q2",html:"<div class=\"slide\" data-i=\"31\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q2 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">19 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 2</u><p>Who signs, and what single number are they personally measured on?</p></div><div class=\"answer\"><u>How they answer it</u><p>Managing Partner. Measured on fee income per partner \u2014 they are judged on whether the firm grows without them working more hours.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Managing Partner is the one role in a partnership that can commit the firm without a vote.</span></div><div class=\"w\"><i>2</i><span>The metric is explicitly about growing <b>without working more hours</b> \u2014 that is the emotional stake.</span></div><div class=\"w\"><i>3</i><span>It is reported annually in most firms, so the sales cycle has to survive a long gap between pains.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Fee income per partner is a productivity ratio, not a revenue total. Selling to a ratio means you can win by lowering the denominator, not only by raising the top line.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q2</span><span class=\"fbar\"><i style=\"width:26.4%\"></i></span><span class=\"pg num\">032<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q2 \u00b7 Solopreneur",title:"Sarah Chen answers Q2",html:"<div class=\"slide\" data-i=\"32\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q2 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">20 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 2</u><p>Who signs, and what single number are they personally measured on?</p></div><div class=\"answer\"><u>How they answer it</u><p>The founder. Measured on whether next quarter's revenue is already visible, not hoped for.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>The founder is both signer and user, which collapses the sale to one conversation.</span></div><div class=\"w\"><i>2</i><span>The metric is about <b>certainty</b> rather than size \u2014 a small number that is predictable beats a big one that is not.</span></div><div class=\"w\"><i>3</i><span>Quarterly visibility sets the natural sales cycle: pitch at the start of a quarter, not the end.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cVisible, not hoped for\u201d is the whole offer compressed into four words. That phrasing belongs on the landing page verbatim.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q2</span><span class=\"fbar\"><i style=\"width:27.8%\"></i></span><span class=\"pg num\">033<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Your turn",title:"What is the one objection that kills your deals? Write it verbatim.",html:"<div class=\"slide\" data-i=\"33\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">21 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 3 of 12</span><span class=\"qk\">Short answer \u00b7 8+ words</span><span class=\"qtime\">\u23f1 3 min</span><span class=\"qtime\">Day 1 \u00b7 answer on your own screen</span></div><div class=\"qq\">What is the one objection that kills your deals? Write it verbatim.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 1</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Verbatim</u><span>Their words, from a real conversation. Not your tidied-up version.</span></div><div class=\"qc\"><u>First person</u><span>Written as the prospect would say it out loud.</span></div><div class=\"qc\"><u>Specific</u><span>Names the actual fear \u2014 not \u201cprice\u201d, but what the price risks.</span></div></div><div class=\"foot\"><b>Why this one:</b> You will answer this exact sentence on every page, every email and every call for the rest of the week. Paraphrasing it into marketing language is how pages stop sounding like they were written for anyone.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">What is the one objection that kills your deals? Write it verbatim.</span><span class=\"fbar\"><i style=\"width:29.2%\"></i></span><span class=\"pg num\">034<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q3 \u00b7 B2B SaaS",title:"SendFlow answers Q3",html:"<div class=\"slide\" data-i=\"34\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q3 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">22 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 3</u><p>What is the one objection that kills your deals? Write it verbatim.</p></div><div class=\"answer\"><u>How they answer it</u><p>\u201cOur reps won't use another tool. We've rolled out two this year and both died.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Two failed rollouts this year is a concrete, recent scar \u2014 not a generic worry.</span></div><div class=\"w\"><i>2</i><span>It is said from the buyer's seat: their credibility is on the line, not their budget.</span></div><div class=\"w\"><i>3</i><span>It hands you the counter-positioning for free \u2014 <b>\u201cthis one they don't have to open\u201d</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">The objection is about <em>adoption risk</em>, not price. Answering it with a discount would miss entirely \u2014 the fix is proof that reps never open the tool.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q3</span><span class=\"fbar\"><i style=\"width:30.6%\"></i></span><span class=\"pg num\">035<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q3 \u00b7 B2B consulting brand",title:"Apex Growth answers Q3",html:"<div class=\"slide\" data-i=\"35\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q3 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">23 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 3</u><p>What is the one objection that kills your deals? Write it verbatim.</p></div><div class=\"answer\"><u>How they answer it</u><p>\u201cWe tried an agency before and it produced a lot of activity and no clients.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>It is a prior-vendor scar, which means you are selling against a memory, not a competitor.</span></div><div class=\"w\"><i>2</i><span>It names the failure mode precisely: <b>activity mistaken for progress</b>.</span></div><div class=\"w\"><i>3</i><span>It tells you the guarantee to write \u2014 one that pays out on results rather than deliverables.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cActivity, not clients\u201d draws the line between output and outcome. The whole offer should be priced and guaranteed on the right side of that line.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q3</span><span class=\"fbar\"><i style=\"width:31.9%\"></i></span><span class=\"pg num\">036<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Q3 \u00b7 Solopreneur",title:"Sarah Chen answers Q3",html:"<div class=\"slide\" data-i=\"36\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Q3 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">24 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 3</u><p>What is the one objection that kills your deals? Write it verbatim.</p></div><div class=\"answer\"><u>How they answer it</u><p>\u201cThis probably works for bigger companies. We're too small and too messy for it.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>\u201cToo small and too messy\u201d is self-disqualification \u2014 the prospect is excluding themselves.</span></div><div class=\"w\"><i>2</i><span>It is aimed at their own situation, not at the offer, so features will not shift it.</span></div><div class=\"w\"><i>3</i><span>It sets the proof requirement: a case study from someone <b>smaller and messier</b> than them.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Self-disqualification is the hardest objection to answer with logic, because it is really about shame. Proof from someone visibly smaller than them beats any argument.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q3</span><span class=\"fbar\"><i style=\"width:33.3%\"></i></span><span class=\"pg num\">037<i> / 230</i></span></div></div>"},
