 {day:"Day 2",section:"Day 2 \u00b7 S3",title:"Six touches before, two branches after",html:"<div class=\"slide\" data-i=\"93\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S3</span><span class=\"sp\"></span><span class=\"step num\">9 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">S3 \u00b7 nurture</div><div class=\"h2\" style=\"font-size:2.35cqw\">Six touches before, two branches after</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 540\" role=\"img\" aria-label=\"Nurture flowchart. A pre-event column of six timed touches from registration confirmation through T minus seven days, T minus twenty-four hours, T minus one hour, T minus fifteen minutes and going live, each tagged with its channels. These lead into the live session and an attended-or-not decision. The attended branch has four follow-ups from the offer through a last call; the no-show branch has four, from an expiring replay link through a final notice and then a thirty-day nurture. Both branches merge into the fifty-two week cadence.\">\n          <defs>\n            <marker id=\"NURTURE_n1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"NURTURE_n2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"NURTURE_n3\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- channel legend -->\n          <g font-size=\"10\">\n            <circle cx=\"524\" cy=\"26\" r=\"4.5\" fill=\"var(--accent)\"/><text x=\"534\" y=\"27\" class=\"svmute\">email</text>\n            <circle cx=\"588\" cy=\"26\" r=\"4.5\" fill=\"var(--teal)\"/><text x=\"598\" y=\"27\" class=\"svmute\">WhatsApp</text>\n            <circle cx=\"676\" cy=\"26\" r=\"4.5\" fill=\"var(--blue)\"/><text x=\"686\" y=\"27\" class=\"svmute\">SMS</text>\n            <circle cx=\"730\" cy=\"26\" r=\"4.5\" fill=\"var(--amber)\"/><text x=\"740\" y=\"27\" class=\"svmute\">AI voice call</text>\n          </g>\n          <text x=\"16\" y=\"44\" class=\"svsub\" font-size=\"11\">PRE-EVENT \u00b7 the show-up engine</text>\n          <line x1=\"9\" y1=\"64\" x2=\"9\" y2=\"358\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"6 6\" class=\"flowline\" opacity=\".7\"/>\n          <g font-size=\"10.5\">\n            <rect x=\"16\" y=\"64\" width=\"234\" height=\"44\" rx=\"9\" class=\"node\"/>\n            <text x=\"30\" y=\"82\" class=\"svlabel\" font-size=\"10.5\">On registration</text><text x=\"30\" y=\"98\" class=\"svmute\" font-size=\"9\">confirmation + calendar file</text>\n            <circle cx=\"214\" cy=\"86\" r=\"4.5\" fill=\"var(--accent)\"/><circle cx=\"230\" cy=\"86\" r=\"4.5\" fill=\"var(--teal)\"/>\n\n            <rect x=\"16\" y=\"114\" width=\"234\" height=\"44\" rx=\"9\" class=\"node\"/>\n            <text x=\"30\" y=\"132\" class=\"svlabel\" font-size=\"10.5\">T\u22127 days</text><text x=\"30\" y=\"148\" class=\"svmute\" font-size=\"9\">value primer \u2014 one useful idea</text>\n            <circle cx=\"230\" cy=\"136\" r=\"4.5\" fill=\"var(--accent)\"/>\n\n            <rect x=\"16\" y=\"164\" width=\"234\" height=\"44\" rx=\"9\" class=\"node\"/>\n            <text x=\"30\" y=\"182\" class=\"svlabel\" font-size=\"10.5\">T\u221224h \u00b7 8am their time</text><text x=\"30\" y=\"198\" class=\"svmute\" font-size=\"9\">what to prepare before you join</text>\n            <circle cx=\"214\" cy=\"186\" r=\"4.5\" fill=\"var(--accent)\"/><circle cx=\"230\" cy=\"186\" r=\"4.5\" fill=\"var(--teal)\"/>\n\n            <rect x=\"16\" y=\"214\" width=\"234\" height=\"44\" rx=\"9\" class=\"node\"/>\n            <text x=\"30\" y=\"232\" class=\"svlabel\" font-size=\"10.5\">T\u22121 hour</text><text x=\"30\" y=\"248\" class=\"svmute\" font-size=\"9\">the join link, again</text>\n            <circle cx=\"198\" cy=\"236\" r=\"4.5\" fill=\"var(--accent)\"/><circle cx=\"214\" cy=\"236\" r=\"4.5\" fill=\"var(--teal)\"/><circle cx=\"230\" cy=\"236\" r=\"4.5\" fill=\"var(--blue)\"/>\n\n            <rect x=\"16\" y=\"264\" width=\"234\" height=\"44\" rx=\"9\" class=\"node\"/>\n            <text x=\"30\" y=\"282\" class=\"svlabel\" font-size=\"10.5\">T\u221215 min</text><text x=\"30\" y=\"298\" class=\"svmute\" font-size=\"9\">we start in fifteen</text>\n            <circle cx=\"214\" cy=\"286\" r=\"4.5\" fill=\"var(--teal)\"/><circle cx=\"230\" cy=\"286\" r=\"4.5\" fill=\"var(--blue)\"/>\n\n            <rect x=\"16\" y=\"314\" width=\"234\" height=\"44\" rx=\"9\" fill=\"var(--accent-2)\"/>\n            <text x=\"30\" y=\"332\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">T\u22120 \u00b7 we're live</text><text x=\"30\" y=\"348\" class=\"svmute\" font-size=\"9\">the touch that converts the stragglers</text>\n            <circle cx=\"214\" cy=\"336\" r=\"4.5\" fill=\"var(--teal)\"/><circle cx=\"230\" cy=\"336\" r=\"4.5\" fill=\"var(--amber)\"/>\n          </g>\n          <path d=\"M252 200 C266 200 262 182 272 178\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" marker-end=\"url(#NURTURE_n1)\" class=\"flowline\"/>\n          <rect x=\"276\" y=\"150\" width=\"142\" height=\"52\" rx=\"12\" fill=\"var(--accent)\"/>\n          <text x=\"347\" y=\"172\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"12.5\">LIVE SESSION</text>\n          <text x=\"347\" y=\"189\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"10\">stage S4</text>\n          <path d=\"M347 202 V228\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" marker-end=\"url(#NURTURE_n1)\"/>\n          <polygon points=\"347,234 385,272 347,310 309,272\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\" stroke-width=\"1.6\"/>\n          <text x=\"347\" y=\"272\" text-anchor=\"middle\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"11\">Attended?</text>\n          <path d=\"M387 260 C420 258 424 160 446 152\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" marker-end=\"url(#NURTURE_n2)\" class=\"flowline\"/>\n          <path d=\"M387 284 C420 286 424 352 446 360\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.8\" marker-end=\"url(#NURTURE_n3)\" class=\"flowline\"/>\n          <text x=\"426\" y=\"192\" class=\"svmute\" font-size=\"9.5\">yes</text>\n          <text x=\"416\" y=\"330\" class=\"svmute\" font-size=\"9.5\">no</text>\n\n          <rect x=\"452\" y=\"56\" width=\"392\" height=\"190\" rx=\"12\" fill=\"var(--teal-bg)\"/>\n          <text x=\"470\" y=\"80\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11.5\">ATTENDED \u00b7 they've seen the offer</text>\n          <g font-size=\"10.5\">\n            <rect x=\"468\" y=\"92\" width=\"360\" height=\"32\" rx=\"7\" fill=\"var(--panel)\"/><text x=\"482\" y=\"107\" class=\"svlabel\" font-size=\"10.5\">+0 \u00b7 the offer and the booking link</text><text x=\"482\" y=\"120\" class=\"svmute\" font-size=\"9\">sent while they're still in the room</text>\n            <rect x=\"468\" y=\"130\" width=\"360\" height=\"32\" rx=\"7\" fill=\"var(--panel)\"/><text x=\"482\" y=\"145\" class=\"svlabel\" font-size=\"10.5\">+1 day \u00b7 recap + objection one</text><text x=\"482\" y=\"158\" class=\"svmute\" font-size=\"9\">the objection from your ICP card, answered</text>\n            <rect x=\"468\" y=\"168\" width=\"360\" height=\"32\" rx=\"7\" fill=\"var(--panel)\"/><text x=\"482\" y=\"183\" class=\"svlabel\" font-size=\"10.5\">+2 days \u00b7 proof + objection two</text><text x=\"482\" y=\"196\" class=\"svmute\" font-size=\"9\">a named result, not an adjective</text>\n            <rect x=\"468\" y=\"206\" width=\"360\" height=\"32\" rx=\"7\" fill=\"var(--panel)\"/><text x=\"482\" y=\"221\" class=\"svlabel\" font-size=\"10.5\">+3 days \u00b7 last call</text><text x=\"482\" y=\"234\" class=\"svmute\" font-size=\"9\">a real deadline, or don't use the word</text>\n          </g>\n\n          <rect x=\"452\" y=\"266\" width=\"392\" height=\"190\" rx=\"12\" fill=\"var(--amber-bg)\"/>\n          <text x=\"470\" y=\"290\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"11.5\">NO-SHOW \u00b7 they've seen nothing yet</text>\n          <g font-size=\"10.5\">\n            <rect x=\"468\" y=\"302\" width=\"360\" height=\"32\" rx=\"7\" fill=\"var(--panel)\"/><text x=\"482\" y=\"317\" class=\"svlabel\" font-size=\"10.5\">+24h \u00b7 the replay, with an expiry</text><text x=\"482\" y=\"330\" class=\"svmute\" font-size=\"9\">no expiry means no reason to watch today</text>\n            <rect x=\"468\" y=\"340\" width=\"360\" height=\"32\" rx=\"7\" fill=\"var(--panel)\"/><text x=\"482\" y=\"355\" class=\"svlabel\" font-size=\"10.5\">+2 days \u00b7 the one thing they missed</text><text x=\"482\" y=\"368\" class=\"svmute\" font-size=\"9\">one idea, timestamped, not \"here's the recording\"</text>\n            <rect x=\"468\" y=\"378\" width=\"360\" height=\"32\" rx=\"7\" fill=\"var(--panel)\"/><text x=\"482\" y=\"393\" class=\"svlabel\" font-size=\"10.5\">+5 days \u00b7 replay closes tonight</text><text x=\"482\" y=\"406\" class=\"svmute\" font-size=\"9\">then actually close it</text>\n            <rect x=\"468\" y=\"416\" width=\"360\" height=\"32\" rx=\"7\" fill=\"var(--panel)\"/><text x=\"482\" y=\"431\" class=\"svlabel\" font-size=\"10.5\">still nothing \u2192 30-day nurture</text><text x=\"482\" y=\"444\" class=\"svmute\" font-size=\"9\">unqualified is not the same as uninterested</text>\n          </g>\n          <path d=\"M468 246 C440 250 436 264 436 340 V470 C436 478 442 484 450 484\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.6\" stroke-dasharray=\"5 6\" marker-end=\"url(#NURTURE_n2)\" opacity=\".9\"/>\n          <path d=\"M648 456 V476\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.6\" marker-end=\"url(#NURTURE_n3)\"/>\n          <rect x=\"452\" y=\"482\" width=\"392\" height=\"46\" rx=\"11\" fill=\"var(--panel-2)\" stroke=\"var(--teal)\"/>\n          <text x=\"648\" y=\"500\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"11.5\">S6 \u00b7 everyone still on the list enters the 52-week cadence</text>\n          <text x=\"648\" y=\"517\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">nobody exits the funnel \u2014 they only change speed</text>\n          <text x=\"16\" y=\"400\" class=\"svlabel\" font-size=\"10.5\">Tantra Pro Flow = 14 nodes</text>\n          <text x=\"16\" y=\"420\" class=\"svmute\" font-size=\"10\">email, WhatsApp and SMS,</text>\n          <text x=\"16\" y=\"436\" class=\"svmute\" font-size=\"10\">plus an AI voice reminder</text>\n          <text x=\"16\" y=\"452\" class=\"svmute\" font-size=\"10\">call at T\u22120.</text>\n          <text x=\"16\" y=\"490\" class=\"svlabel\" font-size=\"16\">89% show-up</text>\n          <text x=\"16\" y=\"510\" class=\"svmute\" font-size=\"9.5\">teaching model \u2014 every</text>\n          <text x=\"16\" y=\"526\" class=\"svmute\" font-size=\"9.5\">channel earns its place.</text>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Six touches before the event</div><div class=\"ab\">On registration, T\u22127 days, T\u221224 hours, T\u22121 hour, T\u221215 minutes, and live. Each one has a different job.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">T\u221224h at 8am in &lt;em&gt;their&lt;/em&gt; timezone</div><div class=\"ab\">Not yours. A reminder landing at 3am is buried under everything that arrives after it.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Two branches after</div><div class=\"ab\">Attended and no-show are different conversations. Sending one sequence to both wastes the more valuable half.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">The touches closest to the event are where show-up is actually decided.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Six touches before, two branches after</span><span class=\"fbar\"><i style=\"width:13.2%\"></i></span><span class=\"pg num\">094<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S4",title:"Sixty minutes, four lanes",html:"<div class=\"slide\" data-i=\"94\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S4</span><span class=\"sp\"></span><span class=\"step num\">10 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">S4 \u00b7 delivery</div><div class=\"h2\" style=\"font-size:2.35cqw\">Sixty minutes, four lanes, nothing improvised</div><div class=\"viz\"><svg viewBox=\"0 0 860 474\" role=\"img\" aria-label=\"Run of show timeline across sixty minutes with four lanes. Host lane: waiting room for five minutes, introduction and why to ten minutes, content to forty-five minutes, then question and answer to sixty. Chat and polls lane: chat rules posted at one minute, three ninety-second polls, and three three-minute offer call-to-action windows. Direct message lane: three timed one-to-one messages at three, fifteen and forty minutes. Tech lane: recording on at the start, attendee counts logged every five minutes, replay exported at the end. Below, five behind-the-scenes roles.\">\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">THE CLOCK RUNS THE SESSION</text>\n          <g class=\"svmute\" font-size=\"9\">\n            <text x=\"96\" y=\"52\" text-anchor=\"middle\">0</text><text x=\"157\" y=\"52\" text-anchor=\"middle\">5</text><text x=\"219\" y=\"52\" text-anchor=\"middle\">10</text><text x=\"280\" y=\"52\" text-anchor=\"middle\">15</text><text x=\"341\" y=\"52\" text-anchor=\"middle\">20</text><text x=\"403\" y=\"52\" text-anchor=\"middle\">25</text><text x=\"464\" y=\"52\" text-anchor=\"middle\">30</text><text x=\"525\" y=\"52\" text-anchor=\"middle\">35</text><text x=\"587\" y=\"52\" text-anchor=\"middle\">40</text><text x=\"648\" y=\"52\" text-anchor=\"middle\">45</text><text x=\"709\" y=\"52\" text-anchor=\"middle\">50</text><text x=\"771\" y=\"52\" text-anchor=\"middle\">55</text><text x=\"832\" y=\"52\" text-anchor=\"middle\">60</text>\n          </g>\n          <g stroke=\"var(--line)\" stroke-width=\"1\">\n            <line x1=\"96\" y1=\"58\" x2=\"96\" y2=\"290\"/><line x1=\"157\" y1=\"58\" x2=\"157\" y2=\"290\"/><line x1=\"219\" y1=\"58\" x2=\"219\" y2=\"290\"/><line x1=\"280\" y1=\"58\" x2=\"280\" y2=\"290\"/><line x1=\"341\" y1=\"58\" x2=\"341\" y2=\"290\"/><line x1=\"403\" y1=\"58\" x2=\"403\" y2=\"290\"/><line x1=\"464\" y1=\"58\" x2=\"464\" y2=\"290\"/><line x1=\"525\" y1=\"58\" x2=\"525\" y2=\"290\"/><line x1=\"587\" y1=\"58\" x2=\"587\" y2=\"290\"/><line x1=\"648\" y1=\"58\" x2=\"648\" y2=\"290\"/><line x1=\"709\" y1=\"58\" x2=\"709\" y2=\"290\"/><line x1=\"771\" y1=\"58\" x2=\"771\" y2=\"290\"/><line x1=\"832\" y1=\"58\" x2=\"832\" y2=\"290\"/>\n          </g>\n          <!-- lane 1 host -->\n          <text x=\"16\" y=\"105\" class=\"svlabel\" font-size=\"10.5\">Host</text>\n          <g font-size=\"10\">\n            <rect x=\"96\" y=\"84\" width=\"61\" height=\"40\" rx=\"6\" fill=\"var(--line)\"/><text x=\"126\" y=\"108\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">hold</text>\n            <rect x=\"159\" y=\"84\" width=\"58\" height=\"40\" rx=\"6\" fill=\"var(--accent-2)\"/><text x=\"188\" y=\"108\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-size=\"9\" font-weight=\"650\">why</text>\n            <rect x=\"221\" y=\"84\" width=\"425\" height=\"40\" rx=\"6\" fill=\"var(--accent)\"/><text x=\"433\" y=\"108\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11\">CONTENT \u00b7 35 minutes, teaching the mechanism</text>\n            <rect x=\"650\" y=\"84\" width=\"182\" height=\"40\" rx=\"6\" fill=\"#0f9e75\"/><text x=\"741\" y=\"108\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11\">Q&amp;A \u00b7 15 min</text>\n          </g>\n          <!-- lane 2 chat + polls -->\n          <text x=\"16\" y=\"161\" class=\"svlabel\" font-size=\"10.5\">Chat</text><text x=\"16\" y=\"174\" class=\"svmute\" font-size=\"9\">+ polls</text>\n          <rect x=\"96\" y=\"140\" width=\"736\" height=\"40\" rx=\"6\" fill=\"var(--panel-2)\"/>\n          <g font-size=\"9\">\n            <rect x=\"104\" y=\"146\" width=\"30\" height=\"28\" rx=\"5\" fill=\"var(--ink-3)\" opacity=\".3\"/><text x=\"119\" y=\"161\" text-anchor=\"middle\" class=\"svmute\" font-size=\"8\">rules</text>\n            <rect x=\"271\" y=\"146\" width=\"19\" height=\"28\" rx=\"5\" fill=\"var(--blue)\"/><rect x=\"430\" y=\"146\" width=\"19\" height=\"28\" rx=\"5\" fill=\"var(--blue)\"/><rect x=\"578\" y=\"146\" width=\"19\" height=\"28\" rx=\"5\" fill=\"var(--blue)\"/>\n            <rect x=\"341\" y=\"146\" width=\"37\" height=\"28\" rx=\"5\" fill=\"var(--pink)\"/><rect x=\"501\" y=\"146\" width=\"37\" height=\"28\" rx=\"5\" fill=\"var(--pink)\"/><rect x=\"685\" y=\"146\" width=\"37\" height=\"28\" rx=\"5\" fill=\"var(--pink)\"/>\n          </g>\n          <text x=\"96\" y=\"196\" class=\"svmute\" font-size=\"9\">polls \u00b7 1 min 30 each</text>\n          <text x=\"345\" y=\"196\" class=\"svmute\" font-size=\"9\">offer CTA \u00b7 3 min each \u00b7 repeat the link in chat every 5 min</text>\n          <!-- lane 3 DMs -->\n          <text x=\"16\" y=\"230\" class=\"svlabel\" font-size=\"10.5\">1:1 DMs</text>\n          <rect x=\"96\" y=\"210\" width=\"736\" height=\"40\" rx=\"6\" fill=\"var(--panel-2)\"/>\n          <g font-size=\"9\">\n            <circle cx=\"133\" cy=\"230\" r=\"9\" fill=\"var(--teal)\"/><text x=\"133\" y=\"230\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"8\">3</text>\n            <circle cx=\"280\" cy=\"230\" r=\"9\" fill=\"var(--teal)\"/><text x=\"280\" y=\"230\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"8\">15</text>\n            <circle cx=\"587\" cy=\"230\" r=\"9\" fill=\"var(--teal)\"/><text x=\"587\" y=\"230\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"8\">40</text>\n            <text x=\"150\" y=\"233\" class=\"svmute\">\"can you hear us?\"</text>\n            <text x=\"297\" y=\"233\" class=\"svmute\">\"what's your biggest blocker right now?\"</text>\n            <text x=\"604\" y=\"233\" class=\"svmute\">\"any question for the Q&amp;A?\"</text>\n          </g>\n          <!-- lane 4 tech -->\n          <text x=\"16\" y=\"286\" class=\"svlabel\" font-size=\"10.5\">Tech</text>\n          <rect x=\"96\" y=\"266\" width=\"736\" height=\"30\" rx=\"6\" fill=\"var(--panel-2)\"/>\n          <g font-size=\"9\" class=\"svmute\">\n            <text x=\"106\" y=\"282\">record on</text>\n            <text x=\"300\" y=\"282\">log the attendee count every 5 minutes \u2014 that curve is your retention data</text>\n            <text x=\"762\" y=\"282\">replay export</text>\n          </g>\n          <!-- roles -->\n          <line x1=\"16\" y1=\"316\" x2=\"844\" y2=\"316\" class=\"gridline\"/>\n          <text x=\"16\" y=\"338\" class=\"svsub\" font-size=\"11\">FIVE PEOPLE BEHIND THE SCENES \u00b7 the host is only one of them</text>\n          <g font-size=\"10\">\n            <rect x=\"16\" y=\"350\" width=\"152\" height=\"108\" rx=\"10\" class=\"node\"/><text x=\"30\" y=\"372\" class=\"svlabel\" font-size=\"10.5\">Host</text><text x=\"30\" y=\"392\" class=\"svmute\" font-size=\"9\">Teaches. Never touches</text><text x=\"30\" y=\"406\" class=\"svmute\" font-size=\"9\">settings, chat or slides.</text><text x=\"30\" y=\"428\" class=\"svmute\" font-size=\"9\">If the host is troubleshooting,</text><text x=\"30\" y=\"442\" class=\"svmute\" font-size=\"9\">the session is already lost.</text>\n            <rect x=\"180\" y=\"350\" width=\"152\" height=\"108\" rx=\"10\" class=\"node\"/><text x=\"194\" y=\"372\" class=\"svlabel\" font-size=\"10.5\">Content moderator</text><text x=\"194\" y=\"392\" class=\"svmute\" font-size=\"9\">Feeds the host questions,</text><text x=\"194\" y=\"406\" class=\"svmute\" font-size=\"9\">signals pace and breaks,</text><text x=\"194\" y=\"428\" class=\"svmute\" font-size=\"9\">and runs the polls on</text><text x=\"194\" y=\"442\" class=\"svmute\" font-size=\"9\">the clock.</text>\n            <rect x=\"344\" y=\"350\" width=\"152\" height=\"108\" rx=\"10\" class=\"node\"/><text x=\"358\" y=\"372\" class=\"svlabel\" font-size=\"10.5\">Tech moderator</text><text x=\"358\" y=\"392\" class=\"svmute\" font-size=\"9\">Owns the platform.</text><text x=\"358\" y=\"406\" class=\"svmute\" font-size=\"9\">Promotes panelists,</text><text x=\"358\" y=\"428\" class=\"svmute\" font-size=\"9\">answers \"I can't hear you\"</text><text x=\"358\" y=\"442\" class=\"svmute\" font-size=\"9\">in private chat.</text>\n            <rect x=\"508\" y=\"350\" width=\"152\" height=\"108\" rx=\"10\" class=\"node\"/><text x=\"522\" y=\"372\" class=\"svlabel\" font-size=\"10.5\">Chat &amp; Q&amp;A</text><text x=\"522\" y=\"392\" class=\"svmute\" font-size=\"9\">Posts the CTA link on</text><text x=\"522\" y=\"406\" class=\"svmute\" font-size=\"9\">cadence, removes spam,</text><text x=\"522\" y=\"428\" class=\"svmute\" font-size=\"9\">curates questions so the</text><text x=\"522\" y=\"442\" class=\"svmute\" font-size=\"9\">best ones surface.</text>\n            <rect x=\"672\" y=\"350\" width=\"152\" height=\"108\" rx=\"10\" class=\"node\"/><text x=\"686\" y=\"372\" class=\"svlabel\" font-size=\"10.5\">DM operator</text><text x=\"686\" y=\"392\" class=\"svmute\" font-size=\"9\">Sends the three timed</text><text x=\"686\" y=\"406\" class=\"svmute\" font-size=\"9\">messages and captures</text><text x=\"686\" y=\"428\" class=\"svmute\" font-size=\"9\">replies straight into</text><text x=\"686\" y=\"442\" class=\"svmute\" font-size=\"9\">the CRM.</text>\n          </g>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">The structure is fixed before the day</div><div class=\"cb\">Pain-point open, then the current state of the art, then the system with case studies, then the offer, then Q&A.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">The offer gets a minute on the clock</div><div class=\"cb\">Decided in advance, not felt on the day. A soft pitch of one to three slides, then a clear call to action.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Five roles, five names</div><div class=\"cb\">Host, tech, chat, content moderator, DMs. A role with nobody's name on it is a role nobody does.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Tuesday to Thursday, late morning or early afternoon, sixty minutes \u2014 content, then Q&A.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sixty minutes, four lanes</span><span class=\"fbar\"><i style=\"width:14.7%\"></i></span><span class=\"pg num\">095<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S4",title:"The four polls",html:"<div class=\"slide\" data-i=\"95\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S4</span><span class=\"sp\"></span><span class=\"step num\">11 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Inside the session</div><div class=\"h2\">Four polls, in this order, each doing one job</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Persona poll</div><div class=\"rs\">Opens the session. Tells you who is actually in the room tonight.</div></div><div class=\"rmeta\"><b>Slide 1</b><span>who</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Challenge poll</div><div class=\"rs\">Surfaces the dominant problem, in their words, live.</div></div><div class=\"rmeta\"><b>Early</b><span>what</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Investment-priority poll</div><div class=\"rs\">Around the ten to fifteen minute mark. Separates browsers from buyers.</div></div><div class=\"rmeta\"><b>~10\u201315 min</b><span>intent</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Discovery-call interest poll</div><div class=\"rs\">On the pitch slide. This is the list your close chain follows up.</div></div><div class=\"rmeta\"><b>Pitch slide</b><span>the gate</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Exit survey</div><div class=\"rs\">On leaving: call interest, reason for leaving, satisfaction.</div></div><div class=\"rmeta\"><b>On exit</b><span>signal</span></div></div></div><div class=\"bar\"><span class=\"bl\">Why poll four matters most</span><span class=\"bt\">The close chain follows up the people who answered yes to it. Everyone else gets the recording and nothing more \u2014 which is what keeps the follow-up welcome.</span></div><div class=\"foot\">Source: poll sequencing and exit survey, the <b>next-gen session workbook</b>.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The four polls</span><span class=\"fbar\"><i style=\"width:16.2%\"></i></span><span class=\"pg num\">096<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S5",title:"From offer to money",html:"<div class=\"slide\" data-i=\"96\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S5</span><span class=\"sp\"></span><span class=\"step num\">12 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">S5 \u00b7 the close</div><div class=\"h2\" style=\"font-size:2.35cqw\">From offer to money, and what the record says</div><div class=\"viz\"><svg viewBox=\"0 0 860 382\" role=\"img\" aria-label=\"Three-lane swimlane from offer to payment. The prospect lane runs from seeing the offer to picking a slot, receiving confirmation, turning up, reading the proposal and paying. The system lane shows the corresponding automation at each step. The CRM lane shows the pipeline stage each step writes. A no-show recovery branch hangs beneath the turn-up step.\">\n          <defs>\n            <marker id=\"CLOSE_mkClose\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"CLOSE_mkCloseAmber\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <text x=\"16\" y=\"88\" class=\"svlabel\" font-size=\"10.5\">Prospect</text>\n          <text x=\"16\" y=\"180\" class=\"svlabel\" font-size=\"10.5\">Your system</text>\n          <text x=\"16\" y=\"272\" class=\"svlabel\" font-size=\"10.5\">The record</text>\n          <text x=\"16\" y=\"22\" class=\"svsub\" font-size=\"11\">EVERY STEP WRITES A STAGE \u2014 if it doesn't, you cannot diagnose the close</text>\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.6\" opacity=\".55\" marker-end=\"url(#CLOSE_mkClose)\">\n            <path d=\"M228 86 L232 86\" class=\"flowline\"/><path d=\"M348 86 L352 86\" class=\"flowline\"/><path d=\"M468 86 L472 86\" class=\"flowline\"/><path d=\"M588 86 L592 86\" class=\"flowline\"/><path d=\"M708 86 L712 86\" class=\"flowline\"/>\n          </g>\n          <g font-size=\"10\">\n            <rect x=\"116\" y=\"60\" width=\"112\" height=\"52\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"172\" y=\"82\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">Sees the offer</text><text x=\"172\" y=\"98\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">slide \u00b7 chat \u00b7 email</text>\n            <rect x=\"236\" y=\"60\" width=\"112\" height=\"52\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"292\" y=\"82\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">Picks a slot</text><text x=\"292\" y=\"98\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">or buys outright</text>\n            <rect x=\"356\" y=\"60\" width=\"112\" height=\"52\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"412\" y=\"82\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">Gets confirmed</text><text x=\"412\" y=\"98\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">+ two reminders</text>\n            <rect x=\"476\" y=\"60\" width=\"112\" height=\"52\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"532\" y=\"82\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">Turns up</text><text x=\"532\" y=\"98\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">or doesn't \u2192</text>\n            <rect x=\"596\" y=\"60\" width=\"112\" height=\"52\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"652\" y=\"82\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">Reads proposal</text><text x=\"652\" y=\"98\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">inside 24 hours</text>\n            <rect x=\"716\" y=\"60\" width=\"112\" height=\"52\" rx=\"9\" fill=\"#0f9e75\"/><text x=\"772\" y=\"82\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"10.5\">Pays</text><text x=\"772\" y=\"98\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"9\">wallets first</text>\n          </g>\n          <g font-size=\"9.5\">\n            <rect x=\"116\" y=\"152\" width=\"112\" height=\"52\" rx=\"9\" class=\"node\"/><text x=\"172\" y=\"172\" text-anchor=\"middle\" class=\"svsub\" font-size=\"9.5\">CTA link, tagged</text><text x=\"172\" y=\"188\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">so you know the source</text>\n            <rect x=\"236\" y=\"152\" width=\"112\" height=\"52\" rx=\"9\" class=\"node\"/><text x=\"292\" y=\"172\" text-anchor=\"middle\" class=\"svsub\" font-size=\"9.5\">booking page</text><text x=\"292\" y=\"188\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">+ qualification fields</text>\n            <rect x=\"356\" y=\"152\" width=\"112\" height=\"52\" rx=\"9\" class=\"node\"/><text x=\"412\" y=\"172\" text-anchor=\"middle\" class=\"svsub\" font-size=\"9.5\">confirm + prep note</text><text x=\"412\" y=\"188\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">T\u221224h and T\u22121h</text>\n            <rect x=\"476\" y=\"152\" width=\"112\" height=\"52\" rx=\"9\" class=\"node\"/><text x=\"532\" y=\"172\" text-anchor=\"middle\" class=\"svsub\" font-size=\"9.5\">recording + notes</text><text x=\"532\" y=\"188\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">synced automatically</text>\n            <rect x=\"596\" y=\"152\" width=\"112\" height=\"52\" rx=\"9\" class=\"node\"/><text x=\"652\" y=\"172\" text-anchor=\"middle\" class=\"svsub\" font-size=\"9.5\">proposal generated</text><text x=\"652\" y=\"188\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">+ unopened watchdog</text>\n            <rect x=\"716\" y=\"152\" width=\"112\" height=\"52\" rx=\"9\" class=\"node\"/><text x=\"772\" y=\"172\" text-anchor=\"middle\" class=\"svsub\" font-size=\"9.5\">checkout + receipt</text><text x=\"772\" y=\"188\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9\">webhook verified</text>\n          </g>\n          <g font-size=\"9.5\">\n            <rect x=\"116\" y=\"244\" width=\"112\" height=\"38\" rx=\"8\" fill=\"var(--panel-2)\"/><text x=\"172\" y=\"267\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Form filled</text>\n            <rect x=\"236\" y=\"244\" width=\"112\" height=\"38\" rx=\"8\" fill=\"var(--panel-2)\"/><text x=\"292\" y=\"267\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Call scheduled</text>\n            <rect x=\"356\" y=\"244\" width=\"112\" height=\"38\" rx=\"8\" fill=\"var(--panel-2)\"/><text x=\"412\" y=\"267\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Qualified / not</text>\n            <rect x=\"476\" y=\"244\" width=\"112\" height=\"38\" rx=\"8\" fill=\"var(--panel-2)\"/><text x=\"532\" y=\"267\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Call held</text>\n            <rect x=\"596\" y=\"244\" width=\"112\" height=\"38\" rx=\"8\" fill=\"var(--panel-2)\"/><text x=\"652\" y=\"267\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">Proposal sent</text>\n            <rect x=\"716\" y=\"244\" width=\"112\" height=\"38\" rx=\"8\" fill=\"var(--teal-bg)\"/><text x=\"772\" y=\"267\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"9.5\">Payment completed</text>\n          </g>\n          <path d=\"M532 112 C532 126 500 130 500 140 V318 C500 330 506 336 516 336\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.6\" stroke-dasharray=\"5 6\" marker-end=\"url(#CLOSE_mkCloseAmber)\" opacity=\".9\"/>\n          <rect x=\"520\" y=\"316\" width=\"324\" height=\"54\" rx=\"9\" fill=\"var(--amber-bg)\"/>\n          <text x=\"536\" y=\"334\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">No-show recovery \u2014 automatic, not optional</text>\n          <text x=\"536\" y=\"349\" class=\"svmute\" font-size=\"9\">rebook link inside the hour, then two follow-ups \u2014</text>\n          <text x=\"536\" y=\"362\" class=\"svmute\" font-size=\"9\">this recovers a real slice of an already-booked pipeline.</text>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Immediately, then plus twenty-four hours</div><div class=\"cb\">A book-a-call message right after the session, then the recording the next day. Both go to everyone who attended.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Then up to three more, every three days</div><div class=\"cb\">But only to the people who said yes on the interest poll. Capped at five touches total, across two weeks.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">A cap is a feature</div><div class=\"cb\">The cap is what keeps the follow-up welcome. An uncapped sequence converts a warm list into an unsubscribe list.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Five touches, two weeks, poll-gated. Then stop and let the nurture sequence take over.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">From offer to money</span><span class=\"fbar\"><i style=\"width:17.6%\"></i></span><span class=\"pg num\">097<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 S6",title:"The four tags, named once",html:"<div class=\"slide\" data-i=\"97\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 S6</span><span class=\"sp\"></span><span class=\"step num\">13 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">S6 \u00b7 the hand-off</div><div class=\"h2\">Define four tags and never rename them</div><div class=\"lede\">Registered, attended, no-show, purchased. Every automation, report and audience you build for the rest of the year keys off these four strings. Renaming one later is a breaking change that orphans every report built on it.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Name them before you build anything</div><div class=\"cb\">Lowercase, consistent, and written down where the whole team can see them.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Remove a tag after it triggers</div><div class=\"cb\">A tag that moves a contact and then stays put will re-fire the same automation forever. Clear it in the same workflow.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Four is enough to start</div><div class=\"cb\">Behavioural tags come later. These four carry every audience and report you need this month.</div></div></div><div class=\"bar\"><span class=\"bl\">The failure mode</span><span class=\"bt\">Automation loops caused by a trigger tag that was never removed are the single most common build defect in the source material.</span></div><div class=\"foot\">Source: tag-driven pipeline automation, <b>2_growthclub_funnel_automations</b>.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The four tags, named once</span><span class=\"fbar\"><i style=\"width:19.1%\"></i></span><span class=\"pg num\">098<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Day 2 \u00b7 full scope",title:"The reverse squeeze funnel, end to end",html:"<div class=\"slide\" data-i=\"98\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Day 2 \u00b7 full scope</span><span class=\"sp\"></span><span class=\"step num\">14 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Full scope</div><div class=\"h2\" style=\"font-size:2.35cqw\">The reverse squeeze funnel, end to end</div><div class=\"vizrow\" style=\"--split:1.08fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 758\" role=\"img\" aria-label=\"Reverse squeeze funnel across six stages. Stage one: the same five traffic channels, but every link points at content rather than a form. Stage two: Part One delivered openly with watch-depth tracking and an opt-in bridge that appears at a threshold. Stage three: depth-triggered nurture with three branches by consumption level. Stage four: Part Two gated and delivered instantly. Stage five: a backend offer routed by engagement score into a low-ticket or premium branch. Stage six: a dual-path growth engine. A loop returns re-engaged contacts to the top.\">\n          <defs>\n            <marker id=\"RSP_r1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--pink)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"RSP_r2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <path d=\"M44 690 H32 C24 690 22 684 22 676 V98 C22 90 26 84 36 84 H44\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.2\" stroke-dasharray=\"7 7\" class=\"flowline\" marker-end=\"url(#RSP_r2)\" opacity=\".95\"/>\n          <text transform=\"translate(11,388) rotate(-90)\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10.5\">re-engaged contacts re-enter at Part 1</text>\n          <g fill=\"none\" stroke=\"var(--pink)\" stroke-width=\"1.8\" opacity=\".55\" marker-end=\"url(#RSP_r1)\">\n            <path d=\"M444 122 V138\" class=\"flowline\"/><path d=\"M444 258 V274\" class=\"flowline\"/>\n            <path d=\"M444 396 V412\" class=\"flowline\"/><path d=\"M444 500 V516\" class=\"flowline\"/>\n            <path d=\"M444 634 V650\" class=\"flowline\"/>\n          </g>\n          <!-- S1 -->\n          <rect x=\"44\" y=\"16\" width=\"800\" height=\"104\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"28\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--pink)\"/><text x=\"76\" y=\"39\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S1</text>\n          <text x=\"102\" y=\"39\" class=\"svlabel\" font-size=\"14\">Traffic \u2014 pointed at content, not a form</text>\n          <text x=\"102\" y=\"56\" class=\"svmute\" font-size=\"10.5\">the link never expires, so every impression keeps working for months</text>\n          <g font-size=\"10\">\n            <rect x=\"60\" y=\"68\" width=\"150\" height=\"38\" rx=\"9\" class=\"node\"/><text x=\"72\" y=\"84\" class=\"svlabel\" font-size=\"10.5\">Cold email</text><text x=\"72\" y=\"98\" class=\"svmute\" font-size=\"9\">\"here's the thing itself\"</text>\n            <rect x=\"218\" y=\"68\" width=\"150\" height=\"38\" rx=\"9\" class=\"node\"/><text x=\"230\" y=\"84\" class=\"svlabel\" font-size=\"10.5\">LinkedIn</text><text x=\"230\" y=\"98\" class=\"svmute\" font-size=\"9\">post + comment, no DM ask</text>\n            <rect x=\"376\" y=\"68\" width=\"150\" height=\"38\" rx=\"9\" class=\"node\"/><text x=\"388\" y=\"84\" class=\"svlabel\" font-size=\"10.5\">Paid ads</text><text x=\"388\" y=\"98\" class=\"svmute\" font-size=\"9\">cheap clicks \u2014 no form friction</text>\n            <rect x=\"534\" y=\"68\" width=\"150\" height=\"38\" rx=\"9\" class=\"node\"/><text x=\"546\" y=\"84\" class=\"svlabel\" font-size=\"10.5\">Content \u00b7 organic</text><text x=\"546\" y=\"98\" class=\"svmute\" font-size=\"9\">the native home of this shape</text>\n            <rect x=\"692\" y=\"68\" width=\"150\" height=\"38\" rx=\"9\" class=\"node\"/><text x=\"704\" y=\"84\" class=\"svlabel\" font-size=\"10.5\">Partner placement</text><text x=\"704\" y=\"98\" class=\"svmute\" font-size=\"9\">value-first travels well</text>\n          </g>\n          <!-- S2 -->\n          <rect x=\"44\" y=\"140\" width=\"800\" height=\"116\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"152\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--pink)\"/><text x=\"76\" y=\"163\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S2</text>\n          <text x=\"102\" y=\"163\" class=\"svlabel\" font-size=\"14\">Part 1 \u2014 delivered in full, with no gate</text>\n          <text x=\"102\" y=\"180\" class=\"svmute\" font-size=\"10.5\">the page IS the asset \u00b7 the only thing you instrument is how far they get</text>\n          <g font-size=\"10\">\n            <rect x=\"60\" y=\"192\" width=\"250\" height=\"52\" rx=\"9\" class=\"node\"/><text x=\"74\" y=\"212\" class=\"svlabel\" font-size=\"10.5\">The content page</text><text x=\"74\" y=\"228\" class=\"svmute\" font-size=\"9\">no nav, no form, no exit links.</text><text x=\"74\" y=\"240\" class=\"svmute\" font-size=\"9\">One idea, delivered completely.</text>\n            <rect x=\"318\" y=\"192\" width=\"250\" height=\"52\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"332\" y=\"212\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"10.5\">Watch-depth tracking</text><text x=\"332\" y=\"228\" class=\"svmute\" font-size=\"9\">25% \u00b7 50% \u00b7 75% \u00b7 100% milestones,</text><text x=\"332\" y=\"240\" class=\"svmute\" font-size=\"9\">each one a logged event.</text>\n            <rect x=\"576\" y=\"192\" width=\"266\" height=\"52\" rx=\"9\" fill=\"var(--teal-bg)\"/><text x=\"590\" y=\"212\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"10.5\">The opt-in bridge</text><text x=\"590\" y=\"228\" class=\"svmute\" font-size=\"9\">appears only past the threshold.</text><text x=\"590\" y=\"240\" class=\"svmute\" font-size=\"9\">\"Part 2 goes deeper \u2014 where do I send it?\"</text>\n          </g>\n          <!-- S3 -->\n          <rect x=\"44\" y=\"276\" width=\"800\" height=\"118\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"288\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--pink)\"/><text x=\"76\" y=\"299\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S3</text>\n          <text x=\"102\" y=\"299\" class=\"svlabel\" font-size=\"14\">Nurture \u2014 triggered by depth, never by the clock</text>\n          <text x=\"102\" y=\"316\" class=\"svmute\" font-size=\"10.5\">this is the single biggest structural difference from a dated funnel</text>\n          <g font-size=\"10\">\n            <rect x=\"60\" y=\"328\" width=\"254\" height=\"54\" rx=\"9\" fill=\"var(--pink-bg)\"/><text x=\"74\" y=\"348\" fill=\"var(--pink)\" font-weight=\"700\" font-size=\"10.5\">Under 25% consumed</text><text x=\"74\" y=\"364\" class=\"svmute\" font-size=\"9\">Wrong person, or wrong hook.</text><text x=\"74\" y=\"376\" class=\"svmute\" font-size=\"9\">One re-engage, then let them go.</text>\n            <rect x=\"322\" y=\"328\" width=\"254\" height=\"54\" rx=\"9\" fill=\"var(--amber-bg)\"/><text x=\"336\" y=\"348\" fill=\"var(--amber)\" font-weight=\"700\" font-size=\"10.5\">25\u201375% consumed</text><text x=\"336\" y=\"364\" class=\"svmute\" font-size=\"9\">Interested, interrupted.</text><text x=\"336\" y=\"376\" class=\"svmute\" font-size=\"9\">Send the missing piece, timestamped.</text>\n            <rect x=\"584\" y=\"328\" width=\"258\" height=\"54\" rx=\"9\" fill=\"var(--teal-bg)\"/><text x=\"598\" y=\"348\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"10.5\">Over 75% consumed</text><text x=\"598\" y=\"364\" class=\"svmute\" font-size=\"9\">Your best lead of the week.</text><text x=\"598\" y=\"376\" class=\"svmute\" font-size=\"9\">Straight to the Part 2 bridge.</text>\n          </g>\n          <!-- S4 -->\n          <rect x=\"44\" y=\"414\" width=\"800\" height=\"84\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"426\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--pink)\"/><text x=\"76\" y=\"437\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S4</text>\n          <text x=\"102\" y=\"437\" class=\"svlabel\" font-size=\"14\">Part 2 \u2014 gated, and delivered in seconds</text>\n          <g font-size=\"10\">\n            <rect x=\"60\" y=\"452\" width=\"250\" height=\"34\" rx=\"9\" class=\"node\"/><text x=\"74\" y=\"473\" class=\"svlabel\" font-size=\"10.5\">Instant access page</text>\n            <rect x=\"318\" y=\"452\" width=\"250\" height=\"34\" rx=\"9\" class=\"node\"/><text x=\"332\" y=\"473\" class=\"svlabel\" font-size=\"10.5\">Email copy as backup delivery</text>\n            <rect x=\"576\" y=\"452\" width=\"266\" height=\"34\" rx=\"9\" class=\"node\"/><text x=\"590\" y=\"473\" class=\"svlabel\" font-size=\"10.5\">Escalates the mechanism, then offers</text>\n          </g>\n          <!-- S5 -->\n          <rect x=\"44\" y=\"518\" width=\"800\" height=\"114\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"530\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--pink)\"/><text x=\"76\" y=\"541\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S5</text>\n          <text x=\"102\" y=\"541\" class=\"svlabel\" font-size=\"14\">Backend offer \u2014 routed by engagement, not by date</text>\n          <text x=\"102\" y=\"558\" class=\"svmute\" font-size=\"10.5\">the dual-path variant: same funnel, two prices, chosen by behaviour</text>\n          <g font-size=\"10\">\n            <rect x=\"60\" y=\"570\" width=\"380\" height=\"50\" rx=\"9\" class=\"node\"/><text x=\"74\" y=\"590\" class=\"svlabel\" font-size=\"10.5\">Shallow branch \u2192 low-ticket offer</text><text x=\"74\" y=\"606\" class=\"svmute\" font-size=\"9\">self-serve checkout, no call, order bump on top</text>\n            <rect x=\"452\" y=\"570\" width=\"390\" height=\"50\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"466\" y=\"590\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"10.5\">Deep branch \u2192 premium offer</text><text x=\"466\" y=\"606\" class=\"svmute\" font-size=\"9\">booked call or high-ticket page \u2014 they've consumed everything</text>\n          </g>\n          <!-- S6 -->\n          <rect x=\"44\" y=\"652\" width=\"800\" height=\"90\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--teal)\" stroke-opacity=\".5\"/>\n          <rect x=\"60\" y=\"664\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--teal)\"/><text x=\"76\" y=\"675\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S6</text>\n          <text x=\"102\" y=\"675\" class=\"svlabel\" font-size=\"14\">Dual-path growth engine</text>\n          <g font-size=\"10\">\n            <rect x=\"60\" y=\"692\" width=\"250\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"74\" y=\"714\" class=\"svlabel\" font-size=\"10.5\">Low-ticket buyers \u2192 ascension track</text>\n            <rect x=\"318\" y=\"692\" width=\"250\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"332\" y=\"714\" class=\"svlabel\" font-size=\"10.5\">Non-buyers \u2192 new Part 1 each month</text>\n            <rect x=\"576\" y=\"692\" width=\"266\" height=\"36\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"590\" y=\"714\" class=\"svlabel\" font-size=\"10.5\">Premium buyers \u2192 referral + expansion</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Value before the gate</div><div class=\"ab\">Part one is given away with no opt-in at all. The gate arrives only once you have already been useful.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">The opt-in is strategic, not defensive</div><div class=\"ab\">It gates part two and the bonus \u2014 things the visitor now actively wants, having seen part one.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">The backend sells to a warmed list</div><div class=\"ab\">By the time the offer appears, the visitor has consumed real value. That is a different conversation from a cold page.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Give first, gate second, sell third \u2014 the inverse of a conventional squeeze page.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">The reverse squeeze funnel, end to end</span><span class=\"fbar\"><i style=\"width:20.6%\"></i></span><span class=\"pg num\">099<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Your turn",title:"Which channels are you actually launching?",html:"<div class=\"slide\" data-i=\"99\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">15 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 1 of 13</span><span class=\"qk\">Choose at least 1</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 2 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which channels are you actually launching?</div><div class=\"qopts\" style=\"--oc:2;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>Cold email</span></span><span class=\"qopt\"><i>B</i><span>LinkedIn outreach</span></span><span class=\"qopt\"><i>C</i><span>Paid ads</span></span><span class=\"qopt\"><i>D</i><span>Content &amp; organic</span></span><span class=\"qopt\"><i>E</i><span>Cold calendar</span></span><span class=\"qopt\"><i>F</i><span>Partner placements</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>One or two</u><span>Two run well beat five run badly. This is a capacity decision.</span></div><div class=\"qc\"><u>You can operate it</u><span>A channel needs a person and a cadence, not just an account.</span></div><div class=\"qc\"><u>It fits the register</u><span>Cold email into a market that treats it as spam costs you the brand.</span></div></div><div class=\"foot\"><b>Why this one:</b> \u201cAll of them\u201d means none of them properly. Each channel you tick has its own daily caps, its own warm-up cost and its own failure mode \u2014 and you are about to set all three.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which channels are you actually launching?</span><span class=\"fbar\"><i style=\"width:22.1%\"></i></span><span class=\"pg num\">100<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q1 \u00b7 B2B SaaS",title:"SendFlow answers Q1",html:"<div class=\"slide\" data-i=\"100\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q1 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">16 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 1</u><p>Which channels are you actually launching?</p></div><div class=\"answer\"><u>How they answer it</u><p>Cold email \u00b7 Paid ads \u2014 we are our own best case study, so we run what we sell.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Two channels only, both already inside the team's existing competence.</span></div><div class=\"w\"><i>2</i><span>Cold email needs dedicated domains, SPF/DKIM/DMARC and a 2\u20133 week warm-up before day one.</span></div><div class=\"w\"><i>3</i><span><b>\u226430\u201350 sends per inbox per day</b> is the hygiene ceiling \u2014 volume comes from more inboxes, never more sends.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Running the channel you sell is the strongest proof asset a tool company has \u2014 the funnel becomes a live demonstration rather than a claim about one.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q1</span><span class=\"fbar\"><i style=\"width:23.5%\"></i></span><span class=\"pg num\">101<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q1 \u00b7 B2B consulting brand",title:"Apex Growth answers Q1",html:"<div class=\"slide\" data-i=\"101\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q1 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">17 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 1</u><p>Which channels are you actually launching?</p></div><div class=\"answer\"><u>How they answer it</u><p>LinkedIn outreach \u00b7 Content &amp; organic \u2014 no cold email; our audience treats it as spam and we'd burn the brand.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Cold email is excluded deliberately \u2014 the audience reads it as spam and the brand pays for it.</span></div><div class=\"w\"><i>2</i><span>LinkedIn carries hard per-campaign caps: roughly <b>15\u201375 connections a day</b>, and messaging limits that track accept rate.</span></div><div class=\"w\"><i>3</i><span>Content compounds slowly but suits a firm selling seniority rather than speed.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Ruling out cold email on brand grounds is a strategy decision, not a squeamish one. At this seniority the channel's register is wrong and no amount of copy fixes that.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q1</span><span class=\"fbar\"><i style=\"width:25.0%\"></i></span><span class=\"pg num\">102<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q1 \u00b7 Solopreneur",title:"Sarah Chen answers Q1",html:"<div class=\"slide\" data-i=\"102\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q1 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">18 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 1</u><p>Which channels are you actually launching?</p></div><div class=\"answer\"><u>How they answer it</u><p>Content &amp; organic \u2014 only. No budget and no list, so compounding is the only option.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>One channel, chosen because it is the only one that survives a fully-booked delivery week.</span></div><div class=\"w\"><i>2</i><span>No list and no budget makes compounding organic the only honest option.</span></div><div class=\"w\"><i>3</i><span>A single channel also means a <b>single number to read</b> on Day 3, which keeps the loop tractable.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">One channel is the correct answer for one person. The constraint that matters is not budget \u2014 it is that there is nobody to cover the week she is heads-down delivering.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q1</span><span class=\"fbar\"><i style=\"width:26.5%\"></i></span><span class=\"pg num\">103<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Your turn",title:"Your branded page headline \u2014 plus the problem-led variant you'll test against it.",html:"<div class=\"slide\" data-i=\"103\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">19 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 2 of 13</span><span class=\"qk\">Long answer \u00b7 15+ words</span><span class=\"qtime\">\u23f1 5 min</span><span class=\"qtime\">Day 2 \u00b7 answer on your own screen</span></div><div class=\"qq\">Your branded page headline \u2014 plus the problem-led variant you'll test against it.</div><div class=\"qpad\"><u>Your answer \u00b7 on your own screen</u><i></i><i></i><i style=\"width:46%\"></i><b>Open the questions page \u00b7 Day 2</b></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Both variants</u><span>A benefit-led A and a problem-led B. One of each, not two of one.</span></div><div class=\"qc\"><u>B uses their words</u><span>Variant B should contain the Day 1 objection nearly verbatim.</span></div><div class=\"qc\"><u>Specific, not clever</u><span>A number or a named situation beats wordplay every time.</span></div></div><div class=\"foot\"><b>Why this one:</b> Two headlines, deliberately opposed. Benefit-led leads with the dream outcome; problem-led leads with the verbatim objection you wrote down on Day 1. You test them against each other, not against a hunch.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Your branded page headline \u2014 plus the problem-led variant you'll test against it.</span><span class=\"fbar\"><i style=\"width:27.9%\"></i></span><span class=\"pg num\">104<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q2 \u00b7 B2B SaaS",title:"SendFlow answers Q2",html:"<div class=\"slide\" data-i=\"104\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q2 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">20 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 2</u><p>Your branded page headline \u2014 plus the problem-led variant you'll test against it.</p></div><div class=\"answer\"><u>How they answer it</u><p>A: \u201c200 personalised touches a day, from the reps who currently send 15.\u201d  B: \u201cYour team won't use another tool. This one they don't have to open.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A leads with the arithmetic \u2014 15 \u2192 200 \u2014 which the buyer can check against their own numbers.</span></div><div class=\"w\"><i>2</i><span>B lifts \u201cyour team won't use another tool\u201d almost word for word from the Day 1 objection.</span></div><div class=\"w\"><i>3</i><span>B then resolves it in the same sentence: <b>\u201cthis one they don't have to open\u201d</b>.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Variant B is the Day 1 objection turned into a promise. That is the whole trick of problem-led copy \u2014 you are not answering the objection, you are proving you have heard it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q2</span><span class=\"fbar\"><i style=\"width:29.4%\"></i></span><span class=\"pg num\">105<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q2 \u00b7 B2B consulting brand",title:"Apex Growth answers Q2",html:"<div class=\"slide\" data-i=\"105\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q2 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">21 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 2</u><p>Your branded page headline \u2014 plus the problem-led variant you'll test against it.</p></div><div class=\"answer\"><u>How they answer it</u><p>A: \u201cA pipeline that doesn't depend on who you had lunch with.\u201d  B: \u201cYou tried an agency. It produced activity, not clients. Here's why.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A names the structural fear \u2014 pipeline that depends on a person \u2014 without using the word pipeline abstractly.</span></div><div class=\"w\"><i>2</i><span>B opens by agreeing with the prospect's bad experience before offering an explanation.</span></div><div class=\"w\"><i>3</i><span>\u201cHere's why\u201d promises a <b>diagnosis rather than a pitch</b>, which suits a sceptical buyer.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cWho you had lunch with\u201d is doing enormous work \u2014 it is specific, slightly funny, and instantly recognisable to anyone running a partner-led firm.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q2</span><span class=\"fbar\"><i style=\"width:30.9%\"></i></span><span class=\"pg num\">106<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q2 \u00b7 Solopreneur",title:"Sarah Chen answers Q2",html:"<div class=\"slide\" data-i=\"106\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q2 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">22 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 2</u><p>Your branded page headline \u2014 plus the problem-led variant you'll test against it.</p></div><div class=\"answer\"><u>How they answer it</u><p>A: \u201cSell while you're delivering \u2014 a funnel that runs either way.\u201d  B: \u201cYour revenue drops every time you get busy. That's not a discipline problem.\u201d</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>A names the exact conflict \u2014 selling while delivering \u2014 in the founder's own vocabulary.</span></div><div class=\"w\"><i>2</i><span>B states the symptom first: revenue drops every time you get busy.</span></div><div class=\"w\"><i>3</i><span>\u201cThat's not a discipline problem\u201d <b>removes the shame</b>, which is what actually unlocks the click.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">B reframes a discipline problem as a structural one. Removing blame is often the single highest-converting move available to a service business.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q2</span><span class=\"fbar\"><i style=\"width:32.4%\"></i></span><span class=\"pg num\">107<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Your turn",title:"Which fields will your registration form ask for?",html:"<div class=\"slide\" data-i=\"107\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">23 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 3 of 13</span><span class=\"qk\">Choose at least 2</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 2 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which fields will your registration form ask for?</div><div class=\"qopts\" style=\"--oc:3;max-height:33cqh\"><span class=\"qopt\"><i>A</i><span>First name</span></span><span class=\"qopt\"><i>B</i><span>Last name</span></span><span class=\"qopt\"><i>C</i><span>Work email</span></span><span class=\"qopt\"><i>D</i><span>Phone number</span></span><span class=\"qopt\"><i>E</i><span>Company</span></span><span class=\"qopt\"><i>F</i><span>Role</span></span><span class=\"qopt\"><i>G</i><span>Profile link</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Only what you act on</u><span>If no automation or human reads it this week, cut it.</span></div><div class=\"qc\"><u>Enrich, don't ask</u><span>Company size and industry are usually lookup-able from the email.</span></div><div class=\"qc\"><u>Count the cost</u><span>Each extra field is a measurable drop. Be able to justify every one.</span></div></div><div class=\"foot\"><b>Why this one:</b> Every field costs you completions. The field you are tempted to add \u201cjust in case\u201d is almost always the one to leave out \u2014 you can enrich or ask for it later, once they are already in.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which fields will your registration form ask for?</span><span class=\"fbar\"><i style=\"width:33.8%\"></i></span><span class=\"pg num\">108<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q3 \u00b7 B2B SaaS",title:"SendFlow answers Q3",html:"<div class=\"slide\" data-i=\"108\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q3 \u00b7 B2B SaaS</span><span class=\"sp\"></span><span class=\"step num\">24 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SE</div><div class=\"vid\"><b>SendFlow</b><span>B2B SaaS \u00b7 sales-engagement platform</span></div><div class=\"vlane\"><u>Lane 1 of 3</u><b>B2B SaaS</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>32 people</b></div><div class=\"vf\"><u>Motion</u><b>Self-serve + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>$490/seat/mo</b></div><div class=\"vf\"><u>Buyer</u><b>VP Sales</b></div></div><div class=\"vq\"><u>Question 3</u><p>Which fields will your registration form ask for?</p></div><div class=\"answer\"><u>How they answer it</u><p>First name \u00b7 Work email \u00b7 Company \u2014 team size becomes a qualification question later instead.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Three fields, and company is kept only because it drives routing on the same day.</span></div><div class=\"w\"><i>2</i><span>Team size is deliberately deferred to a <b>qualification question later in the funnel</b>.</span></div><div class=\"w\"><i>3</i><span>Work email rather than any email keeps consumer addresses out of a B2B pipeline.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Moving team size from the form to a later qualification question is the right instinct: ask for the minimum to get them in, then qualify once they have already committed something.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">SendFlow answers Q3</span><span class=\"fbar\"><i style=\"width:35.3%\"></i></span><span class=\"pg num\">109<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q3 \u00b7 B2B consulting brand",title:"Apex Growth answers Q3",html:"<div class=\"slide\" data-i=\"109\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q3 \u00b7 B2B consulting brand</span><span class=\"sp\"></span><span class=\"step num\">25 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">AP</div><div class=\"vid\"><b>Apex Growth</b><span>B2B consultancy \u00b7 professional services</span></div><div class=\"vlane\"><u>Lane 2 of 3</u><b>B2B consulting brand</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>11 people</b></div><div class=\"vf\"><u>Motion</u><b>Referral + outbound</b></div><div class=\"vf\"><u>Ticket</u><b>\u00a312,000 / 90 days</b></div><div class=\"vf\"><u>Buyer</u><b>Managing Partner</b></div></div><div class=\"vq\"><u>Question 3</u><p>Which fields will your registration form ask for?</p></div><div class=\"answer\"><u>How they answer it</u><p>First name \u00b7 Last name \u00b7 Work email \u00b7 Profile link \u2014 firm size we enrich afterwards.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Four fields, justified by a five-figure ticket where qualification matters more than volume.</span></div><div class=\"w\"><i>2</i><span>Profile link lets them enrich firm size afterwards instead of asking for it.</span></div><div class=\"w\"><i>3</i><span>Last name is included because the follow-up is <b>personal and senior</b>, not automated.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">Profile link is an unusual field that earns its place here \u2014 it replaces three firmographic questions with one paste, and it is the field their buyer finds easiest to give.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Apex Growth answers Q3</span><span class=\"fbar\"><i style=\"width:36.8%\"></i></span><span class=\"pg num\">110<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Q3 \u00b7 Solopreneur",title:"Sarah Chen answers Q3",html:"<div class=\"slide\" data-i=\"110\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Q3 \u00b7 Solopreneur</span><span class=\"sp\"></span><span class=\"step num\">26 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"vhead\"><div class=\"vmark\">SA</div><div class=\"vid\"><b>Sarah Chen</b><span>Independent consultant \u00b7 one person</span></div><div class=\"vlane\"><u>Lane 3 of 3</u><b>Solopreneur</b></div></div><div class=\"vfacts\"><div class=\"vf\"><u>Team</u><b>Just her</b></div><div class=\"vf\"><u>Motion</u><b>Content + referral</b></div><div class=\"vf\"><u>Ticket</u><b>$4,000 / 6 weeks</b></div><div class=\"vf\"><u>Buyer</u><b>Founder</b></div></div><div class=\"vq\"><u>Question 3</u><p>Which fields will your registration form ask for?</p></div><div class=\"answer\"><u>How they answer it</u><p>First name \u00b7 Work email \u2014 nothing else. I'm one person and anything more is theatre.</p></div><div class=\"whyl\">Why this answer works</div><div class=\"why\"><div class=\"w\"><i>1</i><span>Two fields \u2014 the absolute floor, and correct when there is no routing logic to feed.</span></div><div class=\"w\"><i>2</i><span>She can enrich manually at this volume, so asking is strictly worse than looking.</span></div><div class=\"w\"><i>3</i><span>Fewer fields matters most when <b>traffic is scarce</b> and every completion is expensive.</span></div></div><div class=\"bar\"><span class=\"bl\">Notice</span><span class=\"bt\">\u201cAnything more is theatre\u201d is the right test for a one-person business: a field nobody will ever read is pure conversion cost with no offsetting benefit.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Sarah Chen answers Q3</span><span class=\"fbar\"><i style=\"width:38.2%\"></i></span><span class=\"pg num\">111<i> / 230</i></span></div></div>"},
 {day:"Day 2",section:"Your turn",title:"Which channels can you actually send your reminders on?",html:"<div class=\"slide\" data-i=\"111\" data-accent=\"teal\" data-day=\"Day 2\"><div class=\"srail\"><span class=\"daychip\">Day 2</span><span class=\"sect\">Your turn</span><span class=\"sp\"></span><span class=\"step num\">27 / 68</span><span class=\"dots\"><i class=\"done\"></i><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"qwrap\"><div class=\"qhead\"><span class=\"qn\">Question 4 of 13</span><span class=\"qk\">Choose at least 1</span><span class=\"qtime\">\u23f1 2 min</span><span class=\"qtime\">Day 2 \u00b7 answer on your own screen</span></div><div class=\"qq\">Which channels can you actually send your reminders on?</div><div class=\"qopts\" style=\"--oc:2;max-height:22cqh\"><span class=\"qopt\"><i>A</i><span>Email</span></span><span class=\"qopt\"><i>B</i><span>WhatsApp</span></span><span class=\"qopt\"><i>C</i><span>SMS</span></span><span class=\"qopt\"><i>D</i><span>AI voice call</span></span></div><div class=\"qcl\">What a good answer contains</div><div class=\"qcrit\"><div class=\"qc\"><u>Can you operate it</u><span>An SMS channel with no sender identity is not a channel.</span></div><div class=\"qc\"><u>Right register</u><span>Wrong channel at this seniority costs more than the touch gains.</span></div><div class=\"qc\"><u>Timezone-aware</u><span>T\u221224h at 8am <em>their</em> time, or the reminder gets buried.</span></div></div><div class=\"foot\"><b>Why this one:</b> Six touches before the session: on registration, T\u22127d, T\u221224h at 8am in their timezone, T\u22121h, T\u221215m and live. Tick only the channels you can genuinely operate \u2014 four that fire beat six that don't.</div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Which channels can you actually send your reminders on?</span><span class=\"fbar\"><i style=\"width:39.7%\"></i></span><span class=\"pg num\">112<i> / 230</i></span></div></div>"},
