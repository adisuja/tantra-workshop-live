<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 3-Day AI RevOps Workshop — Master Deck</title>
<meta name="robots" content="noindex">
<style>
/* This palette is playbook.html's, kept name-for-name on purpose. The 29
   diagrams are lifted out of the playbook with their markup intact, and they
   paint themselves with `fill="var(--accent)"`, `var(--teal)` and friends
   directly in attributes. An undefined custom property in a fill attribute is
   not ignored — it computes to solid black, so dropping one token here silently
   turns labelled nodes into black slabs. Do not rename these to match the
   deck's own --violet/--a tokens; add, never substitute. */
:root{
  --bg:#f6f7f9;--panel:#fff;--panel-2:#fbfcfd;--ink:#0f1216;--ink-2:#454b57;--ink-3:#878d99;
  --line:#e6e8ec;--line-2:#d6d9df;
  --accent:#5b4bd6;--accent-2:#efedfd;--accent-ink:#3a2fa8;
  --teal:#0f9e75;--teal-bg:#e3f6ef;--amber:#b8790f;--amber-bg:#fbefda;
  --pink:#c23a68;--pink-bg:#fbe9f0;--blue:#2f6fd0;--blue-bg:#e8f0fb;
  --green:#3b8a1f;--green-bg:#eaf5e2;--gold:#a06a12;--gold-bg:#f8efd8;--danger:#c23a68;
  --shadow:0 1px 2px rgba(16,19,24,.04),0 8px 30px rgba(16,19,24,.09);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0c0e13;--panel:#151821;--panel-2:#1a1e28;--ink:#f2f4f8;--ink-2:#b4bac6;--ink-3:#7a818e;
  --line:#252a35;--line-2:#333a48;
  --accent:#8e83f0;--accent-2:#211f3c;--accent-ink:#bcb4fb;
  --teal:#3ec79b;--teal-bg:#123027;--amber:#e0a63f;--amber-bg:#332612;
  --pink:#e97aa2;--pink-bg:#331722;--blue:#6aa3ec;--blue-bg:#122237;
  --green:#7cc65a;--green-bg:#1a2c11;--gold:#d9ab54;--gold-bg:#2e2513;--danger:#e97aa2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}

.top{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;z-index:30;
     background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;text-decoration:none;color:inherit}
.tmark{position:relative;display:block;width:25px;height:25px;flex:none}
.tmark img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tmark .tmk-white{display:none}
[data-theme="dark"] .tmark .tmk-ink{display:none}
[data-theme="dark"] .tmark .tmk-white{display:block}
.tname{font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.tdot{color:var(--ink-3);font-weight:400;margin:0 1px}
.top b{font-size:13px;font-weight:700;white-space:nowrap}
.top .sp{flex:1}
.filters{display:flex;gap:4px;align-items:center}
.filters button{font:inherit;font-size:12px;font-weight:650;color:var(--ink-2);background:none;border:1px solid var(--line);
                border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.filters button:hover{border-color:var(--ink-3)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.top a,.top .ib{font:inherit;font-size:12px;color:var(--ink-2);background:none;border:1px solid var(--line);border-radius:7px;
                padding:4px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}

.stagewrap{position:fixed;inset:46px 0 56px;display:flex;align-items:center;justify-content:center;padding:18px}
.stage{position:relative;width:100%;max-width:1180px;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);
       border-radius:16px;box-shadow:var(--shadow);overflow:hidden}

.nav{position:fixed;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;
     background:var(--panel);border-top:1px solid var(--line);z-index:30}
.nav button{font:inherit;font-size:13px;font-weight:650;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
            border-radius:8px;padding:7px 13px;cursor:pointer}
.nav button:hover{border-color:var(--ink-3)}
.nav .prog{flex:1;height:5px;background:var(--line);border-radius:20px;overflow:hidden;cursor:pointer}
.nav .prog i{display:block;height:100%;background:linear-gradient(90deg,#5b4bd6,#8b5cf6);border-radius:20px;transition:width .25s}
.nav .count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:112px;text-align:center}
.nav .count b{color:var(--ink);font-weight:700}

/* overview grid — essential once the deck is 200+ slides long */
.ov{position:fixed;inset:46px 0 56px;background:var(--bg);z-index:25;overflow:auto;padding:18px;display:none}
.ov.on{display:block}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:1400px;margin:0 auto}
.ovc{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:9px 10px;cursor:pointer;min-width:0}
.ovc:hover{border-color:var(--ink-3)}
.ovc.now{border-color:#5b4bd6;box-shadow:0 0 0 2px rgba(91,75,214,.16)}
.ovc u{text-decoration:none;display:flex;gap:6px;align-items:center;font-size:10px;font-weight:800;letter-spacing:.06em;
       text-transform:uppercase;color:var(--ink-3)}
.ovc u s{text-decoration:none;margin-left:auto;font-variant-numeric:tabular-nums}
.ovc b{display:block;font-size:12px;font-weight:700;line-height:1.28;margin-top:5px;color:var(--ink);
       display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ovh{max-width:1400px;margin:0 auto 12px;font-size:13px;color:var(--ink-3)}
.ovsec{max-width:1400px;margin:18px auto 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* ============================================================ design tokens */
:root{
  --violet:#5b4bd6; --violet-2:#efedfd; --violet-ink:#3a2fa8; --violet-deep:#2a2178;
  --blue:#2f6fd0;   --blue-2:#e8f0fb;   --blue-ink:#1c4d99;   --blue-deep:#12356b;
  --teal:#0f9e75;   --teal-2:#e3f6ef;   --teal-ink:#0a6e51;   --teal-deep:#064c38;
  --amber:#b8790f;  --amber-2:#fbefda;  --amber-ink:#8a5a09;  --amber-deep:#5e3d06;
  --pink:#c23a68;   --pink-2:#fbe9ef;   --pink-ink:#96274d;   --pink-deep:#6a1a36;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
/* A slide sets --a/--a2/--aink once; every child reads those, so one attribute
   on the slide repaints the whole composition for that day. */
.slide[data-accent="violet"]{--a:var(--violet);--a2:var(--violet-2);--aink:var(--violet-ink);--adeep:var(--violet-deep)}
.slide[data-accent="blue"]  {--a:var(--blue);  --a2:var(--blue-2);  --aink:var(--blue-ink);  --adeep:var(--blue-deep)}
.slide[data-accent="teal"]  {--a:var(--teal);  --a2:var(--teal-2);  --aink:var(--teal-ink);  --adeep:var(--teal-deep)}
.slide[data-accent="amber"] {--a:var(--amber); --a2:var(--amber-2); --aink:var(--amber-ink);--adeep:var(--amber-deep)}
.slide[data-accent="pink"]  {--a:var(--pink);  --a2:var(--pink-2);  --aink:var(--pink-ink); --adeep:var(--pink-deep)}
[data-theme="dark"] .slide[data-accent="violet"]{--a2:#211f3c;--aink:#bcb4fb}
[data-theme="dark"] .slide[data-accent="blue"]  {--a2:#122237;--aink:#9cc3f5}
[data-theme="dark"] .slide[data-accent="teal"]  {--a2:#123027;--aink:#6fdcb4}
[data-theme="dark"] .slide[data-accent="amber"] {--a2:#332612;--aink:#e8bf6b}
[data-theme="dark"] .slide[data-accent="pink"]  {--a2:#33151f;--aink:#f093b2}

/* ========================================================= stage and frame */
/* container-type:size is what lets every measurement below be relative to the
   SLIDE rather than the browser window. cqw = 1% of stage width. */
.stage{container-type:size;container-name:stage}

.slide{
  position:absolute;inset:0;display:none;padding:0;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-columns:100%;
  opacity:0;transition:opacity .28s ease;
}
.slide.on{display:grid;opacity:1}

/* --- top rail: where you are ------------------------------------------- */
.srail{
  display:flex;align-items:center;gap:1.1cqw;
  padding:2.4cqh 3.4cqw 0;min-width:0;
}
.srail .daychip{
  flex:none;display:inline-flex;align-items:center;gap:.6cqw;
  font-size:max(11px,1.15cqw);font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:#fff;background:var(--a);border-radius:2cqw;padding:.55cqh 1.1cqw;
}
.srail .daychip u{text-decoration:none;opacity:.72;font-weight:700}
.srail .sect{
  font-size:max(11px,1.15cqw);font-weight:700;letter-spacing:.075em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.srail .sp{flex:1 1 auto;min-width:.8cqw}
.srail .step{
  flex:none;font-size:max(11px,1.05cqw);font-weight:700;color:var(--aink);background:var(--a2);
  border-radius:2cqw;padding:.45cqh 1cqw;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.srail .dots{flex:none;display:flex;gap:.35cqw;align-items:center}
.srail .dots i{width:.5cqw;height:.5cqw;border-radius:50%;background:var(--line-2);display:block}
.srail .dots i.now{background:var(--a);transform:scale(1.45)}
.srail .dots i.done{background:var(--a);opacity:.42}

/* --- body -------------------------------------------------------------- */
.sbody{
  min-height:0;min-width:0;overflow:hidden;
  padding:1.5cqh 3.4cqw;
  display:flex;flex-direction:column;gap:1.5cqh;
}

/* --- footer: what this is, and where -------------------------------------- */
.sfoot{
  display:flex;align-items:center;gap:1.1cqw;
  padding:0 3.4cqw 2.2cqh;min-width:0;
}
.sfoot .ftitle{
  font-size:max(11px,1.15cqw);font-weight:650;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.sfoot .fbar{flex:1 1 auto;height:.45cqh;min-width:2cqw;background:var(--line);border-radius:2cqw;overflow:hidden}
.sfoot .fbar i{display:block;height:100%;background:var(--a);border-radius:2cqw}
.sfoot .pg{
  flex:none;font-family:var(--mono);font-size:max(11px,1.15cqw);font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.sfoot .pg i{font-style:normal;color:var(--ink-3);font-weight:500}

/* inverted slides (covers) carry the frame in white */
.slide.inv{background:linear-gradient(145deg,var(--a),var(--adeep));color:#fff}
.slide.inv .srail .sect,.slide.inv .sfoot .ftitle{color:rgba(255,255,255,.72)}
.slide.inv .srail .daychip{background:rgba(255,255,255,.18)}
.slide.inv .srail .step{background:rgba(255,255,255,.16);color:#fff}
.slide.inv .sfoot .pg{color:rgba(255,255,255,.92)}
.slide.inv .sfoot .pg i{color:rgba(255,255,255,.55)}
.slide.inv .sfoot .fbar{background:rgba(255,255,255,.2)}
.slide.inv .sfoot .fbar i{background:#fff}
.slide.inv .srail .dots i{background:rgba(255,255,255,.3)}
.slide.inv .srail .dots i.now{background:#fff}

/* ============================================================== typography */
.k{font-size:1.2cqw;text-transform:uppercase;letter-spacing:.1em;color:var(--aink);font-weight:800}
.h1{font-size:4.6cqw;line-height:1.03;letter-spacing:-.03em;font-weight:830;max-width:17ch}
.h2{font-size:3.05cqw;line-height:1.08;letter-spacing:-.022em;font-weight:780;max-width:24ch}
.h3{font-size:2.2cqw;line-height:1.12;letter-spacing:-.015em;font-weight:760}
.lede{font-size:1.72cqw;line-height:1.46;color:var(--ink-2);max-width:62ch}
.lede em{color:var(--ink);font-style:normal;font-weight:700}
.slide.inv .lede{color:rgba(255,255,255,.88)}
.slide.inv .k{color:rgba(255,255,255,.8)}
.dim{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* ============================================================== primitives */
/* chips ------------------------------------------------------------------ */
.chips{display:flex;gap:.7cqw;flex-wrap:wrap;align-items:center}
.chip{
  font-size:1.2cqw;font-weight:700;border-radius:2cqw;padding:.55cqh 1.1cqw;
  background:var(--a2);color:var(--aink);white-space:nowrap;
}
.chip.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.chip.solid{background:var(--a);color:#fff}
.chip.w{background:rgba(255,255,255,.16);color:#fff}
.chip b{font-weight:800}

/* support cards ---------------------------------------------------------- */
.cards{display:grid;gap:1cqw;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));align-items:stretch}
.card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:1.15cqw;
  padding:1.5cqh 1.3cqw;display:flex;flex-direction:column;gap:.7cqh;min-width:0;
}
.card .cn{
  flex:none;width:2.5cqw;height:2.5cqw;border-radius:.65cqw;background:var(--a2);color:var(--aink);
  font-weight:850;font-size:1.35cqw;display:flex;align-items:center;justify-content:center;
}
.card .ct{font-size:1.55cqw;font-weight:750;line-height:1.16;letter-spacing:-.01em}
.card .cb{font-size:1.3cqw;line-height:1.42;color:var(--ink-2)}
.card.accent{background:var(--a2);border-color:transparent}
.card.accent .cn{background:var(--a);color:#fff}
.slide.inv .card{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.slide.inv .card .ct{color:#fff}
.slide.inv .card .cb{color:rgba(255,255,255,.82)}
.slide.inv .card .cn{background:rgba(255,255,255,.2);color:#fff}

/* numbered rows ---------------------------------------------------------- */
.rows{display:flex;flex-direction:column;gap:.85cqh;min-height:0}
.rows .r{
  display:flex;gap:1.1cqw;align-items:center;min-width:0;
  background:var(--panel-2);border:1px solid var(--line);border-radius:1cqw;
  padding:1.1cqh 1.3cqw;
}
.rows .r .n{
  flex:none;width:2.8cqw;height:2.8cqw;border-radius:.7cqw;background:var(--a2);color:var(--aink);
  font-weight:850;font-size:1.4cqw;display:flex;align-items:center;justify-content:center;
}
.rows .r .rt{font-size:1.6cqw;font-weight:730;letter-spacing:-.01em;min-width:0}
.rows .r .rs{font-size:1.28cqw;color:var(--ink-2);line-height:1.35;min-width:0}
.rows .r .rmeta{margin-left:auto;text-align:right;flex:none;display:flex;flex-direction:column;gap:.2cqh}
.rows .r .rmeta b{font-size:1.25cqw;font-weight:750;color:var(--aink);font-variant-numeric:tabular-nums}
.rows .r .rmeta span{font-size:max(11px,1.1cqw);color:var(--ink-3)}
.rows .r.hl{border-color:var(--a);background:var(--a2)}

/* key/value strip -------------------------------------------------------- */
.strip{
  display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:1cqw;overflow:hidden;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));
}
.strip .s{background:var(--panel);padding:1.1cqh 1.1cqw;display:flex;flex-direction:column;gap:.25cqh;min-width:0}
.strip .s u{text-decoration:none;font-size:max(11px,1.02cqw);font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.strip .s b{font-size:2cqw;font-weight:820;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.05}
.strip .s span{font-size:max(11px,1.08cqw);color:var(--ink-2);line-height:1.3}
.strip .s.on{background:var(--a2)}
.strip .s.on b{color:var(--aink)}

/* takeaway / rule bar ---------------------------------------------------- */
.bar{
  display:flex;align-items:center;gap:1cqw;border-radius:1cqw;padding:1.1cqh 1.3cqw;
  background:var(--a2);border-left:.45cqw solid var(--a);min-width:0;
}
.bar .bl{
  flex:none;font-size:max(11px,1.02cqw);font-weight:850;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--a);border-radius:.5cqw;padding:.3cqh .8cqw;
}
.bar .bt{font-size:1.4cqw;line-height:1.38;color:var(--ink);font-weight:600;min-width:0}
.bar .bt em{font-style:normal;font-weight:800;color:var(--aink)}
.bar.warn{background:var(--amber-2);border-left-color:var(--amber)}
.bar.warn .bl{background:var(--amber)}
.slide.inv .bar{background:rgba(255,255,255,.12);border-left-color:#fff}
.slide.inv .bar .bt{color:#fff}
.slide.inv .bar .bl{background:#fff;color:var(--adeep)}

/* footnote --------------------------------------------------------------- */
.foot{font-size:max(11px,1.15cqw);line-height:1.4;color:var(--ink-3);border-left:.26cqw solid var(--line-2);padding-left:.9cqw}
.foot b{color:var(--ink-2);font-weight:700}

/* ================================================================ diagrams */
.viz{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
/* Without this the SVGs — which carry a viewBox and no width/height — fall back
   to the 300px CSS default and render as a stamp in the middle of the slide.
   That was the single worst visual defect in the previous deck. */
.viz svg{width:100%;height:100%;max-width:100%;max-height:100%;overflow:visible;display:block}
.vizrow{display:grid;gap:1.2cqw;min-height:0;flex:1 1 auto;grid-template-columns:minmax(0,var(--split,1.9fr)) minmax(0,1fr)}
.vizcol{display:flex;flex-direction:column;gap:.8cqh;min-height:0;min-width:0}
.annots{display:flex;flex-direction:column;gap:.75cqh;min-height:0;flex:1 1 auto;justify-content:space-between}
.annot{
  display:flex;gap:.9cqw;align-items:flex-start;background:var(--panel-2);
  border:1px solid var(--line);border-radius:.9cqw;padding:.95cqh 1.05cqw;min-width:0;
}
.annot .an{
  flex:none;width:2.1cqw;height:2.1cqw;border-radius:50%;background:var(--a);color:#fff;
  font-weight:850;font-size:max(11px,1.15cqw);display:flex;align-items:center;justify-content:center;
}
.annot .at{font-size:1.3cqw;font-weight:740;line-height:1.2;letter-spacing:-.005em}
.annot .ab{font-size:max(11px,1.15cqw);color:var(--ink-2);line-height:1.36;margin-top:.15cqh}
.legend{display:flex;flex-wrap:wrap;gap:.6cqw;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:.45cqw;font-size:max(11px,1.1cqw);font-weight:650;color:var(--ink-2)}
.legend .lg i{width:.95cqw;height:.95cqw;border-radius:.25cqw;display:block;flex:none}

/* ================================================================ matrices */
.matrix{
  display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:1cqw;overflow:hidden;min-height:0;
}
.matrix .mc{background:var(--panel);padding:.95cqh 1.05cqw;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.2cqh}
.matrix .mc.head{background:var(--panel-2)}
.matrix .mc.head b{font-size:1.25cqw;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--aink)}
.matrix .mc.rowh b{font-size:1.32cqw;font-weight:760;color:var(--ink)}
.matrix .mc span{font-size:1.2cqw;line-height:1.34;color:var(--ink-2)}
.matrix .mc.on{background:var(--a2)}

/* ================================================================ big stat */
.statwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:1.6cqw;align-items:center;flex:1 1 auto;min-height:0}
.statbig{font-size:7.2cqw;font-weight:860;letter-spacing:-.04em;line-height:.98;color:var(--a);font-variant-numeric:tabular-nums}
.statsub{font-size:1.45cqw;color:var(--ink-2);line-height:1.4;margin-top:.8cqh}
.bars{display:flex;flex-direction:column;gap:.9cqh}
.bars .bx{display:flex;flex-direction:column;gap:.35cqh}
.bars .bx .bhd{display:flex;align-items:baseline;gap:.6cqw;font-size:1.22cqw}
.bars .bx .bhd b{font-weight:750;color:var(--ink)}
.bars .bx .bhd span{margin-left:auto;font-weight:800;color:var(--aink);font-variant-numeric:tabular-nums}
.bars .bx .tr{height:1.5cqh;background:var(--line);border-radius:2cqw;overflow:hidden}
.bars .bx .tr i{display:block;height:100%;border-radius:2cqw;background:var(--line-2)}

 {day:"Agenda",section:"The week",title:"Three days, one working funnel",html:"<div class=\"slide\" data-i=\"3\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The week</span><span class=\"sp\"></span><span class=\"step num\">3 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">What we build together</div><div class=\"h2\">Three days, one working funnel</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Strategize the offer, the audience and the engine</div><div class=\"rs\">ICP, offer, ladder position and funnel type \u2014 then the five blocks, the diagnostic and one spec the build reads directly.</div></div><div class=\"rmeta\"><b>Day 1</b><span>strategy + your source of truth</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Build every element</div><div class=\"rs\">Traffic limits, the Tantra Pro Funnel, the Tantra Pro Flow, run of show, close chain.</div></div><div class=\"rmeta\"><b>Day 2</b><span>pages \u00b7 sequences \u00b7 close</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Launch the AI RevOps engine, then grow it</div><div class=\"rs\">The build ritual, eleven events, the pipeline, automations and real traffic \u2014 then cost per buyer, the worst leak and the weekly loop.</div></div><div class=\"rmeta\"><b>Day 3</b><span>live, instrumented, improving</span></div></div></div><div class=\"bar\"><span class=\"bl\">Each day</span><span class=\"bt\">Teaching, questions you answer live while the reasoning is fresh, and one generated output in your inbox the same evening.</span></div><div class=\"foot\">Days 1 and 3 run in two halves. Day 2 is the heavy build day \u2014 fewer questions, far more building.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Three days, one working funnel</span><span class=\"fbar\"><i style=\"width:25.0%\"></i></span><span class=\"pg num\">004<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"The week",title:"The daily rhythm",html:"<div class=\"slide\" data-i=\"4\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The week</span><span class=\"sp\"></span><span class=\"step num\">4 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">How each session runs</div><div class=\"h2\">Watch \u2192 answer \u2192 receive \u2192 do</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">1</span><div style=\"min-width:0\"><div class=\"rt\">Watch</div><div class=\"rs\">The live session, with the build happening on screen.</div></div><div class=\"rmeta\"><b>~30 min</b><span>teaching</span></div></div><div class=\"r\"><span class=\"n\">2</span><div style=\"min-width:0\"><div class=\"rt\">Answer</div><div class=\"rs\">The day's 12\u201313 questions, on your own screen, while you watch.</div></div><div class=\"rmeta\"><b>~15 min</b><span>in parallel</span></div></div><div class=\"r\"><span class=\"n\">3</span><div style=\"min-width:0\"><div class=\"rt\">Ask</div><div class=\"rs\">Open Q&A on your own funnel, not on the theory.</div></div><div class=\"rmeta\"><b>~15 min</b><span>live Q&amp;A</span></div></div><div class=\"r\"><span class=\"n\">4</span><div style=\"min-width:0\"><div class=\"rt\">Receive</div><div class=\"rs\">Your generated output \u2014 a PDF and a live link.</div></div><div class=\"rmeta\"><b>Same day</b><span>by evening</span></div></div><div class=\"r\"><span class=\"n\">5</span><div style=\"min-width:0\"><div class=\"rt\">Do</div><div class=\"rs\">One short task that unblocks tomorrow's session.</div></div><div class=\"rmeta\"><b>20\u201330 min</b><span>tonight</span></div></div></div><div class=\"bar\"><span class=\"bl\">Why questions run live</span><span class=\"bt\">An answer you give while the reasoning is fresh is far more specific than one you fill in a form three days later.</span></div><div class=\"foot\">Answers save to your own device as you type, and you can change them until the day closes.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The daily rhythm</span><span class=\"fbar\"><i style=\"width:33.3%\"></i></span><span class=\"pg num\">005<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"Housekeeping",title:"How to get the most out of this week",html:"<div class=\"slide\" data-i=\"5\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">Housekeeping</span><span class=\"sp\"></span><span class=\"step num\">5 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Before we start</div><div class=\"h2\">Three things that decide how much you get out of this</div><div class=\"lede\">The difference between the people who finish the week with a live funnel and the people who finish with notes comes down to three habits, all decided in the first ten minutes.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Answer as your real business</div><div class=\"cb\">Not the business you plan to have. The generated output keys off every answer, and a hypothetical ICP produces a hypothetical funnel.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Keep the questions open in a second window</div><div class=\"cb\">The questions are designed to be answered <em>during</em> the session, while the reasoning behind each one is still in front of you.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Put the homework in your calendar now</div><div class=\"cb\">Twenty to thirty minutes each evening. Every task is chosen because the next day's session is blocked without it.</div></div></div><div class=\"bar\"><span class=\"bl\">Ask anything</span><span class=\"bt\">Questions in chat throughout \u2014 we read them out in the Q&A block rather than losing them.</span></div><div class=\"foot\">Sessions are recorded, but the live Q&A on your own funnel is the part that cannot be replayed.</div></div><div class=\"sfoot\"><span class=\"ftitle\">How to get the most out of this week</span><span class=\"fbar\"><i style=\"width:41.7%\"></i></span><span class=\"pg num\">006<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"The spine",title:"The three businesses we follow all week",html:"<div class=\"slide\" data-i=\"6\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The spine</span><span class=\"sp\"></span><span class=\"step num\">6 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Follow one of these</div><div class=\"h2\">Three businesses, followed from Day 1 to Day 3</div><div class=\"rows fill\"><div class=\"r\"><span class=\"n\">SE</span><div style=\"min-width:0\"><div class=\"rt\">SendFlow</div><div class=\"rs\">B2B SaaS \u00b7 sales-engagement platform \u2014 self-serve + outbound, selling at $490/seat/mo.</div></div><div class=\"rmeta\"><b>B2B SaaS</b><span>32 people</span></div></div><div class=\"r\"><span class=\"n\">AP</span><div style=\"min-width:0\"><div class=\"rt\">Apex Growth</div><div class=\"rs\">B2B consultancy \u00b7 professional services \u2014 referral + outbound, selling at \u00a312,000 / 90 days.</div></div><div class=\"rmeta\"><b>B2B consulting brand</b><span>11 people</span></div></div><div class=\"r\"><span class=\"n\">SA</span><div style=\"min-width:0\"><div class=\"rt\">Sarah Chen</div><div class=\"rs\">Independent consultant \u00b7 one person \u2014 content + referral, selling at $4,000 / 6 weeks.</div></div><div class=\"rmeta\"><b>Solopreneur</b><span>Just her</span></div></div></div><div class=\"bar\"><span class=\"bl\">Pick the closest one now</span><span class=\"bt\">Every question this week is answered three times \u2014 once by each. Follow the lane nearest your own shape and the answers become a template.</span></div><div class=\"foot\">These are composites built to cover the three shapes of business in the room, not named clients.</div></div><div class=\"sfoot\"><span class=\"ftitle\">The three businesses we follow all week</span><span class=\"fbar\"><i style=\"width:50.0%\"></i></span><span class=\"pg num\">007<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"The system",title:"Traffic in, retained revenue out",html:"<div class=\"slide\" data-i=\"7\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The system</span><span class=\"sp\"></span><span class=\"step num\">7 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The system</div><div class=\"h2\" style=\"font-size:2.35cqw\">Traffic in, retained revenue out</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 23 860 543\" role=\"img\" aria-label=\"End-to-end funnel system: five traffic channels converge into a four-stage conversion cascade, with drop-off at each stage and a retention loop feeding referrals back to the top.\">\n          <defs>\n            <marker id=\"CASCADE_arr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"CASCADE_arrT\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- retention loop (drawn first, behind) -->\n          <path d=\"M580 470 C580 520 560 528 512 528 L150 528 C110 528 92 520 92 484 L92 300\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.2\" stroke-dasharray=\"7 7\" class=\"flowline\" marker-end=\"url(#CASCADE_arrT)\" opacity=\".9\"/>\n          <text x=\"330\" y=\"546\" text-anchor=\"middle\" class=\"svsub\" font-size=\"12.5\">Referrals \u00b7 expansion \u00b7 advocacy recirculate into new traffic \u2014 the flywheel</text>\n          <!-- traffic sources -->\n          <g font-size=\"12.5\">\n            <text x=\"20\" y=\"46\" class=\"vtitle svmute\" font-size=\"11\" letter-spacing=\".06em\">TRAFFIC CHANNELS</text>\n            <g>\n              <rect x=\"18\" y=\"64\" width=\"152\" height=\"34\" rx=\"9\" class=\"node\"/><text x=\"40\" y=\"82\" class=\"svlabel\" font-size=\"12.5\">Cold email</text>\n              <rect x=\"18\" y=\"104\" width=\"152\" height=\"34\" rx=\"9\" class=\"node\"/><text x=\"40\" y=\"122\" class=\"svlabel\" font-size=\"12.5\">LinkedIn outreach</text>\n              <rect x=\"18\" y=\"144\" width=\"152\" height=\"34\" rx=\"9\" class=\"node\"/><text x=\"40\" y=\"162\" class=\"svlabel\" font-size=\"12.5\">Paid ads</text>\n              <rect x=\"18\" y=\"184\" width=\"152\" height=\"34\" rx=\"9\" class=\"node\"/><text x=\"40\" y=\"202\" class=\"svlabel\" font-size=\"12.5\">Content \u00b7 organic</text>\n              <rect x=\"18\" y=\"224\" width=\"152\" height=\"34\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"40\" y=\"242\" class=\"svlabel\" font-size=\"12.5\" fill=\"var(--teal)\">Referrals</text>\n            </g>\n          </g>\n          <!-- convergence lines -->\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.4\" opacity=\".55\">\n            <path d=\"M170 81 C300 81 320 100 402 104\" class=\"flowline\"/>\n            <path d=\"M170 121 C300 121 330 105 402 106\" class=\"flowline\"/>\n            <path d=\"M170 161 C300 161 340 112 402 109\" class=\"flowline\"/>\n            <path d=\"M170 201 C300 201 350 120 402 112\" class=\"flowline\"/>\n            <path d=\"M170 241 C300 241 360 128 402 115\" class=\"flowline\"/>\n          </g>\n          <!-- funnel bands -->\n          <g>\n            <polygon points=\"405,62 755,62 735,154 425,154\" fill=\"#6366f1\"/>\n            <polygon points=\"425,164 735,164 692,256 468,256\" fill=\"#7c5cea\"/>\n            <polygon points=\"468,266 692,266 652,358 508,358\" fill=\"#9333ea\"/>\n            <polygon points=\"508,368 652,368 636,460 524,460\" fill=\"#0f9e75\"/>\n            <text x=\"580\" y=\"100\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"16\">Traffic</text>\n            <text x=\"580\" y=\"122\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"18\" font-weight=\"800\">10,000</text>\n            <text x=\"580\" y=\"202\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"16\">Capture</text>\n            <text x=\"580\" y=\"224\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"18\" font-weight=\"800\">2,500</text>\n            <text x=\"580\" y=\"304\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"15\">Convert</text>\n            <text x=\"580\" y=\"325\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"17\" font-weight=\"800\">200</text>\n            <text x=\"580\" y=\"406\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"14\">Retain</text>\n            <text x=\"580\" y=\"426\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"16\" font-weight=\"800\">152</text>\n          </g>\n          <!-- conversion badges (right) -->\n          <g font-size=\"12\">\n            <line x1=\"740\" y1=\"159\" x2=\"792\" y2=\"159\" class=\"gridline\"/><rect x=\"790\" y=\"146\" width=\"70\" height=\"26\" rx=\"13\" fill=\"var(--accent-2)\"/><text x=\"825\" y=\"160\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\">25% opt-in</text>\n            <line x1=\"700\" y1=\"261\" x2=\"792\" y2=\"261\" class=\"gridline\"/><rect x=\"792\" y=\"248\" width=\"66\" height=\"26\" rx=\"13\" fill=\"var(--accent-2)\"/><text x=\"825\" y=\"262\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"700\">8% buy</text>\n            <line x1=\"660\" y1=\"363\" x2=\"792\" y2=\"363\" class=\"gridline\"/><rect x=\"788\" y=\"350\" width=\"72\" height=\"26\" rx=\"13\" fill=\"var(--teal-bg)\"/><text x=\"824\" y=\"364\" text-anchor=\"middle\" fill=\"var(--teal)\" font-weight=\"700\">76% stay</text>\n          </g>\n          <!-- drop-off callouts (left of funnel) -->\n          <g font-size=\"11.5\">\n            <text x=\"300\" y=\"205\" text-anchor=\"end\" fill=\"var(--danger,#c23a68)\" font-weight=\"800\" font-size=\"14\">\u221275%</text>\n            <text x=\"300\" y=\"221\" text-anchor=\"end\" class=\"svmute\">leave, no opt-in</text>\n            <path d=\"M312 210 C360 212 400 216 466 214\" fill=\"none\" stroke=\"var(--danger,#c23a68)\" stroke-width=\"1.2\" opacity=\".5\" stroke-dasharray=\"3 4\"/>\n            <text x=\"342\" y=\"305\" text-anchor=\"end\" fill=\"var(--danger,#c23a68)\" font-weight=\"800\" font-size=\"14\">\u221292%</text>\n            <text x=\"342\" y=\"321\" text-anchor=\"end\" class=\"svmute\">not ready \u2192 nurture</text>\n            <path d=\"M354 312 C400 312 440 312 506 312\" fill=\"none\" stroke=\"var(--danger,#c23a68)\" stroke-width=\"1.2\" opacity=\".5\" stroke-dasharray=\"3 4\"/>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Every box is a counted event</div><div class=\"ab\">Not an estimate. Each step fires one logged event, and the count of that event is the metric.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">A rate is a division, never a symbol</div><div class=\"ab\">One fetched count divided by another. If you cannot fetch both, you do not have the rate.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">The last band is where the money compounds</div><div class=\"ab\">Acquisition is linear. Retention multiplies every buyer you have ever acquired.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Left to right is the journey. Top to bottom is what you can measure about it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Traffic in, retained revenue out</span><span class=\"fbar\"><i style=\"width:58.3%\"></i></span><span class=\"pg num\">008<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"The system",title:"The master map \u2014 six stages",html:"<div class=\"slide\" data-i=\"8\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The system</span><span class=\"sp\"></span><span class=\"step num\">8 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">The master map</div><div class=\"h2\" style=\"font-size:2.35cqw\">Six stages \u2014 every session is a zoom-in on one band</div><div class=\"vizrow\" style=\"--split:1.08fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 910\" role=\"img\" aria-label=\"Master system map: six stacked stages. Stage one traffic engine with five channels; stage two landing and registration on the Tantra Pro Funnel page; stage three multi-channel nurture on the fourteen-node Tantra Pro Flow across email, WhatsApp, SMS and an AI voice reminder call; stage four live delivery with poll, CTA, direct-message and replay timings; stage five revenue pipeline across eight CRM checkpoints; stage six a fifty-two-week growth engine across four channels, which loops back into stage one.\">\n          <defs>\n            <marker id=\"MASTER_ms\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n            <marker id=\"MASTER_mt\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- re-entry loop, drawn first so bands sit on top -->\n          <path d=\"M44 833 H32 C24 833 22 827 22 819 V102 C22 94 26 88 36 88 H44\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.2\" stroke-dasharray=\"7 7\" class=\"flowline\" marker-end=\"url(#MASTER_mt)\" opacity=\".95\"/>\n          <text transform=\"translate(11,460) rotate(-90)\" text-anchor=\"middle\" class=\"svmute\" font-size=\"10.5\">retained customers re-enter at the top \u2014 the flywheel</text>\n\n          <!-- inter-stage connectors -->\n          <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\" opacity=\".55\" marker-end=\"url(#MASTER_ms)\">\n            <path d=\"M444 162 V178\" class=\"flowline\"/><path d=\"M444 302 V318\" class=\"flowline\"/>\n            <path d=\"M444 488 V502\" class=\"flowline\"/><path d=\"M444 610 V626\" class=\"flowline\"/>\n            <path d=\"M444 754 V770\" class=\"flowline\"/>\n          </g>\n\n          <!-- ===== S1 ===== -->\n          <rect x=\"44\" y=\"20\" width=\"800\" height=\"140\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"32\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--accent)\"/><text x=\"76\" y=\"43\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S1</text>\n          <text x=\"102\" y=\"43\" class=\"svlabel\" font-size=\"14.5\">Traffic engine</text>\n          <text x=\"102\" y=\"60\" class=\"svmute\" font-size=\"10.5\">5 channels \u00b7 every link UTM-tagged \u00b7 one destination</text>\n          <text x=\"828\" y=\"41\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13\">342K reach</text>\n          <text x=\"828\" y=\"57\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">teaching model</text>\n          <g font-size=\"10\">\n            <rect x=\"60\" y=\"78\" width=\"150\" height=\"62\" rx=\"9\" class=\"node\"/>\n            <text x=\"72\" y=\"97\" class=\"svlabel\" font-size=\"11.5\">Cold calendar</text><text x=\"72\" y=\"113\" class=\"svmute\">Instantly \u00b7 Workspace</text><text x=\"72\" y=\"130\" fill=\"var(--accent-ink)\" font-weight=\"650\">166.4K \u2192 8,500 regs</text>\n            <rect x=\"218\" y=\"78\" width=\"150\" height=\"62\" rx=\"9\" class=\"node\"/>\n            <text x=\"230\" y=\"97\" class=\"svlabel\" font-size=\"11.5\">Cold email</text><text x=\"230\" y=\"113\" class=\"svmute\">Instantly \u00b7 Apollo</text><text x=\"230\" y=\"130\" fill=\"var(--accent-ink)\" font-weight=\"650\">15K sent \u00b7 18.2% open</text>\n            <rect x=\"376\" y=\"78\" width=\"150\" height=\"62\" rx=\"9\" class=\"node\"/>\n            <text x=\"388\" y=\"97\" class=\"svlabel\" font-size=\"11.5\">LinkedIn outreach</text><text x=\"388\" y=\"113\" class=\"svmute\">Expandi \u00b7 Sales Nav</text><text x=\"388\" y=\"130\" fill=\"var(--accent-ink)\" font-weight=\"650\">2,400 reqs \u00b7 32% accept</text>\n            <rect x=\"534\" y=\"78\" width=\"150\" height=\"62\" rx=\"9\" class=\"node\"/>\n            <text x=\"546\" y=\"97\" class=\"svlabel\" font-size=\"11.5\">Paid ads</text><text x=\"546\" y=\"113\" class=\"svmute\">Meta \u00b7 Google</text><text x=\"546\" y=\"130\" fill=\"var(--accent-ink)\" font-weight=\"650\">24 adsets \u00b7 $1.45 CPC</text>\n            <rect x=\"692\" y=\"78\" width=\"150\" height=\"62\" rx=\"9\" class=\"node\"/>\n            <text x=\"704\" y=\"97\" class=\"svlabel\" font-size=\"11.5\">Content \u00b7 organic</text><text x=\"704\" y=\"113\" class=\"svmute\">Metricool \u00b7 Beehiiv</text><text x=\"704\" y=\"130\" fill=\"var(--accent-ink)\" font-weight=\"650\">15.4K visits \u00b7 940 regs</text>\n          </g>\n\n          <!-- ===== S2 ===== -->\n          <rect x=\"44\" y=\"184\" width=\"800\" height=\"118\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"196\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--accent)\"/><text x=\"76\" y=\"207\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S2</text>\n          <text x=\"102\" y=\"207\" class=\"svlabel\" font-size=\"14.5\">Landing &amp; registration</text>\n          <text x=\"102\" y=\"224\" class=\"svmute\" font-size=\"10.5\">one branded page, headline always A/B-tested \u2014 the cheapest lift in the whole funnel</text>\n          <text x=\"828\" y=\"205\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13\">9.6% CVR</text>\n          <text x=\"828\" y=\"221\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">teaching model</text>\n          <g font-size=\"10.5\">\n            <rect x=\"60\" y=\"240\" width=\"784\" height=\"50\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/>\n            <text x=\"74\" y=\"259\" class=\"svlabel\" font-size=\"12\" fill=\"var(--teal)\">Tantra Pro Funnel \u00b7 branded registration page</text><text x=\"74\" y=\"277\" class=\"svmute\">9.6% CVR \u00b7 72% scroll \u00b7 $4.12 cost/lead \u00b7 form above the fold</text>\n          </g>\n\n          <!-- ===== S3 ===== -->\n          <rect x=\"44\" y=\"324\" width=\"800\" height=\"160\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"336\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--accent)\"/><text x=\"76\" y=\"347\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S3</text>\n          <text x=\"102\" y=\"347\" class=\"svlabel\" font-size=\"14.5\">Multi-channel nurture</text>\n          <text x=\"102\" y=\"364\" class=\"svmute\" font-size=\"10.5\">the show-up engine \u2014 no other stage moves the number this much</text>\n          <text x=\"828\" y=\"345\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13\">89% show-up</text>\n          <text x=\"828\" y=\"361\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">teaching model</text>\n          <g font-size=\"10.5\" text-anchor=\"middle\">\n            <rect x=\"60\" y=\"378\" width=\"184\" height=\"24\" rx=\"7\" fill=\"var(--accent-2)\"/><text x=\"152\" y=\"394\" fill=\"var(--accent-ink)\" font-weight=\"650\">Email</text>\n            <rect x=\"252\" y=\"378\" width=\"184\" height=\"24\" rx=\"7\" fill=\"var(--teal-bg)\"/><text x=\"344\" y=\"394\" fill=\"var(--teal)\" font-weight=\"650\">WhatsApp</text>\n            <rect x=\"444\" y=\"378\" width=\"184\" height=\"24\" rx=\"7\" fill=\"var(--blue-bg)\"/><text x=\"536\" y=\"394\" fill=\"var(--blue)\" font-weight=\"650\">SMS</text>\n            <rect x=\"636\" y=\"378\" width=\"184\" height=\"24\" rx=\"7\" fill=\"var(--amber-bg)\"/><text x=\"728\" y=\"394\" fill=\"var(--amber)\" font-weight=\"650\">AI voice reminder call</text>\n          </g>\n          <text x=\"60\" y=\"428\" class=\"svsub\" font-size=\"10.5\">TANTRA PRO FLOW \u00b7 14 nodes across all four channels</text>\n          <line x1=\"62\" y1=\"446\" x2=\"820\" y2=\"446\" stroke=\"var(--teal)\" stroke-width=\"1.5\" opacity=\".5\"/>\n          <g fill=\"var(--teal-bg)\" stroke=\"var(--teal)\" stroke-width=\"1.5\">\n            <circle cx=\"62\" cy=\"446\" r=\"6.5\"/><circle cx=\"120\" cy=\"446\" r=\"6.5\"/><circle cx=\"179\" cy=\"446\" r=\"6.5\"/><circle cx=\"237\" cy=\"446\" r=\"6.5\"/><circle cx=\"296\" cy=\"446\" r=\"6.5\"/><circle cx=\"354\" cy=\"446\" r=\"6.5\"/><circle cx=\"413\" cy=\"446\" r=\"6.5\"/><circle cx=\"471\" cy=\"446\" r=\"6.5\"/><circle cx=\"530\" cy=\"446\" r=\"6.5\"/><circle cx=\"588\" cy=\"446\" r=\"6.5\"/><circle cx=\"646\" cy=\"446\" r=\"6.5\"/><circle cx=\"705\" cy=\"446\" r=\"6.5\"/><circle cx=\"763\" cy=\"446\" r=\"6.5\"/><circle cx=\"820\" cy=\"446\" r=\"6.5\"/>\n          </g>\n          <line x1=\"62\" y1=\"462\" x2=\"820\" y2=\"462\" stroke=\"var(--line)\" stroke-width=\"1\"/>\n          <g text-anchor=\"middle\" font-size=\"9.5\" class=\"svmute\">\n            <text x=\"68\" y=\"474\">confirm</text><text x=\"231\" y=\"474\">T\u221224h</text><text x=\"399\" y=\"474\">T\u221215m</text>\n            <text x=\"483\" y=\"474\" fill=\"var(--accent-ink)\" font-weight=\"700\">LIVE</text><text x=\"652\" y=\"474\">+1 day</text><text x=\"812\" y=\"474\">+3 days</text>\n          </g>\n\n          <!-- ===== S4 ===== -->\n          <rect x=\"44\" y=\"506\" width=\"800\" height=\"102\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"518\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--accent)\"/><text x=\"76\" y=\"529\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S4</text>\n          <text x=\"102\" y=\"529\" class=\"svlabel\" font-size=\"14.5\">Live delivery</text>\n          <text x=\"102\" y=\"546\" class=\"svmute\" font-size=\"10.5\">the only stage where your audience actually meets you</text>\n          <text x=\"828\" y=\"527\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13\">179 live \u00b7 42m watched</text>\n          <text x=\"828\" y=\"543\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">48.6% of registrations</text>\n          <g font-size=\"11.5\">\n            <rect x=\"60\" y=\"560\" width=\"190\" height=\"36\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"155\" y=\"579\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"650\">Poll at 1:30</text>\n            <rect x=\"258\" y=\"560\" width=\"190\" height=\"36\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"353\" y=\"579\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"650\">Offer CTA \u00b7 3 min</text>\n            <rect x=\"456\" y=\"560\" width=\"190\" height=\"36\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"551\" y=\"579\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"650\">DMs at 3 \u00b7 15 \u00b7 40 min</text>\n            <rect x=\"654\" y=\"560\" width=\"190\" height=\"36\" rx=\"9\" fill=\"var(--accent-2)\"/><text x=\"749\" y=\"579\" text-anchor=\"middle\" fill=\"var(--accent-ink)\" font-weight=\"650\">Replay at T+24h</text>\n          </g>\n\n          <!-- ===== S5 ===== -->\n          <rect x=\"44\" y=\"632\" width=\"800\" height=\"122\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--line-2)\"/>\n          <rect x=\"60\" y=\"644\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--accent)\"/><text x=\"76\" y=\"655\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S5</text>\n          <text x=\"102\" y=\"655\" class=\"svlabel\" font-size=\"14.5\">Revenue &amp; deal pipeline</text>\n          <text x=\"102\" y=\"672\" class=\"svmute\" font-size=\"10.5\">11 CRM stages \u00b7 booking \u2192 proposal \u2192 payment \u2192 onboarding</text>\n          <text x=\"828\" y=\"653\" text-anchor=\"end\" fill=\"var(--accent-ink)\" font-weight=\"700\" font-size=\"13\">$560K pipeline</text>\n          <text x=\"828\" y=\"669\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">22% win rate</text>\n          <g>\n            <rect x=\"60\" y=\"686\" width=\"93\" height=\"48\" rx=\"8\" class=\"node\"/><text x=\"106\" y=\"707\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"14\">342</text><text x=\"106\" y=\"723\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">form filled</text>\n            <rect x=\"158\" y=\"686\" width=\"93\" height=\"48\" rx=\"8\" class=\"node\"/><text x=\"204\" y=\"707\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"14\">85</text><text x=\"204\" y=\"723\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">call booked</text>\n            <rect x=\"256\" y=\"686\" width=\"93\" height=\"48\" rx=\"8\" class=\"node\"/><text x=\"302\" y=\"707\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"14\">62</text><text x=\"302\" y=\"723\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">qualified</text>\n            <rect x=\"354\" y=\"686\" width=\"93\" height=\"48\" rx=\"8\" class=\"node\"/><text x=\"400\" y=\"707\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"14\">55</text><text x=\"400\" y=\"723\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">call held</text>\n            <rect x=\"452\" y=\"686\" width=\"93\" height=\"48\" rx=\"8\" class=\"node\"/><text x=\"498\" y=\"707\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"14\">18</text><text x=\"498\" y=\"723\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">proposal</text>\n            <rect x=\"550\" y=\"686\" width=\"93\" height=\"48\" rx=\"8\" class=\"node\"/><text x=\"596\" y=\"707\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"14\">15</text><text x=\"596\" y=\"723\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">accepted</text>\n            <rect x=\"648\" y=\"686\" width=\"93\" height=\"48\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"694\" y=\"707\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"14\" fill=\"var(--teal)\">14</text><text x=\"694\" y=\"723\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">paid</text>\n            <rect x=\"746\" y=\"686\" width=\"93\" height=\"48\" rx=\"8\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"792\" y=\"707\" text-anchor=\"middle\" class=\"svlabel\" font-size=\"14\" fill=\"var(--teal)\">14</text><text x=\"792\" y=\"723\" text-anchor=\"middle\" class=\"svmute\" font-size=\"9.5\">onboarding</text>\n          </g>\n\n          <!-- ===== S6 ===== -->\n          <rect x=\"44\" y=\"776\" width=\"800\" height=\"114\" rx=\"14\" fill=\"var(--panel-2)\" stroke=\"var(--teal)\" stroke-opacity=\".5\"/>\n          <rect x=\"60\" y=\"788\" width=\"32\" height=\"21\" rx=\"6\" fill=\"var(--teal)\"/><text x=\"76\" y=\"799\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"11.5\">S6</text>\n          <text x=\"102\" y=\"799\" class=\"svlabel\" font-size=\"14.5\">52-week growth engine</text>\n          <text x=\"102\" y=\"816\" class=\"svmute\" font-size=\"10.5\">replay \u2192 weekly cadence \u2192 reactivation \u2192 back to the top</text>\n          <text x=\"828\" y=\"797\" text-anchor=\"end\" fill=\"var(--teal)\" font-weight=\"700\" font-size=\"13\">3,420 subscribers</text>\n          <text x=\"828\" y=\"813\" text-anchor=\"end\" class=\"svmute\" font-size=\"10\">68% engaged</text>\n          <g font-size=\"10\">\n            <rect x=\"60\" y=\"830\" width=\"190\" height=\"46\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"72\" y=\"848\" class=\"svlabel\" font-size=\"11.5\">Email</text><text x=\"72\" y=\"865\" class=\"svmute\">47,600 sent \u00b7 42% open</text>\n            <rect x=\"258\" y=\"830\" width=\"190\" height=\"46\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"270\" y=\"848\" class=\"svlabel\" font-size=\"11.5\">WhatsApp</text><text x=\"270\" y=\"865\" class=\"svmute\">43,500 sent \u00b7 88% read</text>\n            <rect x=\"456\" y=\"830\" width=\"190\" height=\"46\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"468\" y=\"848\" class=\"svlabel\" font-size=\"11.5\">SMS</text><text x=\"468\" y=\"865\" class=\"svmute\">99% delivered</text>\n            <rect x=\"654\" y=\"830\" width=\"190\" height=\"46\" rx=\"9\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"666\" y=\"848\" class=\"svlabel\" font-size=\"11.5\">AI newsletter</text><text x=\"666\" y=\"865\" class=\"svmute\">65,000 sent \u00b7 12 topics</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Stage 0 sits outside the funnel</div><div class=\"ab\">Traffic is upstream and variable. The funnel mechanism starts once someone arrives.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">Each band is one day of this week</div><div class=\"ab\">Day 1 sets the strategy across all of them; Days 2 and 3 each own the bands below it.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">The bands are sequential for a reason</div><div class=\"ab\">Building the core before attaching traffic is the difference between a test and a burned list.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Everything this week is a zoom-in on one of these six bands.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">The master map \u2014 six stages</span><span class=\"fbar\"><i style=\"width:66.7%\"></i></span><span class=\"pg num\">009<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"The system",title:"One system, three shapes",html:"<div class=\"slide\" data-i=\"9\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The system</span><span class=\"sp\"></span><span class=\"step num\">9 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">You are not all building the same thing</div><div class=\"h2\" style=\"font-size:2.35cqw\">One system, three shapes</div><div class=\"vizrow\" style=\"--split:1.75fr\"><div class=\"viz\"><svg viewBox=\"0 0 860 592\" role=\"img\" aria-label=\"Comparison matrix: six funnel stages down the left, three funnel shapes across the top \u2014 webinar funnel, workshop or challenge funnel, and reverse squeeze funnel \u2014 with what each shape does at each stage.\">\n          <!-- column headers -->\n          <rect x=\"136\" y=\"14\" width=\"228\" height=\"42\" rx=\"10\" fill=\"var(--accent)\"/><text x=\"250\" y=\"35\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"13\">Webinar funnel</text>\n          <rect x=\"376\" y=\"14\" width=\"228\" height=\"42\" rx=\"10\" fill=\"#0f9e75\"/><text x=\"490\" y=\"35\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"13\">Workshop \u00b7 challenge</text>\n          <rect x=\"616\" y=\"14\" width=\"228\" height=\"42\" rx=\"10\" fill=\"#c23a68\"/><text x=\"730\" y=\"35\" text-anchor=\"middle\" class=\"svwhite\" font-size=\"13\">Reverse squeeze</text>\n          <text x=\"250\" y=\"50\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"9.5\">39 h build \u00b7 8\u201312 h/wk</text>\n          <text x=\"490\" y=\"50\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"9.5\">50 h build \u00b7 10\u201315 h/wk</text>\n          <text x=\"730\" y=\"50\" text-anchor=\"middle\" class=\"svwhite2\" font-size=\"9.5\">33 h build \u00b7 4\u20138 h/wk</text>\n\n          <g font-size=\"11.5\">\n            <!-- row 1 -->\n            <text x=\"20\" y=\"84\" class=\"svlabel\" font-size=\"11.5\">S1 Traffic</text><text x=\"20\" y=\"99\" class=\"svmute\" font-size=\"9.5\">who you invite</text>\n            <rect x=\"136\" y=\"66\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"150\" y=\"90\" class=\"svlabel\" font-size=\"11.5\">Invite to a dated event</text><text x=\"150\" y=\"108\" class=\"svmute\" font-size=\"10\">calendar \u00b7 email \u00b7 LinkedIn</text><text x=\"150\" y=\"124\" class=\"svmute\" font-size=\"10\">\u00b7 ads \u00b7 content</text>\n            <rect x=\"376\" y=\"66\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"390\" y=\"90\" class=\"svlabel\" font-size=\"11.5\">Invite to a cohort</text><text x=\"390\" y=\"108\" class=\"svmute\" font-size=\"10\">same five channels, plus</text><text x=\"390\" y=\"124\" class=\"svmute\" font-size=\"10\">peer referral \u2014 cohorts spread</text>\n            <rect x=\"616\" y=\"66\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"630\" y=\"90\" class=\"svlabel\" font-size=\"11.5\">Distribute Part 1 openly</text><text x=\"630\" y=\"108\" class=\"svmute\" font-size=\"10\">same five channels, but the</text><text x=\"630\" y=\"124\" class=\"svmute\" font-size=\"10\">link leads to value, not a form</text>\n            <!-- row 2 -->\n            <text x=\"20\" y=\"172\" class=\"svlabel\" font-size=\"11.5\">S2 Landing</text><text x=\"20\" y=\"187\" class=\"svmute\" font-size=\"9.5\">how you capture</text>\n            <rect x=\"136\" y=\"154\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"150\" y=\"178\" class=\"svlabel\" font-size=\"11.5\">Registration page</text><text x=\"150\" y=\"196\" class=\"svmute\" font-size=\"10\">date \u00b7 time \u00b7 speaker \u00b7 agenda</text><text x=\"150\" y=\"212\" class=\"svmute\" font-size=\"10\">form is the conversion event</text>\n            <rect x=\"376\" y=\"154\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"390\" y=\"178\" class=\"svlabel\" font-size=\"11.5\">Registration + checkout</text><text x=\"390\" y=\"196\" class=\"svmute\" font-size=\"10\">an entry price qualifies harder</text><text x=\"390\" y=\"212\" class=\"svmute\" font-size=\"10\">than any form field can</text>\n            <rect x=\"616\" y=\"154\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"630\" y=\"178\" class=\"svlabel\" font-size=\"11.5\">Content page \u00b7 no form</text><text x=\"630\" y=\"196\" class=\"svmute\" font-size=\"10\">the opt-in bridge appears</text><text x=\"630\" y=\"212\" class=\"svmute\" font-size=\"10\">only after the value lands</text>\n            <!-- row 3 -->\n            <text x=\"20\" y=\"260\" class=\"svlabel\" font-size=\"11.5\">S3 Nurture</text><text x=\"20\" y=\"275\" class=\"svmute\" font-size=\"9.5\">how you show up</text>\n            <rect x=\"136\" y=\"242\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"150\" y=\"266\" class=\"svlabel\" font-size=\"11.5\">Show-up sequence</text><text x=\"150\" y=\"284\" class=\"svmute\" font-size=\"10\">T\u221224h \u00b7 T\u22121h \u00b7 T\u221215m \u00b7 live</text><text x=\"150\" y=\"300\" class=\"svmute\" font-size=\"10\">time-triggered</text>\n            <rect x=\"376\" y=\"242\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"390\" y=\"266\" class=\"svlabel\" font-size=\"11.5\">Show-up + daily delivery</text><text x=\"390\" y=\"284\" class=\"svmute\" font-size=\"10\">5 \u00d7 (recap \u00b7 artifact \u00b7 tomorrow)</text><text x=\"390\" y=\"300\" class=\"svmute\" font-size=\"10\">the loop IS the product</text>\n            <rect x=\"616\" y=\"242\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"630\" y=\"266\" class=\"svlabel\" font-size=\"11.5\">Consumption sequence</text><text x=\"630\" y=\"284\" class=\"svmute\" font-size=\"10\">triggered by watch depth,</text><text x=\"630\" y=\"300\" class=\"svmute\" font-size=\"10\">not by the clock</text>\n            <!-- row 4 -->\n            <text x=\"20\" y=\"348\" class=\"svlabel\" font-size=\"11.5\">S4 Delivery</text><text x=\"20\" y=\"363\" class=\"svmute\" font-size=\"9.5\">the main event</text>\n            <rect x=\"136\" y=\"330\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"150\" y=\"354\" class=\"svlabel\" font-size=\"11.5\">One 60-minute session</text><text x=\"150\" y=\"372\" class=\"svmute\" font-size=\"10\">45 teach + 15 Q&amp;A</text><text x=\"150\" y=\"388\" class=\"svmute\" font-size=\"10\">offer lands near the end</text>\n            <rect x=\"376\" y=\"330\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"390\" y=\"354\" class=\"svlabel\" font-size=\"11.5\">3 sessions + 3 artifacts</text><text x=\"390\" y=\"372\" class=\"svmute\" font-size=\"10\">each day: survey in parallel \u2192</text><text x=\"390\" y=\"388\" class=\"svmute\" font-size=\"10\">generated output \u2192 delivered</text>\n            <rect x=\"616\" y=\"330\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"630\" y=\"354\" class=\"svlabel\" font-size=\"11.5\">Part 2, on demand</text><text x=\"630\" y=\"372\" class=\"svmute\" font-size=\"10\">gated, delivered instantly</text><text x=\"630\" y=\"388\" class=\"svmute\" font-size=\"10\">no scheduled moment at all</text>\n            <!-- row 5 -->\n            <text x=\"20\" y=\"436\" class=\"svlabel\" font-size=\"11.5\">S5 Revenue</text><text x=\"20\" y=\"451\" class=\"svmute\" font-size=\"9.5\">how it closes</text>\n            <rect x=\"136\" y=\"418\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"150\" y=\"442\" class=\"svlabel\" font-size=\"11.5\">CTA slide \u2192 booked call</text><text x=\"150\" y=\"460\" class=\"svmute\" font-size=\"10\">or straight to checkout for</text><text x=\"150\" y=\"476\" class=\"svmute\" font-size=\"10\">lower ticket sizes</text>\n            <rect x=\"376\" y=\"418\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"390\" y=\"442\" class=\"svlabel\" font-size=\"11.5\">Offer on the final day</text><text x=\"390\" y=\"460\" class=\"svmute\" font-size=\"10\">they already paid once \u2014 the</text><text x=\"390\" y=\"476\" class=\"svmute\" font-size=\"10\">second yes is far cheaper</text>\n            <rect x=\"616\" y=\"418\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\"/><text x=\"630\" y=\"442\" class=\"svlabel\" font-size=\"11.5\">Backend offer page</text><text x=\"630\" y=\"460\" class=\"svmute\" font-size=\"10\">routed by engagement score,</text><text x=\"630\" y=\"476\" class=\"svmute\" font-size=\"10\">not by a calendar date</text>\n            <!-- row 6 -->\n            <text x=\"20\" y=\"524\" class=\"svlabel\" font-size=\"11.5\">S6 Growth</text><text x=\"20\" y=\"539\" class=\"svmute\" font-size=\"9.5\">how it compounds</text>\n            <rect x=\"136\" y=\"506\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"150\" y=\"530\" class=\"svlabel\" font-size=\"11.5\">Replay + 52-week cadence</text><text x=\"150\" y=\"548\" class=\"svmute\" font-size=\"10\">the next event re-invites</text><text x=\"150\" y=\"564\" class=\"svmute\" font-size=\"10\">the whole list for free</text>\n            <rect x=\"376\" y=\"506\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"390\" y=\"530\" class=\"svlabel\" font-size=\"11.5\">Alumni + next cohort</text><text x=\"390\" y=\"548\" class=\"svmute\" font-size=\"10\">retention is literally the</text><text x=\"390\" y=\"564\" class=\"svmute\" font-size=\"10\">product you're selling</text>\n            <rect x=\"616\" y=\"506\" width=\"228\" height=\"74\" rx=\"10\" class=\"node\" stroke=\"var(--teal)\"/><text x=\"630\" y=\"530\" class=\"svlabel\" font-size=\"11.5\">Dual-path nurture</text><text x=\"630\" y=\"548\" class=\"svmute\" font-size=\"10\">low-ticket branch and premium</text><text x=\"630\" y=\"564\" class=\"svmute\" font-size=\"10\">branch, split by behaviour</text>\n          </g>\n        </svg></div><div class=\"vizcol\"><div class=\"annots\"><div class=\"annot\"><span class=\"an\">1</span><div style=\"min-width:0\"><div class=\"at\">Same stages, different weight</div><div class=\"ab\">A self-serve funnel loads the page and the checkout. A call-closed funnel loads the booking chain.</div></div></div><div class=\"annot\"><span class=\"an\">2</span><div style=\"min-width:0\"><div class=\"at\">The ticket decides the shape</div><div class=\"ab\">Higher price needs more contact time before the ask \u2014 that is the whole rule.</div></div></div><div class=\"annot\"><span class=\"an\">3</span><div style=\"min-width:0\"><div class=\"at\">Pick one shape this week</div><div class=\"ab\">A second funnel is a fine idea next quarter. Two at once is how neither gets finished.</div></div></div></div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Find the column closest to your ticket, and read down it.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">One system, three shapes</span><span class=\"fbar\"><i style=\"width:75.0%\"></i></span><span class=\"pg num\">010<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"The fork",title:"Two philosophies \u2014 pick a lane",html:"<div class=\"slide\" data-i=\"10\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The fork</span><span class=\"sp\"></span><span class=\"step num\">10 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Before you choose</div><div class=\"h2\" style=\"font-size:2.6cqw\">Two philosophies in this material \u2014 do not blend them</div><div class=\"matrix fill\" style=\"grid-template-columns:minmax(0,.85fr) repeat(2,minmax(0,1fr))\"><div class=\"mc head\"></div><div class=\"mc head\"><b>Self-serve assessment funnel</b></div><div class=\"mc head\"><b>Live / call-closed funnel</b></div><div class=\"mc rowh\"><b>The close</b></div><div class=\"mc\"><span>No human in the conversion path at all. Checkout is the close.</span></div><div class=\"mc\"><span>A human conversation is the close \u2014 a call, or a live room.</span></div><div class=\"mc rowh\"><b>Best fit</b></div><div class=\"mc\"><span>Lower ticket, high volume, a product that demonstrates itself.</span></div><div class=\"mc\"><span>Higher ticket, lower volume, where trust must be built before the ask.</span></div><div class=\"mc rowh\"><b>What you build</b></div><div class=\"mc\"><span>Scored assessment, result screen, plan tiers, checkout, upsell.</span></div><div class=\"mc\"><span>Registration, six-touch nurture, run of show, booking page, close chain.</span></div><div class=\"mc rowh\"><b>Where it breaks</b></div><div class=\"mc\"><span>Price too high for a page to carry alone.</span></div><div class=\"mc\"><span>Nobody available to host the room every week.</span></div><div class=\"mc rowh\"><b>This week</b></div><div class=\"mc\"><span>Days 1 and 3 carry most of your build.</span></div><div class=\"mc\"><span>Day 2 carries most of your build.</span></div></div><div class=\"foot\">These two models appear throughout the source material and genuinely conflict. Choosing one on Day 1 is what stops Day 3 becoming a scramble.</div></div><div class=\"sfoot\"><span class=\"ftitle\">Two philosophies \u2014 pick a lane</span><span class=\"fbar\"><i style=\"width:83.3%\"></i></span><span class=\"pg num\">011<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"The system",title:"Where your offers live",html:"<div class=\"slide\" data-i=\"11\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The system</span><span class=\"sp\"></span><span class=\"step num\">11 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">Where your offers live</div><div class=\"h2\" style=\"font-size:2.35cqw\">The value ladder</div><div class=\"viz\"><svg viewBox=\"0 0 860 486\" role=\"img\" aria-label=\"Value ladder staircase: five ascending rungs plotted with commitment on the horizontal axis and value delivered and trust earned on the vertical axis. Rungs are attention, lead, entry offer, core program and flagship. A narrowing wedge behind the stairs shows the audience shrinking at each rung, and a dashed ascension path climbs the steps.\">\n          <defs>\n            <marker id=\"LADDER_va\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L8 5L1 9\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker>\n          </defs>\n          <!-- axes -->\n          <line x1=\"90\" y1=\"438\" x2=\"838\" y2=\"438\" class=\"axis\"/>\n          <line x1=\"90\" y1=\"42\" x2=\"90\" y2=\"438\" class=\"axis\"/>\n          <text x=\"464\" y=\"470\" text-anchor=\"middle\" class=\"svsub\" font-size=\"11.5\">COMMITMENT  \u2192  attention \u00b7 contact details \u00b7 money \u00b7 more money</text>\n          <text transform=\"translate(28,240) rotate(-90)\" text-anchor=\"middle\" class=\"svsub\" font-size=\"11.5\">VALUE DELIVERED \u00b7 TRUST EARNED  \u2192</text>\n          <!-- steps -->\n          <g>\n            <rect x=\"90\" y=\"370\" width=\"146\" height=\"68\" fill=\"#a5b4fc\"/>\n            <rect x=\"236\" y=\"302\" width=\"146\" height=\"136\" fill=\"#818cf8\"/>\n            <rect x=\"382\" y=\"234\" width=\"146\" height=\"204\" fill=\"#6366f1\"/>\n            <rect x=\"528\" y=\"166\" width=\"146\" height=\"272\" fill=\"#7c3aed\"/>\n            <rect x=\"674\" y=\"98\" width=\"146\" height=\"340\" fill=\"#0f9e75\"/>\n          </g>\n          <!-- step labels -->\n          <g text-anchor=\"middle\">\n            <text x=\"163\" y=\"392\" class=\"svwhite\" font-size=\"12\">Attention</text><text x=\"163\" y=\"409\" class=\"svwhite2\" font-size=\"10\">free content</text><text x=\"163\" y=\"425\" class=\"svwhite2\" font-size=\"10\">costs them nothing</text>\n            <text x=\"309\" y=\"324\" class=\"svwhite\" font-size=\"12\">Lead</text><text x=\"309\" y=\"341\" class=\"svwhite2\" font-size=\"10\">opt-in / registration</text><text x=\"309\" y=\"357\" class=\"svwhite2\" font-size=\"10\">costs them an email</text>\n            <text x=\"455\" y=\"256\" class=\"svwhite\" font-size=\"12\">Entry offer</text><text x=\"455\" y=\"273\" class=\"svwhite2\" font-size=\"10\">small, self-liquidating</text><text x=\"455\" y=\"289\" class=\"svwhite2\" font-size=\"10\">pays for your traffic</text>\n            <text x=\"601\" y=\"188\" class=\"svwhite\" font-size=\"12\">Core program</text><text x=\"601\" y=\"205\" class=\"svwhite2\" font-size=\"10\">the transformation</text><text x=\"601\" y=\"221\" class=\"svwhite2\" font-size=\"10\">course \u00b7 community \u00b7 calls</text>\n            <text x=\"747\" y=\"120\" class=\"svwhite\" font-size=\"12\">Flagship</text><text x=\"747\" y=\"137\" class=\"svwhite2\" font-size=\"10\">done-with-you, long horizon</text><text x=\"747\" y=\"153\" class=\"svwhite2\" font-size=\"10\">your highest-trust buyers</text>\n          </g>\n          <!-- ascension path -->\n          <path d=\"M120 356 H206 V288 H352 V220 H498 V152 H644 V84 H790\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.4\" stroke-dasharray=\"6 6\" class=\"flowline\" marker-end=\"url(#LADDER_va)\" opacity=\".95\"/>\n          <!-- how many people stand on each rung: bar width IS the audience -->\n          <text x=\"90\" y=\"20\" class=\"svsub\" font-size=\"10.5\">HOW MANY PEOPLE STAND ON EACH RUNG</text>\n          <g text-anchor=\"middle\" font-size=\"10\">\n            <rect x=\"98\" y=\"30\" width=\"130\" height=\"9\" rx=\"4.5\" fill=\"var(--accent)\" opacity=\".85\"/>\n            <text x=\"163\" y=\"52\" class=\"svmute\">everyone who arrives</text>\n            <rect x=\"273\" y=\"30\" width=\"72\" height=\"9\" rx=\"4.5\" fill=\"var(--accent)\" opacity=\".7\"/>\n            <text x=\"309\" y=\"52\" class=\"svmute\">a fraction opt in</text>\n            <rect x=\"435\" y=\"30\" width=\"40\" height=\"9\" rx=\"4.5\" fill=\"var(--accent)\" opacity=\".55\"/>\n            <text x=\"455\" y=\"52\" class=\"svmute\">a fraction of those buy</text>\n            <rect x=\"590\" y=\"30\" width=\"22\" height=\"9\" rx=\"4.5\" fill=\"var(--accent)\" opacity=\".42\"/>\n            <text x=\"601\" y=\"52\" class=\"svmute\">some buyers climb</text>\n            <rect x=\"741\" y=\"30\" width=\"12\" height=\"9\" rx=\"4.5\" fill=\"var(--teal)\" opacity=\".8\"/>\n            <text x=\"747\" y=\"52\" class=\"svmute\">a handful reach the top</text>\n          </g>\n          <line x1=\"90\" y1=\"60\" x2=\"820\" y2=\"60\" stroke=\"var(--line-2)\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/>\n        </svg></div><div class=\"cards\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">One rung per funnel</div><div class=\"cb\">This week's funnel sells one rung. The rung above is Day 3's ascension work.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">Price sets the mechanism</div><div class=\"cb\">A page can close four figures. Five figures needs a conversation in the chain.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">The rung above is the cheapest revenue you own</div><div class=\"cb\">Someone who just bought is the warmest buyer you will ever have.</div></div></div><div class=\"bar\"><span class=\"bl\">Read it as</span><span class=\"bt\">Find your rung, then look directly above it \u2014 that gap is Day 3.</span></div></div><div class=\"sfoot\"><span class=\"ftitle\">Where your offers live</span><span class=\"fbar\"><i style=\"width:91.7%\"></i></span><span class=\"pg num\">012<i> / 230</i></span></div></div>"},
 {day:"Agenda",section:"The rule",title:"One rule for the whole week",html:"<div class=\"slide\" data-i=\"12\" data-accent=\"violet\" data-day=\"Agenda\"><div class=\"srail\"><span class=\"daychip\">Agenda</span><span class=\"sect\">The rule</span><span class=\"sp\"></span><span class=\"step num\">12 / 12</span><span class=\"dots\"><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"k\">One rule for the whole week</div><div class=\"h2\">Never model your funnel with invented rates</div><div class=\"lede\">Every step you build this week gets instrumented. The count of an event is the metric; a conversion rate is one count divided by another. If you cannot fetch it, you cannot fix it \u2014 you are optimising by vibes.</div><div class=\"cards fill\" style=\"--n:3\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Count, don't estimate</div><div class=\"cb\">Every step fires one logged event. The number of times it fired is the only number that counts.</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">A rate is a division</div><div class=\"cb\">Fetched count \u00f7 fetched count. A rate you typed into a spreadsheet is a wish with a percent sign.</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">Name the source</div><div class=\"cb\">For every number on your dashboard, you should be able to say which system it came from.</div></div></div><div class=\"bar\"><span class=\"bl\">Why this is rule one</span><span class=\"bt\">Every decision from Day 3 onward \u2014 which channel to fund, which step to fix \u2014 is only as good as the numbers underneath it.</span></div><div class=\"foot\">Illustrative figures do appear in this deck, to show the <em>shape</em> of an argument. Every one of them is labelled as a teaching model where it appears.</div></div><div class=\"sfoot\"><span class=\"ftitle\">One rule for the whole week</span><span class=\"fbar\"><i style=\"width:100.0%\"></i></span><span class=\"pg num\">013<i> / 230</i></span></div></div>"},
 {day:"Day 1",section:"Session 1 of 3",title:"Day 1 \u2014 Strategize the offer, the audience and the engine",html:"<div class=\"slide inv\" data-i=\"13\" data-accent=\"violet\" data-day=\"Day 1\"><div class=\"srail\"><span class=\"daychip\">Day 1</span><span class=\"sect\">Session 1 of 3</span><span class=\"sp\"></span><span class=\"step num\">1 / 72</span><span class=\"dots\"><i class=\"done\"></i><i class=\"now\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span></div><div class=\"sbody\"><div class=\"coverwrap\"><div style=\"display:flex;align-items:flex-end;gap:2cqw\"><div class=\"daynum\">1</div><div style=\"flex:1;min-width:0;padding-bottom:1.2cqh\"><div class=\"k\">Day 1 \u00b7 ~75 min + Q&amp;A</div><div class=\"h1\" style=\"font-size:3.9cqw\">Strategize the offer, the audience and the engine</div><div class=\"lede\" style=\"margin-top:.8cqh\">Zero tools today. This session decides most of the outcome of the other two.</div></div></div><div class=\"cards\" style=\"--n:4\"><div class=\"card\"><div class=\"cn\">1</div><div class=\"ct\">Who it's for</div><div class=\"cb\">From a market to one winnable account</div></div><div class=\"card\"><div class=\"cn\">2</div><div class=\"ct\">The offer</div><div class=\"cb\">Pressure-tested, then stacked</div></div><div class=\"card\"><div class=\"cn\">3</div><div class=\"ct\">The shape</div><div class=\"cb\">Twenty funnel types, one choice</div></div><div class=\"card\"><div class=\"cn\">4</div><div class=\"ct\">The engine</div><div class=\"cb\">Five blocks, one diagnostic, one spec</div></div></div><div class=\"bar\"><span class=\"bl\">You leave with</span><span class=\"bt\">Your funnel strategy on one page, and the conversion engine that generates every asset from it.</span></div></div></div><div class=\"sfoot\"><span class=\"ftitle\">Day 1 \u2014 Strategize the offer, the audience and the engine</span><span class=\"fbar\"><i style=\"width:1.4%\"></i></span><span class=\"pg num\">014<i> / 230</i></span></div></div>"},
