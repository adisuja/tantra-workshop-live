<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 3-Day AI RevOps Workshop: Daily Questions</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel-2:#fbfcfd;--ink:#0f1216;--ink-2:#454b57;--ink-3:#878d99;
  --line:#e6e8ec;--line-2:#d6d9df;--accent:#5b4bd6;--accent-2:#efedfd;--accent-ink:#3a2fa8;
  --teal:#0f9e75;--teal-bg:#e3f6ef;--amber:#b8790f;--amber-bg:#fbefda;--blue:#2f6fd0;--blue-bg:#e8f0fb;
  --pink:#c23a68;--pink-bg:#fbe9f0;
  --shadow:0 1px 2px rgba(16,19,24,.04),0 8px 30px rgba(16,19,24,.09);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0c0e13;--panel:#151821;--panel-2:#1a1e28;--ink:#f2f4f8;--ink-2:#b4bac6;--ink-3:#7a818e;
  --line:#252a35;--line-2:#333a48;--accent:#8e83f0;--accent-2:#211f3c;--accent-ink:#bcb4fb;
  --teal:#3ec79b;--teal-bg:#123027;--amber:#e0a63f;--amber-bg:#332612;--blue:#6aa3ec;--blue-bg:#122237;
  --pink:#e97aa2;--pink-bg:#331722;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hb{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}.tmark{position:relative;display:block;width:29px;height:29px;flex:none}.tmark img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.tmark .tmk-white{display:none}[data-theme="dark"] .tmark .tmk-ink{display:none}[data-theme="dark"] .tmark .tmk-white{display:block}.tname{font-weight:800;letter-spacing:-.02em;color:var(--ink)}.tdot{color:var(--ink-3);font-weight:400;margin:0 1px}
.hb b{font-size:14px;font-weight:650}
.hb .sp{flex:1}
.hb a{font-size:13px;color:var(--ink-2);text-decoration:none;font-weight:550}
.hb a:hover{color:var(--accent-ink)}
.iconbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:15px}
.days{max-width:1180px;margin:0 auto;padding:0 22px 11px;display:flex;gap:7px;flex-wrap:wrap}
.days button{font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel);cursor:pointer}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.days button .dn{opacity:.65;font-weight:500}
.days button .tick{color:var(--teal);font-weight:800;margin-left:5px}
.days button.on .tick{color:#fff}

main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:30px 22px 40px;display:flex;flex-direction:column;justify-content:center}

/* ---- the one-question card ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 26px 24px;position:relative;overflow:hidden}
@media(min-width:640px){.card{padding:34px 40px 30px}}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.prog .track{flex:1;height:5px;border-radius:20px;background:var(--line);overflow:hidden}
.prog .fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),#8b5cf6);transition:width .35s cubic-bezier(.22,.61,.36,1)}
.prog .n{font-size:11.5px;font-weight:750;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:650;color:var(--ink-3);background:none;border:0;cursor:pointer;padding:0;margin-bottom:14px}
.back:hover{color:var(--ink)}
.back[hidden]{display:none}

.qbody{animation:slide .26s cubic-bezier(.22,.61,.36,1)}
@keyframes slide{from{opacity:0;transform:translateX(var(--dx,22px))}to{opacity:1;transform:none}}
.kind{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;border-radius:20px;padding:4px 11px;background:var(--accent-2);color:var(--accent-ink);margin-bottom:12px}
.kind.met{background:var(--teal-bg);color:var(--teal)}
h1.q{font-size:22px;line-height:1.28;letter-spacing:-.015em;font-weight:700;margin-bottom:9px}
@media(min-width:640px){h1.q{font-size:27px}}
p.hint{font-size:14.5px;color:var(--ink-3);line-height:1.55;margin-bottom:20px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:15px;line-height:1.4;color:var(--ink);background:var(--panel);border:2px solid var(--line-2);border-radius:12px;padding:13px 15px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .let{flex:none;width:23px;height:23px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:750;background:var(--line);color:var(--ink-3)}
.opt.on{border-color:var(--accent);background:var(--accent-2)}
.opt.on .let{background:var(--accent);color:#fff}

textarea{width:100%;font:inherit;font-size:16.5px;line-height:1.62;color:var(--ink);background:var(--panel-2);border:2px solid var(--line-2);border-radius:13px;padding:14px 16px;resize:vertical}
.oth{display:block;width:100%;margin-top:10px;font:inherit;font-size:15px;color:var(--ink);background:var(--panel-2);border:2px solid var(--accent);border-radius:12px;padding:12px 15px}
textarea:focus{outline:none;border-color:var(--accent);background:var(--panel)}
textarea::placeholder{color:var(--ink-3);opacity:.75}

.meter{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:12.5px;font-weight:650;color:var(--ink-3)}
.meter .bar{width:96px;height:4px;border-radius:20px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--amber);border-radius:20px;transition:width .2s}
.meter.met{color:var(--teal)}
.meter.met .bar i{background:var(--teal)}

.row{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:22px}
.next{font:inherit;font-size:15.5px;font-weight:750;color:#fff;background:var(--accent);border:0;border-radius:30px;padding:12px 26px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,opacity .12s}
.next:hover:not(:disabled){transform:scale(1.03)}
.next:disabled{opacity:.4;cursor:not-allowed}
.why{font-size:13px;color:var(--pink);font-weight:600}

.togg{margin-top:20px;font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-2);border:0;border-radius:9px;padding:8px 14px;cursor:pointer}
.togg:hover{background:var(--accent);color:#fff}
.samples{display:none;margin-top:12px;flex-direction:column;gap:9px}
.samples.on{display:flex}
.samp{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14.5px;color:var(--ink-2);line-height:1.58}
.samp .who{display:block;font-size:10.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);background:var(--blue-bg);border-radius:6px;padding:2px 8px;margin-bottom:7px;width:fit-content}
.samp .who i{font-style:normal;opacity:.75;font-weight:600;text-transform:none;letter-spacing:0}

/* ---- day intro + done screens ---- */
.pad{text-align:center;padding:8px 0 4px}
.pad .kick{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink);font-weight:750}
.pad h1{font-size:30px;line-height:1.14;letter-spacing:-.025em;font-weight:800;margin:10px 0 12px}
@media(min-width:640px){.pad h1{font-size:36px}}
.pad p{color:var(--ink-2);font-size:16.5px;max-width:52ch;margin:0 auto}
.pad .out{margin:18px auto 0;max-width:56ch;background:var(--teal-bg);border-radius:12px;padding:13px 16px;font-size:14.5px;color:var(--teal);line-height:1.55;text-align:left}
.pad .out b{font-weight:750}
.pad .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.ghost{font:inherit;font-size:14.5px;font-weight:650;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:30px;padding:11px 22px;cursor:pointer}
.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}

footer{border-top:1px solid var(--line);padding:16px 22px;background:var(--panel)}
footer .inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
footer .sp{flex:1}
footer button{font:inherit;font-size:13.5px;font-weight:650;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 15px;cursor:pointer}
footer button:hover{border-color:var(--accent)}
footer button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>

    <a class="brand" href="index.html" aria-label="Tantra: The 3-Day AI RevOps Workshop"><span class="tmark"><img class="tmk-ink" src="brand/tantra-mark-ink.png" alt="" width="192" height="192"><img class="tmk-white" src="brand/tantra-mark-white.png" alt="" width="192" height="192"></span><span><span class="tname">Tantra</span> <span class="tdot">·</span> <b>3-Day AI RevOps Workshop</b></span></a>

<script>
const DATA = {"PERSONAS": {"send": ["For a SaaS company", "SendFlow, sales software at $490 a seat a month"], "apex": ["For a consulting firm", "Apex Growth, 11 people, £12,000 for 90 days"], "sarah": ["For a solo consultant", "Sarah Chen, $4,000 for six weeks"]}, "DAYS": [{"id": "day0", "n": 0, "title": "Get Set Up", "short": "Setup", "kick": "Your tools and your senders · every setup step follows these", "intro": "Seven questions: your mailboxes, your domains, your reminder email, your CRM, your AI provider, how buyers pay, and whose names go on the mailboxes. Cold email, LinkedIn, WhatsApp and calendar invites run on Tantra, SMS on Twilio, booking on Cal.com and social posts on Metricool for everyone, so there is nothing to choose for those.", "output": "Your setup steps in order, only for the tools you picked, and the weekly sending capacity the system works out from your mailboxes. Your personal plan at the end of Day 0 follows these answers.", "questions": [{"id": "mail_provider", "q": "Your outreach mailboxes: which way do you want them?", "hint": "Both are Google Workspace inboxes the agent sets up for you. Through our partner, SPF, DKIM and DMARC are done for you, the domains come included and the monthly cost is lower; their team contacts you.", "type": "single", "options": ["Google Workspace, in my own account", "Google Workspace through our partner: SPF, DKIM and DMARC set up for you, domains included, lower monthly cost"], "samples": {"send": "Google Workspace, in my own account. We already run Workspace and want every seat in our own admin.", "apex": "Google Workspace through our partner: SPF, DKIM and DMARC set up for you, domains included, lower monthly cost. We would rather not touch DNS.", "sarah": "Google Workspace through our partner: SPF, DKIM and DMARC set up for you, domains included, lower monthly cost. Lowest cost and nothing to configure."}}, {"id": "stack_domains", "q": "Your outreach domains: where do they come from?", "hint": "Never send cold email from your main domain. Cloudflare runs the DNS either way: the agent points domains you own at GoDaddy to Cloudflare, or registers new ones at Cloudflare at cost.", "type": "single", "options": ["I own domains at GoDaddy", "Cloudflare Registrar: register new domains there"], "samples": {"send": "I own domains at GoDaddy: trysendflow.com and sendflowhq.com.", "apex": "Cloudflare Registrar: register new domains there. We own none yet.", "sarah": "Cloudflare Registrar: register new domains there. Two new names at cost price."}}, {"id": "stack_reminder_email", "q": "Which tool sends your reminder and nurture email?", "hint": "Registrants get their reminders and the weekly email from it. Cold email always goes through Tantra.", "type": "single", "options": ["Resend", "SendGrid"], "samples": {"send": "SendGrid. Our product email already runs on it.", "apex": "Resend. Simplest to start with.", "sarah": "Resend."}}, {"id": "stack_crm", "q": "Your CRM: the built-in one alone, or synced to one you already use?", "hint": "The built-in CRM runs in your Cloudflare account either way. Pick a sync only if your team already lives in that CRM.", "type": "single", "options": ["Built-in CRM only", "Built-in, synced to GoHighLevel", "Built-in, synced to HubSpot", "Built-in, synced to Zoho CRM"], "samples": {"send": "Built-in, synced to HubSpot. Sales works from HubSpot.", "apex": "Built-in, synced to GoHighLevel.", "sarah": "Built-in CRM only."}}, {"id": "stack_ai", "q": "Your AI provider for drafts and images?", "hint": "Kie.ai is pay as you go. A Claude or OpenAI subscription you already pay for works too. Day 3 runs the build from Claude Code either way.", "type": "single", "options": ["Kie.ai", "I have a Claude subscription", "I have an OpenAI subscription"], "samples": {"send": "I have a Claude subscription.", "apex": "I have an OpenAI subscription.", "sarah": "Kie.ai."}}, {"id": "pay_checkout", "q": "How does a buyer pay you?", "hint": "Live payments need identity checks that take 1 to 3 business days, so the checkout account starts today. If a person closes every deal, choose invoice.", "type": "single", "options": ["By checkout, with Dodo Payments", "By checkout, with Stripe", "After a call, by invoice"], "samples": {"send": "By checkout, with Stripe.", "apex": "After a call, by invoice.", "sarah": "By checkout, with Dodo Payments."}}, {"id": "send_senders", "q": "Whose names go on the mailboxes? The full name of each person.", "hint": "Their first names become the mailbox names, and each gets a LinkedIn account in Tantra. The system works out how many people you can reach each week from this; you never pick a number.", "type": "short", "minWords": 2, "placeholder": "First Last, First Last", "samples": {"send": "Maya Ortiz, Dan Reyes", "apex": "James Whitfield", "sarah": "Sarah Chen"}}]}, {"id": "day1", "n": 1, "title": "Make the 8 Decisions Every Page, Email and Invite Depends On", "short": "Decide", "kick": "Strategy and setup · the decisions every later build reads", "intro": "Eight steps, in order: the offer, the method, the value equation, the buyer, the prospect list, the funnel, the event line, and every channel connected. Keep this tab open and answer as each step ends.", "output": "Your offer sentence, your named method, the buyer, where the list comes from, the funnel and event line, the channels you are connecting, and what you finish before Day 2.", "questions": [{"id": "d1v5_offer", "q": "Your offer in one sentence: I help [who] go from [before] to [after] using [method], in [time], or [guarantee].", "hint": "Outcome in the sentence, tool in the method slot. After Step 3, paste the version with your two weakest levers fixed.", "samples": {"send": "We help VPs of Sales go from reps sending 15 manual touches a day to 200 personalised ones using Profile-to-Message, live in a week, or your first month is free.", "apex": "I help professional-services partners go from referral-dependent to a predictable pipeline using the Partner Pipeline System, inside 90 days, or we keep working at no charge until it runs.", "sarah": "I help founders go from selling only when they aren't delivering to a funnel that runs either way, in six weeks, with every asset built alongside you."}, "type": "short", "minWords": 18, "placeholder": "I help … go from … to … using …, in …, or …"}, {"id": "d1v5_method", "q": "Your method: its name, its 3 to 5 steps in order, and why the obvious alternative fails.", "hint": "Two to four words for the name. The alternative is an agency, a tool on its own, or doing nothing.", "samples": {"send": "Profile-to-Message. 1 Enrich the person, not the company. 2 Write from their own signals. 3 Send inside safe daily caps. 4 Route replies to a human. A tool on its own fails because reps stop opening it.", "apex": "The Partner Pipeline System. 1 Map the referral pattern you already have. 2 Turn it into an offer. 3 Build one repeatable channel. 4 Hand the rhythm to the team. Agencies fail because they sell activity, not a channel the firm owns.", "sarah": "Build-With, Not Build-For. 1 Decide together. 2 I build, you watch. 3 You build, I watch. 4 You own it. Done-for-you fails because the funnel rots the day the freelancer leaves."}, "type": "short", "minWords": 15, "placeholder": "Name. 1 … 2 … 3 … The alternative fails because …"}, {"id": "d1v5_buyer", "q": "Your buyer: headcount, industry, geography, the role that signs, and the objection that kills deals, in their words.", "hint": "Trace every value to a real customer. Persona fields 1 to 5 become the data vendor filters in Step 5.", "samples": {"send": "B2B software, 20 to 80 staff, US and Canada, already paying for a sales-engagement tool. Signer: VP Sales, judged on pipeline per rep per month. Objection: “Our reps won't use another tool. We've rolled out two this year and both died.”", "apex": "Professional-services firms, 25 to 120 staff, UK and Ireland, no in-house marketing. Signer: Managing Partner, judged on fee income per partner. Objection: “We tried an agency before and it produced a lot of activity and no clients.”", "sarah": "Consultancies and studios, 3 to 12 people, English-speaking, founder still selling and delivering. Signer: the founder, judged on whether next quarter is already visible. Objection: “We're too small and too messy for this.”"}, "type": "long", "minWords": 25, "placeholder": "Headcount · industry · geography · who signs · the objection, in quotes"}, {"id": "d1v5_list", "q": "Which database builds your first prospect list?", "hint": "Your buyer fields become its filters. Remove current customers and verify every email before anything sends.", "samples": {"send": "Apollo: titles Head of Sales and VP Sales, 20 to 80 staff, US and Canada, then a verifier before any send.", "apex": "LinkedIn Sales Navigator: we run LinkedIn outreach, and partners rarely list work emails in the databases.", "sarah": "My own CRM or customer list: past enquiries and referrals first, then Apollo on the free tier."}, "type": "single", "options": ["Apollo", "LinkedIn Sales Navigator", "ZoomInfo", "Clay", "BuiltWith", "My own CRM or customer list"], "other": true}, {"id": "d1v5_funnel", "q": "Which funnel are you building?", "hint": "Buyers who need one idea reframed: webinar. Buyers who must try it to believe it: workshop or challenge. Buyers who have never heard of you: reverse squeeze.", "samples": {"send": "Webinar funnel: VPs of Sales know the category but not the method, and a person closes the annual deals on a demo call.", "apex": "Webinar funnel: partners don't believe pipeline can be systematised, so one idea has to be reframed before the offer lands.", "sarah": "Reverse squeeze funnel: nobody has heard of me yet, and my ticket is too small to justify a call on every lead."}, "type": "single", "options": ["Webinar funnel", "Workshop or challenge funnel", "Reverse squeeze funnel"]}, {"id": "d1v5_event", "q": "Your event line: title, date, time with time zone, length and <script>
// v5 (30 Sep 2026): the questions were rewritten, so answers are keyed by each
// question's stable id (d1v5_offer, ...) instead of its position (day1q1).
// A new store and new ids mean an old answer can never show under a new question.
const KEY = "tantra-survey-v5";
const store = JSON.parse(localStorage.getItem(KEY) || "{}");
// d3v5_tools offers the centre card's labels and d2v5_creds the approved tools (round 6); an answer saved
// under an old label keeps its match, and a retired tool maps to the one that replaced it (Instantly and
// HeyReach to Tantra). The server mirror (cloud/src/index.ts SURVEY_LEGACY) maps d3v5_tools the same way.
const LEGACY = {
  d3v5_tools: { "Cloudflare Workers (route B)": "Cloudflare (pages, CRM, DNS)", "Dodo Payments": "Dodo Payments or Stripe", "Zoom or WebinarGeek, through Tantra": "Zoom or WebinarGeek",
    "Instantly": "Tantra: MCP server, API and webhooks", "HeyReach": "Tantra: MCP server, API and webhooks", "Resend": "Resend or SendGrid" },
  d2v5_creds: { "GoHighLevel Private Integration token (route A)": "Your CRM's key (GoHighLevel, HubSpot or Zoho)", "Cloudflare Workers API token (route B)": "Cloudflare API token",
    "Google service account JSON": "Google service account JSON (calendar invites)", "Dodo Payments API key": "Dodo Payments or Stripe key" },
};
function normaliseTools() {
  for (const [id, was] of Object.entries(LEGACY)) {
    const q = DAYS.flatMap((d) => d.questions).find((x) => x.id === id);
    if (q && Array.isArray(store[id])) store[id] = [...new Set(store[id].map((x) => was[x] || x))].filter((x) => q.options.includes(x));
  }
}
normaliseTools();
const save = () => { touched = true; localStorage.setItem(KEY, JSON.stringify(store)); scheduleSync(day); };

// ---- account sync: answers follow the attendee to any device --------------
// The survey works fully on localStorage alone. Served by the centre (the
// Worker), it saves each day to the attendee's account through same-origin
// /api/survey: the session cookie names them, so no email travels in the URL.
// With ?ops=<base> it mirrors to a local ops service instead, as it always did
// (identity from ?email=, ?sid= handed over by the centre, or an id already
// synced on this device). Every call fails soft: with no session or no service
// this is exactly the local-only survey it has always been.
const PARAMS = new URLSearchParams(location.search);
const OPS_MODE = PARAMS.has("ops");
const OPS = (PARAMS.get("ops") || window.OPS_BASE || "http://127.0.0.1:8787").replace(/\/+$/, "");
const ID = { email: (PARAMS.get("email") || "").trim().toLowerCase(), sid: (PARAMS.get("sid") || "").trim(), account: false };
// Day 0's answers ride on the account's day1 row (the table holds day1 to day3; the server takes the
// Day 0 ids on day1), so a push for Day 0 or Day 1 always sends both days' answers together.
const kindOf = (di) => (DAYS[di].id === "day0" ? "day1" : DAYS[di].id);
const linked = () => (OPS_MODE ? !!ID.email : ID.account);
let syncTimers = {};
let accountSurveys = null;   // the account's surveys, read once while resolving the session
// The answers on this device belong to one attendee. The centre names them with an opaque key; when a
// different attendee signs in on the same browser, the device's answers are cleared, never pushed into
// their account. Answers given before any account was linked here (no key yet) are adopted.
const OWNER = "tantra-survey-owner";
let ownerKey = "", foreign = false;

function dayAnswers(di) {
  const o = {};
  DAYS.forEach((D, dj) => {
    if (kindOf(dj) !== kindOf(di)) return;
    D.questions.forEach((q) => { if (store[q.id] !== undefined) o[q.id] = store[q.id]; });
  });
  return o;
}
async function resolveIdentity() {
  if (!OPS_MODE) {
    // same origin, the session cookie only; a 401 (no session) keeps the survey on this device
    if (!/^https?:$/.test(location.protocol)) return;
    // only the centre (the Worker) has /api; the static review mirror stays local, with no failed calls
    if (!(/\.workers\.dev$/.test(location.hostname) || ["8790", "8820"].includes(location.port))) return;
    try {
      const r = await fetch("/api/survey", { credentials: "same-origin", headers: { accept: "application/json" } });
      if (r.ok) {
        const j = await r.json();
        accountSurveys = j.surveys || {};
        ownerKey = j.owner || "";
        const prev = localStorage.getItem(OWNER);
        if (ownerKey && prev && prev !== ownerKey) {
          // someone else's answers: drop them before anything is pulled or pushed
          Object.keys(store).forEach((k) => delete store[k]);
          localStorage.setItem(KEY, "{}");
          foreign = true;
        }
        ID.account = true;
      }
    } catch (e) { /* offline: stay on this device */ }
    return;
  }
  if (ID.email) return;
  if (ID.sid) {
    try {
      const r = await fetch(`${OPS}/api/session/resolve?sid=${encodeURIComponent(ID.sid)}`);
      if (r.ok) { const j = await r.json(); ID.email = ((j.attendee && j.attendee.email) || "").toLowerCase(); }
    } catch (e) { /* offline: fall through to device-local id */ }
  }
  if (!ID.email) ID.email = (localStorage.getItem("tantra-survey-id") || "").toLowerCase();
}
async function pullFromOps() {
  if (!linked()) return 0;
  try {
    let surveys = accountSurveys;
    if (OPS_MODE) {
      const r = await fetch(`${OPS}/api/survey?email=${encodeURIComponent(ID.email)}`);
      if (!r.ok) return 0;
      surveys = (await r.json()).surveys;
    }
    let filled = 0;
    Object.values(surveys || {}).forEach((ans) => Object.entries(ans || {}).forEach(([k, v]) => {
      if (!KNOWN.has(k)) return;            // skip answers to retired questions (v4 day1q1 and the like)
      const cur = store[k];
      const empty = cur === undefined || cur === "" || (Array.isArray(cur) && !cur.length);
      if (empty) { store[k] = v; filled++; }   // local edits win; the account only fills the blanks
    }));
    if (filled) { normaliseTools(); localStorage.setItem(KEY, JSON.stringify(store)); }
    return filled;
  } catch (e) { return 0; /* offline: keep whatever is on the device */ }
}
async function pushDay(di) {
  if (!linked()) return;
  syncState("saving");
  try {
    const r = OPS_MODE
      ? await fetch(`${OPS}/api/survey`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: kindOf(di), email: ID.email, answers: dayAnswers(di) }),
        })
      : await fetch("/api/survey", {
          method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: kindOf(di), answers: dayAnswers(di) }),
        });
    syncState(r.ok ? "ok" : "off");
  } catch (e) { syncState("off"); }
}
function scheduleSync(di) {
  if (!linked()) return;
  const k = kindOf(di);
  clearTimeout(syncTimers[k]);
  syncTimers[k] = setTimeout(() => pushDay(di), 900);
}
function syncState(s) {
  const el = document.getElementById("synced");
  if (!el) return;
  el.textContent = !linked() ? "Answers save on this device as you type."
    : s === "saving" ? "Saving to your account…"
    : s === "off" ? "Saved on this device. Account sync is offline."
    : "Saved to your account. Your answers follow you to any device.";
}
function dayFromHash() {
  const m = /^#day-?(\d+)$/i.exec(location.hash);
  if (!m) return null;
  const n = DAYS.findIndex((d) => d.n === +m[1]);
  return n >= 0 ? n : null;
}

const st = localStorage.getItem("tantra-theme");
if (st) document.documentElement.dataset.theme = st;
document.getElementById("theme").onclick = () => {
  const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = n;
  localStorage.setItem("tantra-theme", n);
};

const LETTERS = "ABCDEFGHIJK";
const words = (s) => (s || "").trim().split(/\s+/).filter(Boolean).length;

/* step -1 = the day's intro card, 0..n-1 = questions, n = the day's done card */
let day = 0, step = -1, dir = 1;

let touched = false;

function key(d, i) { return DAYS[d].questions[i].id; }
const KNOWN = new Set(DAYS.flatMap((d) => d.questions.map((q) => q.id)));
function answer(d, i) { return store[key(d, i)]; }

/** Is this question satisfied? Returns the reason it is not. */
// A single-choice question with other: true adds a last option that takes a
// typed name, stored as "Other: <name>".
const OTHER = "Other (name it)";
const isOther = (v) => typeof v === "string" && v.startsWith("Other:");
function optionsOf(q) { return q.other ? [...q.options, OTHER] : q.options; }

function check(q, v) {
  if (q.type === "single") {
    if (q.other && isOther(v)) return v.slice(6).trim() ? null : "Name it to continue.";
    return v ? null : "Choose one to continue.";
  }
  if (q.type === "multi") {
    const n = Array.isArray(v) ? v.length : 0;
    const need = q.minChoices || 1;
    return n >= need ? null : `Choose at least ${need}. You have ${n}.`;
  }
  const n = words(v);
  return n >= q.minWords ? null : `At least ${q.minWords} words. You have ${n}.`;
}

function dayDone(d) {
  return DAYS[d].questions.every((q, i) => !check(q, answer(d, i)));
}
function answeredCount(d) {
  return DAYS[d].questions.filter((q, i) => !check(q, answer(d, i))).length;
}

function renderDays() {
  elDays.innerHTML = DAYS.map((d, i) =>

    `<span class="dn">Day ${d.n}</span> · ${d.short}` +

  elDays.querySelectorAll("button").forEach(b => {
    b.onclick = () => { day = +b.dataset.d; step = -1; dir = 1; location.hash = "day-" + DAYS[day].n; render(); };
  });

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function kindLabel(q) {
  if (q.type === "single") return "Choose one";
  if (q.type === "multi") return `Choose at least ${q.minChoices || 1}`;
  return (q.type === "long" ? "Long answer" : "Short answer") + ` · at least ${q.minWords} words`;
}

function render() {
  renderDays();
  const D = DAYS[day];

  if (step < 0) {
    elMain.innerHTML =
      `<div class="pad qbody"><div class="kick">Day ${D.n} · ${esc(D.kick)}</div>` +
      `<h1>${esc(D.title)}</h1><p>${esc(D.intro)}</p>` +
      `<div class="out"><b>What you get back today:</b> ${esc(D.output)}</div>` +
      `<div class="btns"><button class="next" id="go">` +
      (answeredCount(day) ? "Continue" : `Start Day ${D.n}`) +
      ` <span aria-hidden="true">→</span></button></div>` +
      `<p style="margin-top:16px;font-size:13px;color:var(--ink-3)">${D.questions.length} questions · ` +
      `${answeredCount(day)} answered</p></div>`;
    document.getElementById("go").onclick = () => {
      // resume at the first unanswered question rather than the very start
      const first = D.questions.findIndex((q, i) => check(q, answer(day, i)));
      step = first === -1 ? 0 : first; dir = 1; render();
    };
    return;
  }

  if (step >= D.questions.length) {
    const done = dayDone(day);
    elMain.innerHTML =
      `<div class="pad qbody"><div class="kick">Day ${D.n} complete</div>` +
      `<h1>${done ? `All ${D.questions.length} answered.` : "Nearly there."}</h1>` +
      `<p>${done
        ? "That is everything today's output is generated from. You can still go back and sharpen any answer."
        : `${answeredCount(day)} of ${D.questions.length} meet the minimum. Go back and finish the rest. A thin answer makes a thin output.`}</p>` +
      `<div class="btns">` +
      `<button class="ghost" id="rev">Review answers</button>` +
      (day < DAYS.length - 1
        ? `<button class="next" id="nx">Day ${DAYS[day + 1].n} <span aria-hidden="true">→</span></button>`
        : `<button class="next" id="dl">Download my answers</button>`) +
      `</div></div>`;
    document.getElementById("rev").onclick = () => { step = 0; dir = -1; render(); };
    const nx = document.getElementById("nx");
    if (nx) nx.onclick = () => { day++; step = -1; dir = 1; render(); };
    const dl = document.getElementById("dl");
    if (dl) dl.onclick = download;
    return;
  }

  const q = D.questions[step];
  const v = answer(day, step);
  const pct = Math.round(((step + 1) / D.questions.length) * 100);
  const reason = check(q, v);

  let input = "";
  if (q.type === "single" || q.type === "multi") {
    input = `<div class="opts">` + optionsOf(q).map((o, i) => {
      const on = q.type === "multi" ? (Array.isArray(v) && v.includes(o)) : (o === OTHER ? isOther(v) : v === o);
      return `<button class="opt ${on ? "on" : ""}" data-o="${esc(o)}">` +
        `<span class="let">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
    }).join("") + `</div>` +
      (q.other && isOther(v) ? `<input id="oth" class="oth" type="text" placeholder="Name it" value="${esc(v.slice(6).trim())}">` : "");
  } else {
    const n = words(v);
    const pc = Math.min(100, Math.round((n / q.minWords) * 100));
    input =
      `<textarea id="ta" rows="${q.type === "long" ? 7 : 3}" placeholder="${esc(q.placeholder || "")}">${esc(v || "")}</textarea>` +
      `<div class="meter ${n >= q.minWords ? "met" : ""}" id="meter">` +
      `<span class="bar"><i style="width:${pc}%"></i></span>` +
      `<span id="mtext">${n} / ${q.minWords} words${n >= q.minWords ? " ✓" : ""}</span></div>`;
  }

  const last = step === D.questions.length - 1;
  elMain.innerHTML =
    `<div class="card"><div class="prog"><span class="track"><span class="fill" style="width:${pct}%"></span></span>` +
    `<span class="n">${step + 1} / ${D.questions.length}</span></div>` +
    `<button class="back" id="back" ${step === 0 ? "" : ""}>` +
    `<span aria-hidden="true">←</span> Back</button>` +
    `<div class="qbody" style="--dx:${dir * 22}px">` +
    `<span class="kind ${reason ? "" : "met"}" id="kind">${kindLabel(q)}</span>` +
    `<h1 class="q">${esc(q.q)}</h1>` +
    `<p class="hint">${esc(q.hint)}</p>` +
    input +
    `<div class="row"><button class="next" id="next" ${reason ? "disabled" : ""}>` +
    `${last ? "Finish day" : "Next"} <span aria-hidden="true">→</span></button>` +
    `<span class="why" id="why">${reason ? esc(reason) : ""}</span></div>` +
    `<button class="togg" id="togg">Show ${Object.keys(q.samples).length} sample answers</button>` +
    `<div class="samples" id="samples">` +
    Object.entries(q.samples).map(([p, txt]) =>
      `<div class="samp"><span class="who">${esc(PERSONAS[p][0])} <i>· ${esc(PERSONAS[p][1])}</i></span>${esc(txt)}</div>`).join("") +
    `</div></div></div>`;

  const back = document.getElementById("back");
  back.onclick = () => { dir = -1; step--; render(); };

  const nextBtn = document.getElementById("next");
  nextBtn.onclick = () => { if (!check(q, answer(day, step))) { dir = 1; step++; render(); } };

  document.getElementById("togg").onclick = (e) => {
    const box = document.getElementById("samples");
    const open = box.classList.toggle("on");
    e.target.textContent = open ? "Hide sample answers" : `Show ${Object.keys(q.samples).length} sample answers`;
  };

  if (q.type === "single" || q.type === "multi") {
    elMain.querySelectorAll(".opt").forEach(b => {
      b.onclick = () => {
        const o = b.dataset.o;
        if (q.type === "multi") {
          const cur = Array.isArray(answer(day, step)) ? [...answer(day, step)] : [];
          const i = cur.indexOf(o);
          if (i === -1) cur.push(o); else cur.splice(i, 1);
          store[key(day, step)] = cur; save();
          render();
        } else if (o === OTHER) {
          // no auto-advance: the name is still to be typed
          if (!isOther(answer(day, step))) { store[key(day, step)] = "Other: "; save(); }
          render();
          const oth = document.getElementById("oth");
          if (oth) oth.focus();
        } else {
          store[key(day, step)] = o; save();
          // single choice auto-advances, the way the thank-you survey does
          setTimeout(() => { dir = 1; step++; render(); }, 240);
          b.classList.add("on");
          document.getElementById("next").disabled = false;
          document.getElementById("why").textContent = "";
        }
      };
    });
    const oth = document.getElementById("oth");
    if (oth) oth.addEventListener("input", () => {
      store[key(day, step)] = "Other: " + oth.value; save();
      const r = check(q, store[key(day, step)]);
      document.getElementById("next").disabled = !!r;
      document.getElementById("why").textContent = r || "";
      document.getElementById("kind").className = "kind" + (r ? "" : " met");
      renderDays();
    });
  } else {
    const ta = document.getElementById("ta");
    ta.addEventListener("input", () => {
      store[key(day, step)] = ta.value; save();
      const n = words(ta.value), ok = n >= q.minWords;
      const m = document.getElementById("meter");
      m.className = "meter" + (ok ? " met" : "");
      m.querySelector("i").style.width = Math.min(100, Math.round((n / q.minWords) * 100)) + "%";
      document.getElementById("mtext").textContent = `${n} / ${q.minWords} words` + (ok ? " ✓" : "");
      document.getElementById("next").disabled = !ok;
      document.getElementById("why").textContent = ok ? "" : `At least ${q.minWords} words. You have ${n}.`;
      document.getElementById("kind").className = "kind" + (ok ? " met" : "");
      renderDays();
    });
    // Enter advances on a short answer; long answers need the newline
    if (q.type === "short") {
      ta.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!check(q, ta.value)) { dir = 1; step++; render(); } }
      });
    }
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

function collect() {
  const out = [];
  DAYS.forEach((d, di) => {
    const rows = d.questions.map((q, i) => [q, answer(di, i)]);
    if (!rows.some(([, v]) => (Array.isArray(v) ? v.length : String(v || "").trim()))) return;
    out.push(`# Day ${d.n} · ${d.title}`);
    rows.forEach(([q, v]) => {
      const a = Array.isArray(v) ? v.join(" · ") : String(v || "").trim();
      out.push(`\n## ${q.q}\n${a || "(not answered)"}`);
    });
    out.push("");
  });
  return out.join("\n").trim() || "No answers yet.";
}
function download() {
  const blob = new Blob([collect()], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "workshop-answers.md";
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById("download").onclick = download;
document.getElementById("copy").onclick = async (e) => {
  try {
    await navigator.clipboard.writeText(collect());
    e.target.textContent = "Copied";
    setTimeout(() => (e.target.textContent = "Copy answers"), 1500);
  } catch { e.target.textContent = "Copy failed"; }
};

// A "#day-2" link (from the deck or the command centre) opens the right day
// rather than always Day 1. It stays live after load, so pasting a new hash
// into the address bar moves the survey too.
const _hd0 = dayFromHash();
if (_hd0 !== null) day = _hd0;
render();
addEventListener("hashchange", () => {
  const hd = dayFromHash();
  if (hd !== null && hd !== day) { day = hd; step = -1; dir = 1; render(); }
});

// Then, if we can name the attendee, hydrate from ops so the answers they gave
// on another device are already here, and mirror future edits back up.
(async () => {
  await resolveIdentity();
  if (!linked()) { syncState(); return; }
  if (OPS_MODE) localStorage.setItem("tantra-survey-id", ID.email);
  syncState("saving");
  const filled = await pullFromOps();
  // Only repaint if ops actually added answers AND the attendee has not started
  // typing; otherwise the repaint would discard the field they are in.
  if ((filled && !touched) || foreign) render();
  if (!OPS_MODE && ownerKey) localStorage.setItem(OWNER, ownerKey);
  syncState("ok");
  // answers given on this device before the account was linked go up now, so nothing waits for the next edit;
  // never when they belonged to another attendee (they were cleared above)
  if (!OPS_MODE && !foreign) DAYS.forEach((_, di) => {
    const mine = dayAnswers(di);
    if (Object.keys(mine).length && JSON.stringify(mine) !== JSON.stringify((accountSurveys || {})[kindOf(di)] || {})) scheduleSync(di);
  });
})();
</script>
