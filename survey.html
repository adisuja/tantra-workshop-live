<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5-Day Workshop — Daily Questions</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel-2:#fbfcfd;--ink:#0f1216;--ink-2:#454b57;--ink-3:#878d99;
  --line:#e6e8ec;--line-2:#d6d9df;--accent:#5b4bd6;--accent-2:#efedfd;--accent-ink:#3a2fa8;
  --teal:#0f9e75;--teal-bg:#e3f6ef;--amber:#b8790f;--amber-bg:#fbefda;--blue:#2f6fd0;--blue-bg:#e8f0fb;
  --pink:#c23a68;--pink-bg:#fbe9f0;
  --shadow:0 1px 2px rgba(16,19,24,.04),0 8px 30px rgba(16,19,24,.09);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0c0e13;--panel:#151821;--panel-2:#1a1e28;--ink:#f2f4f8;--ink-2:#b4bac6;--ink-3:#7a818e;
  --line:#252a35;--line-2:#333a48;--accent:#8e83f0;--accent-2:#211f3c;--accent-ink:#bcb4fb;
  --teal:#3ec79b;--teal-bg:#123027;--amber:#e0a63f;--amber-bg:#332612;--blue:#6aa3ec;--blue-bg:#122237;
  --pink:#e97aa2;--pink-bg:#331722;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hb{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}.tmark{position:relative;display:block;width:29px;height:29px;flex:none}.tmark img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.tmark .tmk-white{display:none}[data-theme="dark"] .tmark .tmk-ink{display:none}[data-theme="dark"] .tmark .tmk-white{display:block}.tname{font-weight:800;letter-spacing:-.02em;color:var(--ink)}.tdot{color:var(--ink-3);font-weight:400;margin:0 1px}
.hb b{font-size:14px;font-weight:650}
.hb .sp{flex:1}
.hb a{font-size:13px;color:var(--ink-2);text-decoration:none;font-weight:550}
.hb a:hover{color:var(--accent-ink)}
.iconbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:15px}
.days{max-width:1180px;margin:0 auto;padding:0 22px 11px;display:flex;gap:7px;flex-wrap:wrap}
.days button{font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel);cursor:pointer}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.days button .dn{opacity:.65;font-weight:500}
.days button .tick{color:var(--teal);font-weight:800;margin-left:5px}
.days button.on .tick{color:#fff}

main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:30px 22px 40px;display:flex;flex-direction:column;justify-content:center}

/* ---- the one-question card ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 26px 24px;position:relative;overflow:hidden}
@media(min-width:640px){.card{padding:34px 40px 30px}}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.prog .track{flex:1;height:5px;border-radius:20px;background:var(--line);overflow:hidden}
.prog .fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),#8b5cf6);transition:width .35s cubic-bezier(.22,.61,.36,1)}
.prog .n{font-size:11.5px;font-weight:750;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:650;color:var(--ink-3);background:none;border:0;cursor:pointer;padding:0;margin-bottom:14px}
.back:hover{color:var(--ink)}
.back[hidden]{display:none}

.qbody{animation:slide .26s cubic-bezier(.22,.61,.36,1)}
@keyframes slide{from{opacity:0;transform:translateX(var(--dx,22px))}to{opacity:1;transform:none}}
.kind{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;border-radius:20px;padding:4px 11px;background:var(--accent-2);color:var(--accent-ink);margin-bottom:12px}
.kind.met{background:var(--teal-bg);color:var(--teal)}
h1.q{font-size:22px;line-height:1.28;letter-spacing:-.015em;font-weight:700;margin-bottom:9px}
@media(min-width:640px){h1.q{font-size:27px}}
p.hint{font-size:14.5px;color:var(--ink-3);line-height:1.55;margin-bottom:20px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:15px;line-height:1.4;color:var(--ink);background:var(--panel);border:2px solid var(--line-2);border-radius:12px;padding:13px 15px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .let{flex:none;width:23px;height:23px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:750;background:var(--line);color:var(--ink-3)}
.opt.on{border-color:var(--accent);background:var(--accent-2)}
.opt.on .let{background:var(--accent);color:#fff}

textarea{width:100%;font:inherit;font-size:16.5px;line-height:1.62;color:var(--ink);background:var(--panel-2);border:2px solid var(--line-2);border-radius:13px;padding:14px 16px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);background:var(--panel)}
textarea::placeholder{color:var(--ink-3);opacity:.75}

.meter{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:12.5px;font-weight:650;color:var(--ink-3)}
.meter .bar{width:96px;height:4px;border-radius:20px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--amber);border-radius:20px;transition:width .2s}
.meter.met{color:var(--teal)}
.meter.met .bar i{background:var(--teal)}

.row{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:22px}
.next{font:inherit;font-size:15.5px;font-weight:750;color:#fff;background:var(--accent);border:0;border-radius:30px;padding:12px 26px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,opacity .12s}
.next:hover:not(:disabled){transform:scale(1.03)}
.next:disabled{opacity:.4;cursor:not-allowed}
.why{font-size:13px;color:var(--pink);font-weight:600}

.togg{margin-top:20px;font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-2);border:0;border-radius:9px;padding:8px 14px;cursor:pointer}
.togg:hover{background:var(--accent);color:#fff}
.samples{display:none;margin-top:12px;flex-direction:column;gap:9px}
.samples.on{display:flex}
.samp{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14.5px;color:var(--ink-2);line-height:1.58}
.samp .who{display:block;font-size:10.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);background:var(--blue-bg);border-radius:6px;padding:2px 8px;margin-bottom:7px;width:fit-content}
.samp .who i{font-style:normal;opacity:.75;font-weight:600;text-transform:none;letter-spacing:0}

/* ---- day intro + done screens ---- */
.pad{text-align:center;padding:8px 0 4px}
.pad .kick{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink);font-weight:750}
.pad h1{font-size:30px;line-height:1.14;letter-spacing:-.025em;font-weight:800;margin:10px 0 12px}
@media(min-width:640px){.pad h1{font-size:36px}}
.pad p{color:var(--ink-2);font-size:16.5px;max-width:52ch;margin:0 auto}
.pad .out{margin:18px auto 0;max-width:56ch;background:var(--teal-bg);border-radius:12px;padding:13px 16px;font-size:14.5px;color:var(--teal);line-height:1.55;text-align:left}
.pad .out b{font-weight:750}
.pad .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.ghost{font:inherit;font-size:14.5px;font-weight:650;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:30px;padding:11px 22px;cursor:pointer}
.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}

footer{border-top:1px solid var(--line);padding:16px 22px;background:var(--panel)}
footer .inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
footer .sp{flex:1}
footer button{font:inherit;font-size:13.5px;font-weight:650;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 15px;cursor:pointer}
footer button:hover{border-color:var(--accent)}
footer button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hb">
    <a class="brand" href="index.html" aria-label="Tantra — 5-Day Workshop"><span class="tmark"><img class="tmk-ink" src="brand/tantra-mark-ink.png" alt="" width="192" height="192"><img class="tmk-white" src="brand/tantra-mark-white.png" alt="" width="192" height="192"></span><span><span class="tname">Tantra</span> <span class="tdot">·</span> <b>5-Day Workshop</b></span></a>
    <span class="sp"></span>
    <a href="playbook.html">Playbook</a>
    <a href="index.html">← Command center</a>
    <button class="iconbtn" id="theme" title="Theme">◐</button>
  </div>
  <nav class="days" id="days"></nav>
</header>

<main id="main"></main>

<footer><div class="inner">
  <span>Answers save on this device as you type.</span>
  <span class="sp"></span>
  <button id="copy">Copy answers</button>
  <button id="download" class="pri">Download</button>
</div></footer>

<script>
const DATA = {"PERSONAS": {"apex": ["Apex Growth", "high-ticket B2B consultancy"], "send": ["SendFlow", "B2B SaaS · outreach"], "metric": ["MetricBase", "B2B SaaS · analytics"], "sarah": ["Sarah Chen", "solo consultant"], "revops": ["RevOps Collective", "boutique agency"], "sherpa": ["Ops Sherpa", "fractional operations"]}, "DAYS": [{"id": "day1", "n": 1, "title": "Strategize the offer and the audience", "short": "Strategize", "kick": "Strategy · zero tools, 90% of the outcome", "intro": "Everything on Days 2–5 is generated from what you write today. Vague here becomes a vague landing page on Wednesday.", "output": "Your funnel strategy on one page — ICP, persona, offer, ladder position, funnel type, and the baseline arithmetic.", "questions": [{"q": "Describe the company you sell to — headcount, revenue band, industry, geography.", "hint": "Specific enough to paste into a list-building filter. “SMB” is not an answer.", "samples": {"apex": "Professional-services firms, 25–120 staff, £5M–£25M turnover, UK and Ireland, partner-led with no in-house marketing function.", "send": "B2B software companies, 20–80 staff, $3M–$15M ARR, US and Canada, already paying for a sales-engagement tool they complain about.", "metric": "Product-led SaaS, 30–150 staff, Series A or B, North America and Western Europe, running a home-built analytics setup nobody trusts.", "sarah": "Independent consultancies and studios, 3–12 people, $400K–$2M revenue, English-speaking, founder still doing delivery and sales.", "revops": "Venture-backed B2B, 40–250 staff, $10M–$60M ARR, US, with a CRM that three teams each describe differently.", "sherpa": "Agencies and studios, 8–40 staff, $1M–$8M revenue, anywhere remote-friendly, growing faster than their processes."}, "type": "long", "minWords": 25, "placeholder": "Headcount, revenue band, industry, geography…"}, {"q": "Who signs, and what single number are they personally measured on?", "hint": "A role senior enough to say yes alone — plus the metric their own boss asks them about.", "samples": {"apex": "Managing Partner. Measured on fee income per partner — they are judged on whether the firm grows without them working more hours.", "send": "VP Sales. Measured on qualified pipeline created per rep per month, reported weekly.", "metric": "Head of Product. Measured on activation rate — what share of signups reach the first real value moment.", "sarah": "The founder. Measured on whether next quarter's revenue is already visible, not hoped for.", "revops": "VP RevOps or Chief of Staff. Measured on forecast accuracy — how close the call was to the actual close.", "sherpa": "Founder or COO. Measured on delivery margin — profit per project after the chaos tax."}, "type": "short", "minWords": 12, "placeholder": "The role, and the number they're judged on"}, {"q": "What is the one objection that kills your deals? Write it verbatim.", "hint": "Their words, not your paraphrase. You will be answering this sentence on every page you build.", "samples": {"apex": "“We tried an agency before and it produced a lot of activity and no clients.”", "send": "“Our reps won't use another tool. We've rolled out two this year and both died.”", "metric": "“We already have analytics. The problem is nobody looks at it.”", "sarah": "“This probably works for bigger companies. We're too small and too messy for it.”", "revops": "“Our data is a disaster. You'd have to fix that before any of this would work.”", "sherpa": "“We don't have time to implement anything right now — that's the whole problem.”"}, "type": "short", "minWords": 8, "placeholder": "Their exact words, in quotes"}, {"q": "Your offer in one sentence: I help [who] go from [before] to [after] using [mechanism], in [time], or [guarantee].", "hint": "Read it to someone who doesn't know your business. If they ask a follow-up question, it isn't finished.", "samples": {"apex": "I help professional-services partners go from referral-dependent to a predictable pipeline using the Partner Pipeline System, inside 90 days, or we keep working free until it runs.", "send": "We help VPs of Sales go from reps sending 15 manual touches a day to 200 personalised ones using our profile-to-message engine, live in a week, or your first month is free.", "metric": "We help product teams go from arguing about numbers to agreeing on them using one instrumented activation funnel, in 14 days, backed by a full refund window.", "sarah": "I help founders go from selling only when they aren't delivering to a funnel that runs either way, in six weeks, with every asset built alongside you.", "revops": "We help RevOps leaders go from a forecast nobody believes to one that lands within 10% using our pipeline audit and rebuild, in 30 days, or we don't invoice.", "sherpa": "I help agency founders go from firefighting to documented operations using the Ops Spine method, in 60 days, or I keep going until it's done."}, "type": "long", "minWords": 30, "placeholder": "I help … go from … to … using …, in …, or …"}, {"q": "Which rung of your ladder is this offer?", "hint": "You'll name the rung above it on Day 5. A ladder with only one rung forces your traffic to be profitable on the very first sale — the hardest game there is.", "samples": {"apex": "Core · the main transformation — £12,000 for the 90-day build; the annual retainer sits above it.", "send": "Core · the main transformation — the $490/month seat, with a $290 audit below and a managed programme above.", "metric": "Core · the main transformation — the $1,200/month platform; an embedded analyst day is the rung above.", "sarah": "Core · the main transformation — the $4,000 six-week build. I still need to name my flagship.", "revops": "Core · the main transformation — the $18,000 pipeline rebuild, with a quarterly retainer above it.", "sherpa": "Core · the main transformation — the $7,500 Ops Spine build; fractional COO time is the rung above."}, "type": "single", "options": ["Entry · small and self-liquidating", "Core · the main transformation", "Flagship · highest-touch, highest-price", "I only have one offer today"]}, {"q": "Which funnel shape are you building?", "hint": "Three questions decide it: how much do they already believe, how big is the ticket, and who closes — a page or a person?", "samples": {"apex": "Webinar funnel — partners don't believe pipeline can be systematised, so the idea has to be taught before any offer lands.", "send": "Reverse squeeze funnel — nobody has heard of us, and we can demonstrate the mechanism in one piece of content.", "metric": "Workshop (challenge) funnel — the product is the implementation, so they need to do it with us.", "sarah": "Reverse squeeze funnel — my ticket is too small to justify a call on every lead.", "revops": "Book-a-call funnel — at $18,000 no page carries the objection about their data being a mess.", "sherpa": "Workshop (challenge) funnel — founders need to feel the method working on their own business first."}, "type": "single", "options": ["Webinar funnel", "Workshop (challenge) funnel", "Reverse squeeze funnel", "Book-a-call funnel", "Still deciding"]}]}, {"id": "day2", "n": 2, "title": "Design the conversion engine", "short": "Design", "kick": "One source of truth that writes everything", "intro": "Five context blocks, a diagnostic, and a spec outline — so every asset on Day 3 gets generated instead of invented.", "output": "A conversion engine: five blocks filled, a diagnostic designed, and a spec outline the build reads directly.", "questions": [{"q": "Your offer block: price, guarantee, what's included, and what is explicitly NOT included.", "hint": "The exclusions matter as much as the inclusions — they're what stop the wrong buyer arriving.", "samples": {"apex": "£12,000, 90 days, keep-working-free guarantee. Includes strategy, build and training. Does not include running campaigns for them after handover.", "send": "$490/month per seat, cancel anytime, first month free if not live in 7 days. Includes setup and sequences. Does not include list purchase or domain costs.", "metric": "$1,200/month, 30-day refund. Includes instrumentation, dashboards and a quarterly review. Does not include data-warehouse migration.", "sarah": "$4,000, six weeks, built alongside you. Includes every asset and the recordings. Does not include ad spend or ongoing management.", "revops": "$18,000, 30 days, no invoice if the forecast doesn't improve. Includes audit, rebuild and enablement. Does not include net-new CRM licences.", "sherpa": "$7,500, 60 days, I keep going until it's done. Includes documentation and training. Does not include hiring or recruiting."}, "type": "long", "minWords": 30, "placeholder": "Price, guarantee, what's included — and what is not…"}, {"q": "Your brand voice: three adjectives you are, and three you are deliberately not.", "hint": "The anti-adjectives do more work than the adjectives — they're what stop generic copy getting through.", "samples": {"apex": "Is: measured, senior, plain-spoken. Is not: hypey, chummy, jargon-heavy.", "send": "Is: direct, technical, slightly irreverent. Is not: corporate, salesy, buzzword-driven.", "metric": "Is: precise, evidence-first, calm. Is not: dramatic, vague, trend-chasing.", "sarah": "Is: warm, practical, honest about trade-offs. Is not: guru-ish, urgent, over-promising.", "revops": "Is: analytical, blunt, numerate. Is not: fluffy, motivational, hand-wavy.", "sherpa": "Is: calm, systematic, reassuring. Is not: hustle-coded, panicky, macho."}, "type": "short", "minWords": 6, "placeholder": "Is: … · Is not: …"}, {"q": "Name your mechanism, then list its 3–5 steps and why each one is necessary.", "hint": "An unnamed method is a commodity. A named one with a reason per step is a reason to choose you.", "samples": {"apex": "The Partner Pipeline System. 1 Map the referral pattern you already have. 2 Turn it into an offer. 3 Build one repeatable channel. 4 Hand the operating rhythm to the team, so it survives you.", "send": "Profile-to-Message. 1 Enrich the person, not the company. 2 Generate from their own signals. 3 Send inside safe daily caps. 4 Route replies to a human — automation stops where the conversation starts.", "metric": "The Activation Spine. 1 Define the value moment. 2 Instrument every step to it. 3 Find the worst step. 4 Fix only that one — because fixing five teaches you nothing.", "sarah": "Build-With, Not Build-For. 1 Decide together. 2 I build, you watch. 3 You build, I watch. 4 You own it — which is why it doesn't rot when I leave.", "revops": "Forecast Integrity. 1 Audit stage definitions. 2 Make every transition event-driven. 3 Rebuild the pipeline. 4 Enable the team, because a pipeline nobody follows is decoration.", "sherpa": "The Ops Spine. 1 Find the five processes that cause 80% of the chaos. 2 Document them once. 3 Automate the handoffs. 4 Assign an owner — an unowned process is an unwritten one."}, "type": "long", "minWords": 30, "placeholder": "The name, then each step and why it's necessary…"}, {"q": "Your strongest piece of proof — with a number, a name and a date.", "hint": "“Great results” is not proof. If you have none, use borrowed proof and label it as borrowed.", "samples": {"apex": "A 40-partner firm went from 3 inbound enquiries a quarter to 11 a month within two quarters — named, with permission to use it.", "send": "One customer moved from 15 manual touches per rep per day to 180 automated ones in three weeks, with reply rate holding steady.", "metric": "A Series-A client found a single onboarding screen costing them a fifth of activations. One change, measured over four weeks.", "sarah": "Borrowed for now: I have three unnamed before-and-afters and no permission yet. Getting written consent from two clients this week.", "revops": "Forecast variance went from 38% to 9% over one quarter at a 120-person B2B company, verified against their own closed numbers.", "sherpa": "An agency cut project overrun from 22% of hours to 6% in two months after documenting five processes."}, "type": "short", "minWords": 12, "placeholder": "A number, a name and a date"}, {"q": "Which dimensions does your offer actually improve?", "hint": "These become your score axes. Pick 3–5 — and only ones you can genuinely move. An axis you can't help with makes the diagnostic dishonest.", "samples": {"apex": "Acquisition · Conversion · Retention · Ops & data — the four a partner-led firm actually feels.", "send": "Acquisition · Conversion · Ops & data — volume, personalisation quality and deliverability all live here.", "metric": "Conversion · Retention · Ops & data — activation, data trust and decision speed.", "sarah": "Acquisition · Conversion · Pricing & offer — lead flow, offer clarity and follow-up consistency.", "revops": "Conversion · Ops & data · Team & process — data hygiene, stage discipline and handoff quality.", "sherpa": "Ops & data · Team & process · Retention — documentation, handoff friction and delivery margin."}, "type": "multi", "minChoices": 3, "options": ["Acquisition — getting found at all", "Conversion — turning attention into buyers", "Retention — keeping the ones you win", "Ops & data — knowing what is actually happening", "Pricing & offer — what you sell and for how much", "Team & process — who does what, repeatably"]}, {"q": "Your three band labels, and the rule that maps a band to a recommended rung.", "hint": "Write the rule down and commit to it. A rule can be A/B tested; a hunch can't.", "samples": {"apex": "Referral-dependent (0–40) → entry diagnostic. Inconsistent (41–75) → the 90-day build. Scaling-blocked (76–100) → retainer.", "send": "Manual (0–40) → audit. Semi-automated (41–75) → platform seat. At-scale (76–100) → managed programme.", "metric": "Flying blind (0–40) → teardown. Instrumented but ignored (41–75) → platform. Data-led (76–100) → embedded analyst.", "sarah": "Feast-or-famine (0–40) → diagnostic. Inconsistent (41–75) → six-week build. Ready to scale (76–100) → ongoing optimisation.", "revops": "Chaotic (0   if (q.type === "single") return v ? null : "Choose one to continue.";
  if (q.type === "multi") {
    const n = Array.isArray(v) ? v.length : 0;
    const need = q.minChoices || 1;

  }
  const n = words(v);

  return DAYS[d].questions.every((q, i) => !check(q, answer(d, i)));

  return DAYS[d].questions.filter((q, i) => !check(q, answer(d, i))).length;

  } else {
    const n = words(v);
    const pc = Math.min(100, Math.round((n / q.minWords) * 100));
    input =
      `<textarea id="ta" rows="${q.type === "long" ? 7 : 3}" placeholder="${esc(q.placeholder || "")}">${esc(v || "")}</textarea>` +
      `<div class="meter ${n >= q.minWords ? "met" : ""}" id="meter">` +
      `<span class="bar"><i style="width:${pc}%"></i></span>` +
      `<span id="mtext">${n} / ${q.minWords} words${n >= q.minWords ? " ✓" : ""}</span></div>`;
  }

  const last = step === D.questions.length - 1;
  elMain.innerHTML =
    `<div class="card"><div class="prog"><span class="track"><span class="fill" style="width:${pct}%"></span></span>` +
    `<span class="n">${step + 1} / ${D.questions.length}</span></div>` +
    `<button class="back" id="back" ${step === 0 ? "" : ""}>` +
    `<span aria-hidden="true">←</span> Back</button>` +
    `<div class="qbody" style="--dx:${dir * 22}px">` +
    `<span class="kind ${reason ? "" : "met"}" id="kind">${kindLabel(q)}</span>` +
    `<h1 class="q">${esc(q.q)}</h1>` +
    `<p class="hint">${esc(q.hint)}</p>` +
    input +
    `<div class="row"><button class="next" id="next" ${reason ? "disabled" : ""}>` +
    `${last ? "Finish day" : "Next"} <span aria-hidden="true">→</span></button>` +
    `<span class="why" id="why">${reason ? esc(reason) : ""}</span></div>` +
    `<button class="togg" id="togg">Show 6 sample answers</button>` +
    `<div class="samples" id="samples">` +
    Object.entries(q.samples).map(([p, txt]) =>
      `<div class="samp"><span class="who">${esc(PERSONAS[p][0])} <i>· ${esc(PERSONAS[p][1])}</i></span>${esc(txt)}</div>`).join("") +
    `</div></div></div>`;

  const back = document.getElementById("back");
  back.onclick = () => { dir = -1; step--; render(); };

  const nextBtn = document.getElementById("next");
  nextBtn.onclick = () => { if (!check(q, answer(day, step))) { dir = 1; step++; render(); } };

  document.getElementById("togg").onclick = (e) => {
    const box = document.getElementById("samples");
    const open = box.classList.toggle("on");
    e.target.textContent = open ? "Hide sample answers" : "Show 6 sample answers";
  };

  if (q.type === "single" || q.type === "multi") {
    elMain.querySelectorAll(".opt").forEach(b => {
      b.onclick = () => {
        const o = b.dataset.o;
        if (q.type === "multi") {
          const cur = Array.isArray(answer(day, step)) ? [...answer(day, step)] : [];
          const i = cur.indexOf(o);
          if (i === -1) cur.push(o); else cur.splice(i, 1);
          store[key(day, step)] = cur; save();
          render();
        } else {
          store[key(day, step)] = o; save();
          // single choice auto-advances, the way the thank-you survey does
          setTimeout(() => { dir = 1; step++; render(); }, 240);
          b.classList.add("on");
          document.getElementById("next").disabled = false;
          document.getElementById("why").textContent = "";
        }
      };
    });
  } else {
    const ta = document.getElementById("ta");
    ta.addEventListener("input", () => {
      store[key(day, step)] = ta.value; save();
      const n = words(ta.value), ok = n >= q.minWords;
      const m = document.getElementById("meter");
      m.className = "meter" + (ok ? " met" : "");
      m.querySelector("i").style.width = Math.min(100, Math.round((n / q.minWords) * 100)) + "%";
      document.getElementById("mtext").textContent = `${n} / ${q.minWords} words` + (ok ? " ✓" : "");
      document.getElementById("next").disabled = !ok;
      document.getElementById("why").textContent = ok ? "" : `At least ${q.minWords} words — you have ${n}.`;
      document.getElementById("kind").className = "kind" + (ok ? " met" : "");
      renderDays();
    });
    // Enter advances on a short answer; long answers need the newline
    if (q.type === "short") {
      ta.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!check(q, ta.value)) { dir = 1; step++; render(); } }
      });
    }
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

function collect() {
  const out = [];
  DAYS.forEach((d, di) => {
    const rows = d.questions.map((q, i) => [q, answer(di, i)]);
    if (!rows.some(([, v]) => (Array.isArray(v) ? v.length : String(v || "").trim()))) return;
    out.push(`# Day ${d.n} · ${d.title}`);
    rows.forEach(([q, v]) => {
      const a = Array.isArray(v) ? v.join(" · ") : String(v || "").trim();
      out.push(`\n## ${q.q}\n${a || "(not answered)"}`);
    });
    out.push("");
  });
  return out.join("\n").trim() || "No answers yet.";
}
function download() {
  const blob = new Blob([collect()], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "workshop-answers.md";
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById("download").onclick = download;
document.getElementById("copy").onclick = async (e) => {
  try {
    await navigator.clipboard.writeText(collect());
    e.target.textContent = "Copied";
    setTimeout(() => (e.target.textContent = "Copy answers"), 1500);
  } catch { e.target.textContent = "Copy failed"; }
};

render();
</script>
</body>
</html>
